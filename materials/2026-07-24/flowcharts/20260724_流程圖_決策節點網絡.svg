<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>決策節點網絡流程</title>
  <desc>應用#124技巧：節點網絡+叢集連接線，融合模組化設計、可重組元件趨勢</desc>

  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="altGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="rejectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#F8FAFC"/>

  <!-- 標題 -->
  <text x="160" y="130" font-family="Microsoft JhengHei, PingFang TC, sans-serif" font-size="56" font-weight="700" fill="#1E40AF">工作報告 · 決策節點網絡</text>
  <text x="160" y="180" font-family="Microsoft JhengHei, PingFang TC, sans-serif" font-size="24" fill="#64748B">Decision Node Network · 可重組決策元件</text>
  <line x1="160" y1="210" x2="320" y2="210" stroke="#F59E0B" stroke-width="4"/>

  <!-- 連接線 (節點網絡) -->
  <g stroke-width="3" fill="none">
    <!-- 起點到分流 -->
    <path d="M 280,540 L 540,540" stroke="#3B82F6"/>
    <!-- 分流到三個評估節點 -->
    <path d="M 700,540 Q 800,400 900,360" stroke="#3B82F6"/>
    <path d="M 700,540 L 900,540" stroke="#3B82F6"/>
    <path d="M 700,540 Q 800,680 900,720" stroke="#3B82F6"/>
    <!-- 三節點到決策 -->
    <path d="M 1080,360 Q 1200,400 1300,500" stroke="#3B82F6"/>
    <path d="M 1080,540 L 1300,540" stroke="#3B82F6"/>
    <path d="M 1080,720 Q 1200,680 1300,580" stroke="#3B82F6"/>
    <!-- 決策分流 -->
    <path d="M 1430,540 Q 1530,420 1620,360" stroke="#F59E0B" stroke-width="4"/>
    <path d="M 1430,540 L 1620,540" stroke="#F59E0B" stroke-width="4"/>
    <path d="M 1430,540 Q 1530,660 1620,720" stroke="#64748B" stroke-dasharray="6,4"/>
  </g>

  <!-- 箭頭標記 -->
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#3B82F6"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- 起點節點 -->
  <g transform="translate(160, 480)" filter="url(#nodeShadow)">
    <polygon points="20,0 120,0 100,120 0,120" fill="url(#nodeGrad)"/>
    <text x="60" y="56" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">提案</text>
    <text x="60" y="88" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">起點</text>
  </g>

  <!-- 三個評估節點 -->
  <g transform="translate(900, 300)" filter="url(#nodeShadow)">
    <polygon points="20,0 160,0 140,120 0,120" fill="url(#nodeGrad)"/>
    <text x="80" y="50" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">可行性</text>
    <text x="80" y="84" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#DBEAFE">Feasibility</text>
  </g>

  <g transform="translate(900, 480)" filter="url(#nodeShadow)">
    <polygon points="20,0 160,0 140,120 0,120" fill="url(#nodeGrad)"/>
    <text x="80" y="50" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">成本效益</text>
    <text x="80" y="84" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#DBEAFE">Cost-Benefit</text>
  </g>

  <g transform="translate(900, 660)" filter="url(#nodeShadow)">
    <polygon points="20,0 160,0 140,120 0,120" fill="url(#nodeGrad)"/>
    <text x="80" y="50" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">風險評估</text>
    <text x="80" y="84" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#DBEAFE">Risk</text>
  </g>

  <!-- 中央決策節點 -->
  <g transform="translate(1300, 480)" filter="url(#nodeShadow)">
    <polygon points="20,0 130,0 110,120 0,120" fill="url(#altGrad)"/>
    <circle cx="65" cy="60" r="22" fill="#FFFFFF" opacity="0.9"/>
    <text x="65" y="68" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#F59E0B">決策</text>
    <text x="65" y="100" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#FFFFFF">Decision</text>
  </g>

  <!-- 結果節點 -->
  <g transform="translate(1600, 300)" filter="url(#nodeShadow)">
    <polygon points="20,0 130,0 110,120 0,120" fill="url(#nodeGrad)"/>
    <text x="65" y="56" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">通過</text>
    <text x="65" y="90" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#DBEAFE">Approved</text>
  </g>

  <g transform="translate(1600, 480)" filter="url(#nodeShadow)">
    <polygon points="20,0 130,0 110,120 0,120" fill="url(#altGrad)"/>
    <text x="65" y="56" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">修正</text>
    <text x="65" y="90" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#FFFFFF">Revise</text>
  </g>

  <g transform="translate(1600, 660)" filter="url(#nodeShadow)">
    <polygon points="20,0 130,0 110,120 0,120" fill="url(#rejectGrad)"/>
    <text x="65" y="56" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">退回</text>
    <text x="65" y="90" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#FFFFFF">Rejected</text>
  </g>

  <!-- 圖例 -->
  <g transform="translate(160, 880)">
    <rect x="0" y="0" width="1600" height="120" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="40" y="42" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E40AF">元件說明</text>
    <circle cx="50" cy="80" r="8" fill="url(#nodeGrad)"/>
    <text x="70" y="86" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#374151">評估節點</text>
    <circle cx="260" cy="80" r="8" fill="url(#altGrad)"/>
    <text x="280" y="86" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#374151">決策節點</text>
    <circle cx="470" cy="80" r="8" fill="url(#rejectGrad)"/>
    <text x="490" y="86" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#374151">退回節點</text>
    <line x1="700" y1="80" x2="760" y2="80" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="780" y="86" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#374151">虛線 = 否決路徑</text>
  </g>
</svg>
