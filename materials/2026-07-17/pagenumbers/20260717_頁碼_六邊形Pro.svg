<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60">
  <title>六邊形頁碼 Pro</title>
  <desc>應用#120六邊形十式：大小對比+旋轉角度，融合Exaggerated Hierarchy趨勢</desc>
  
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- 大六邊形襯底（#120-大六邊形 s=25） -->
  <polygon points="30,5 50,5 60,20 50,35 30,35 20,20" 
           fill="url(#hexGrad)" opacity="0.2" transform="translate(-5,5)"/>
  
  <!-- 主六邊形（#120-標準六邊形 s=20） -->
  <polygon points="30,10 50,10 60,25 50,40 30,40 20,25" 
           fill="url(#hexGrad)"/>
  
  <!-- 內部裝飾六邊形（#120-外粗空心） -->
  <polygon points="30,14 50,14 58,25 50,36 30,36 22,25" 
           fill="none" stroke="#F59E0B" stroke-width="2"/>
  
  <!-- 頁碼數字 -->
  <text x="40" y="30" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">
    01
  </text>
  
  <!-- 右側小六邊形裝飾（#120-小六邊形 s=12） -->
  <polygon points="80,20 90,20 95,27 90,34 80,34 75,27" 
           fill="#F59E0B" opacity="0.8"/>
  <polygon points="100,25 105,25 107.5,29 105,33 100,33 97.5,29" 
           fill="#3B82F6" opacity="0.6"/>
</svg>