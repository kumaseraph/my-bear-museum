<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" role="img" aria-label="簡潔重點摘要按鈕">
  <title>簡潔重點摘要</title>
  <desc>現代簡潔風格，查看重點CTA按鈕，邊界引導線+低透明斜紋。應用#124技巧：邊界引導線+條紋疊加。融合趨勢：Accessibility as design、Simple shapes、工作報告摘要場景。適用PowerPoint工作報告PPT，不含動畫與外部依賴。</desc>

  <defs>
    <linearGradient id="bsa_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="bsa_arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <pattern id="bsa_stripes" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="transparent"/>
      <line x1="0" y1="8" x2="8" y2="0" stroke="#FFFFFF" stroke-width="1.5" opacity="0.2"/>
    </pattern>
    <!-- 文字陰影：輕暗紫描邊增加可讀性，不影响乾淨外觀 -->
    <filter id="bsa_textShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feFlood flood-color="#4C1D95" flood-opacity="0.25" result="shadowColor"/>
      <feComposite in="shadowColor" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 左側邊界引導線 -->
  <g stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.5">
    <line x1="0" y1="50" x2="45" y2="50"/>
    <line x1="0" y1="40" x2="45" y2="40" stroke-opacity="0.3"/>
    <line x1="0" y1="60" x2="45" y2="60" stroke-opacity="0.3"/>
    <!-- 左箭頭 -->
    <polygon points="40,50 50,44 50,56" fill="#A78BFA" fill-opacity="0.5"/>
  </g>

  <!-- 主按鈕主體 (平行四邊形，skewX=-12) -->
  <g transform="translate(210, 50)">
    <!-- 按鈕本體 -->
    <rect x="-160" y="-38" width="320" height="76" rx="10"
          fill="url(#bsa_grad)" transform="skewX(-12)"/>
    <!-- 低透明斜紋疊加 -->
    <rect x="-160" y="-38" width="320" height="76" rx="10"
          fill="url(#bsa_stripes)" transform="skewX(-12)"/>
    <!-- 強調邊框 -->
    <rect x="-160" y="-38" width="320" height="76" rx="10"
          fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.3" transform="skewX(-12)"/>

    <!-- 文字：查看重點 -->
    <text x="0" y="-5" text-anchor="middle" fill="#FFFFFF"
          font-family="system-ui, sans-serif" font-size="20" font-weight="700"
          letter-spacing="0.5" filter="url(#bsa_textShadow)">查看重點</text>
    <text x="0" y="18" text-anchor="middle" fill="#FFFFFF"
          font-family="system-ui, sans-serif" font-size="11" letter-spacing="0.5" fill-opacity="0.9" filter="url(#bsa_textShadow)">VIEW HIGHLIGHTS</text>

    <!-- 右側小箭頭裝飾 -->
    <polygon points="115,-6 130,0 115,6" fill="#FFFFFF" fill-opacity="0.7" transform="skewX(-12)"/>
  </g>

  <!-- 右側邊界引導線 -->
  <g stroke="#4ECDC4" stroke-width="1.5" stroke-opacity="0.5">
    <line x1="420" y1="50" x2="375" y2="50"/>
    <line x1="420" y1="40" x2="375" y2="40" stroke-opacity="0.3"/>
    <line x1="420" y1="60" x2="375" y2="60" stroke-opacity="0.3"/>
    <!-- 右箭頭 -->
    <polygon points="380,50 370,44 370,56" fill="#4ECDC4" fill-opacity="0.5"/>
  </g>

  <!-- 底部說明 (無障礙高對比區域) -->
  <rect x="80" y="88" width="260" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="80" y="88" width="130" height="4" rx="2" fill="#6B5CE7" fill-opacity="0.4"/>
</svg>
