<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="phase1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6B5CE7"/>
      <stop offset="100%" style="stop-color:#4C1D95"/>
    </linearGradient>
    <linearGradient id="phase2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ECDC4"/>
      <stop offset="100%" style="stop-color:#0EA5E9"/>
    </linearGradient>
    <linearGradient id="phase3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#EA580C"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bg3)"/>
  
  <!-- 標題 -->
  <text x="960" y="80" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="36" font-weight="bold">專案管理流程</text>
  <text x="960" y="115" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">PROJECT MANAGEMENT PHASES</text>
  
  <!-- 透視消失點效果 -->
  <g opacity="0.15">
    <line x1="960" y1="550" x2="100" y2="1080" stroke="#6B5CE7" stroke-width="1"/>
    <line x1="960" y1="550" x2="300" y2="1080" stroke="#6B5CE7" stroke-width="1"/>
    <line x1="960" y1="550" x2="500" y2="1080" stroke="#6B5CE7" stroke-width="1"/>
    <line x1="960" y1="550" x2="700" y2="1080" stroke="#6B5CE7" stroke-width="1"/>
    <line x1="960" y1="550" x2="900" y2="1080" stroke="#6B5CE7" stroke-width="1"/>
    <line x1="960" y1="550" x2="1100" y2="1080" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="960" y1="550" x2="1300" y2="1080" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="960" y1="550" x2="1500" y2="1080" stroke="#4ECDC4" stroke-width="1"/>
    <line x1="960" y1="550" x2="1700" y2="1080" stroke="#FF8C00" stroke-width="1"/>
    <line x1="960" y1="550" x2="1850" y2="1080" stroke="#FF8C00" stroke-width="1"/>
  </g>
  
  <!-- 三階段流程 -->
  <!-- 階段1：規劃 -->
  <g transform="translate(300, 300)">
    <polygon points="100,0 300,0 280,150 80,150" fill="url(#phase1)" opacity="0.9" filter="url(#glow3)"/>
    <polygon points="100,0 300,0 280,150 80,150" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <!-- 內部線條裝飾 -->
    <line x1="20" y1="30" x2="380" y2="30" stroke="#A78BFA" stroke-width="1" opacity="0.3"/>
    <line x1="30" y1="60" x2="370" y2="60" stroke="#A78BFA" stroke-width="1" opacity="0.3"/>
    
    <text x="200" y="50" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PHASE 1</text>
    <text x="200" y="80" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="24" font-weight="bold">規劃</text>
    <text x="200" y="110" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="14">目標設定 • 資源分配</text>
    
    <!-- 節點裝飾 -->
    <circle cx="50" cy="75" r="8" fill="#FF8C00"/>
    <circle cx="350" cy="75" r="8" fill="#FF8C00"/>
  </g>
  
  <!-- 連接線1->2 -->
  <g transform="translate(520, 375)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#4ECDC4" stroke-width="4"/>
    <polygon points="100,-10 130,0 100,10" fill="#4ECDC4"/>
    <!-- 斜向裝飾線 -->
    <line x1="20" y1="-15" x2="80" y2="15" stroke="#4ECDC4" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- 階段2：執行 -->
  <g transform="translate(700, 400)">
    <polygon points="100,0 300,0 280,150 80,150" fill="url(#phase2)" opacity="0.9" filter="url(#glow3)"/>
    <polygon points="100,0 300,0 280,150 80,150" fill="none" stroke="#67E8F9" stroke-width="2"/>
    <line x1="20" y1="30" x2="380" y2="30" stroke="#67E8F9" stroke-width="1" opacity="0.3"/>
    <line x1="30" y1="60" x2="370" y2="60" stroke="#67E8F9" stroke-width="1" opacity="0.3"/>
    
    <text x="200" y="50" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PHASE 2</text>
    <text x="200" y="80" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="24" font-weight="bold">執行</text>
    <text x="200" y="110" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="14">進度追蹤 • 風險管理</text>
    
    <circle cx="50" cy="75" r="8" fill="#6B5CE7"/>
    <circle cx="350" cy="75" r="8" fill="#6B5CE7"/>
  </g>
  
  <!-- 連接線2->3 -->
  <g transform="translate(1020, 475)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#FF8C00" stroke-width="4"/>
    <polygon points="100,-10 130,0 100,10" fill="#FF8C00"/>
    <line x1="20" y1="15" x2="80" y2="-15" stroke="#FF8C00" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- 階段3：完成 -->
  <g transform="translate(1200, 500)">
    <polygon points="100,0 300,0 280,150 80,150" fill="url(#phase3)" opacity="0.9" filter="url(#glow3)"/>
    <polygon points="100,0 300,0 280,150 80,150" fill="none" stroke="#FBBF24" stroke-width="2"/>
    <line x1="20" y1="30" x2="380" y2="30" stroke="#FBBF24" stroke-width="1" opacity="0.3"/>
    <line x1="30" y1="60" x2="370" y2="60" stroke="#FBBF24" stroke-width="1" opacity="0.3"/>
    
    <text x="200" y="50" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="14" font-weight="bold">PHASE 3</text>
    <text x="200" y="80" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="24" font-weight="bold">完成</text>
    <text x="200" y="110" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="14">成果交付 • 經驗總結</text>
    
    <circle cx="50" cy="75" r="8" fill="#4ECDC4"/>
    <circle cx="350" cy="75" r="8" fill="#4ECDC4"/>
  </g>
  
  <!-- 底部總結區 -->
  <g transform="translate(300, 800)">
    <rect x="0" y="0" width="1320" height="120" rx="15" fill="#4C1D95" opacity="0.5"/>
    <rect x="0" y="0" width="1320" height="120" rx="15" fill="none" stroke="#6B5CE7" stroke-width="2"/>
    
    <!-- 三個要點 -->
    <g transform="translate(220, 60)">
      <circle cx="0" cy="0" r="20" fill="#6B5CE7"/>
      <text x="0" y="6" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1</text>
      <text x="0" y="45" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="14">清晰目標</text>
    </g>
    <g transform="translate(660, 60)">
      <circle cx="0" cy="0" r="20" fill="#4ECDC4"/>
      <text x="0" y="6" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2</text>
      <text x="0" y="45" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="14">有效執行</text>
    </g>
    <g transform="translate(1100, 60)">
      <circle cx="0" cy="0" r="20" fill="#FF8C00"/>
      <text x="0" y="6" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="14" font-weight="bold">3</text>
      <text x="0" y="45" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="14">持續改進</text>
    </g>
  </g>
  
  <!-- 底部技巧說明 -->
  <text x="960" y="980" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="12">透視線（#124-8）| 階梯排列（#124-3）| 大膽層級</text>
</svg>