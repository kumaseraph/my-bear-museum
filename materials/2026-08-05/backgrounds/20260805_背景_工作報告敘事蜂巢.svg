<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img">
  <title>工作報告敘事蜂巢背景</title>
  <desc>創意活潑風格蜂巢圖案背景，左側保留文字安全區</desc>
  <defs>
    <filter id="grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
      <feComposite in="noisy" in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1e3a6e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- 左側文字安全區（乾淨區域） -->
  <rect x="0" y="0" width="700" height="1080" fill="#172554" opacity="0.95"/>

  <!-- 蜂巢叢集 - 右側區域 -->
  <g id="honeycomb-cluster" opacity="0.9">
    <!-- 大六邊形叢集 - 右上 -->
    <g transform="translate(1400, 100) rotate(0)">
      <polygon points="0,-80 69.3,-40 69.3,40 0,80 -69.3,40 -69.3,-40" fill="none" stroke="#22D3EE" stroke-width="4" opacity="0.8"/>
      <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" fill="#22D3EE" opacity="0.3"/>
    </g>
    <g transform="translate(1550, 180) rotate(30)">
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="none" stroke="#FB7185" stroke-width="3" opacity="0.7"/>
      <polygon points="0,-37 32,-18 32,18 0,37 -32,18 -32,-18" fill="#FB7185" opacity="0.25"/>
    </g>
    <g transform="translate(1300, 250) rotate(-15)">
      <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" fill="none" stroke="#FBBF24" stroke-width="3.5" opacity="0.75"/>
      <polygon points="0,-44 37.9,-22 37.9,22 0,44 -37.9,22 -37.9,-22" fill="#FBBF24" opacity="0.2"/>
    </g>
    <g transform="translate(1500, 320) rotate(20)">
      <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" fill="none" stroke="#22D3EE" stroke-width="3" opacity="0.6"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="#22D3EE" opacity="0.35"/>
    </g>

    <!-- 中間區域蜂巢 -->
    <g transform="translate(1200, 450) rotate(10)">
      <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="#FB7185" stroke-width="4" opacity="0.65"/>
      <polygon points="0,-56 48.5,-28 48.5,28 0,56 -48.5,28 -48.5,-28" fill="#FB7185" opacity="0.2"/>
    </g>
    <g transform="translate(1400, 520) rotate(-25)">
      <polygon points="0,-55 47.7,-27 47.7,27 0,55 -47.7,27 -47.7,-27" fill="none" stroke="#FBBF24" stroke-width="3" opacity="0.7"/>
      <polygon points="0,-34 29.5,-17 29.5,17 0,34 -29.5,17 -29.5,-17" fill="#FBBF24" opacity="0.25"/>
    </g>
    <g transform="translate(1100, 580) rotate(40)">
      <polygon points="0,-65 56.3,-32 56.3,32 0,65 -56.3,32 -56.3,-32" fill="none" stroke="#22D3EE" stroke-width="3.5" opacity="0.6"/>
      <polygon points="0,-40 35.2,-20 35.2,20 0,40 -35.2,20 -35.2,-20" fill="#22D3EE" opacity="0.3"/>
    </g>

    <!-- 右下角蜂巢 -->
    <g transform="translate(1500, 700) rotate(15)">
      <polygon points="0,-75 65,-32.5 65,32.5 0,75 -65,32.5 -65,-32.5" fill="none" stroke="#FBBF24" stroke-width="3.5" opacity="0.65"/>
      <polygon points="0,-47 40.6,-23 40.6,23 0,47 -40.6,23 -40.6,-23" fill="#FBBF24" opacity="0.22"/>
    </g>
    <g transform="translate(1650, 780) rotate(-10)">
      <polygon points="0,-45 39,-19.5 39,19.5 0,45 -39,19.5 -39,-19.5" fill="none" stroke="#FB7185" stroke-width="2.5" opacity="0.55"/>
      <polygon points="0,-28 24.2,-14 24.2,14 0,28 -24.2,14 -24.2,-14" fill="#FB7185" opacity="0.28"/>
    </g>
    <g transform="translate(1750, 650) rotate(35)">
      <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" fill="none" stroke="#22D3EE" stroke-width="3" opacity="0.6"/>
      <polygon points="0,-31 26.8,-15 26.8,15 0,31 -26.8,15 -26.8,-15" fill="#22D3EE" opacity="0.32"/>
    </g>
    <g transform="translate(1800, 500) rotate(-30)">
      <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="none" stroke="#FBBF24" stroke-width="2.5" opacity="0.5"/>
      <polygon points="0,-25 21.6,-12 21.6,12 0,25 -21.6,12 -21.6,-12" fill="#FBBF24" opacity="0.25"/>
    </g>
  </g>

  <!-- 裝飾線條 -->
  <g opacity="0.4">
    <line x1="700" y1="0" x2="1920" y2="1080" stroke="#22D3EE" stroke-width="1"/>
    <line x1="750" y1="0" x2="1920" y2="900" stroke="#FB7185" stroke-width="0.8"/>
    <line x1="800" y1="0" x2="1920" y2="720" stroke="#FBBF24" stroke-width="0.6"/>
  </g>

  <!-- 觸感紋理覆蓋 -->
  <rect width="1920" height="1080" fill="#172554" opacity="0.08" filter="url(#grain)"/>

  <!-- 左側安全區裝飾邊界 -->
  <line x1="700" y1="0" x2="700" y2="1080" stroke="#22D3EE" stroke-width="2" stroke-dasharray="8,4" opacity="0.3"/>
</svg>
