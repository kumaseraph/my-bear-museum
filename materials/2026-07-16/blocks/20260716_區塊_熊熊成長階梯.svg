<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="100%" stop-color="#4A2C17"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#C4956A"/>
    </linearGradient>
    <linearGradient id="warmGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F5E6D3"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="400" fill="#FDF8F3"/>
  
  <!-- 蜂巢背景裝飾 -->
  <g opacity="0.08">
    <path d="M50,350 L86.6,375 L86.6,425 L50,400 L13.4,375 L13.4,325 Z" fill="#8B6914" transform="translate(0,-100)"/>
    <path d="M50,350 L86.6,375 L86.6,425 L50,400 L13.4,375 L13.4,325 Z" fill="#8B6914" transform="translate(86.6,-50)"/>
    <path d="M50,350 L86.6,375 L86.6,425 L50,400 L13.4,375 L13.4,325 Z" fill="#8B6914" transform="translate(173.2,0)"/>
  </g>
  
  <!-- 標題 -->
  <text x="200" y="45" text-anchor="middle" fill="#4A2C17" font-family="Arial, sans-serif" font-size="22" font-weight="bold">熊熊成長階梯</text>
  <text x="200" y="70" text-anchor="middle" fill="#8B6914" font-family="Arial, sans-serif" font-size="12">工作能力發展歷程</text>
  
  <!-- 階梯式區塊 - 尺寸漸層 -->
  <g transform="translate(200,340)">
    <!-- 第一階 (最小) -->
    <g transform="translate(-130,0)">
      <rect width="60" height="50" rx="6" fill="url(#bearGrad)" opacity="0.5"/>
      <rect width="60" height="50" rx="6" fill="none" stroke="#D4A574" stroke-width="1.5"/>
      <text x="30" y="30" text-anchor="middle" fill="#F5E6D3" font-family="Arial, sans-serif" font-size="11">初階</text>
    </g>
    
    <!-- 第二階 -->
    <g transform="translate(-60,-30)">
      <rect width="60" height="80" rx="6" fill="url(#bearGrad)" opacity="0.6"/>
      <rect width="60" height="80" rx="6" fill="none" stroke="#D4A574" stroke-width="1.5"/>
      <text x="30" y="45" text-anchor="middle" fill="#F5E6D3" font-family="Arial, sans-serif" font-size="11">基礎</text>
    </g>
    
    <!-- 第三階 -->
    <g transform="translate(10,-65)">
      <rect width="60" height="115" rx="6" fill="url(#bearGrad)" opacity="0.75"/>
      <rect width="60" height="115" rx="6" fill="none" stroke="#D4A574" stroke-width="2"/>
      <text x="30" y="60" text-anchor="middle" fill="#F5E6D3" font-family="Arial, sans-serif" font-size="12">熟練</text>
    </g>
    
    <!-- 第四階 (最大) -->
    <g transform="translate(80,-105)">
      <rect width="60" height="155" rx="6" fill="url(#goldGrad)"/>
      <rect width="60" height="155" rx="6" fill="none" stroke="#4A2C17" stroke-width="2"/>
      <text x="30" y="80" text-anchor="middle" fill="#4A2C17" font-family="Arial, sans-serif" font-size="13" font-weight="bold">專業</text>
      <!-- 星星裝飾 -->
      <text x="30" y="130" text-anchor="middle" fill="#4A2C17" font-size="16">⭐</text>
    </g>
  </g>
  
  <!-- 連接箭頭 -->
  <g fill="#C4956A" opacity="0.6">
    <path d="M120,300 L135,285 L130,285 L130,275 L140,285 L135,285 L140,300 Z" transform="translate(30,-10)"/>
    <path d="M120,300 L135,285 L130,285 L130,275 L140,285 L135,285 L140,300 Z" transform="translate(-10,-10)"/>
    <path d="M120,300 L135,285 L130,285 L130,275 L140,285 L135,285 L140,300 Z" transform="translate(-50,-10)"/>
  </g>
  
  <!-- 底部熊熊標語 -->
  <g transform="translate(200,380)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="#D4A574" opacity="0.2"/>
    <text x="0" y="5" text-anchor="middle" fill="#6B4423" font-family="Arial, sans-serif" font-size="12">持續學習·邁向專業</text>
  </g>
</svg>