<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <!-- 團隊合作圖標：六邊形蜂巢 + 圓形節點 -->
  <g transform="translate(960,540)">
    <!-- 六邊形外框 -->
    <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75" 
             fill="none" stroke="#475569" stroke-width="6"/>
    <!-- 中心圓形 -->
    <circle cx="0" cy="0" r="50" fill="#3B82F6"/>
    <!-- 六個頂點裝飾圓 -->
    <circle cx="0" cy="-150" r="20" fill="#60A5FA"/>
    <circle cx="130" cy="-75" r="20" fill="#60A5FA"/>
    <circle cx="130" cy="75" r="20" fill="#60A5FA"/>
    <circle cx="0" cy="150" r="20" fill="#60A5FA"/>
    <circle cx="-130" cy="75" r="20" fill="#60A5FA"/>
    <circle cx="-130" cy="-75" r="20" fill="#60A5FA"/>
    <!-- 連接線 -->
    <g stroke="#94A3B8" stroke-width="3">
      <line x1="0" y1="-130" x2="0" y2="-50"/>
      <line x1="113" y1="-65" x2="43" y2="-22"/>
      <line x1="113" y1="65" x2="43" y2="22"/>
      <line x1="0" y1="130" x2="0" y2="50"/>
      <line x1="-113" y1="65" x2="-43" y2="22"/>
      <line x1="-113" y1="-65" x2="-43" y2="-22"/>
    </g>
  </g>
</svg>