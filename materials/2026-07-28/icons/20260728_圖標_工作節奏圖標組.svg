<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="iconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="iconCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="iconTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="iconSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="iconOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="iconGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <text x="120" y="100" font-family="Microsoft JhengHei, sans-serif" font-size="44" font-weight="700" fill="#1E293B">工作報告｜工作節奏圖標組</text>
  <text x="120" y="148" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#64748B">6 個流程節奏圖示｜六邊形載體 × 菱形五角星 中心 × 虛實對比</text>

  <!-- ============ 圖標 1：啟動會議 ============ -->
  <g transform="translate(280, 360)">
    <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z" fill="url(#iconBlue)" opacity="0.08"/>
    <!-- 菱形包圍五角星（核心價值） -->
    <polygon points="0,-70 50,0 0,70 -50,0" fill="none" stroke="url(#iconBlue)" stroke-width="3"/>
    <polygon points="0,-35 11,0 35,0 15,15 22,40 0,25 -22,40 -15,15 -35,0 -11,0" fill="url(#iconBlue)"/>
    <!-- 啟動光點 -->
    <circle cx="0" cy="-70" r="4" fill="url(#iconBlue)"/>
    <circle cx="50" cy="0" r="4" fill="url(#iconBlue)"/>
    <circle cx="0" cy="70" r="4" fill="url(#iconBlue)"/>
    <circle cx="-50" cy="0" r="4" fill="url(#iconBlue)"/>
  </g>
  <text x="280" y="540" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E293B">啟動會議</text>
  <text x="280" y="568" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Kick-off Meeting</text>

  <!-- ============ 圖標 2：規劃藍圖 ============ -->
  <g transform="translate(640, 360)">
    <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z" fill="url(#iconCyan)" opacity="0.08"/>
    <!-- 菱形×五角星交替（節奏） -->
    <polygon points="-30,-25 0,5 -30,35 -60,5" fill="url(#iconCyan)"/>
    <polygon points="0,-5 20,15 0,35 -20,15" fill="none" stroke="url(#iconCyan)" stroke-width="2"/>
    <polygon points="30,-25 60,5 30,35 0,5" fill="url(#iconCyan)" opacity="0.3"/>
    <polygon points="50,-15 60,0 50,15 40,0" fill="url(#iconCyan)"/>
  </g>
  <text x="640" y="540" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E293B">規劃藍圖</text>
  <text x="640" y="568" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Planning Blueprint</text>

  <!-- ============ 圖標 3：執行推進 ============ -->
  <g transform="translate(1000, 360)">
    <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z" fill="url(#iconTeal)" opacity="0.08"/>
    <!-- 菱形放射五角星（輻射影響） -->
    <polygon points="0,-25 25,0 0,25 -25,0" fill="url(#iconTeal)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,13 0,8 -9,13 -7,5 -12,0 -6,0" fill="#FFFFFF" transform="translate(0,-55) scale(0.8)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,13 0,8 -9,13 -7,5 -12,0 -6,0" fill="#FFFFFF" transform="translate(55,0) scale(0.8)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,13 0,8 -9,13 -7,5 -12,0 -6,0" fill="#FFFFFF" transform="translate(0,55) scale(0.8)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,13 0,8 -9,13 -7,5 -12,0 -6,0" fill="#FFFFFF" transform="translate(-55,0) scale(0.8)"/>
    <line x1="0" y1="-25" x2="0" y2="-30" stroke="url(#iconTeal)" stroke-width="2"/>
    <line x1="25" y1="0" x2="30" y2="0" stroke="url(#iconTeal)" stroke-width="2"/>
    <line x1="0" y1="25" x2="0" y2="30" stroke="url(#iconTeal)" stroke-width="2"/>
    <line x1="-25" y1="0" x2="-30" y2="0" stroke="url(#iconTeal)" stroke-width="2"/>
  </g>
  <text x="1000" y="540" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E293B">執行推進</text>
  <text x="1000" y="568" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Execution Pulse</text>

  <!-- ============ 圖標 4：校對覆核 ============ -->
  <g transform="translate(1360, 360)">
    <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z" fill="url(#iconOrange)" opacity="0.08"/>
    <!-- 雙重菱形五角星（深度感） -->
    <polygon points="0,-50 35,0 0,50 -35,0" fill="none" stroke="url(#iconOrange)" stroke-width="2"/>
    <polygon points="0,-50 35,0 0,50 -35,0" fill="url(#iconOrange)" opacity="0.15" transform="rotate(15)"/>
    <polygon points="0,-25 14,0 28,0 18,8 22,28 0,18 -22,28 -18,8 -28,0 -14,0" fill="url(#iconOrange)"/>
    <!-- 焦點 -->
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>
  <text x="1360" y="540" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E293B">校對覆核</text>
  <text x="1360" y="568" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Review &amp; Verify</text>

  <!-- ============ 圖標 5：數據決策 ============ -->
  <g transform="translate(640, 770)">
    <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z" fill="url(#iconSlate)" opacity="0.08"/>
    <!-- 菱形簇生五角星（成長） -->
    <polygon points="0,-40 30,0 0,40 -30,0" fill="url(#iconSlate)"/>
    <polygon points="0,-10 5,0 10,0 6,4 7,11 0,7 -7,11 -6,4 -10,0 -5,0" fill="#FFFFFF" transform="translate(35,-30) scale(0.7)"/>
    <polygon points="0,-10 5,0 10,0 6,4 7,11 0,7 -7,11 -6,4 -10,0 -5,0" fill="#FFFFFF" transform="translate(40,0) scale(0.85)"/>
    <polygon points="0,-10 5,0 10,0 6,4 7,11 0,7 -7,11 -6,4 -10,0 -5,0" fill="#FFFFFF" transform="translate(35,30) scale(0.7)"/>
    <polygon points="0,-10 5,0 10,0 6,4 7,11 0,7 -7,11 -6,4 -10,0 -5,0" fill="#FFFFFF" transform="translate(-35,-30) scale(0.7)"/>
    <polygon points="0,-10 5,0 10,0 6,4 7,11 0,7 -7,11 -6,4 -10,0 -5,0" fill="#FFFFFF" transform="translate(-40,0) scale(0.85)"/>
    <polygon points="0,-10 5,0 10,0 6,4 7,11 0,7 -7,11 -6,4 -10,0 -5,0" fill="#FFFFFF" transform="translate(-35,30) scale(0.7)"/>
  </g>
  <text x="640" y="950" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E293B">數據決策</text>
  <text x="640" y="978" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Data-Driven Decision</text>

  <!-- ============ 圖標 6：循環優化 ============ -->
  <g transform="translate(1000, 770)">
    <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z" fill="url(#iconGreen)" opacity="0.08"/>
    <!-- 菱形五角星混合體（循環） -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#iconGreen)" stroke-width="3" stroke-dasharray="6 4"/>
    <polygon points="0,-25 16,0 0,25 -16,0" fill="url(#iconGreen)"/>
    <polygon points="0,-12 7,0 14,0 8,5 11,15 0,9 -11,15 -8,5 -14,0 -7,0" fill="#FFFFFF" transform="translate(0,0) scale(0.9)"/>
    <!-- 箭頭指示 -->
    <polygon points="50,-8 60,-2 50,4 53,0" fill="url(#iconGreen)"/>
    <polygon points="-50,8 -60,2 -50,-4 -53,0" fill="url(#iconGreen)"/>
  </g>
  <text x="1000" y="950" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E293B">循環優化</text>
  <text x="1000" y="978" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Continuous Improvement</text>

  <text x="120" y="1040" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#94A3B8">技巧 #123 菱形×五角星 × #121 六邊形載體 × 虛實對比</text>
  <text x="1800" y="1040" text-anchor="end" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#94A3B8">2026-07-28 熊熊生成</text>
</svg>
