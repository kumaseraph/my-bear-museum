<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>圖標_高效執行</title>
  <desc>工作報告主題圖標 - 高效執行</desc>
  <defs>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
  </defs>
  
  <!-- 六邊形背景 -->
  <path d="M50,5 L89.3,27.5 L89.3,72.5 L50,95 L10.7,72.5 L10.7,27.5 Z" 
        fill="#6B5CE7" fill-opacity="0.15"/>
  <path d="M50,5 L89.3,27.5 L89.3,72.5 L50,95 L10.7,72.5 L10.7,27.5 Z" 
        fill="none" stroke="#6B5CE7" stroke-width="3"/>
  
  <!-- 齒輪圖示（代表執行力） -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="url(#checkGrad)" stroke-width="4"/>
  <circle cx="50" cy="50" r="8" fill="url(#checkGrad)"/>
  
  <!-- 齒輪齒 -->
  <g stroke="url(#checkGrad)" stroke-width="4">
    <line x1="50" y1="28" x2="50" y2="35"/>
    <line x1="50" y1="65" x2="50" y2="72"/>
    <line x1="28" y1="50" x2="35" y2="50"/>
    <line x1="65" y1="50" x2="72" y2="50"/>
    <line x1="34.4" y1="34.4" x2="39.4" y2="39.4"/>
    <line x1="60.6" y1="60.6" x2="65.6" y2="65.6"/>
    <line x1="34.4" y1="65.6" x2="39.4" y2="60.6"/>
    <line x1="60.6" y1="39.4" x2="65.6" y2="34.4"/>
  </g>
  
  <!-- 打勾標記 -->
  <circle cx="75" cy="25" r="12" fill="#4ECDC4"/>
  <path d="M70,25 L73,28 L80,21" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>