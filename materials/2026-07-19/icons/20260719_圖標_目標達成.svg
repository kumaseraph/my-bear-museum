<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>目標達成圖標 - 工作報告</title>
  <desc>六邊形+菱形組合，應用#121旋轉角度與#123虛實對比技巧，熊熊溫暖風格</desc>
  
  <defs>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="iconBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C49A6C"/>
      <stop offset="100%" stop-color="#5D4417"/>
    </linearGradient>
  </defs>
  
  <!-- 底層六邊形（空心） -->
  <g transform="translate(50,50)">
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="none" stroke="#C49A6C" stroke-width="2"/>
    
    <!-- 內層菱形（實心） -->
    <g transform="rotate(45)">
      <rect x="-12" y="-12" width="24" height="24" 
            fill="url(#iconGold)" transform="rotate(0)"/>
    </g>
    
    <!-- 中心小六邊形 -->
    <path d="M0,-10 L8.7,-5 L8.7,5 L0,10 L-8.7,5 L-8.7,-5 Z" 
          fill="#E8C39E"/>
    
    <!-- 頂部標記（對勾） -->
    <g transform="translate(0,-28)">
      <path d="M-8,0 L-2,6 L10,-8" 
            fill="none" stroke="#8B6914" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>