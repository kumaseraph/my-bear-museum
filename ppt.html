<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT素材庫 | 🐾 Bear Materials</title>
<style>
:root {
  /* 博物館同款暖色系 */
  --bg: #fdf8f3;
  --bg-secondary: #fff5eb;
  --card: #ffffff;
  --card-hover: #faf5f0;
  --primary: #5d4037;
  --accent: #d4a574;
  --accent-dark: #c4956a;
  --text: #5d4037;
  --text-muted: #8b7355;
  --text-light: #a89585;
  --border: #d7ccc8;
  --border-light: rgba(93,64,55,0.1);
  --shadow: 0 4px 18px rgba(93,64,55,0.06);
  --shadow-hover: 0 8px 28px rgba(93,64,55,0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== 博物館同款頂部導航列 ===== */
.top-nav {
  background: var(--primary);
  padding: 0 32px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(93,64,55,0.15);
  position: sticky;
  top: 0;
  z-index: 100;
}
.top-nav-brand {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.top-nav-brand:hover {
  opacity: 0.9;
}
.top-nav-links {
  display: flex;
  gap: 8px;
}
.top-nav-links a {
  color: rgba(255,255,255,0.85);
  text-decoration: none;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
}
.top-nav-links a:hover {
  color: #fff;
  background: rgba(255,255,255,0.15);
}
.top-nav-links a.active {
  color: #fff;
  background: rgba(255,255,255,0.25);
}

/* ===== 頁面內容 ===== */
.page-wrapper {
  max-width: 1200px;
  margin: 0 auto;
  padding: 48px 32px 80px;
}

/* ===== 頁首 ===== */
.page-header {
  margin-bottom: 40px;
  padding-bottom: 28px;
  border-bottom: 2px solid var(--border);
  position: relative;
}
.page-header::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 80px;
  height: 2px;
  background: var(--accent);
}
.page-eyebrow {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent-dark);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.page-title {
  font-size: 30px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}
.page-meta {
  font-size: 13px;
  color: var(--text-muted);
}

/* ===== 統計資訊 ===== */
.stats-row {
  display: flex;
  gap: 16px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.stat-icon {
  font-size: 24px;
}
.stat-info {
  display: flex;
  flex-direction: column;
}
.stat-value {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary);
  line-height: 1.2;
}
.stat-label {
  font-size: 12px;
  color: var(--text-muted);
}

/* ===== 篩選列 ===== */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-tag {
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--card);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.filter-tag:hover {
  border-color: var(--accent);
  color: var(--accent-dark);
}
.filter-tag.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

/* ===== 素材卡片網格 ===== */
.materials-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}
.material-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  transition: all 0.25s;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
}
.material-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
  border-color: var(--accent);
}

/* 卡片預覽區 */
.card-preview {
  height: 140px;
  background: var(--bg-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.card-preview img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 8px;
}
.card-preview-icon {
  font-size: 40px;
  opacity: 0.3;
}

/* 卡片資訊區 */
.card-info {
  padding: 14px;
  border-top: 1px solid var(--border-light);
}
.card-category {
  font-size: 10px;
  font-weight: 600;
  color: var(--accent-dark);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}
.card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.card-tag {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--bg-secondary);
  color: var(--text-muted);
}

/* ===== 載入中 ===== */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.loading-spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== 錯誤訊息 ===== */
.error-message {
  text-align: center;
  padding: 60px 20px;
  color: #c0392b;
  background: #fdf2f2;
  border-radius: 12px;
  border: 1px solid #fadbd8;
}

/* ===== 無結果 ===== */
.no-results {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  grid-column: 1 / -1;
}

/* ===== 頁尾 ===== */
footer {
  text-align: center;
  padding: 32px;
  color: var(--text-muted);
  font-size: 13px;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}
footer a {
  color: var(--accent-dark);
  text-decoration: none;
}
footer a:hover {
  text-decoration: underline;
}

/* ===== RWD ===== */
@media (max-width: 768px) {
  .top-nav {
    padding: 0 16px;
  }
  .top-nav-links {
    display: none;
  }
  .page-wrapper {
    padding: 32px 16px 60px;
  }
  .page-title {
    font-size: 24px;
  }
  .materials-grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .stats-row {
    gap: 8px;
  }
  .stat-card {
    padding: 12px 16px;
    flex: 1;
    min-width: 140px;
  }
}
</style>
</head>
<body>

<!-- 頂部導航列 -->
<nav class="top-nav">
  <a href="/index.html" class="top-nav-brand">
    <span>🐻</span> 熊熊博物館
  </a>
  <div class="top-nav-links">
    <a href="/index.html">🏠 首頁</a>
    <a href="/ppt.html" class="active">📊 PPT素材</a>
    <a href="/slides">🎬 熊熊簡報</a>
    <a href="/vocabulary.html">📚 詞彙庫</a>
  </div>
</nav>

<!-- 主內容 -->
<main class="page-wrapper">
  <header class="page-header">
    <div class="page-eyebrow">Bear Materials</div>
    <h1 class="page-title">PPT 素材庫</h1>
    <p class="page-meta">精選設計素材，讓你的簡報與眾不同 ✨</p>
  </header>

  <!-- 統計資訊 -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <span class="stat-icon">📦</span>
      <div class="stat-info">
        <span class="stat-value" id="totalCount">-</span>
        <span class="stat-label">素材總數</span>
      </div>
    </div>
    <div class="stat-card">
      <span class="stat-icon">📅</span>
      <div class="stat-info">
        <span class="stat-value" id="dateCount">-</span>
        <span class="stat-label">更新日</span>
      </div>
    </div>
    <div class="stat-card">
      <span class="stat-icon">🏷️</span>
      <div class="stat-info">
        <span class="stat-value" id="categoryCount">-</span>
        <span class="stat-label">分類數</span>
      </div>
    </div>
  </div>

  <!-- 篩選標籤 -->
  <div class="filter-bar" id="filterBar">
    <span class="filter-tag active" data-category="all">全部</span>
  </div>

  <!-- 素材網格 -->
  <div class="materials-grid" id="materialsGrid">
    <div class="loading">
      <div class="loading-spinner"></div>
      <p>載入素材中...</p>
    </div>
  </div>
</main>

<footer>
  由 <a href="/index.html">熊熊(Kuma)</a> 盡心經營 🐻 | <a href="https://kumaweb.pages.dev">kumaweb.pages.dev</a>
</footer>

<script>
// 素材類別對應
const categoryIcons = {
  'backgrounds': '🖼️',
  'blocks': '📦',
  'borders': '🖌️',
  'flowcharts': '📊',
  'buttons': '🔘',
  'icons': '⭐',
  'charts': '📈',
  'decoration': '✨'
};

const categoryNames = {
  'backgrounds': '背景素材',
  'blocks': '卡片區塊',
  'borders': '邊框設計',
  'flowcharts': '流程圖',
  'buttons': '按鈕元件',
  'icons': '圖示',
  'charts': '圖表',
  'decoration': '裝飾元素'
};

let allMaterials = [];
let currentCategory = 'all';

// 初始化
async function init() {
  try {
    const response = await fetch('/materials/metadata.json');
    if (!response.ok) throw new Error('無法載入素材資料');
    
    const data = await response.json();
    allMaterials = data.materials || [];
    
    renderStats(allMaterials);
    renderCategories(allMaterials);
    renderMaterials(allMaterials);
  } catch (error) {
    console.error('Error:', error);
    document.getElementById('materialsGrid').innerHTML = `
      <div class="error-message">
        <p>⚠️ 載入失敗：${error.message}</p>
      </div>
    `;
  }
}

// 渲染統計資訊
function renderStats(materials) {
  const dates = [...new Set(materials.map(m => m.created))];
  const categories = [...new Set(materials.map(m => m.category))];
  
  document.getElementById('totalCount').textContent = materials.length;
  document.getElementById('dateCount').textContent = dates.length;
  document.getElementById('categoryCount').textContent = categories.length;
}

// 渲染分類標籤
function renderCategories(materials) {
  const categories = [...new Set(materials.map(m => m.category))].sort();
  const filterBar = document.getElementById('filterBar');
  
  categories.forEach(cat => {
    const tag = document.createElement('span');
    tag.className = 'filter-tag';
    tag.dataset.category = cat;
    tag.innerHTML = `${categoryIcons[cat] || '📁'} ${categoryNames[cat] || cat}`;
    tag.onclick = () => filterByCategory(cat);
    filterBar.appendChild(tag);
  });
  
  // 全部按鈕點擊事件
  filterBar.querySelector('[data-category="all"]').onclick = () => filterByCategory('all');
}

// 篩選素材
function filterByCategory(category) {
  currentCategory = category;
  
  // 更新標籤狀態
  document.querySelectorAll('.filter-tag').forEach(tag => {
    tag.classList.toggle('active', tag.dataset.category === category);
  });
  
  // 篩選並渲染
  const filtered = category === 'all' 
    ? allMaterials 
    : allMaterials.filter(m => m.category === category);
  
  renderMaterials(filtered);
}

// 渲染素材卡片
function renderMaterials(materials) {
  const grid = document.getElementById('materialsGrid');
  
  if (materials.length === 0) {
    grid.innerHTML = '<div class="no-results">找不到素材 😢</div>';
    return;
  }
  
  grid.innerHTML = materials.map(m => `
    <a href="/${m.path}" class="material-card" target="_blank" title="${m.description || m.name}">
      <div class="card-preview">
        ${m.format === 'svg' 
          ? `<img src="/${m.path}" alt="${m.name}" onerror="this.parentElement.innerHTML='<span class=\\'card-preview-icon\\'>${categoryIcons[m.category] || '📁'}</span>'">`
          : `<span class="card-preview-icon">${categoryIcons[m.category] || '📁'}</span>`
        }
      </div>
      <div class="card-info">
        <div class="card-category">${categoryNames[m.category] || m.category}</div>
        <div class="card-title">${m.name}</div>
        <div class="card-tags">
          <span class="card-tag">${m.created}</span>
          <span class="card-tag">${m.format?.toUpperCase() || 'SVG'}</span>
        </div>
      </div>
    </a>
  `).join('');
}

// 啟動
init();
</script>

</body>
</html>
