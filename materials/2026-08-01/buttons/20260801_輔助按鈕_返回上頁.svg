<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- 邊界引導線漸層 -->
    <linearGradient id="guideLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 左側引導線（#124 變化 #2 邊界引導線）-->
  <line x1="20" y1="60" x2="90" y2="60" stroke="url(#guideLine)" stroke-width="2"/>
  <line x1="30" y1="68" x2="80" y2="68" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- 按鈕本體（純線條風，呼應現代簡潔） -->
  <rect x="100" y="38" width="200" height="44" rx="4" fill="none" stroke="#1E40AF" stroke-width="2"/>

  <!-- 內部裝飾虛線 -->
  <line x1="110" y1="50" x2="290" y2="50" stroke="#3B82F6" stroke-width="0.5" opacity="0.3"/>
  <line x1="110" y1="70" x2="290" y2="70" stroke="#3B82F6" stroke-width="0.5" opacity="0.3"/>

  <!-- 左側箭頭（往左，表示返回） -->
  <polygon points="118,52 130,60 118,68 124,60" fill="#1E40AF"/>

  <!-- 文字「返回上頁」 -->
  <text x="210" y="68" font-family="'PingFang TC', 'Noto Sans TC', sans-serif" font-size="22" font-weight="600" fill="#1E40AF" text-anchor="middle" letter-spacing="3">返回上頁</text>

  <!-- 右側裝飾小點 -->
  <circle cx="285" cy="60" r="3" fill="#F59E0B"/>
</svg>