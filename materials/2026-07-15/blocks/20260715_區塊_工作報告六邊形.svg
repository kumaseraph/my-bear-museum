<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#blockGrad)"/>
  
  <!-- 六邊形資訊區塊 (蜂巢叢集) -->
  <g transform="translate(400,200)">
    <!-- 主區塊: 大六邊形 -->
    <path d="M0,-100 L86.6,-50 L86.6,50 L0,100 L-86.6,50 L-86.6,-50 Z" 
          fill="#6B5CE7" fill-opacity="0.8" stroke="#A78BFA" stroke-width="2"/>
    
    <!-- 內部標題區 -->
    <text x="0" y="-20" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="bold">工作報告</text>
    <text x="0" y="10" text-anchor="middle" fill="#A78BFA" font-size="14">WORK REPORT</text>
    <text x="0" y="40" text-anchor="middle" fill="#4ECDC4" font-size="12">2026.07.15</text>
    
    <!-- 左上連接區塊 -->
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z" 
          fill="#4ECDC4" fill-opacity="0.6" stroke="#4ECDC4" stroke-width="1"
          transform="translate(-100,-80)"/>
    <text x="-100" y="-75" text-anchor="middle" fill="#FFFFFF" font-size="11">月度</text>
    
    <!-- 右上連接區塊 -->
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z" 
          fill="#A78BFA" fill-opacity="0.6" stroke="#A78BFA" stroke-width="1"
          transform="translate(100,-80)"/>
    <text x="100" y="-75" text-anchor="middle" fill="#FFFFFF" font-size="11">季度</text>
    
    <!-- 左下連接區塊 -->
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z" 
          fill="#FBBF24" fill-opacity="0.6" stroke="#FBBF24" stroke-width="1"
          transform="translate(-80,90)"/>
    
    <!-- 右下連接區塊 -->
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z" 
          fill="#4ECDC4" fill-opacity="0.6" stroke="#4ECDC4" stroke-width="1"
          transform="translate(80,90)"/>
  </g>
  
  <!-- 底部裝飾 -->
  <line x1="100" y1="350" x2="700" y2="350" stroke="#6B5CE7" stroke-width="1" opacity="0.5"/>
</svg>