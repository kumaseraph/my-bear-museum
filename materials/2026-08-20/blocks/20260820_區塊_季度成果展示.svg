<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- 熊熊風格季度成果展示區塊 - 蜂巢叢集 + 尺寸漸層 + 案例成果導向 -->
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E3"/>
      <stop offset="100%" stop-color="#F0DEB8"/>
    </linearGradient>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#8B6239"/>
    </linearGradient>
    <pattern id="honeycombPattern" x="0" y="0" width="78" height="86.6" patternUnits="userSpaceOnUse">
      <path d="M39,0 L78,21.65 L78,64.95 L39,86.6 L0,64.95 L0,21.65 Z"
            fill="none" stroke="#B8895A" stroke-width="0.6" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#warmBg)"/>
  <rect width="800" height="450" fill="url(#honeycombPattern)"/>

  <!-- 標題列 -->
  <g transform="translate(50, 50)">
    <path d="M0,-20 L20,0 L20,15 L0,35 L-20,15 L-20,0 Z" fill="#8B6239"/>
    <text x="40" y="15" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="800" fill="#4C2D12">季度成果展示</text>
    <text x="40" y="35" font-family="Microsoft JhengHei, sans-serif" font-size="13" font-weight="500" fill="#8B6239" letter-spacing="2">Q3 ACHIEVEMENTS  ·  2026</text>
  </g>

  <!-- 蜂巢叢集 - 中心大六邊形 + 環繞小六邊形（#122 放射環形 + #120 大小對比） -->
  <g transform="translate(400, 270)">
    <!-- 中心大六邊形 (s=70) - 主要成果 -->
    <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z"
          fill="url(#hexGradient)" stroke="#4C2D12" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" font-weight="600" fill="#FDF6E3">總體</text>
    <text x="0" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#FDF6E3">100%</text>
    <text x="0" y="35" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="11" font-weight="500" fill="#FDF6E3">完成</text>

    <!-- 2環 6個小六邊形（應用 #120 顏色深淺對比） -->
    <g transform="rotate(0)">
      <g transform="translate(0, -120)">
        <path d="M0,-32 L27.7,-16 L27.7,16 L0,32 L-27.7,16 L-27.7,-16 Z" fill="#D4A574" stroke="#8B6239" stroke-width="1.5"/>
        <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#4C2D12">85</text>
        <text x="0" y="14" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="9" fill="#4C2D12">銷售</text>
      </g>
    </g>
    <g transform="rotate(60)">
      <g transform="translate(0, -120)">
        <path d="M0,-32 L27.7,-16 L27.7,16 L0,32 L-27.7,16 L-27.7,-16 Z" fill="#B8895A" stroke="#8B6239" stroke-width="1.5"/>
        <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#FDF6E3">92</text>
        <text x="0" y="14" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="9" fill="#FDF6E3">服務</text>
      </g>
    </g>
    <g transform="rotate(120)">
      <g transform="translate(0, -120)">
        <path d="M0,-32 L27.7,-16 L27.7,16 L0,32 L-27.7,16 L-27.7,-16 Z" fill="#A07845" stroke="#8B6239" stroke-width="1.5"/>
        <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#FDF6E3">78</text>
        <text x="0" y="14" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="9" fill="#FDF6E3">創新</text>
      </g>
    </g>
    <g transform="rotate(180)">
      <g transform="translate(0, -120)">
        <path d="M0,-32 L27.7,-16 L27.7,16 L0,32 L-27.7,16 L-27.7,-16 Z" fill="#8B6239" stroke="#4C2D12" stroke-width="1.5"/>
        <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#FDF6E3">95</text>
        <text x="0" y="14" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="9" fill="#FDF6E3">品質</text>
      </g>
    </g>
    <g transform="rotate(240)">
      <g transform="translate(0, -120)">
        <path d="M0,-32 L27.7,-16 L27.7,16 L0,32 L-27.7,16 L-27.7,-16 Z" fill="#B8895A" stroke="#8B6239" stroke-width="1.5"/>
        <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#FDF6E3">88</text>
        <text x="0" y="14" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="9" fill="#FDF6E3">效率</text>
      </g>
    </g>
    <g transform="rotate(300)">
      <g transform="translate(0, -120)">
        <path d="M0,-32 L27.7,-16 L27.7,16 L0,32 L-27.7,16 L-27.7,-16 Z" fill="#D4A574" stroke="#8B6239" stroke-width="1.5"/>
        <text x="0" y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="800" fill="#4C2D12">90</text>
        <text x="0" y="14" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="9" fill="#4C2D12">團隊</text>
      </g>
    </g>
  </g>

  <!-- 底部案例成果標籤（case-study structure: 結果導向） -->
  <g transform="translate(50, 400)">
    <text x="0" y="0" font-family="Microsoft JhengHei, sans-serif" font-size="12" font-weight="500" fill="#8B6239" letter-spacing="1">— 從計畫 → 執行 → 成果，結構化呈現季度工作重點</text>
  </g>
  <g transform="translate(750, 400)">
    <text x="0" y="0" text-anchor="end" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#6B5230" letter-spacing="1">📊 06</text>
  </g>
</svg>
