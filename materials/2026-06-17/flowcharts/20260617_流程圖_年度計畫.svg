<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <title>年度計畫流程</title>
  <desc>工作報告年度計畫步驟流程圖</desc>
  <!-- 背景 -->
  <rect width="800" height="400" fill="#FDF8F3"/>
  <!-- 連接線（手繪風格） -->
  <path d="M170 120 Q250 120 250 160 Q250 200 330 200" fill="none" stroke="#C4A35A" stroke-width="3" stroke-linecap="round"/>
  <path d="M370 200 Q450 200 450 160 Q450 120 530 120 Q610 120 610 160 Q610 200 670 200" fill="none" stroke="#C4A35A" stroke-width="3" stroke-linecap="round"/>
  <!-- 步驟1 -->
  <circle cx="120" cy="200" r="60" fill="#8B6914"/>
  <text x="120" y="190" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">STEP</text>
  <text x="120" y="215" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">01</text>
  <text x="120" y="280" font-family="Arial, sans-serif" font-size="14" fill="#8B6914" text-anchor="middle">計畫制定</text>
  <!-- 步驟2 -->
  <circle cx="320" cy="200" r="60" fill="#C4A35A"/>
  <text x="320" y="190" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">STEP</text>
  <text x="320" y="215" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">02</text>
  <text x="320" y="280" font-family="Arial, sans-serif" font-size="14" fill="#8B6914" text-anchor="middle">執行落實</text>
  <!-- 步驟3 -->
  <circle cx="520" cy="200" r="60" fill="#8B6914"/>
  <text x="520" y="190" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">STEP</text>
  <text x="520" y="215" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">03</text>
  <text x="520" y="280" font-family="Arial, sans-serif" font-size="14" fill="#8B6914" text-anchor="middle">成果檢視</text>
  <!-- 步驟4 -->
  <circle cx="720" cy="200" r="60" fill="#C4A35A"/>
  <text x="720" y="190" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">STEP</text>
  <text x="720" y="215" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">04</text>
  <text x="720" y="280" font-family="Arial, sans-serif" font-size="14" fill="#8B6914" text-anchor="middle">優化改進</text>
</svg>