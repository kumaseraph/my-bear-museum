<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- 工作報告背景 - 幾何圖案 + 簡報風格 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF9F0"/>
      <stop offset="50%" style="stop-color:#FFF5E6"/>
      <stop offset="100%" style="stop-color:#FFE8CC"/>
    </linearGradient>
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#E8A87C" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    <pattern id="dotPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#C68B59" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- 主背景 -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- 網格裝飾 -->
  <rect width="1920" height="1080" fill="url(#gridPattern)"/>
  
  <!-- 圓點裝飾 -->
  <rect width="1920" height="1080" fill="url(#dotPattern)"/>
  
  <!-- 左上角幾何裝飾 -->
  <circle cx="-50" cy="-50" r="200" fill="#E8A87C" opacity="0.1"/>
  <circle cx="-30" cy="-30" r="120" fill="#C68B59" opacity="0.08"/>
  
  <!-- 右下角幾何裝飾 -->
  <circle cx="1970" cy="1130" r="250" fill="#E8A87C" opacity="0.1"/>
  <circle cx="1950" cy="1110" r="150" fill="#C68B59" opacity="0.08"/>
  
  <!-- 左側豎條裝飾 -->
  <rect x="0" y="200" width="8" height="680" fill="url(#bgGrad)" opacity="0.8"/>
  <rect x="12" y="250" width="4" height="580" fill="#E8A87C" opacity="0.3"/>
  
  <!-- 右側豎條裝飾 -->
  <rect x="1912" y="200" width="8" height="680" fill="url(#bgGrad)" opacity="0.8"/>
  <rect x="1904" y="250" width="4" height="580" fill="#E8A87C" opacity="0.3"/>
  
  <!-- 底部橫條裝飾 -->
  <rect x="100" y="1050" width="1720" height="6" fill="#E8A87C" opacity="0.2" rx="3"/>
  
  <!-- 角落熊爪印裝飾 (簡化) -->
  <g opacity="0.15" transform="translate(80, 80)">
    <ellipse cx="0" cy="0" rx="15" ry="12" fill="#C68B59"/>
    <circle cx="-18" cy="-12" r="8" fill="#C68B59"/>
    <circle cx="0" cy="-18" r="8" fill="#C68B59"/>
    <circle cx="18" cy="-12" r="8" fill="#C68B59"/>
  </g>
  
  <g opacity="0.15" transform="translate(1840, 1000)">
    <ellipse cx="0" cy="0" rx="15" ry="12" fill="#C68B59"/>
    <circle cx="-18" cy="-12" r="8" fill="#C68B59"/>
    <circle cx="0" cy="-18" r="8" fill="#C68B59"/>
    <circle cx="18" cy="-12" r="8" fill="#C68B59"/>
  </g>
</svg>