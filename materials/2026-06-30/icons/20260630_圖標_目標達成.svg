<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>目標達成</title>
  <desc>工作報告圖標 - 菱形包圍五角星設計，象徵核心價值與目標達成</desc>
  <!-- 背景六邊形裝飾 -->
  <path d="M50,5 L90,27.5 L90,72.5 L50,95 L10,72.5 L10,27.5 Z" 
        fill="none" stroke="#6B5CE7" stroke-width="1.5" opacity="0.3"/>
  <!-- 菱形邊框 -->
  <polygon points="50,10 85,50 50,90 15,50" 
           fill="none" stroke="#6B5CE7" stroke-width="3"/>
  <!-- 內圈虛線菱形 -->
  <polygon points="50,20 75,50 50,80 25,50" 
           fill="none" stroke="#4ECDC4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- 五角星中心 -->
  <polygon points="50,30 56,45 72,45 59,55 64,70 50,60 36,70 41,55 28,45 44,45" 
           fill="#FF8C00"/>
  <!-- 裝飾小圓點 -->
  <circle cx="50" cy="15" r="3" fill="#4ECDC4"/>
  <circle cx="80" cy="50" r="3" fill="#4ECDC4"/>
  <circle cx="50" cy="85" r="3" fill="#4ECDC4"/>
  <circle cx="20" cy="50" r="3" fill="#4ECDC4"/>
</svg>