<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="600" fill="#0A0612"/>
  
  <!-- 蜂巢裝飾背景 -->
  <pattern id="hexPat" x="0" y="0" width="52" height="60" patternUnits="userSpaceOnUse">
    <path d="M26,0 L52,15 L52,45 L26,60 L0,45 L0,15 Z" 
          fill="none" stroke="#6B5CE7" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="800" height="600" fill="url(#hexPat)"/>
  
  <!-- 主卡片 -->
  <g transform="translate(100, 80)">
    <!-- 外框六邊形襯托 -->
    <polygon points="0,-20 346.4,-10 346.4,130 0,140 -346.4,130 -346.4,-10" 
             fill="none" stroke="#6B5CE7" stroke-width="2" opacity="0.3" transform="translate(300, 70)"/>
    
    <!-- 主卡片背景 -->
    <rect x="0" y="0" width="600" height="280" rx="12" fill="url(#cardGrad1)"/>
    <rect x="0" y="0" width="600" height="280" rx="12" fill="none" stroke="#A78BFA" stroke-width="2"/>
    
    <!-- 頂部標題區 -->
    <rect x="0" y="0" width="600" height="60" rx="12" fill="#4C1D95" opacity="0.5"/>
    <rect x="0" y="40" width="600" height="20" fill="#4C1D95" opacity="0.5"/>
    
    <!-- 蜂巢圖標 -->
    <g transform="translate(50, 30)">
      <polygon points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10" 
               fill="#4ECDC4" stroke="#22D3EE" stroke-width="1.5"/>
      <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6" 
               fill="none" stroke="white" stroke-width="1"/>
    </g>
    
    <text x="90" y="40" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white">工作報告摘要</text>
    
    <!-- 內容區 -->
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.9">本月完成項目</text>
    <text x="30" y="130" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#4ECDC4">87%</text>
    
    <text x="200" y="100" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.9">待辦事項</text>
    <text x="200" y="130" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#22D3EE">12</text>
    
    <text x="350" y="100" font-family="Arial, sans-serif" font-size="16" fill="white" opacity="0.9">完成率</text>
    <text x="350" y="130" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#F97316">94%</text>
    
    <!-- 底部狀態條 -->
    <rect x="30" y="200" width="540" height="8" rx="4" fill="#1E293B"/>
    <rect x="30" y="200" width="480" height="8" rx="4" fill="#4ECDC4"/>
    
    <text x="30" y="240" font-family="Arial, sans-serif" font-size="12" fill="#A78BFA">更新於 2026-07-01</text>
  </g>
  
  <!-- 右側小卡片 -->
  <g transform="translate(450, 400)">
    <rect width="280" height="140" rx="8" fill="url(#cardGrad2)"/>
    <rect width="280" height="140" rx="8" fill="none" stroke="#22D3EE" stroke-width="1.5"/>
    
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.8">目標達成</text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">+23%</text>
    
    <!-- 小蜂巢裝飾 -->
    <g transform="translate(200, 30)" opacity="0.6">
      <polygon points="0,-15 13,-7.5 13,7.5 0,15 -13,7.5 -13,-7.5" 
               fill="none" stroke="#22D3EE" stroke-width="1"/>
      <polygon points="0,-8 6.9,-4 6.9,4 0,8 -6.9,4 -6.9,-4" 
               fill="#22D3EE"/>
    </g>
    
    <text x="20" y="120" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.6">相較上月</text>
  </g>
  
  <!-- 左下裝飾 -->
  <g transform="translate(50, 420)">
    <rect width="200" height="120" rx="8" fill="url(#cardGrad3)"/>
    <rect width="200" height="120" rx="8" fill="none" stroke="#FB923C" stroke-width="1.5"/>
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.8">產出效率</text>
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">高</text>
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="11" fill="white" opacity="0.6">超越目標</text>
  </g>
</svg>