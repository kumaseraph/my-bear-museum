<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 200">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="200" fill="#1a1a2e"/>
  
  <!-- 頁碼數字 -->
  <text x="960" y="120" fill="url(#pageGrad)" font-size="100" font-weight="bold" text-anchor="middle" font-family="Arial, sans-serif">07</text>
  
  <!-- 六邊形裝飾（左側 技巧#120） -->
  <g transform="translate(150, 100)" opacity="0.6">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="none" stroke="#6B5CE7" stroke-width="3"/>
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="#6B5CE7" fill-opacity="0.2"/>
  </g>
  
  <g transform="translate(250, 60)" opacity="0.4">
    <path d="M35,3.5 L65.3,19.25 L65.3,54.75 L35,70.5 L4.7,54.75 L4.7,19.25 Z" 
          fill="none" stroke="#A78BFA" stroke-width="2"/>
  </g>
  
  <!-- 六邊形裝飾（右側） -->
  <g transform="translate(1650, 100)" opacity="0.6">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="none" stroke="#4ECDC4" stroke-width="3"/>
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="#4ECDC4" fill-opacity="0.2"/>
  </g>
  
  <g transform="translate(1550, 60)" opacity="0.4">
    <path d="M35,3.5 L65.3,19.25 L65.3,54.75 L35,70.5 L4.7,54.75 L4.7,19.25 Z" 
          fill="none" stroke="#4ECDC4" stroke-width="2"/>
  </g>
  
  <!-- 底部裝飾線 -->
  <line x1="400" y1="180" x2="1520" y2="180" stroke="url(#pageGrad)" stroke-width="2" opacity="0.4"/>
  
  <!-- 分隔點 -->
  <circle cx="960" cy="180" r="4" fill="#6B5CE7"/>
  <circle cx="940" cy="180" r="2" fill="#A78BFA" opacity="0.6"/>
  <circle cx="980" cy="180" r="2" fill="#4ECDC4" opacity="0.6"/>
</svg>