<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- 蜂蜜主漸層 -->
    <linearGradient id="honeyStream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE9B5"/>
      <stop offset="40%" stop-color="#F4D08C"/>
      <stop offset="100%" stop-color="#D89030"/>
    </linearGradient>
    <!-- 蜂蜜深淺對比 (技巧 #120 顏色深淺) -->
    <linearGradient id="hexLarge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C77B22"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
    <linearGradient id="hexMedium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#C77B22"/>
    </linearGradient>
    <linearGradient id="hexSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4B860"/>
      <stop offset="100%" stop-color="#E8A33D"/>
    </linearGradient>
    <!-- 流金裝飾漸層 -->
    <linearGradient id="goldStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE4A8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFE4A8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFE4A8" stop-opacity="0"/>
    </linearGradient>
    <!-- 蜂巢pattern -->
    <pattern id="honeycombBg2" x="0" y="0" width="78" height="86.6" patternUnits="userSpaceOnUse">
      <path d="M39,0 L78,21.65 L78,64.95 L39,86.6 L0,64.95 L0,21.65 Z"
            fill="none" stroke="#A87A3F" stroke-width="0.6" opacity="0.25"/>
    </pattern>
    <!-- 手繪粗糙�鏡 -->
    <filter id="rough2">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
  </defs>

  <!-- 蜂蜜漸層底 -->
  <rect width="1920" height="1080" fill="url(#honeyStream)"/>
  <!-- 蜂巢底紋 -->
  <rect width="1920" height="1080" fill="url(#honeycombBg2)" opacity="0.6"/>

  <!-- 流金裝飾線 (Imperfect by Design) -->
  <path d="M0,300 Q480,250 960,320 T1920,290" stroke="url(#goldStream)"
        stroke-width="40" fill="none" opacity="0.4" filter="url(#rough2)"/>
  <path d="M0,780 Q480,720 960,800 T1920,760" stroke="url(#goldStream)"
        stroke-width="60" fill="none" opacity="0.35" filter="url(#rough2)"/>

  <!-- 尺寸漸層蜂巢 (中心→外圍) - 左側主要�集 -->
  <g transform="translate(640, 540)" filter="url(#rough2)">
    <!-- 中心最大六邊形 (s=140) -->
    <path d="M0,-140 L121.2,-70 L121.2,70 L0,140 L-121.2,70 L-121.2,-70 Z"
          fill="url(#hexLarge)" stroke="#5C3A1E" stroke-width="3"/>
    <!-- 2.5D 內嵌 -->
    <path d="M0,-90 L77.9,-45 L77.9,45 L0,90 L-77.9,45 L-77.9,-45 Z"
          fill="none" stroke="#FFE4A8" stroke-width="4"/>

    <!-- 中環 6個中型六邊形 (s=70) -->
    <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z"
          fill="url(#hexMedium)" stroke="#5C3A1E" stroke-width="2"
          transform="rotate(0) translate(0,-200)"/>
    <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z"
          fill="url(#hexMedium)" stroke="#5C3A1E" stroke-width="2"
          transform="rotate(60) translate(0,-200)"/>
    <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z"
          fill="url(#hexMedium)" stroke="#5C3A1E" stroke-width="2"
          transform="rotate(120) translate(0,-200)"/>
    <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z"
          fill="url(#hexMedium)" stroke="#5C3A1E" stroke-width="2"
          transform="rotate(180) translate(0,-200)"/>
    <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z"
          fill="url(#hexMedium)" stroke="#5C3A1E" stroke-width="2"
          transform="rotate(240) translate(0,-200)"/>
    <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z"
          fill="url(#hexMedium)" stroke="#5C3A1E" stroke-width="2"
          transform="rotate(300) translate(0,-200)"/>

    <!-- 外環 12個小型六邊形 (s=35) -->
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
          fill="url(#hexSmall)" stroke="#5C3A1E" stroke-width="1.5"
          transform="rotate(0) translate(0,-320)"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
          fill="none" stroke="#5C3A1E" stroke-width="1.5"
          transform="rotate(30) translate(0,-320)"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
          fill="url(#hexSmall)" stroke="#5C3A1E" stroke-width="1.5"
          transform="rotate(60) translate(0,-320)"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
          fill="none" stroke="#5C3A1E" stroke-width="1.5"
          transform="rotate(90) translate(0,-320)"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
          fill="url(#hexSmall)" stroke="#5C3A1E" stroke-width="1.5"
          transform="rotate(120) translate(0,-320)"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
          fill="none" stroke="#5C3A1E" stroke-width="1.5"
          transform="rotate(150) translate(0,-320)"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
          fill="url(#hexSmall)" stroke="#5C3A1E" stroke-width="1.5"
          transform="rotate(180) translate(0,-320)"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
          fill="none" stroke="#5C3A1E" stroke-width="1.5"
          transform="rotate(210) translate(0,-320)"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
          fill="url(#hexSmall)" stroke="#5C3A1E" stroke-width="1.5"
          transform="rotate(240) translate(0,-320)"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
          fill="none" stroke="#5C3A1E" stroke-width="1.5"
          transform="rotate(270) translate(0,-320)"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
          fill="url(#hexSmall)" stroke="#5C3A1E" stroke-width="1.5"
          transform="rotate(300) translate(0,-320)"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
          fill="none" stroke="#5C3A1E" stroke-width="1.5"
          transform="rotate(330) translate(0,-320)"/>
  </g>

  <!-- 右側分組叢集 (Bento Grid 概念) -->
  <g transform="translate(1400, 320)">
    <path d="M0,-60 L52,-30 L52,30 L0,60 L-52,30 L-52,-30 Z"
          fill="url(#hexMedium)" stroke="#5C3A1E" stroke-width="2"/>
    <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
          fill="#FFE4A8" stroke="#5C3A1E" stroke-width="1"/>
  </g>
  <g transform="translate(1560, 480)">
    <path d="M0,-45 L39,-22.5 L39,22.5 L0,45 L-39,22.5 L-39,-22.5 Z"
          fill="url(#hexSmall)" stroke="#5C3A1E" stroke-width="2"/>
  </g>
  <g transform="translate(1500, 700)">
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="none" stroke="#5C3A1E" stroke-width="3"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#E8A33D" opacity="0.7"/>
  </g>

  <!-- 標題文字 -->
  <g transform="translate(960, 920)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="52" font-weight="bold"
          fill="#5C3A1E" text-anchor="middle">工作報告 · 蜂蜜流金</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="22"
          fill="#8B5A2B" text-anchor="middle" opacity="0.85">Work Report · Honey Stream</text>
  </g>
</svg>
