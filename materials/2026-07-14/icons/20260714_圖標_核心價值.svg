<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- 配色方案：皇室風 -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#1E1B4B"/>
  
  <!-- 菱形包圍五角星設計 -->
  <g transform="translate(960,540)">
    <!-- 外層菱形 -->
    <polygon points="0,-180 140,0 0,180 -140,0" 
             fill="none" stroke="url(#hexGrad)" stroke-width="4"/>
    
    <!-- 第二層菱形 -->
    <polygon points="0,-130 100,0 0,130 -100,0" 
             fill="url(#hexGrad)" fill-opacity="0.2" stroke="url(#hexGrad)" stroke-width="2"/>
    
    <!-- 中央五角星 -->
    <polygon points="0,-80 20,-30 70,-30 30,5 45,55 0,25 -45,55 -30,5 -70,-30 -20,-30" 
             fill="url(#starGrad)" stroke="#C2410C" stroke-width="2"/>
    
    <!-- 放射光芒裝飾 -->
    <line x1="0" y1="-200" x2="0" y2="-160" stroke="#FF8C00" stroke-width="3"/>
    <line x1="0" y1="200" x2="0" y2="160" stroke="#FF8C00" stroke-width="3"/>
    <line x1="-200" y1="0" x2="-160" y2="0" stroke="#FF8C00" stroke-width="3"/>
    <line x1="200" y1="0" x2="160" y2="0" stroke="#FF8C00" stroke-width="3"/>
    
    <!-- 對角線裝飾 -->
    <line x1="-140" y1="-140" x2="-100" y2="-100" stroke="#6B5CE7" stroke-width="2"/>
    <line x1="140" y1="-140" x2="100" y2="-100" stroke="#6B5CE7" stroke-width="2"/>
    <line x1="-140" y1="140" x2="-100" y2="100" stroke="#6B5CE7" stroke-width="2"/>
    <line x1="140" y1="140" x2="100" y2="100" stroke="#6B5CE7" stroke-width="2"/>
    
    <!-- 角落小六邊形裝飾 -->
    <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="#6B5CE7" opacity="0.6"/>
  </g>
  
  <!-- 底部標題區 -->
  <text x="960" y="850" text-anchor="middle" 
        font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#F8FAFC">
    核心價值
  </text>
  <text x="960" y="920" text-anchor="middle" 
        font-family="Arial, sans-serif" font-size="24" fill="#94A3B8">
    Core Value • 菱形包圍五角星設計
  </text>
</svg>