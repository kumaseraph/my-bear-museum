<style>
:root {
  /* 博物館同款暖色系 */
  --bg: #fdf8f3;
  --bg-secondary: #fff5eb;
  --card: #ffffff;
  --card-hover: #faf5f0;
  --primary: #5d4037;
  --accent: #d4a574;
  --accent-dark: #c4956a;
  --text: #5d4037;
  --text-muted: #8b7355;
  --text-light: #a89585;
  --border: #d7ccc8;
  --border-light: rgba(93,64,55,0.1);
  --shadow: 0 4px 18px rgba(93,64,55,0.06);
  --shadow-hover: 0 8px 28px rgba(93,64,55,0.12);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== 博物館同款頂部導航列 ===== */
.top-nav {
  background: var(--primary);
  padding: 0 32px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(93,64,55,0.15);
  position: sticky;
  top: 0;
  z-index: 100;
}
.top-nav-brand {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.top-nav-links {
  display: flex;
  gap: 4px;
}
.top-nav-links a {
  color: rgba(255,255,255,0.8);
  text-decoration: none;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
}
.top-nav-links a:hover {
  color: #fff;
  background: rgba(255,255,255,0.15);
}
.top-nav-links a.active {
  color: #fff;
  background: rgba(255,255,255,0.2);
}

/* ===== 頁面內容 ===== */
.page-wrapper {
  max-width: 1100px;
  margin: 0 auto;
  padding: 48px 32px 80px;
}

/* ===== 頁首 ===== */
.page-header {
  margin-bottom: 40px;
  padding-bottom: 28px;
  border-bottom: 2px solid var(--border);
  position: relative;
}
.page-header::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 0;
  width: 80px;
  height: 2px;
  background: var(--accent);
}
.page-eyebrow {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent-dark);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.page-title {
  font-size: 30px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 6px;
  letter-spacing: 0.5px;
}
.page-meta {
  font-size: 13px;
  color: var(--text-muted);
}

/* ===== 篩選列 ===== */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-tag {
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--card);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.filter-tag:hover {
  border-color: var(--accent);
  color: var(--accent-dark);
}
.filter-tag.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}

/* ===== 簡報卡片網格 ===== */
.slides-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 24px;
}
.slide-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  transition: all 0.25s;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow);
  position: relative;
}
.slide-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-hover);
  border-color: var(--accent);
}

/* 卡片左側色條 */
.slide-card::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 5px;
  background: var(--card-accent, var(--accent));
  border-radius: 16px 0 0 16px;
}

/* 卡片預覽區 */
.card-preview {
  height: 130px;
  background: var(--bg-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.card-preview-icon {
  opacity: 0.25;
  transition: opacity 0.25s;
}
.slide-card:hover .card-preview-icon {
  opacity: 0.4;
}
.card-category-badge {
  position: absolute;
  top: 12px;
  left: 16px;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  background: rgba(255,255,255,0.85);
  color: var(--card-accent, var(--accent-dark));
  border: 1px solid var(--card-accent, var(--accent));
}
.card-date-badge {
  position: absolute;
  top: 12px;
  right: 12px;
  font-size: 11px;
  color: var(--text-light);
  font-weight: 500;
}

/* 卡片主體 */
.card-body {
  padding: 18px 20px 16px;
  flex: 1;
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 8px;
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 卡片底部 */
.card-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-link-text {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent-dark);
  display: flex;
  align-items: center;
  gap: 4px;
  transition: gap 0.2s;
}
.slide-card:hover .card-link-text {
  gap: 8px;
}
.card-color-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

/* ===== 無篩選結果 ===== */
.no-result {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
  font-size: 14px;
}
.no-result-icon {
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.5;
}

/* ===== 響應式 ===== */
@media (max-width: 600px) {
  .page-wrapper { padding: 72px 16px 60px; }
  .page-title { font-size: 24px; }
  .slides-grid { grid-template-columns: 1fr; gap: 16px; }
}

const CATEGORY_LABELS = {
  government: "政府",
  tech: "科技",
  creative: "創意",
  business: "商業",
  life: "生活",
  review: "回顧"
};

function formatDate(d) {
  const [y, m, day] = d.split("-");
  return `${parseInt(m)}/${parseInt(day)}`;
}

// 熊熊掌印 SVG
const pawSVG = (color) => `
<svg class="card-preview-icon" viewBox="0 0 64 64" width="52" height="52" fill="${color}" stroke="none">
  <ellipse cx="32" cy="44" rx="12" ry="10"/>
  <circle cx="18" cy="28" r="6"/>
  <circle cx="46" cy="28" r="6"/>
  <circle cx="12" cy="38" r="5"/>
  <circle cx="52" cy="38" r="5"/>
</svg>
`;

function renderSlides(filter) {
  const grid = document.getElementById("slides-grid");
  const noResult = document.getElementById("no-result");
  const filtered = filter === "all" ? SLIDES : SLIDES.filter(s => s.category === filter);

  if (filtered.length === 0) {
    grid.innerHTML = "";
    noResult.style.display = "block";
    return;
  }
  noResult.style.display = "none";

  grid.innerHTML = filtered.map(slide => `
    <a class="slide-card" href="/presentations/${slide.file}.htm" style="--card-accent: ${slide.color}">
      <div class="card-preview">
        ${pawSVG(slide.color)}
        <span class="card-category-badge">${CATEGORY_LABELS[slide.category] || slide.category}</span>
        <span class="card-date-badge">${formatDate(slide.date)}</span>
      </div>
      <div class="card-body">
        <div class="card-title">${slide.title}</div>
        <div class="card-subtitle">${slide.subtitle || ''}</div>
      </div>
      <div class="card-footer">
        <span class="card-link-text">開啟簡報 →</span>
        <span class="card-color-dot" style="background:${slide.color}"></span>
      </div>
    </a>
  `).join("");
}

document.getElementById("total-count").textContent = SLIDES.length;
renderSlides("all");

document.querySelectorAll(".filter-tag").forEach(tag => {
  tag.addEventListener("click", () => {
    document.querySelectorAll(".filter-tag").forEach(t => t.classList.remove("active"));
    tag.classList.add("active");
    renderSlides(tag.dataset.filter);
  });
});
</script>
