<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="hexGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A84B"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C49A3A"/>
      <stop offset="100%" stop-color="#6B4E1A"/>
    </linearGradient>
  </defs>
  
  <!-- 六邊形外框（2.5D效果） -->
  <path d="M50,8 L87,29 L87,71 L50,92 L13,71 L13,29 Z" 
        fill="none" stroke="url(#hexGrad1)" stroke-width="4"/>
  <path d="M50,8 L87,29 L87,71 L50,92 L13,71 L13,29 Z" 
        fill="#D4A84B" fill-opacity="0.15"/>
  
  <!-- 柱狀圖（分析圖示） -->
  <g transform="translate(28, 55)">
    <!-- 柱1 -->
    <rect x="0" y="0" width="10" height="28" rx="2" fill="url(#barGrad)" fill-opacity="0.7"/>
    <!-- 柱2 -->
    <rect x="14" y="-12" width="10" height="40" rx="2" fill="url(#barGrad)" fill-opacity="0.85"/>
    <!-- 柱3 -->
    <rect x="28" y="-24" width="10" height="52" rx="2" fill="url(#barGrad)"/>
  </g>
  
  <!-- 趨勢箭頭 -->
  <g transform="translate(55, 32)">
    <path d="M0,20 L15,5 L15,12 L28,12 L28,18 L15,18 L15,25 Z" 
          fill="#8B6914" fill-opacity="0.8"/>
  </g>
</svg>