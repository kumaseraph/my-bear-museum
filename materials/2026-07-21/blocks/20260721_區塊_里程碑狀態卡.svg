<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">里程碑狀態卡</title>
  <desc id="desc">亮點、阻礙與下一步以蜂巢分組、尺寸對比和清晰摘要呈現</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#66736A" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#263238" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#F7F7F2"/>
  <rect x="72" y="72" width="1776" height="936" rx="36" fill="url(#grid)"/>
  <rect x="112" y="112" width="1696" height="856" rx="28" fill="#F7F7F2" fill-opacity=".94" stroke="#87A96B" stroke-opacity=".45" stroke-width="2"/>
  <text x="160" y="190" fill="#263238" font-family="Noto Sans TC, sans-serif" font-size="68" font-weight="800">本週狀態：亮點已形成，阻礙可控</text>
  <text x="160" y="252" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="31">用三個意圖清楚交代進度，讓下一步可以直接行動。</text>
  <g filter="url(#shadow)">
    <rect x="160" y="338" width="620" height="452" rx="30" fill="#87A96B" fill-opacity=".24" stroke="#263238" stroke-width="2.5"/>
    <rect x="820" y="338" width="420" height="452" rx="30" fill="#F7F7F2" stroke="#66736A" stroke-opacity=".55" stroke-width="2.5"/>
    <rect x="1280" y="338" width="480" height="452" rx="30" fill="#F4D35E" fill-opacity=".42" stroke="#263238" stroke-width="2.5"/>
  </g>
  <g transform="translate(252 434)">
    <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="#263238" fill-opacity=".14" transform="translate(10 12)"/>
    <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="#F7F7F2" stroke="#263238" stroke-width="3"/>
    <path d="M-20 2l14 14 29-34" fill="none" stroke="#87A96B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="330" y="430" fill="#263238" font-family="Noto Sans TC, sans-serif" font-size="30" font-weight="700">亮點</text>
  <text x="208" y="568" fill="#263238" font-family="Noto Sans TC, sans-serif" font-size="48" font-weight="800">驗證節奏提前</text>
  <text x="208" y="632" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="30">核心任務已完成</text>
  <path d="M208 694H720" stroke="#87A96B" stroke-width="10" stroke-linecap="round"/>
  <text x="208" y="752" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="27">進度  •  92%</text>
  <g transform="translate(898 432)">
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="#66736A" fill-opacity=".13" stroke="#66736A" stroke-width="2"/>
    <path d="M0 -23v27M0 16v4" stroke="#263238" stroke-width="7" stroke-linecap="round"/>
  </g>
  <text x="968" y="430" fill="#263238" font-family="Noto Sans TC, sans-serif" font-size="30" font-weight="700">阻礙</text>
  <text x="868" y="568" fill="#263238" font-family="Noto Sans TC, sans-serif" font-size="43" font-weight="800">等待回饋</text>
  <text x="868" y="632" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="29">範圍已鎖定</text>
  <rect x="868" y="690" width="312" height="12" rx="6" fill="#66736A" fill-opacity=".18"/>
  <rect x="868" y="690" width="184" height="12" rx="6" fill="#66736A"/>
  <text x="868" y="752" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="27">風險  •  低</text>
  <g transform="translate(1384 432)">
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="#F7F7F2" stroke="#263238" stroke-width="2.5"/>
    <path d="M-17 5h34M8 -5l10 10-10 10" fill="none" stroke="#263238" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1454" y="430" fill="#263238" font-family="Noto Sans TC, sans-serif" font-size="30" font-weight="700">下一步</text>
  <text x="1328" y="568" fill="#263238" font-family="Noto Sans TC, sans-serif" font-size="43" font-weight="800">完成品質驗證</text>
  <text x="1328" y="632" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="29">明日 17:00 前回報</text>
  <path d="M1328 690h350" stroke="#263238" stroke-opacity=".3" stroke-width="3"/>
  <text x="1328" y="752" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="27">負責人  •  專案小組</text>
  <g opacity=".72">
    <polygon points="160,878 204,852 248,878 248,930 204,956 160,930" fill="#87A96B"/>
    <polygon points="264,878 308,852 352,878 352,930 308,956 264,930" fill="#F4D35E"/>
    <polygon points="368,878 412,852 456,878 456,930 412,956 368,930" fill="#263238" fill-opacity=".28"/>
    <polygon points="472,878 516,852 560,878 560,930 516,956 472,930" fill="#87A96B" fill-opacity=".42"/>
