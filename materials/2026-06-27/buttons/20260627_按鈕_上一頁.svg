<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <title>上一頁按鈕</title>
  <desc>工作報告PPT上一頁按鈕，採用平行四邊形skewX動感設計</desc>
  
  <defs>
    <!-- 主體漸層 -->
    <linearGradient id="btnGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
    <!-- 引導線條紋 -->
    <pattern id="guideLines1" patternUnits="userSpaceOnUse" width="8" height="8">
      <line x1="0" y1="8" x2="8" y2="0" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- 陰影層 -->
  <polygon points="25,8 235,8 215,72 5,72" fill="#1E293B" opacity="0.2" transform="translate(4,4)"/>
  
  <!-- 主體：平行四邊形 skewX=-15 左向動感 -->
  <g transform="translate(0,0)">
    <polygon points="25,0 235,0 215,64 5,64" 
             fill="url(#btnGrad1)" 
             transform="skewX(-15)"/>
    
    <!-- 邊界引導線 -->
    <line x1="25" y1="0" x2="5" y2="64" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <line x1="35" y1="0" x2="15" y2="64" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
    
    <!-- 條紋疊加 -->
    <polygon points="25,0 235,0 215,64 5,64" 
             fill="url(#guideLines1)" 
             transform="skewX(-15)"/>
  </g>
  
  <!-- 左箭頭指示 -->
  <polygon points="70,32 95,22 95,27 120,27 120,37 95,37 95,42" 
           fill="#ffffff" 
           transform="skewX(-15) translate(-10,0)"/>
  
  <!-- 文字：上一頁 -->
  <text x="145" y="40" 
        font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" 
        font-size="22" 
        font-weight="500" 
        fill="#ffffff" 
        text-anchor="middle"
        transform="skewX(-15)">上一頁</text>
</svg>