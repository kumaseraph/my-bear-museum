<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- 雙重交叉線 pattern -->
    <pattern id="crossLines" patternUnits="userSpaceOnUse" width="12" height="12">
      <line x1="0" y1="12" x2="12" y2="0" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
      <line x1="-6" y1="6" x2="6" y2="-6" stroke="#3B82F6" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- 外框（粗空心 + 雙重交叉線填充 #124 變化 #6） -->
  <polygon points="30,30 320,30 300,90 10,90" fill="url(#crossLines)" stroke="#1E40AF" stroke-width="2.5" transform="skewX(-12)"/>

  <!-- 內框（半透明） -->
  <polygon points="50,42 300,42 286,78 36,78" fill="#FFFFFF" opacity="0.85" transform="skewX(-12)"/>

  <!-- 交叉強調線（X 形） -->
  <line x1="36" y1="78" x2="300" y2="42" stroke="#F59E0B" stroke-width="1" opacity="0.5" transform="skewX(-12)"/>
  <line x1="50" y1="42" x2="286" y2="78" stroke="#F59E0B" stroke-width="1" opacity="0.5" transform="skewX(-12)"/>

  <!-- 左側小圓點（節點感） -->
  <circle cx="60" cy="60" r="4" fill="#1E40AF" transform="skewX(-12)"/>

  <!-- 文字「檢視詳情」 -->
  <text x="170" y="68" font-family="'PingFang TC', 'Noto Sans TC', sans-serif" font-size="22" font-weight="600" fill="#1E40AF" text-anchor="middle" letter-spacing="3">檢視詳情</text>

  <!-- 右側小箭頭 -->
  <polygon points="280,55 295,60 280,65" fill="#F59E0B"/>
</svg>