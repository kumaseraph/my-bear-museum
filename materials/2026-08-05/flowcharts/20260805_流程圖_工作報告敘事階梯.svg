<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img">
  <title>工作報告敘事階梯流程圖</title>
  <desc>5步驟平行四邊形階梯式工作報告流程圖</desc>
  <defs>
    <filter id="paperTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="textured"/>
      <feComposite in="textured" in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="step4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="step5Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FB7185"/>
    </marker>
    <marker id="arrowYellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#FBBF24"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- 標題區 -->
  <text x="960" y="75" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="52" font-weight="bold" fill="#F8FAFC" text-anchor="middle">工作報告敘事流程</text>
  <text x="960" y="115" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="24" fill="#22D3EE" text-anchor="middle" opacity="0.85">5步驟完成高效工作報告</text>

  <!-- 連接線 - 從前一節點右邊界 → 下一節點左邊界 -->
  <!-- 線1: STEP1 右邊界(350,270) → STEP2 左邊界(580,370) -->
  <line x1="350" y1="270" x2="580" y2="370" stroke="#22D3EE" stroke-width="3" marker-end="url(#arrowCyan)"/>
  <!-- 線2: STEP2 右邊界(820,370) → STEP3 左邊界(1050,470) -->
  <line x1="820" y1="370" x2="1050" y2="470" stroke="#FB7185" stroke-width="3" marker-end="url(#arrowPink)"/>
  <!-- 線3: STEP3 右邊界(1290,470) → STEP4 左邊界(1520,570) -->
  <line x1="1290" y1="470" x2="1520" y2="570" stroke="#FBBF24" stroke-width="3" marker-end="url(#arrowYellow)"/>
  <!-- 線4: STEP4 右邊界(1750,570) → STEP5 左邊界(1380,670) - 向下彎曲連接 -->
  <path d="M 1750 570 Q 1860 570 1860 670 Q 1860 770 1380 770" stroke="#34d399" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>

  <!-- 步驟 1：起點規劃 - 平行四邊形寬220,高110,斜角30px -->
  <g transform="translate(80, 170)">
    <polygon points="0,15 190,0 220,110 30,125" fill="url(#step1Grad)" opacity="0.92"/>
    <polygon points="0,15 190,0 220,110 30,125" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="110" y="40" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">STEP 1</text>
    <text x="110" y="70" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="22" font-weight="bold" fill="#172554" text-anchor="middle">明確目標</text>
    <text x="110" y="98" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#1e3a5f" text-anchor="middle">設定SMART目標</text>
  </g>

  <!-- 步驟 2：資料收集 -->
  <g transform="translate(460, 290)">
    <polygon points="0,15 190,0 220,110 30,125" fill="url(#step2Grad)" opacity="0.92"/>
    <polygon points="0,15 190,0 220,110 30,125" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="110" y="40" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">STEP 2</text>
    <text x="110" y="70" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle">資料收集</text>
    <text x="110" y="98" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#fce7f3" text-anchor="middle">數據與事實</text>
  </g>

  <!-- 步驟 3：結構建構 -->
  <g transform="translate(840, 410)">
    <polygon points="0,15 190,0 220,110 30,125" fill="url(#step3Grad)" opacity="0.92"/>
    <polygon points="0,15 190,0 220,110 30,125" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="110" y="40" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#172554" text-anchor="middle">STEP 3</text>
    <text x="110" y="70" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="22" font-weight="bold" fill="#172554" text-anchor="middle">結構建構</text>
    <text x="110" y="98" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#422006" text-anchor="middle">金字塔原理</text>
  </g>

  <!-- 步驟 4：行動建議 -->
  <g transform="translate(1220, 530)">
    <polygon points="0,15 190,0 220,110 30,125" fill="url(#step4Grad)" opacity="0.92"/>
    <polygon points="0,15 190,0 220,110 30,125" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="110" y="40" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">STEP 4</text>
    <text x="110" y="70" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle">行動方案</text>
    <text x="110" y="98" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#d1fae5" text-anchor="middle">具體可行</text>
  </g>

  <!-- 步驟 5：成果呈現 -->
  <g transform="translate(1050, 690)">
    <polygon points="0,15 190,0 220,110 30,125" fill="url(#step5Grad)" opacity="0.92"/>
    <polygon points="0,15 190,0 220,110 30,125" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="110" y="40" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">STEP 5</text>
    <text x="110" y="70" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle">成果展現</text>
    <text x="110" y="98" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#ddd6fe" text-anchor="middle">總結與呼籲</text>
  </g>

  <!-- 底部裝飾 -->
  <rect x="0" y="1000" width="1920" height="80" fill="#172554" opacity="0.5"/>
  <text x="960" y="1045" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">一圖一洞見 · 可訪問性高對比 · 行動優先資料極簡</text>

  <!-- 紙紋覆蓋 -->
  <rect width="1920" height="1080" fill="#f8fafc" opacity="0.025" filter="url(#paperTexture)"/>
</svg>