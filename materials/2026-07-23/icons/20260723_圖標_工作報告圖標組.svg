<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">工作報告圖標組 - 5 圖標（菱形五角星 + 虛實對比）</title>
  <desc id="desc">以技巧 #123 菱形五角星為主、#120 虛實對比為輔的熊熊風格工作報告圖標組（規劃 / 執行 / 驗證 / 溝通 / 達成）</desc>
  <defs>
    <linearGradient id="iconA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C572"/>
      <stop offset="100%" stop-color="#D89B3F"/>
    </linearGradient>
    <linearGradient id="iconB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C97B4A"/>
      <stop offset="100%" stop-color="#7A3F1D"/>
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#5C2F18" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- 底色 -->
  <rect width="1920" height="1080" fill="#FBF6EC"/>

  <!-- 標題 -->
  <text x="960" y="120" fill="#5C2F18" font-family="Noto Sans TC, sans-serif" font-size="60" font-weight="900" text-anchor="middle">工作報告 · 5 大核心圖標</text>
  <text x="960" y="170" fill="#7A3F1D" font-family="Noto Sans TC, sans-serif" font-size="22" font-weight="500" text-anchor="middle">菱形五角星 × 六邊形 · 熊熊風格</text>

  <!-- 5 個圖標 5 列 -->
  <!-- 圖標 1：規劃（菱形 + 5 角星 #123） -->
  <g transform="translate(280 320)" filter="url(#iconShadow)">
    <!-- 菱形背景（旋轉 45 的方） -->
    <g transform="rotate(45)">
      <rect x="-110" y="-110" width="220" height="220" rx="20" fill="url(#iconA)" stroke="#7A3F1D" stroke-width="2.5"/>
    </g>
    <!-- 中心六邊形 -->
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" fill="#FBF6EC" stroke="#7A3F1D" stroke-width="3"/>
    <!-- 5 角星 -->
    <path d="M0,-44 L13,-14 L46,-14 L19,5 L29,38 L0,18 L-29,38 L-19,5 L-46,-14 L-13,-14 Z" fill="#7A3F1D"/>
  </g>
  <text x="480" y="320" fill="#5C2F18" font-family="Noto Sans TC, sans-serif" font-size="40" font-weight="800">規劃 · PLAN</text>
  <text x="480" y="370" fill="#7A3F1D" font-family="Noto Sans TC, sans-serif" font-size="22">梳理目標 · 排定優先順序</text>
  <text x="480" y="402" fill="#A0552A" font-family="Noto Sans TC, sans-serif" font-size="18">14 項 · 4 區塊 · 1 目標</text>

  <!-- 圖標 2：執行（外粗空心六邊形 + 雙箭頭實心） -->
  <g transform="translate(280 540)" filter="url(#iconShadow)">
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="none" stroke="#7A3F1D" stroke-width="6"/>
    <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" fill="url(#iconB)" stroke="#7A3F1D" stroke-width="2.5"/>
    <!-- 雙箭頭 -->
    <path d="M-44 0 L36 0" stroke="#FBF6EC" stroke-width="6" stroke-linecap="round"/>
    <path d="M-44 0 L-26 -16 M-44 0 L-26 16" stroke="#FBF6EC" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M36 0 L18 -16 M36 0 L18 16" stroke="#FBF6EC" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
  <text x="480" y="540" fill="#5C2F18" font-family="Noto Sans TC, sans-serif" font-size="40" font-weight="800">執行 · EXECUTE</text>
  <text x="480" y="590" fill="#7A3F1D" font-family="Noto Sans TC, sans-serif" font-size="22">推動交付 · 迭代調整</text>
  <text x="480" y="622" fill="#A0552A" font-family="Noto Sans TC, sans-serif" font-size="18">12 項完成 · 2 項進行</text>

  <!-- 圖標 3：驗證（六邊形 + 勾） -->
  <g transform="translate(280 760)" filter="url(#iconShadow)">
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="url(#iconA)" stroke="#7A3F1D" stroke-width="2.5"/>
    <polygon points="0,-78 68,-39 68,39 0,78 -68,39 -68,-39" fill="none" stroke="#7A3F1D" stroke-width="4"/>
    <!-- 勾 -->
    <path d="M-42 0 L-12 28 L42 -28" fill="none" stroke="#5C2F18" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="480" y="760" fill="#5C2F18" font-family="Noto Sans TC, sans-serif" font-size="40" font-weight="800">驗證 · VERIFY</text>
  <text x="480" y="810" fill="#7A3F1D" font-family="Noto Sans TC, sans-serif" font-size="22">品質檢核 · 流程守門</text>
  <text x="480" y="842" fill="#A0552A" font-family="Noto Sans TC, sans-serif" font-size="18">100% 通過 · 0 缺點</text>

  <!-- 圖標 4：溝通（蜂巢叢集 + 對話） -->
  <g transform="translate(1200 320)" filter="url(#iconShadow)">
    <!-- 三個六邊形叢集（#122 分組叢集） -->
    <g transform="translate(-50 -30)">
      <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="url(#iconB)" stroke="#7A3F1D" stroke-width="2.5"/>
    </g>
    <g transform="translate(50 -30)">
      <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="url(#iconA)" stroke="#7A3F1D" stroke-width="2.5"/>
    </g>
    <g transform="translate(0 30)">
      <polygon points="0,-44 38,-22 38,22 0,44 -38,22 -38,-22" fill="#FBF6EC" stroke="#7A3F1D" stroke-width="3"/>
    </g>
    <!-- 中心點 -->
    <circle cx="0" cy="0" r="12" fill="#7A3F1D"/>
    <!-- 連線 -->
    <line x1="-50" y1="-30" x2="-12" y2="-6" stroke="#7A3F1D" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="50" y1="-30" x2="12" y2="-6" stroke="#7A3F1D" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="0" y1="30" x2="0" y2="12" stroke="#7A3F1D" stroke-width="2" stroke-dasharray="3 3"/>
  </g>
  <text x="1400" y="320" fill="#5C2F18" font-family="Noto Sans TC, sans-serif" font-size="40" font-weight="800">溝通 · ALIGN</text>
  <text x="1400" y="370" fill="#7A3F1D" font-family="Noto Sans TC, sans-serif" font-size="22">同步資訊 · 對齊共識</text>
  <text x="1400" y="402" fill="#A0552A" font-family="Noto Sans TC, sans-serif" font-size="18">5 場會議 · 12 位夥伴</text>

  <!-- 圖標 5：達成（巨型五角星填蜂巢叢集）+ 已完成背景 -->
  <g transform="translate(1200 760)" filter="url(#iconShadow)">
    <!-- 背景蜂巢（五個小六邊形繞） -->
    <g opacity=".4">
      <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="none" stroke="#7A3F1D" stroke-width="1.5" transform="translate(-80 -60)"/>
      <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="none" stroke="#7A3F1D" stroke-width="1.5" transform="translate(80 -60)"/>
      <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="none" stroke="#7A3F1D" stroke-width="1.5" transform="translate(-80 60)"/>
      <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="none" stroke="#7A3F1D" stroke-width="1.5" transform="translate(80 60)"/>
      <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="none" stroke="#7A3F1D" stroke-width="1.5" transform="translate(0 -90)"/>
    </g>
    <!-- 大五角星（#123） -->
    <polygon points="0,-110 32,-34 110,-34 50,12 70,90 0,46 -70,90 -50,12 -110,-34 -32,-34" fill="url(#iconA)" stroke="#7A3F1D" stroke-width="3"/>
    <!-- 星中央實心圓 + 勾 -->
    <circle cx="0" cy="0" r="34" fill="#7A3F1D"/>
    <path d="M-18 0 L-4 14 L20 -12" fill="none" stroke="#FBF6EC" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1400" y="760" fill="#5C2F18" font-family="Noto Sans TC, sans-serif" font-size="40" font-weight="800">達成 · DELIVER</text>
  <text x="1400" y="810" fill="#7A3F1D" font-family="Noto Sans TC, sans-serif" font-size="22">交付完成 · 目標達陣</text>
  <text x="1400" y="842" fill="#A0552A" font-family="Noto Sans TC, sans-serif" font-size="18">92% · 提前 5 天</text>

  <!-- 頁尾 -->
  <text x="960" y="1020" fill="#7A3F1D" fill-opacity=".55" font-family="Noto Sans TC, sans-serif" font-size="20" text-anchor="middle">熊熊設計 · Working Report Icon Set · 2026.07.23</text>
</svg>
