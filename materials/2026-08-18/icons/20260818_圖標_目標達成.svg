<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- 現代簡潔：目標達成 - 靶心六邊形 + 五角星箭頭 (融合技巧#123 + #121) -->
  <defs>
    <linearGradient id="gradCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="#F8FAFC"/>
  <!-- 同心六邊形靶心 -->
  <polygon points="200,60 309,120 309,260 200,320 91,260 91,120"
           fill="none" stroke="#0EA5E9" stroke-width="3" opacity="0.9"/>
  <polygon points="200,95 275,140 275,240 200,285 125,240 125,140"
           fill="none" stroke="#0EA5E9" stroke-width="3" opacity="0.6"/>
  <polygon points="200,130 245,158 245,222 200,250 155,222 155,158"
           fill="#0EA5E9" fill-opacity="0.15" stroke="#0EA5E9" stroke-width="2.5"/>
  <!-- 中心實心靶心 + 虛實對比 (技巧#123 #10) -->
  <circle cx="200" cy="190" r="22" fill="url(#gradCenter)"/>
  <circle cx="200" cy="190" r="34" fill="none" stroke="#F97316" stroke-width="2" stroke-dasharray="3 4" opacity="0.7"/>
  <!-- 右上角箭頭射入靶心 -->
  <g transform="translate(310,80) rotate(35)">
    <rect x="0" y="-3" width="80" height="6" rx="3" fill="#0F172A"/>
    <polygon points="80,-12 100,0 80,12" fill="#0F172A"/>
  </g>
  <!-- 標題 -->
  <text x="200" y="375" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">目標達成</text>
</svg>