<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="hexGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C49A3A"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>
  
  <!-- 六邊形外框（旋轉30度變化） -->
  <g transform="translate(50,50) rotate(30)">
    <path d="M0,-42 L36.4,-21 L36.4,21 L0,42 L-36.4,21 L-36.4,-21 Z" 
          fill="none" stroke="url(#hexGrad2)" stroke-width="3"/>
    <path d="M0,-42 L36.4,-21 L36.4,21 L0,42 L-36.4,21 L-36.4,-21 Z" 
          fill="#D4A84B" fill-opacity="0.12"/>
  </g>
  
  <!-- 人物圖示（會議/團隊） -->
  <g transform="translate(50, 50)">
    <!-- 中間人物（領導者）- 實心 -->
    <circle cx="0" cy="-8" r="7" fill="#8B6914"/>
    <path d="M-10,18 Q-10,6 0,6 Q10,6 10,18" fill="#8B6914"/>
    
    <!-- 左邊人物 - 空心 -->
    <circle cx="-22" cy="-4" r="6" fill="none" stroke="#C49A3A" stroke-width="2"/>
    <path d="M-30,16 Q-30,6 -22,6 Q-14,6 -14,16" fill="none" stroke="#C49A3A" stroke-width="2"/>
    
    <!-- 右邊人物 - 空心 -->
    <circle cx="22" cy="-4" r="6" fill="none" stroke="#C49A3A" stroke-width="2"/>
    <path d="M14,16 Q14,6 22,6 Q30,6 30,16" fill="none" stroke="#C49A3A" stroke-width="2"/>
  </g>
  
  <!-- 連接線（協作關係） -->
  <g stroke="#D4A84B" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6">
    <line x1="28" y1="38" x2="40" y2="42"/>
    <line x1="72" y1="38" x2="60" y2="42"/>
    <line x1="50" y1="68" x2="50" y2="56"/>
  </g>
</svg>