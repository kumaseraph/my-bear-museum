<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 720" width="1920" height="720">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="iconPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="iconAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <pattern id="iconStripes" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="skewX(-15)">
      <line x1="0" y1="5" x2="10" y2="5" stroke="#FFFFFF" stroke-width="1.2" opacity="0.3"/>
    </pattern>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="720" fill="url(#bgGrad5)"/>

  <!-- 標題 -->
  <text x="120" y="100" font-family="Microsoft JhengHei, sans-serif" font-size="44" font-weight="700" fill="#1E3A8A">工作報告 · 圖標組（六枚）</text>
  <text x="120" y="140" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#64748B">Report Icons — 議題 / 數據 / 決策 / 時程 / 團隊 / 完成</text>
  <line x1="120" y1="170" x2="320" y2="170" stroke="#F59E0B" stroke-width="4"/>

  <!-- Icon 1: 議題設定 (燈泡 + 對話框) -->
  <g transform="translate(160, 260)">
    <polygon points="0,80 80,0 160,80 80,160" fill="url(#iconPrimary)" filter="url(#iconShadow)"/>
    <polygon points="0,80 80,0 160,80 80,160" fill="url(#iconStripes)"/>
    <circle cx="80" cy="70" r="20" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 80 58 L 88 70 L 80 82 L 72 70 Z" fill="#1E40AF"/>
    <line x1="80" y1="82" x2="80" y2="92" stroke="#1E40AF" stroke-width="3" stroke-linecap="round"/>
    <line x1="73" y1="92" x2="87" y2="92" stroke="#1E40AF" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="240" y="460" font-family="Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">議題設定</text>
  <text x="240" y="490" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Topic</text>

  <!-- Icon 2: 數據分析 (長條圖) -->
  <g transform="translate(440, 260)">
    <polygon points="0,80 80,0 160,80 80,160" fill="url(#iconPrimary)" filter="url(#iconShadow)"/>
    <polygon points="0,80 80,0 160,80 80,160" fill="url(#iconStripes)"/>
    <rect x="50" y="100" width="14" height="30" fill="#FFFFFF"/>
    <rect x="68" y="85" width="14" height="45" fill="#FFFFFF"/>
    <rect x="86" y="70" width="14" height="60" fill="#F59E0B"/>
    <rect x="104" y="95" width="14" height="35" fill="#FFFFFF"/>
  </g>
  <text x="520" y="460" font-family="Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">數據分析</text>
  <text x="520" y="490" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Analytics</text>

  <!-- Icon 3: 決策判斷 (打勾盾牌) -->
  <g transform="translate(720, 260)">
    <polygon points="0,80 80,0 160,80 80,160" fill="url(#iconAccent)" filter="url(#iconShadow)"/>
    <polygon points="0,80 80,0 160,80 80,160" fill="url(#iconStripes)"/>
    <path d="M 80 55 L 110 70 L 110 95 Q 110 115 80 130 Q 50 115 50 95 L 50 70 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M 65 90 L 75 100 L 95 78" fill="none" stroke="#B45309" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="800" y="460" font-family="Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">決策判斷</text>
  <text x="800" y="490" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Decision</text>

  <!-- Icon 4: 時程進度 (時鐘 + 箭頭) -->
  <g transform="translate(1000, 260)">
    <polygon points="0,80 80,0 160,80 80,160" fill="url(#iconPrimary)" filter="url(#iconShadow)"/>
    <polygon points="0,80 80,0 160,80 80,160" fill="url(#iconStripes)"/>
    <circle cx="80" cy="90" r="28" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <line x1="80" y1="90" x2="80" y2="70" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="90" x2="96" y2="98" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
    <circle cx="80" cy="90" r="3" fill="#FFFFFF"/>
    <!-- 進度箭頭 -->
    <path d="M 30 130 L 50 130 M 50 130 L 45 125 M 50 130 L 45 135" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="1080" y="460" font-family="Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">時程進度</text>
  <text x="1080" y="490" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Schedule</text>

  <!-- Icon 5: 團隊協作 (三人頭像) -->
  <g transform="translate(1280, 260)">
    <polygon points="0,80 80,0 160,80 80,160" fill="url(#iconPrimary)" filter="url(#iconShadow)"/>
    <polygon points="0,80 80,0 160,80 80,160" fill="url(#iconStripes)"/>
    <circle cx="60" cy="85" r="12" fill="#FFFFFF"/>
    <circle cx="100" cy="85" r="12" fill="#F59E0B"/>
    <circle cx="80" cy="70" r="13" fill="#FFFFFF"/>
    <path d="M 45 110 Q 60 95 75 110 Z" fill="#FFFFFF"/>
    <path d="M 85 110 Q 100 95 115 110 Z" fill="#FFFFFF"/>
    <path d="M 65 125 Q 80 110 95 125 Z" fill="#FFFFFF"/>
  </g>
  <text x="1360" y="460" font-family="Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">團隊協作</text>
  <text x="1360" y="490" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Teamwork</text>

  <!-- Icon 6: 完成 (星星 + 對勾) -->
  <g transform="translate(1560, 260)">
    <polygon points="0,80 80,0 160,80 80,160" fill="url(#iconAccent)" filter="url(#iconShadow)"/>
    <polygon points="0,80 80,0 160,80 80,160" fill="url(#iconStripes)"/>
    <path d="M 80 55 L 88 75 L 110 78 L 93 93 L 98 115 L 80 103 L 62 115 L 67 93 L 50 78 L 72 75 Z" fill="#FFFFFF"/>
    <path d="M 70 92 L 78 100 L 95 82" fill="none" stroke="#B45309" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1640" y="460" font-family="Microsoft JhengHei, sans-serif" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">完成定稿</text>
  <text x="1640" y="490" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B" text-anchor="middle">Complete</text>

  <!-- 底部說明 -->
  <g transform="translate(160, 580)">
    <rect x="0" y="0" width="1600" height="80" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="30" y="32" font-family="Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#1E40AF">使用建議</text>
    <text x="30" y="58" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#475569">▸ 一圖一 insight · 章節導覽用 · 圓角菱形底盤易於在 9:16 / 16:9 版面切換</text>
  </g>

  <text x="160" y="690" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">熊熊設計 · 工作報告素材庫 · 圖標</text>
</svg>
