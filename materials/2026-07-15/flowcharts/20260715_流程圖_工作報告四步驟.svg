<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  
  <!-- 平行四邊形階梯流程圖 -->
  <g transform="translate(50,150)">
    <!-- 步驟1 -->
    <polygon points="30,0 170,0 150,60 10,60" fill="url(#step1)"/>
    <text x="90" y="25" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">收集資料</text>
    <text x="90" y="45" text-anchor="middle" fill="#A78BFA" font-size="11">Gather Info</text>
    
    <!-- 連接線1 -->
    <line x1="170" y1="30" x2="200" y2="30" stroke="#FBBF24" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="200,25 210,30 200,35" fill="#FBBF24"/>
  </g>
  
  <g transform="translate(230,150)">
    <!-- 步驟2 -->
    <polygon points="30,0 170,0 150,60 10,60" fill="url(#step2)"/>
    <text x="90" y="25" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">分析數據</text>
    <text x="90" y="45" text-anchor="middle" fill="#FFFFFF" font-size="11">Analyze Data</text>
    
    <!-- 連接線2 -->
    <line x1="170" y1="30" x2="200" y2="30" stroke="#FBBF24" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="200,25 210,30 200,35" fill="#FBBF24"/>
  </g>
  
  <g transform="translate(410,150)">
    <!-- 步驟3 -->
    <polygon points="30,0 170,0 150,60 10,60" fill="url(#step3)"/>
    <text x="90" y="25" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="bold">產出報告</text>
    <text x="90" y="45" text-anchor="middle" fill="#0F172A" font-size="11">Create Report</text>
    
    <!-- 連接線3 -->
    <line x1="170" y1="30" x2="200" y2="30" stroke="#FBBF24" stroke-width="2" stroke-dasharray="5,3"/>
    <polygon points="200,25 210,30 200,35" fill="#FBBF24"/>
  </g>
  
  <g transform="translate(590,150)">
    <!-- 步驟4 -->
    <polygon points="30,0 170,0 150,60 10,60" fill="#FBBF24"/>
    <text x="90" y="25" text-anchor="middle" fill="#0F172A" font-size="14" font-weight="bold">簡報展示</text>
    <text x="90" y="45" text-anchor="middle" fill="#0F172A" font-size="11">Present</text>
  </g>
  
  <!-- 底部標題 -->
  <text x="400" y="50" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">工作報告流程</text>
  <text x="400" y="75" text-anchor="middle" fill="#A78BFA" font-size="12">Work Report Process</text>
</svg>