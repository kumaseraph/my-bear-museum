<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="growGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="100%" stop-color="#CD853F"/>
    </linearGradient>
    <linearGradient id="growGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D2691E"/>
      <stop offset="100%" stop-color="#DEB887"/>
    </linearGradient>
    <linearGradient id="growGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="#FFF8DC"/>
  
  <!-- 尺寸漸層蜂巢 - 從小到大代表成長 -->
  <g transform="translate(200,150)">
    <!-- Level 1 - 最小 (最早期) -->
    <g transform="translate(-120,60)">
      <path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z" 
            fill="url(#growGrad1)" stroke="#5D2E0C" stroke-width="1"/>
    </g>
    
    <!-- Level 2 -->
    <g transform="translate(-60,20)">
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z" 
            fill="url(#growGrad1)" stroke="#5D2E0C" stroke-width="1.5"/>
    </g>
    
    <!-- Level 3 -->
    <g transform="translate(0,-30)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" 
            fill="url(#growGrad2)" stroke="#8B4513" stroke-width="2"/>
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" 
            fill="#FFF8DC" fill-opacity="0.3" transform="scale(0.6)"/>
    </g>
    
    <!-- Level 4 -->
    <g transform="translate(70,-10)">
      <path d="M0,-38 L33,-19 L33,19 L0,38 L-33,19 L-33,-19 Z" 
            fill="url(#growGrad2)" stroke="#8B4513" stroke-width="2"/>
    </g>
    
    <!-- Level 5 - 最大 (最新/最高成就) -->
    <g transform="translate(120,70)">
      <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z" 
            fill="url(#growGrad3)" stroke="#8B4513" stroke-width="3"/>
      <!-- 2.5D效果 -->
      <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z" 
            fill="none" stroke="#DAA520" stroke-width="6" transform="scale(0.85)"/>
      <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z" 
            fill="#FFD700" fill-opacity="0.4" transform="scale(0.85)"/>
      <!-- 星星裝飾 -->
      <polygon points="0,-15 4,-5 15,-5 6,2 10,12 0,6 -10,12 -6,2 -15,-5 -4,-5" 
               fill="#FFF" transform="translate(0,-15) scale(0.5)"/>
    </g>
  </g>
  
  <!-- 成長標籤 -->
  <text x="80" y="280" text-anchor="middle" font-family="Arial" font-size="9" fill="#8B4513">入門</text>
  <text x="200" y="280" text-anchor="middle" font-family="Arial" font-size="9" fill="#8B4513">成長</text>
  <text x="320" y="280" text-anchor="middle" font-family="Arial" font-size="9" fill="#8B4513">精通</text>
  
  <!-- 連接箭頭 -->
  <g stroke="#DAA520" stroke-width="2" fill="none">
    <path d="M95,270 Q140,260 170,260" marker-end="url(#arrowhead)"/>
    <path d="M230,260 Q260,260 300,270"/>
  </g>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#DAA520"/>
    </marker>
  </defs>
  
  <!-- 標題 -->
  <text x="200" y="30" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#5D2E0C">成長歷程</text>
</svg>