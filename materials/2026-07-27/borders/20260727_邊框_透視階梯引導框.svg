<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Chrome 漸層（retro-futurism 風格） -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="chromeBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <pattern id="stepLines" patternUnits="userSpaceOnUse" width="12" height="12">
      <line x1="0" y1="12" x2="12" y2="0" stroke="#1E3A8A" stroke-width="0.5" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#F8FAFC"/>
  <rect width="1920" height="1080" fill="url(#stepLines)"/>

  <!-- 標題列 -->
  <text x="120" y="100" font-family="Microsoft JhengHei, sans-serif" font-size="44" font-weight="700" fill="#1E3A8A">工作報告｜透視階梯引導框</text>
  <text x="120" y="148" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#64748B">#124 階梯排列 + 透視線 + retro-futurism chrome 漸層</text>

  <!-- 透視消失線（往中央景深）-->
  <line x1="80" y1="200" x2="960" y2="540" stroke="#1E40AF" stroke-width="1" opacity="0.25"/>
  <line x1="1840" y1="200" x2="960" y2="540" stroke="#1E40AF" stroke-width="1" opacity="0.25"/>
  <line x1="80" y1="880" x2="960" y2="540" stroke="#1E40AF" stroke-width="1" opacity="0.25"/>
  <line x1="1840" y1="880" x2="960" y2="540" stroke="#1E40AF" stroke-width="1" opacity="0.25"/>

  <!-- 中央焦點 -->
  <circle cx="960" cy="540" r="14" fill="#F59E0B"/>
  <circle cx="960" cy="540" r="28" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.5"/>
  <circle cx="960" cy="540" r="42" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.3"/>

  <!-- ===== 階梯三層（從左下到右上）===== -->
  <!-- 第一階（左下） -->
  <g transform="translate(180, 720)">
    <polygon points="20,0 320,0 290,100 0,100" fill="url(#stepGrad1)" opacity="0.95"/>
    <polygon points="20,0 320,0 290,100 0,100" fill="none" stroke="#1E3A8A" stroke-width="1.5" opacity="0.6"/>
    <text x="170" y="58" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">① 計劃</text>
  </g>

  <!-- 第二階（中） -->
  <g transform="translate(670, 540)">
    <polygon points="20,0 480,0 450,100 0,100" fill="url(#stepGrad2)" opacity="0.95"/>
    <polygon points="20,0 480,0 450,100 0,100" fill="none" stroke="#1E3A8A" stroke-width="1.5" opacity="0.6"/>
    <text x="250" y="58" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">② 執行</text>
  </g>

  <!-- 第三階（右上） -->
  <g transform="translate(1300, 360)">
    <polygon points="20,0 320,0 290,100 0,100" fill="url(#stepGrad3)" opacity="0.95"/>
    <polygon points="20,0 320,0 290,100 0,100" fill="none" stroke="#1E3A8A" stroke-width="1.5" opacity="0.6"/>
    <text x="170" y="58" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">③ 成果</text>
  </g>

  <!-- 階梯連接指引線（虛線）-->
  <line x1="500" y1="770" x2="690" y2="590" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="1150" y1="590" x2="1320" y2="410" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 頂部 KEY MESSAGE 槽位（chrome 邊框） -->
  <rect x="120" y="200" width="1680" height="80" fill="none" stroke="url(#chromeGrad)" stroke-width="3"/>
  <rect x="128" y="208" width="1664" height="64" fill="none" stroke="#1E40AF" stroke-width="1" opacity="0.5"/>
  <text x="960" y="252" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#1E3A8A">KEY MESSAGE — 進度往上、視覺往上</text>

  <!-- 底部技術標籤 -->
  <text x="120" y="990" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#94A3B8">技巧 #124 平行四邊形線條｜階梯排列 + 透視線 + chrome 漸層</text>
  <text x="1800" y="990" text-anchor="end" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#94A3B8">2026-07-27 熊熊生成</text>
</svg>
