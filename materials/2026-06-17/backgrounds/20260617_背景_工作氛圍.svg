<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>工作氛圍背景</title>
  <desc>工作報告會議相關背景，結合手繪有機形狀與溫暖棕金色系</desc>
  <!-- 背景基底 -->
  <rect width="1920" height="1080" fill="#FDF8F3"/>
  <!-- 有機形狀裝飾（左上） -->
  <path d="M-50 200 Q100 150 200 250 Q300 350 150 450 Q0 550 -50 400 Z" fill="#F5E6D3" opacity="0.7"/>
  <path d="M0 0 Q200 100 350 50 Q500 0 400 -50 Q300 -100 150 -50 Q50 0 0 0 Z" fill="#E8D5C4" opacity="0.5"/>
  <!-- 有機形狀裝飾（右下） -->
  <path d="M1700 800 Q1800 850 1920 900 Q1920 1000 1850 1080 L1700 1080 Z" fill="#F5E6D3" opacity="0.7"/>
  <path d="M1920 700 Q1850 750 1800 720 Q1750 690 1780 650 Q1810 610 1880 650 Q1950 690 1920 700 Z" fill="#E8D5C4" opacity="0.5"/>
  <!-- 頂部裝飾線 -->
  <path d="M400 100 Q600 120 800 90 Q1000 60 1200 100 Q1400 140 1600 110" fill="none" stroke="#C4A35A" stroke-width="2" opacity="0.4"/>
  <!-- 手繪風格幾何裝飾 -->
  <rect x="100" y="900" width="80" height="80" rx="8" fill="none" stroke="#8B6914" stroke-width="2" transform="rotate(15 140 940)" opacity="0.3"/>
  <circle cx="1750" cy="200" r="40" fill="none" stroke="#C4A35A" stroke-width="2" opacity="0.3"/>
  <!-- 底部色塊 -->
  <rect x="0" y="1000" width="1920" height="80" fill="#F5E6D3" opacity="0.5"/>
</svg>