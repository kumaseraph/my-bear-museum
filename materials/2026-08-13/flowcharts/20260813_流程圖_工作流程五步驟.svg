<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- 熊熊風格 - 工作流程圖，融合階梯排列 + 節點網絡 + 觸覺溫暖 -->
  <defs>
    <linearGradient id="bgWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="100%" stop-color="#F5E6C8"/>
    </linearGradient>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6B47A"/>
      <stop offset="100%" stop-color="#8B6239"/>
    </linearGradient>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8B6239"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#bgWarm)"/>

  <!-- 標題 -->
  <text x="400" y="50" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#5C3A1E" text-anchor="middle">
    工作流程
  </text>
  <text x="400" y="72" font-family="Georgia, serif" font-size="13" font-style="italic" fill="#8B6239" text-anchor="middle">
    Workflow · 5 Steps
  </text>
  <rect x="350" y="82" width="100" height="2" fill="#B8895A" rx="1"/>

  <!-- 流程節點（階梯排列） -->
  <!-- Step 1 - 開始 -->
  <g transform="translate(80, 150)">
    <path d="M30,3 L55,17 L55,47 L30,61 L5,47 L5,17 Z"
          fill="none" stroke="#8B6239" stroke-width="3"/>
    <path d="M30,3 L55,17 L55,47 L30,61 L5,47 L5,17 Z" fill="url(#stepGrad)"/>
    <text x="30" y="38" font-family="Georgia, serif" font-size="18" fill="#FFFBF0" text-anchor="middle" font-weight="bold">1</text>
    <text x="30" y="100" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3A1E" text-anchor="middle">
      收集資料
    </text>
    <text x="30" y="118" font-family="Georgia, serif" font-size="10" fill="#8B6239" text-anchor="middle">
      Collect
    </text>
  </g>

  <!-- 連接線 1→2 -->
  <line x1="140" y1="180" x2="220" y2="180" stroke="#8B6239" stroke-width="2" marker-end="url(#arrowGold)" stroke-dasharray="4,2"/>

  <!-- Step 2 -->
  <g transform="translate(220, 130)">
    <path d="M30,3 L55,17 L55,47 L30,61 L5,47 L5,17 Z"
          fill="none" stroke="#8B6239" stroke-width="3"/>
    <path d="M30,3 L55,17 L55,47 L30,61 L5,47 L5,17 Z" fill="#D4A574"/>
    <text x="30" y="38" font-family="Georgia, serif" font-size="18" fill="#FFFBF0" text-anchor="middle" font-weight="bold">2</text>
    <text x="30" y="100" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3A1E" text-anchor="middle">
      整理分析
    </text>
    <text x="30" y="118" font-family="Georgia, serif" font-size="10" fill="#8B6239" text-anchor="middle">
      Analyze
    </text>
  </g>

  <!-- 連接線 2→3 -->
  <line x1="280" y1="160" x2="360" y2="160" stroke="#8B6239" stroke-width="2" marker-end="url(#arrowGold)" stroke-dasharray="4,2"/>

  <!-- Step 3 - 中央重點 -->
  <g transform="translate(360, 110)">
    <path d="M40,4 L73,23 L73,63 L40,82 L7,63 L7,23 Z"
          fill="none" stroke="#8B6239" stroke-width="4"/>
    <path d="M40,4 L73,23 L73,63 L40,82 L7,63 L7,23 Z" fill="url(#stepGrad)"/>
    <text x="40" y="50" font-family="Georgia, serif" font-size="22" fill="#FFFBF0" text-anchor="middle" font-weight="bold">3</text>
    <text x="40" y="115" font-family="Georgia, serif" font-size="14" font-weight="bold" fill="#5C3A1E" text-anchor="middle">
      報告撰寫
    </text>
    <text x="40" y="133" font-family="Georgia, serif" font-size="10" fill="#8B6239" text-anchor="middle">
      Write
    </text>
  </g>

  <!-- 連接線 3→4 -->
  <line x1="448" y1="160" x2="528" y2="160" stroke="#8B6239" stroke-width="2" marker-end="url(#arrowGold)" stroke-dasharray="4,2"/>

  <!-- Step 4 -->
  <g transform="translate(530, 130)">
    <path d="M30,3 L55,17 L55,47 L30,61 L5,47 L5,17 Z"
          fill="none" stroke="#8B6239" stroke-width="3"/>
    <path d="M30,3 L55,17 L55,47 L30,61 L5,47 L5,17 Z" fill="#D4A574"/>
    <text x="30" y="38" font-family="Georgia, serif" font-size="18" fill="#FFFBF0" text-anchor="middle" font-weight="bold">4</text>
    <text x="30" y="100" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3A1E" text-anchor="middle">
      審核修訂
    </text>
    <text x="30" y="118" font-family="Georgia, serif" font-size="10" fill="#8B6239" text-anchor="middle">
      Review
    </text>
  </g>

  <!-- 連接線 4→5 -->
  <line x1="590" y1="180" x2="670" y2="180" stroke="#8B6239" stroke-width="2" marker-end="url(#arrowGold)" stroke-dasharray="4,2"/>

  <!-- Step 5 -->
  <g transform="translate(670, 150)">
    <path d="M30,3 L55,17 L55,47 L30,61 L5,47 L5,17 Z"
          fill="none" stroke="#8B6239" stroke-width="3"/>
    <path d="M30,3 L55,17 L55,47 L30,61 L5,47 L5,17 Z" fill="url(#stepGrad)"/>
    <text x="30" y="38" font-family="Georgia, serif" font-size="18" fill="#FFFBF0" text-anchor="middle" font-weight="bold">5</text>
    <text x="30" y="100" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3A1E" text-anchor="middle">
      提交發布
    </text>
    <text x="30" y="118" font-family="Georgia, serif" font-size="10" fill="#8B6239" text-anchor="middle">
      Submit
    </text>
  </g>

  <!-- 底部說明 -->
  <g transform="translate(80, 340)">
    <rect x="0" y="0" width="640" height="80" fill="#FFFBF0" stroke="#B8895A" stroke-width="1.5" rx="8"/>
    <text x="20" y="25" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#5C3A1E">
      🔑 流程設計原則
    </text>
    <text x="20" y="48" font-family="Georgia, serif" font-size="11" fill="#8B6239">
      ·  認知負荷管控：每步聚焦單一任務  ·  人類痕跡：不規則蜂巢邊緣
    </text>
    <text x="20" y="65" font-family="Georgia, serif" font-size="11" fill="#8B6239">
      ·  蜂巢叢集：節點視覺統一  ·  觸覺溫暖：紙感底色 + 木刻質感
    </text>
  </g>

  <!-- 底部裝飾蜂巢 -->
  <g transform="translate(720, 410)">
    <path d="M12,1 L22,6 L22,18 L12,23 L2,18 L2,6 Z" fill="#8B6239" opacity="0.7"/>
  </g>
  <g transform="translate(40, 410)">
    <path d="M12,1 L22,6 L22,18 L12,23 L2,18 L2,6 Z" fill="none" stroke="#B8895A" stroke-width="1.5" opacity="0.7"/>
  </g>
</svg>