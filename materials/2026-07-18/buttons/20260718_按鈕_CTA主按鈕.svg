<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <!-- CTA 按鈕漸層 -->
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="ctaHover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#bgGrad5)"/>
  
  <!-- CTA 按鈕主體 -->
  <g transform="translate(960, 540)">
    <!-- 外發光效果 -->
    <rect x="-220" y="-60" width="440" height="120" rx="60" 
          fill="#6B5CE7" fill-opacity="0.2"/>
    
    <!-- 按鈕主體 - 圓角矩形 -->
    <rect x="-200" y="-50" width="400" height="100" rx="50" 
          fill="url(#ctaGrad)"/>
    
    <!-- 內部高光線 -->
    <rect x="-190" y="-40" width="380" height="40" rx="20" 
          fill="white" fill-opacity="0.15"/>
    
    <!-- 邊界引導線裝飾 -->
    <rect x="-210" y="-55" width="420" height="110" rx="55" 
          fill="none" stroke="#A78BFA" stroke-width="2" stroke-dasharray="8,4"/>
    
    <!-- 按鈕文字 -->
    <text x="0" y="12" text-anchor="middle" 
          font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
          fill="white">
      立即下載 Download
    </text>
    
    <!-- 箭頭圖標 -->
    <g transform="translate(140, 0)">
      <polygon points="0,-12 20,0 0,12" fill="white"/>
    </g>
  </g>
  
  <text x="960" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#64748B">
    CTA 按鈕設計 · 漸層科技風
  </text>
</svg>