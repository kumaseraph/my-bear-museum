<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- 工作報告：數據透明化配色 (技巧#120 2.5D + 顏色深淺) -->
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="dataGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- 純白底 -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- =============================================
       技巧#120 六邊形：大小對比 + 2.5D 效果
       融合 Data Storytelling 趨勢：指標透明、視覺層級清晰
       ============================================= -->

  <!-- 主標題區（頂部 2.5D 框） -->
  <g transform="translate(120,90)">
    <!-- 大六邊形外框（粗空心 = 2.5D） -->
    <path d="M40,5 L1220,5 L1260,75 L1260,135 L1220,205 L40,205 L0,135 L0,75 Z"
          fill="none" stroke="url(#dataGrad)" stroke-width="5"/>
    <!-- 內實心層（半透明藍） -->
    <path d="M40,5 L1220,5 L1260,75 L1260,135 L1220,205 L40,205 L0,135 L0,75 Z"
          fill="url(#dataGrad)" fill-opacity="0.08"/>
    <!-- 標題文字 -->
    <text x="640" y="120" text-anchor="middle"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="56" font-weight="700" fill="#1E40AF">
      工 作 報 告 · 數 據 儀 表 板
    </text>
  </g>

  <!-- 左側大數據區（六邊形外框 + 內實心 2.5D） -->
  <g transform="translate(150,420)">
    <!-- 大六邊形外框 -->
    <path d="M40,5 L420,5 L460,80 L460,200 L420,275 L40,275 L0,200 L0,80 Z"
          fill="none" stroke="url(#dataGrad2)" stroke-width="4"/>
    <!-- 內實心半透明 -->
    <path d="M40,5 L420,5 L460,80 L460,200 L420,275 L40,275 L0,200 L0,80 Z"
          fill="url(#dataGrad2)" fill-opacity="0.12"/>
    <!-- 標籤 -->
    <text x="230" y="80" text-anchor="middle"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="22" fill="#3B82F6">
      本期 KPI
    </text>
    <text x="230" y="170" text-anchor="middle"
          font-family="'Arial',sans-serif"
          font-size="84" font-weight="700" fill="#1E40AF">
      87.5%
    </text>
    <text x="230" y="220" text-anchor="middle"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="18" fill="#6B7280">
      ↑ 12.3% YoY
    </text>
    <!-- 小六邊形裝飾 -->
    <path d="M390,240 L420,240 L425,255 L420,270 L390,270 L385,255 Z"
          fill="#F59E0B"/>
  </g>

  <!-- 中間數據區 -->
  <g transform="translate(720,420)">
    <path d="M40,5 L420,5 L460,80 L460,200 L420,275 L40,275 L0,200 L0,80 Z"
          fill="none" stroke="url(#dataGrad2)" stroke-width="4"/>
    <path d="M40,5 L420,5 L460,80 L460,200 L420,275 L40,275 L0,200 L0,80 Z"
          fill="url(#dataGrad2)" fill-opacity="0.12"/>
    <text x="230" y="80" text-anchor="middle"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="22" fill="#3B82F6">
      完成進度
    </text>
    <text x="230" y="170" text-anchor="middle"
          font-family="'Arial',sans-serif"
          font-size="84" font-weight="700" fill="#1E40AF">
      42/60
    </text>
    <text x="230" y="220" text-anchor="middle"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="18" fill="#6B7280">
      截止 08/30
    </text>
    <path d="M390,240 L420,240 L425,255 L420,270 L390,270 L385,255 Z"
          fill="#F59E0B"/>
  </g>

  <!-- 右側數據區 -->
  <g transform="translate(1290,420)">
    <path d="M40,5 L420,5 L460,80 L460,200 L420,275 L40,275 L0,200 L0,80 Z"
          fill="none" stroke="url(#dataGrad2)" stroke-width="4"/>
    <path d="M40,5 L420,5 L460,80 L460,200 L420,275 L40,275 L0,200 L0,80 Z"
          fill="url(#dataGrad2)" fill-opacity="0.12"/>
    <text x="230" y="80" text-anchor="middle"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="22" fill="#3B82F6">
      團隊投入
    </text>
    <text x="230" y="170" text-anchor="middle"
          font-family="'Arial',sans-serif"
          font-size="84" font-weight="700" fill="#1E40AF">
      168h
    </text>
    <text x="230" y="220" text-anchor="middle"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="18" fill="#6B7280">
      本週 32 人次
    </text>
    <path d="M390,240 L420,240 L425,255 L420,270 L390,270 L385,255 Z"
          fill="#F59E0B"/>
  </g>

  <!-- 底部六邊形邊界引導線（叢集連接線） -->
  <g transform="translate(0,820)">
    <line x1="170" y1="0" x2="1750" y2="0" stroke="#1E40AF" stroke-width="2" stroke-opacity="0.35"/>
    <!-- 5 個等距小六邊形節點 -->
    <g transform="translate(360,0)"><path d="M15,3 L30,12 L30,30 L15,40 L0,30 L0,12 Z" fill="#1E40AF"/></g>
    <g transform="translate(730,0)"><path d="M15,3 L30,12 L30,30 L15,40 L0,30 L0,12 Z" fill="#3B82F6"/></g>
    <g transform="translate(945,0) scale(1.4)"><path d="M15,3 L30,12 L30,30 L15,40 L0,30 L0,12 Z" fill="#1E40AF"/></g>
    <g transform="translate(1160,0)"><path d="M15,3 L30,12 L30,30 L15,40 L0,30 L0,12 Z" fill="#3B82F6"/></g>
    <g transform="translate(1530,0)"><path d="M15,3 L30,12 L30,30 L15,40 L0,30 L0,12 Z" fill="#1E40AF"/></g>
  </g>

  <!-- 底部註腳區 -->
  <g transform="translate(120,910)">
    <path d="M0,0 L1680,0 L1700,30 L0,30 Z" fill="#1E40AF" fill-opacity="0.08"/>
    <text x="30" y="22"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="16" fill="#1E40AF">
      報告人：
    </text>
    <text x="900" y="22"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="16" fill="#1E40AF">
      部門：
    </text>
    <text x="1620" y="22" text-anchor="end"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="16" fill="#1E40AF">
      日期：2026.08.17
    </text>
  </g>
</svg>