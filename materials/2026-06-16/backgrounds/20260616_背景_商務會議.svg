<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>商務會議背景</title>
  <desc>簡報背景模板 - 藍灰色系專業商務風格</desc>
  <!-- 漸變背景 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- 主背景 -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <!-- 裝飾元素 - 幾何圖案 -->
  <circle cx="1700" cy="150" r="300" fill="url(#accentGrad)"/>
  <circle cx="200" cy="900" r="250" fill="url(#accentGrad)"/>
  <!-- 底部裝飾線 -->
  <rect x="0" y="1050" width="1920" height="30" fill="#1E40AF" opacity="0.05"/>
  <!-- 左側豎線裝飾 -->
  <rect x="50" y="100" width="4" height="880" fill="#3B82F6" opacity="0.2" rx="2"/>
  <!-- 右上角幾何裝飾 -->
  <polygon points="1850,0 1920,0 1920,70" fill="#3B82F6" opacity="0.1"/>
  <!-- 網格點裝飾 -->
  <g fill="#94A3B8" opacity="0.15">
    <circle cx="300" cy="200" r="3"/>
    <circle cx="400" cy="200" r="3"/>
    <circle cx="500" cy="200" r="3"/>
    <circle cx="300" cy="300" r="3"/>
    <circle cx="400" cy="300" r="3"/>
    <circle cx="500" cy="300" r="3"/>
    <circle cx="300" cy="400" r="3"/>
    <circle cx="400" cy="400" r="3"/>
    <circle cx="500" cy="400" r="3"/>
  </g>
  <!-- 底部角落裝飾 -->
  <rect x="0" y="0" width="120" height="8" fill="#3B82F6"/>
  <rect x="0" y="0" width="8" height="120" fill="#3B82F6"/>
</svg>