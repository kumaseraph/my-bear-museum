<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="radTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="radOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#FFFFFF"/>

  <text x="60" y="60" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#1E293B">放射影響波</text>
  <text x="60" y="90" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Radial Impact — 菱形放射五角星 × 虛實對比</text>

  <!-- 圖標主體 -->
  <g transform="translate(400, 320)">
    <!-- 底層六邊形 -->
    <path d="M0,-180 L156,-90 L156,90 L0,180 L-156,90 L-156,-90 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-160 L138,-80 L138,80 L0,160 L-138,80 L-138,-80 Z" fill="url(#radTeal)" opacity="0.05"/>

    <!-- 影響波紋：同心虛線圓 -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#radTeal)" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="url(#radTeal)" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.4"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#radTeal)" stroke-width="1" stroke-dasharray="2 6" opacity="0.3"/>

    <!-- 中心實心菱形 -->
    <polygon points="0,-40 40,0 0,40 -40,0" fill="url(#radTeal)"/>

    <!-- 八向放射五角星（虛實對比） -->
    <polygon points="0,-12 6,0 12,0 7,5 9,12 0,8 -9,12 -7,5 -12,0 -6,0" fill="url(#radOrange)" transform="translate(0,-85)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,12 0,8 -9,12 -7,5 -12,0 -6,0" fill="url(#radOrange)" transform="translate(60,-60) scale(0.9)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,12 0,8 -9,12 -7,5 -12,0 -6,0" fill="url(#radOrange)" transform="translate(85,0)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,12 0,8 -9,12 -7,5 -12,0 -6,0" fill="url(#radOrange)" transform="translate(60,60) scale(0.9)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,12 0,8 -9,12 -7,5 -12,0 -6,0" fill="url(#radOrange)" transform="translate(0,85)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,12 0,8 -9,12 -7,5 -12,0 -6,0" fill="url(#radOrange)" transform="translate(-60,60) scale(0.9)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,12 0,8 -9,12 -7,5 -12,0 -6,0" fill="url(#radOrange)" transform="translate(-85,0)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,12 0,8 -9,12 -7,5 -12,0 -6,0" fill="url(#radOrange)" transform="translate(-60,-60) scale(0.9)"/>

    <!-- 連接中心與放射點 -->
    <line x1="0" y1="-40" x2="0" y2="-65" stroke="url(#radTeal)" stroke-width="2" opacity="0.6"/>
    <line x1="28" y1="-28" x2="42" y2="-42" stroke="url(#radTeal)" stroke-width="2" opacity="0.6"/>
    <line x1="40" y1="0" x2="65" y2="0" stroke="url(#radTeal)" stroke-width="2" opacity="0.6"/>
    <line x1="28" y1="28" x2="42" y2="42" stroke="url(#radTeal)" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="40" x2="0" y2="65" stroke="url(#radTeal)" stroke-width="2" opacity="0.6"/>
    <line x1="-28" y1="28" x2="-42" y2="42" stroke="url(#radTeal)" stroke-width="2" opacity="0.6"/>
    <line x1="-40" y1="0" x2="-65" y2="0" stroke="url(#radTeal)" stroke-width="2" opacity="0.6"/>
    <line x1="-28" y1="-28" x2="-42" y2="-42" stroke="url(#radTeal)" stroke-width="2" opacity="0.6"/>

    <!-- 中心焦點 -->
    <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
  </g>

  <text x="400" y="555" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#64748B">適用於：影響擴散、價值輻射、策略傳遞</text>
  <text x="740" y="585" text-anchor="end" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="#94A3B8">2026-07-28 熊熊</text>
</svg>
