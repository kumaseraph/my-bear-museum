<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 155" role="img" aria-label="幾何里程碑索引頁碼設計">
  <title>幾何里程碑索引</title>
  <desc>現代簡潔風格，05里程碑頁碼，0°/30°旋轉+菱形/平行四邊形，輕不對稱拼貼。應用#120/#121/#124技巧：旋轉角度對比+虛實對比+平行四邊形組合。融合趨勢：Asymmetric collage、Morphing、Simple shapes。適用工作報告PPT章節里程碑場景。</desc>

  <defs>
    <linearGradient id="gmi_grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="gmi_grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="gmi_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- 左側襯托六邊形叢集 (0°旋轉，虛) -->
  <g transform="translate(55, 77)">
    <path d="M0,-28 L24.3,-14 L24.3,14 L0,28 L-24.3,14 L-24.3,-14 Z"
          fill="#6B5CE7" fill-opacity="0.1"/>
    <path d="M0,-28 L24.3,-14 L24.3,14 L0,28 L-24.3,14 L-24.3,-14 Z"
          fill="none" stroke="#6B5CE7" stroke-width="1" stroke-opacity="0.25"/>
  </g>
  <g transform="translate(32, 54) rotate(15)">
    <path d="M0,-16 L13.9,-8 L13.9,8 L0,16 L-13.9,8 L-13.9,-8 Z"
          fill="#4ECDC4" fill-opacity="0.15"/>
  </g>
  <g transform="translate(32, 100) rotate(-15)">
    <path d="M0,-16 L13.9,-8 L13.9,8 L0,16 L-13.9,8 L-13.9,-8 Z"
          fill="#4ECDC4" fill-opacity="0.15"/>
  </g>

  <!-- 主六邊形 (0°旋轉) -->
  <g transform="translate(190, 77)">
    <!-- 外六邊形 - 粗空心 -->
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="none" stroke="url(#gmi_grad1)" stroke-width="5"/>
    <!-- 內六邊形 - 半透明實心 -->
    <path d="M0,-35 L30.4,-17.5 L30.4,17.5 L0,35 L-30.4,17.5 L-30.4,-17.5 Z"
          fill="#6B5CE7" fill-opacity="0.2"/>
    <!-- 白底核心 — 半徑加大至覆蓋 05 頂部，避免內六邊形穿越 -->
    <circle cx="0" cy="0" r="38" fill="#FFFFFF" fill-opacity="0.92"/>
    <!-- 菱形強調徽記 — 移至主六邊形右上方，不穿越數字 -->
    <g transform="translate(43, -26)">
      <polygon points="0,-10 8,0 0,10 -8,0"
               fill="none" stroke="#FF8C00" stroke-width="1.5" stroke-opacity="0.7"/>
      <polygon points="0,-5 4,0 0,5 -4,0"
               fill="#FF8C00" fill-opacity="0.3"/>
    </g>
    <!-- 里程碑數字 -->
    <text x="0" y="-58" text-anchor="middle" fill="#6B5CE7"
          font-family="system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="1" fill-opacity="0.7">MILESTONE</text>
    <text x="0" y="5" text-anchor="middle" fill="#4C1D95"
          font-family="system-ui, sans-serif" font-size="36" font-weight="800">05</text>
  </g>

  <!-- 右側襯托六邊形叢集 (30°旋轉，虛) -->
  <g transform="translate(325, 77) rotate(30)">
    <path d="M0,-28 L24.3,-14 L24.3,14 L0,28 L-24.3,14 L-24.3,-14 Z"
          fill="#4ECDC4" fill-opacity="0.1"/>
    <path d="M0,-28 L24.3,-14 L24.3,14 L0,28 L-24.3,14 L-24.3,-14 Z"
          fill="none" stroke="#4ECDC4" stroke-width="1" stroke-opacity="0.3"/>
  </g>
  <g transform="translate(348, 52) rotate(45)">
    <path d="M0,-16 L13.9,-8 L13.9,8 L0,16 L-13.9,8 L-13.9,-8 Z"
          fill="#6B5CE7" fill-opacity="0.12"/>
  </g>
  <g transform="translate(348, 102) rotate(45)">
    <path d="M0,-16 L13.9,-8 L13.9,8 L0,16 L-13.9,8 L-13.9,-8 Z"
          fill="#6B5CE7" fill-opacity="0.12"/>
  </g>

  <!-- 底部輕不對稱平行四邊形裝飾 (skewX=-15) -->
  <g transform="translate(190, 127)">
    <polygon points="-30,0 30,0 22,10 -22,10"
             fill="#4ECDC4" fill-opacity="0.2"/>
    <polygon points="-15,0 15,0 10,10 -10,10"
             fill="#FF8C00" fill-opacity="0.3"/>
  </g>

  <!-- 連接線 (輕不對稱) -->
  <line x1="83" y1="77" x2="140" y2="77" stroke="#A78BFA" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,4"/>
  <line x1="240" y1="77" x2="297" y2="77" stroke="#4ECDC4" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3,4"/>
</svg>
