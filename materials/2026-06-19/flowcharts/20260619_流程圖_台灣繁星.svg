<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#1a1a2e"/>
  
  <!-- 蜂巢叢集裝飾（背景層次） -->
  <g opacity="0.15" transform="translate(100, 100)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" fill="#6B5CE7"/>
    <path d="M150,5 L193.3,27.5 L193.3,72.5 L150,95 L106.7,72.5 L106.7,27.5 Z" fill="#A78BFA"/>
    <path d="M100,52.5 L143.3,75 L143.3,120 L100,142.5 L56.7,120 L56.7,75 Z" fill="#4ECDC4"/>
  </g>
  
  <g opacity="0.1" transform="translate(1600, 800)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" fill="#FF8C00"/>
    <path d="M0,52.5 L43.3,75 L43.3,120 L0,142.5 L-43.3,120 L-43.3,75 Z" fill="#6B5CE7"/>
  </g>
  
  <!-- 主流程：階梯排列（技巧#124 組合#3） -->
  <g transform="translate(200, 300)">
    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <polygon points="30,0 200,0 170,80 0,80" fill="url(#flowGrad)" opacity="0.9"/>
      <polygon points="30,0 200,0 170,80 0,80" fill="none" stroke="#A78BFA" stroke-width="2"/>
      <text x="100" y="45" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">01 計畫啟動</text>
      <circle cx="185" cy="40" r="8" fill="#FF8C00"/>
    </g>
    
    <!-- Step 2 -->
    <g transform="translate(120, 100)">
      <polygon points="30,0 200,0 170,80 0,80" fill="url(#flowGrad)" opacity="0.85"/>
      <polygon points="30,0 200,0 170,80 0,80" fill="none" stroke="#A78BFA" stroke-width="2"/>
      <text x="100" y="45" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">02 資源盤點</text>
      <circle cx="185" cy="40" r="8" fill="#FF8C00"/>
    </g>
    
    <!-- Step 3 -->
    <g transform="translate(240, 200)">
      <polygon points="30,0 200,0 170,80 0,80" fill="url(#flowGrad)" opacity="0.8"/>
      <polygon points="30,0 200,0 170,80 0,80" fill="none" stroke="#A78BFA" stroke-width="2"/>
      <text x="100" y="45" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">03 策略制定</text>
      <circle cx="185" cy="40" r="8" fill="#FF8C00"/>
    </g>
    
    <!-- Step 4 -->
    <g transform="translate(360, 300)">
      <polygon points="30,0 200,0 170,80 0,80" fill="url(#flowGrad)" opacity="0.75"/>
      <polygon points="30,0 200,0 170,80 0,80" fill="none" stroke="#A78BFA" stroke-width="2"/>
      <text x="100" y="45" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">04 執行管控</text>
      <circle cx="185" cy="40" r="8" fill="#FF8C00"/>
    </g>
    
    <!-- Step 5 -->
    <g transform="translate(480, 400)">
      <polygon points="30,0 200,0 170,80 0,80" fill="url(#accentGrad)" opacity="0.95"/>
      <polygon points="30,0 200,0 170,80 0,80" fill="none" stroke="#F59E0B" stroke-width="3"/>
      <text x="100" y="45" fill="#fff" font-size="18" font-weight="bold" text-anchor="middle">05 成果驗收</text>
      <circle cx="185" cy="40" r="8" fill="#4ECDC4"/>
    </g>
  </g>
  
  <!-- 連接線（技巧#124 組合#4：叢集連接線） -->
  <g stroke="#FF8C00" stroke-width="2" stroke-dasharray="8,4" fill="none">
    <path d="M380 340 Q450 340 450 380 Q450 420 520 420"/>
    <path d="M500 460 Q570 460 570 500 Q570 540 640 540"/>
    <path d="M620 580 Q690 580 690 620 Q690 660 760 660"/>
    <path d="M740 700 Q810 700 810 740 Q810 780 880 780"/>
  </g>
  
  <!-- 右側裝飾：節點網絡（技巧#124 組合#9） -->
  <g transform="translate(1300, 300)">
    <circle cx="100" cy="100" r="12" fill="#4ECDC4"/>
    <polygon points="80,50 150,50 130,100 60,100" fill="#6B5CE7" fill-opacity="0.5"/>
    
    <circle cx="250" cy="180" r="12" fill="#FF8C00"/>
    <polygon points="230,130 300,130 280,180 210,180" fill="#A78BFA" fill-opacity="0.5"/>
    
    <circle cx="180" cy="280" r="12" fill="#4ECDC4"/>
    <polygon points="160,230 230,230 210,280 140,280" fill="#6B5CE7" fill-opacity="0.5"/>
    
    <!-- 連接線 -->
    <line x1="100" y1="100" x2="250" y2="180" stroke="#FF8C00" stroke-width="2"/>
    <line x1="250" y1="180" x2="180" y2="280" stroke="#FF8C00" stroke-width="2"/>
    <line x1="180" y1="280" x2="100" y2="100" stroke="#FF8C00" stroke-width="2"/>
  </g>
  
  <!-- 底部標題 -->
  <text x="960" y="950" fill="#fff" font-size="32" font-weight="bold" text-anchor="middle" opacity="0.9">專案管理流程</text>
  <text x="960" y="1000" fill="#A78BFA" font-size="18" text-anchor="middle" opacity="0.7">Project Management Flowchart</text>
</svg>