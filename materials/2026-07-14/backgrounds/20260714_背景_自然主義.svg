<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- 自然主義配色 -->
    <linearGradient id="leafGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    
    <!-- 葉片圖案 -->
    <path id="leaf" d="M0,-30 Q15,-25 20,0 Q15,25 0,30 Q-15,25 -20,0 Q-15,-25 0,-30" fill="#059669"/>
  </defs>
  
  <!-- 溫暖米色背景 -->
  <rect width="1920" height="1080" fill="#F8FAFC"/>
  
  <!-- 自然葉片裝飾 - 左上角 -->
  <g transform="translate(100,100)">
    <use href="#leaf" fill="url(#leafGrad1)" transform="rotate(30) scale(1.5)"/>
    <use href="#leaf" fill="url(#leafGrad2)" transform="translate(40,20) rotate(60) scale(1.2)"/>
    <use href="#leaf" fill="#059669" transform="translate(20,50) rotate(15) scale(0.8)" opacity="0.6"/>
  </g>
  
  <!-- 自然葉片裝飾 - 右上角 -->
  <g transform="translate(1800,150)">
    <use href="#leaf" fill="url(#leafGrad1)" transform="rotate(-45) scale(1.8)"/>
    <use href="#leaf" fill="url(#leafGrad2)" transform="translate(-50,30) rotate(-30) scale(1.3)"/>
    <use href="#leaf" fill="#34D399" transform="translate(-30,60) rotate(-60) scale(0.9)" opacity="0.5"/>
  </g>
  
  <!-- 左側葉片群 -->
  <g transform="translate(50,500)">
    <use href="#leaf" fill="url(#leafGrad1)" transform="rotate(90) scale(1.4)"/>
    <use href="#leaf" fill="url(#leafGrad2)" transform="translate(30,40) rotate(120) scale(1.1)"/>
    <use href="#leaf" fill="#10B981" transform="translate(10,80) rotate(80) scale(0.7)" opacity="0.7"/>
  </g>
  
  <!-- 右側葉片群 -->
  <g transform="translate(1850,600)">
    <use href="#leaf" fill="url(#leafGrad1)" transform="rotate(-90) scale(1.6)"/>
    <use href="#leaf" fill="url(#leafGrad2)" transform="translate(-40,50) rotate(-60) scale(1.2)"/>
  </g>
  
  <!-- 底部葉片裝飾 -->
  <g transform="translate(300,950)">
    <use href="#leaf" fill="#059669" transform="rotate(10) scale(1.3)" opacity="0.8"/>
    <use href="#leaf" fill="url(#leafGrad2)" transform="translate(50,10) rotate(-15) scale(1.1)"/>
    <use href="#leaf" fill="#34D399" transform="translate(100,-5) rotate(25) scale(0.9)" opacity="0.6"/>
  </g>
  
  <g transform="translate(1400,1000)">
    <use href="#leaf" fill="#059669" transform="rotate(-20) scale(1.4)" opacity="0.7"/>
    <use href="#leaf" fill="url(#leafGrad1)" transform="translate(-60,0) rotate(10) scale(1.2)"/>
  </g>
  
  <!-- 中央焦點區 - 六邊形叢集 -->
  <g transform="translate(960,540)">
    <!-- 大六邊形 -->
    <polygon points="100,0 200,58 200,173 100,231 0,173 0,58" 
             fill="url(#leafGrad1)" fill-opacity="0.15"/>
    <polygon points="100,20 180,68 180,155 100,200 20,155 20,68" 
             fill="none" stroke="#059669" stroke-width="2" opacity="0.5"/>
    
    <!-- 中六邊形群 -->
    <polygon points="0,-150 52,-75 52,0 0,75 -52,0 -52,-75" 
             fill="url(#leafGrad2)" fill-opacity="0.3"/>
    <polygon points="150,-80 202,-5 202,70 150,145 98,70 98,-5" 
             fill="url(#leafGrad1)" fill-opacity="0.25"/>
    <polygon points="-150,-80 -98,-5 -98,70 -150,145 -202,70 -202,-5" 
             fill="url(#leafGrad2)" fill-opacity="0.2"/>
    
    <!-- 小六邊形點綴 -->
    <polygon points="50,200 77,225 77,275 50,300 23,275 23,225" 
             fill="#FBBF24" fill-opacity="0.6"/>
    <polygon points="180,250 207,275 207,325 180,350 153,325 153,275" 
             fill="url(#goldGrad)" fill-opacity="0.5"/>
    <polygon points="-180,250 -153,275 -153,325 -180,350 -207,325 -207,275" 
             fill="#34D399" fill-opacity="0.4"/>
  </g>
  
  <!-- 金色果實點綴 -->
  <circle cx="960" cy="350" r="15" fill="#FBBF24" opacity="0.8"/>
  <circle cx="920" cy="370" r="8" fill="#FCD34D" opacity="0.6"/>
  <circle cx="1000" cy="365" r="10" fill="#FBBF24" opacity="0.7"/>
  
  <!-- 右下角葉片 -->
  <g transform="translate(1750,900)">
    <use href="#leaf" fill="#059669" transform="rotate(-120) scale(1.5)" opacity="0.8"/>
    <use href="#leaf" fill="url(#leafGrad2)" transform="translate(-40,-30) rotate(-150) scale(1.2)"/>
  </g>
  
  <!-- 誇張層級裝飾線 -->
  <line x1="960" y1="50" x2="960" y2="150" stroke="#059669" stroke-width="4" opacity="0.3"/>
  <line x1="960" y1="930" x2="960" y2="1030" stroke="#059669" stroke-width="4" opacity="0.3"/>
</svg>