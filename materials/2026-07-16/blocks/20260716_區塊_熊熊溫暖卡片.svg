<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <!-- 熊熊溫暖配色 -->
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F3"/>
      <stop offset="100%" stop-color="#F5E6D3"/>
    </linearGradient>
    <linearGradient id="bearCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="100%" stop-color="#4A2C17"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#C4956A"/>
    </linearGradient>
    <!-- 玻璃擬態濾鏡 -->
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#warmBg)"/>
  
  <!-- 蜂巢圖案裝飾 - 交錯排列 -->
  <g opacity="0.12">
    <path d="M30,20 L51.96,35 L51.96,65 L30,80 L8.04,65 L8.04,35 Z" fill="#8B6914"/>
    <path d="M30,20 L51.96,35 L51.96,65 L30,80 L8.04,65 L8.04,35 Z" fill="#8B6914" transform="translate(43.3,50)"/>
    <path d="M30,20 L51.96,35 L51.96,65 L30,80 L8.04,65 L8.04,35 Z" fill="#8B6914" transform="translate(86.6,0)"/>
    <path d="M30,20 L51.96,35 L51.96,65 L30,80 L8.04,65 L8.04,35 Z" fill="#8B6914" transform="translate(86.6,0)"/>
    <path d="M30,20 L51.96,35 L51.96,65 L30,80 L8.04,65 L8.04,35 Z" fill="#8B6914" transform="translate(129.9,50)"/>
  </g>
  
  <!-- 主卡片 - 玻璃擬態效果 -->
  <g transform="translate(200,150)">
    <!-- 卡片陰影 -->
    <rect x="-140" y="-80" width="280" height="180" rx="16" fill="#6B4423" opacity="0.15" transform="translate(8,8)"/>
    
    <!-- 卡片本體 -->
    <rect x="-140" y="-80" width="280" height="180" rx="16" fill="#FFFFFF" opacity="0.85"/>
    <rect x="-140" y="-80" width="280" height="180" rx="16" fill="none" stroke="url(#goldAccent)" stroke-width="2"/>
    
    <!-- 頂部熊熊標誌 -->
    <circle cx="-100" cy="-50" r="25" fill="url(#bearCard)"/>
    <circle cx="-108" cy="-58" r="8" fill="#D4A574"/>
    <circle cx="-92" cy="-58" r="8" fill="#D4A574"/>
    <ellipse cx="-100" cy="-42" rx="6" ry="4" fill="#4A2C17"/>
    
    <!-- 標題 -->
    <text x="60" y="-45" text-anchor="middle" fill="#4A2C17" font-family="Arial, sans-serif" font-size="20" font-weight="bold">工作報告</text>
    
    <!-- 分隔線 -->
    <line x1="-120" y1="-20" x2="120" y2="-20" stroke="url(#goldAccent)" stroke-width="1" stroke-dasharray="4,4"/>
    
    <!-- 內容區 -->
    <text x="-110" y="10" fill="#6B4423" font-family="Arial, sans-serif" font-size="13">📊 本月進度</text>
    <rect x="-110" y="20" width="200" height="8" rx="4" fill="#E8D4BE"/>
    <rect x="-110" y="20" width="140" height="8" rx="4" fill="url(#goldAccent)"/>
    
    <text x="-110" y="50" fill="#6B4423" font-family="Arial, sans-serif" font-size="13">🎯 目標達成</text>
    <rect x="-110" y="60" width="200" height="8" rx="4" fill="#E8D4BE"/>
    <rect x="-110" y="60" width="170" height="8" rx="4" fill="#8B6914"/>
    
    <text x="-110" y="90" fill="#6B4423" font-family="Arial, sans-serif" font-size="13">💡 創新提案</text>
    <rect x="-110" y="100" width="200" height="8" rx="4" fill="#E8D4BE"/>
    <rect x="-110" y="100" width="90" height="8" rx="4" fill="#C4956A"/>
  </g>
</svg>