<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>專案節點網絡圖</title>
  <desc>組織架構與專案流程節點網絡圖</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 主節點：專案經理 -->
  <g transform="translate(860, 100)" filter="url(#glow)">
    <polygon points="0,-50 120,-50 100,30 -20,30" fill="url(#nodeGrad)" transform="skewX(-15)"/>
    <text x="40" y="0" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Microsoft JhengHei, Arial">專案經理</text>
    <circle cx="40" cy="-70" r="12" fill="#F59E0B"/>
  </g>
  
  <!-- 連接線：經理→組長 -->
  <line x1="860" y1="130" x2="400" y2="320" stroke="#3B82F6" stroke-width="3"/>
  <line x1="860" y1="130" x2="960" y2="320" stroke="#3B82F6" stroke-width="3"/>
  <line x1="860" y1="130" x2="1500" y2="320" stroke="#3B82F6" stroke-width="3"/>
  
  <!-- 組長1：規劃組 -->
  <g transform="translate(300, 320)">
    <polygon points="0,-40 120,-40 100,30 -20,30" fill="#60A5FA" transform="skewX(-10)"/>
    <text x="40" y="5" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Microsoft JhengHei, Arial">規劃組</text>
    <circle cx="40" cy="-55" r="10" fill="#1E40AF"/>
  </g>
  
  <!-- 組長2：執行組 -->
  <g transform="translate(860, 320)">
    <polygon points="0,-40 120,-40 100,30 -20,30" fill="#60A5FA" transform="skewX(-10)"/>
    <text x="40" y="5" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Microsoft JhengHei, Arial">執行組</text>
    <circle cx="40" cy="-55" r="10" fill="#1E40AF"/>
  </g>
  
  <!-- 組長3：品管組 -->
  <g transform="translate(1400, 320)">
    <polygon points="0,-40 120,-40 100,30 -20,30" fill="#60A5FA" transform="skewX(-10)"/>
    <text x="40" y="5" text-anchor="middle" fill="white" font-size="18" font-weight="bold" font-family="Microsoft JhengHei, Arial">品管組</text>
    <circle cx="40" cy="-55" r="10" fill="#1E40AF"/>
  </g>
  
  <!-- 成員連接線 -->
  <line x1="380" y1="360" x2="200" y2="500" stroke="#93C5FD" stroke-width="2"/>
  <line x1="380" y1="360" x2="380" y2="500" stroke="#93C5FD" stroke-width="2"/>
  <line x1="380" y1="360" x2="560" y2="500" stroke="#93C5FD" stroke-width="2"/>
  
  <line x1="940" y1="360" x2="760" y2="500" stroke="#93C5FD" stroke-width="2"/>
  <line x1="940" y1="360" x2="940" y2="500" stroke="#93C5FD" stroke-width="2"/>
  <line x1="940" y1="360" x2="1120" y2="500" stroke="#93C5FD" stroke-width="2"/>
  
  <line x1="1480" y1="360" x2="1300" y2="500" stroke="#93C5FD" stroke-width="2"/>
  <line x1="1480" y1="360" x2="1480" y2="500" stroke="#93C5FD" stroke-width="2"/>
  <line x1="1480" y1="360" x2="1660" y2="500" stroke="#93C5FD" stroke-width="2"/>
  
  <!-- 成員節點 -->
  <g font-family="Microsoft JhengHei, Arial" fill="#374151">
    <text x="200" y="520" text-anchor="middle" font-size="14">成員 A</text>
    <text x="380" y="520" text-anchor="middle" font-size="14">成員 B</text>
    <text x="560" y="520" text-anchor="middle" font-size="14">成員 C</text>
    
    <text x="760" y="520" text-anchor="middle" font-size="14">成員 D</text>
    <text x="940" y="520" text-anchor="middle" font-size="14">成員 E</text>
    <text x="1120" y="520" text-anchor="middle" font-size="14">成員 F</text>
    
    <text x="1300" y="520" text-anchor="middle" font-size="14">成員 G</text>
    <text x="1480" y="520" text-anchor="middle" font-size="14">成員 H</text>
    <text x="1660" y="520" text-anchor="middle" font-size="14">成員 I</text>
  </g>
  
  <!-- 節點圓點裝飾 -->
  <g fill="#3B82F6">
    <circle cx="200" cy="500" r="6"/>
    <circle cx="380" cy="500" r="6"/>
    <circle cx="560" cy="500" r="6"/>
    <circle cx="760" cy="500" r="6"/>
    <circle cx="940" cy="500" r="6"/>
    <circle cx="1120" cy="500" r="6"/>
    <circle cx="1300" cy="500" r="6"/>
    <circle cx="1480" cy="500" r="6"/>
    <circle cx="1660" cy="500" r="6"/>
  </g>
  
  <!-- 底部流程箭頭 -->
  <g transform="translate(200, 650)">
    <line x1="100" y1="0" x2="1600" y2="0" stroke="#E5E7EB" stroke-width="2"/>
    <polygon points="1600,0 1580,-10 1580,10" fill="#E5E7EB"/>
    
    <g font-family="Microsoft JhengHei, Arial" font-size="14" fill="#6B7280">
      <text x="200" y="40" text-anchor="middle">啟動</text>
      <text x="500" y="40" text-anchor="middle">規劃</text>
      <text x="800" y="40" text-anchor="middle">執行</text>
      <text x="1100" y="40" text-anchor="middle">監控</text>
      <text x="1400" y="40" text-anchor="middle">結案</text>
    </g>
    <g fill="#3B82F6">
      <circle cx="200" cy="0" r="8"/>
      <circle cx="500" cy="0" r="8"/>
      <circle cx="800" cy="0" r="8"/>
      <circle cx="1100" cy="0" r="8"/>
      <circle cx="1400" cy="0" r="8"/>
    </g>
  </g>
  
  <!-- 說明文字 -->
  <text x="960" y="850" text-anchor="middle" fill="#9CA3AF" font-size="16" font-family="Microsoft JhengHei, Arial">專案組織架構 × 工作流程階段</text>
</svg>