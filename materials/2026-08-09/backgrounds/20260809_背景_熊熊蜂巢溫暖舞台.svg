<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 背景_工作報告蜂巢舞台 | 工作報告系列 | 🐻 熊熊風格 -->
  <!-- 技巧: #122 蜂巢叢集七變化 + #120 六邊形十式 - 叢集排列 + 漸層統一 + 大小對比 + 虛實對比 -->
  <!-- 趨勢融合: 品牌色克制使用 + 重複形狀串敘事 + 對齊比裝飾重要 -->
  <defs>
    <linearGradient id="honeyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="50%" stop-color="#FAF0D7"/>
      <stop offset="100%" stop-color="#F5E6C0"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92750C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="brownSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- 暖白底色(克制留白) -->
  <rect width="1920" height="1080" fill="url(#honeyBg)"/>

  <!-- 左上蜂巢叢集(主視覺焦點 - 大小對比) -->
  <g transform="translate(200, 200)">
    <!-- 大六邊形(叢集焦點) -->
    <path d="M120,12 L223.92,66 L223.92,174 L120,228 L16.08,174 L16.08,66 Z"
          fill="url(#brownSoft)"/>
    <!-- 中六邊形 -->
    <path d="M70,7 L130.62,38.5 L130.62,101.5 L70,133 L9.38,101.5 L9.38,38.5 Z"
          fill="none" stroke="url(#goldLight)" stroke-width="2"/>
    <!-- 小六邊形(虛實對比) -->
    <path d="M40,4 L74.6,22 L74.6,58 L40,76 L5.4,58 L5.4,22 Z"
          fill="#D4AF37" fill-opacity="0.7"/>
    <!-- 環繞點綴小六邊形 -->
    <g transform="translate(250, 50)">
      <path d="M30,3 L56,17 L56,43 L30,57 L4,43 L4,17 Z"
            fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>
    </g>
    <g transform="translate(310, 130)">
      <path d="M22,2.2 L41,12.4 L41,32 L22,42.2 L3,32 L3,12.4 Z"
            fill="#D4AF37" fill-opacity="0.4"/>
    </g>
    <g transform="translate(-30, 240)">
      <path d="M28,2.8 L52,16 L52,40 L28,53.2 L4,40 L4,16 Z"
            fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.4"/>
    </g>
  </g>

  <!-- 右下蜂巢叢集(對稱焦點) -->
  <g transform="translate(1500, 700)">
    <path d="M120,12 L223.92,66 L223.92,174 L120,228 L16.08,174 L16.08,66 Z"
          fill="url(#brownSoft)"/>
    <path d="M70,7 L130.62,38.5 L130.62,101.5 L70,133 L9.38,101.5 L9.38,38.5 Z"
          fill="none" stroke="url(#goldLight)" stroke-width="2"/>
    <path d="M40,4 L74.6,22 L74.6,58 L40,76 L5.4,58 L5.4,22 Z"
          fill="#D4AF37" fill-opacity="0.7"/>
    <g transform="translate(-230, -30)">
      <path d="M30,3 L56,17 L56,43 L30,57 L4,43 L4,17 Z"
            fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.5"/>
    </g>
    <g transform="translate(280, -90)">
      <path d="M22,2.2 L41,12.4 L41,32 L22,42.2 L3,32 L3,12.4 Z"
