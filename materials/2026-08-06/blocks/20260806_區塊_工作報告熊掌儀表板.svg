<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FFF8E7"/><stop offset="1" stop-color="#F5E6D3"/></linearGradient>
    <linearGradient id="warm" x2="1" y2="1"><stop stop-color="#B8860B"/><stop offset="1" stop-color="#F2B94B"/></linearGradient>
    <linearGradient id="dark" x2="1" y2="1"><stop stop-color="#5C3A0E"/><stop offset="1" stop-color="#8B6914"/></linearGradient>
    <pattern id="honeycomb" x="0" y="0" width="78" height="86.6" patternUnits="userSpaceOnUse">
      <path d="M39,0 L78,21.65 L78,64.95 L39,86.6 L0,64.95 L0,21.65 Z" fill="none" stroke="#B8860B" stroke-width="0.6" opacity="0.12"/>
    </pattern>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11"/><feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.27  0 0 0 0 0.07  0 0 0 0.04 0"/></filter>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#8B6914" flood-opacity=".15"/></filter>
    <!-- 熊掌符號（5圓 = 主掌+4趾） -->
    <symbol id="paw" viewBox="-50 -50 100 100">
      <ellipse cx="0" cy="20" rx="22" ry="18" fill="currentColor"/>
      <circle cx="-22" cy="-10" r="11" fill="currentColor"/>
      <circle cx="22" cy="-10" r="11" fill="currentColor"/>
      <circle cx="-8" cy="-25" r="9" fill="currentColor"/>
      <circle cx="8" cy="-25" r="9" fill="currentColor"/>
    </symbol>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#honeycomb)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.5"/>
  <g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
    <text x="120" y="130" font-size="28" fill="#B8860B" font-weight="700" letter-spacing="5">PAW DASHBOARD · 熊掌儀表板</text>
    <text x="120" y="205" font-size="62" fill="#5C3A0E" font-weight="800">工作報告 · 熊掌數據板</text>
    <text x="120" y="253" font-size="25" fill="#8B6914">5 大面向 · 一掌掌握</text>
  </g>
  <!-- 4 個儀表卡 + 1 大焦點卡，蜂巢式交錯排列 -->
  <g transform="translate(170 360)">
    <g filter="url(#s)">
      <path d="M0,-100 L260,-50 L260,50 L0,100 L-180,50 L-180,-50 Z" fill="#FFFFFF" stroke="#D4A017" stroke-width="3"/>
      <g color="#B8860B" transform="translate(-130 -30) scale(0.45)"><use href="#paw"/></g>
      <text x="-100" y="0" font-size="22" fill="#8B6914" font-weight="700">營收</text>
      <text x="-100" y="55" font-family="Arial" font-size="62" font-weight="800" fill="#5C3A0E">$2.4M</text>
      <text x="80" y="-50" font-size="20" fill="#B8860B" text-anchor="end">▲ 18%</text>
    </g>
  </g>
  <g transform="translate(550 360)">
    <g filter="url(#s)">
      <path d="M0,-100 L260,-50 L260,50 L0,100 L-180,50 L-180,-50 Z" fill="#FFFFFF" stroke="#D4A017" stroke-width="3"/>
      <g color="#B8860B" transform="translate(-130 -30) scale(0.45)"><use href="#paw"/></g>
      <text x="-100" y="0" font-size="22" fill="#8B6914" font-weight="700">活躍用戶</text>
      <text x="-100" y="55" font-family="Arial" font-size="62" font-weight="800" fill="#5C3A0E">58.2K</text>
      <text x="80" y="-50" font-size="20" fill="#167A6A" text-anchor="end">▲ 12%</text>
    </g>
  </g>
  <g transform="translate(930 360)">
    <g filter="url(#s)">
      <path d="M0,-100 L260,-50 L260,50 L0,100 L-180,50 L-180,-50 Z" fill="#FFFFFF" stroke="#D4A017" stroke-width="3"/>
      <g color="#B8860B" transform="translate(-130 -30) scale(0.45)"><use href="#paw"/></g>
      <text x="-100" y="0" font-size="22" fill="#8B6914" font-weight="700">回客率</text>
      <text x="-100" y="55" font-family="Arial" font-size="62" font-weight="800" fill="#5C3A0E">76%</text>
      <text x="80" y="-50" font-size="20" fill="#167A6A" text-anchor="end">▲ 5pp</text>
    </g>
  </g>
  <g transform="translate(1310 360)">
    <g filter="url(#s)">
      <path d="M0,-100 L260,-50 L260,50 L0,100 L-180,50 L-180,-50 Z" fill="#FFFFFF" stroke="#D4A017" stroke-width="3"/>
      <g color="#B8860B" transform="translate(-130 -30) scale(0.45)"><use href="#paw"/></g>
      <text x="-100" y="0" font-size="22" fill="#8B6914" font-weight="700">NPS</text>
      <text x="-100" y="55" font-family="Arial" font-size="62" font-weight="800" fill="#5C3A0E">62</text>
      <text x="80" y="-50" font-size="20" fill="#167A6A" text-anchor="end">▲ 8 分</text>
    </g>
  </g>
  <!-- 大焦點卡：熊掌足跡（#122 放射環形變化） -->
  <g transform="translate(960 740)" filter="url(#s)">
    <path d="M-360,-130 L360,-130 L420,0 L360,130 L-360,130 L-420,0 Z" fill="url(#dark)"/>
    <text x="-340" y="-60" font-size="22" fill="#F2B94B" font-weight="700" letter-spacing="3">PAW SCORE · 總體表現</text>
    <!-- 中心大掌 -->
    <g color="#F2B94B" transform="translate(-300 30) scale(1.4)"><use href="#paw"/></g>
    <!-- 環繞小掌 -->
    <g color="#F2B94B" opacity="0.6" transform="translate(-100 -50) scale(0.5)"><use href="#paw"/></g>
    <g color="#F2B94B" opacity="0.6" transform="translate(-50 -80) scale(0.5)"><use href="#paw"/></g>
    <g color="#F2B94B" opacity="0.6" transform="translate(50 -80) scale(0.5)"><use href="#paw"/></g>
    <g color="#F2B94B" opacity="0.6" transform="translate(100 -50) scale(0.5)"><use href="#paw"/></g>
    <g color="#F2B94B" opacity="0.6" transform="translate(130 0) scale(0.5)"><use href="#paw"/></g>
    <text x="-100" y="40" font-family="Arial" font-size="120" font-weight="800" fill="#FFFFFF">92</text>
    <text x="80" y="40" font-size="40" fill="#F2B94B" font-weight="700">/ 100</text>
    <text x="-100" y="85" font-size="22" fill="#F2B94B" letter-spacing="2">★★★★★ EXCELLENT</text>
  </g>
</svg>
