<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>時間軸透視流程</title>
  <desc>應用#124技巧：階梯排列+透視線，融合跨情境清晰度、在可控系統中保留人類痕跡趨勢</desc>

  <defs>
    <linearGradient id="timeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="timeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="timeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="timeLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="timeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#F8FAFC"/>

  <!-- 標題 -->
  <text x="160" y="130" font-family="Microsoft JhengHei, PingFang TC, sans-serif" font-size="56" font-weight="700" fill="#1E40AF">工作報告 · 時間軸透視流程</text>
  <text x="160" y="180" font-family="Microsoft JhengHei, PingFang TC, sans-serif" font-size="24" fill="#64748B">Timeline · 階段 × 透視深度</text>
  <line x1="160" y1="210" x2="320" y2="210" stroke="#F59E0B" stroke-width="4"/>

  <!-- 透視時間軸主線 -->
  <line x1="160" y1="600" x2="1760" y2="600" stroke="url(#timeLine)" stroke-width="3"/>

  <!-- 透視消失線（從中軸向後消失） -->
  <g opacity="0.12" stroke="#1E40AF" stroke-width="1" fill="none">
    <line x1="160" y1="600" x2="960" y2="200"/>
    <line x1="160" y1="600" x2="960" y2="300"/>
    <line x1="160" y1="600" x2="960" y2="400"/>
    <line x1="1760" y1="600" x2="960" y2="200"/>
    <line x1="1760" y1="600" x2="960" y2="300"/>
    <line x1="1760" y1="600" x2="960" y2="400"/>
  </g>

  <!-- 階段節點（平行四邊形，階梯上行） -->
  <!-- 階段1: 規劃 (低) -->
  <g transform="translate(180, 540)" filter="url(#timeShadow)">
    <polygon points="20,0 220,0 200,100 0,100" fill="url(#timeGrad1)"/>
    <text x="110" y="42" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">第一階段</text>
    <text x="110" y="76" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">規劃</text>
  </g>
  <circle cx="290" cy="600" r="14" fill="#1E40AF" stroke="#FFFFFF" stroke-width="3"/>
  <text x="290" y="688" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#64748B">Week 1-2</text>

  <!-- 階段2: 執行 -->
  <g transform="translate(440, 480)" filter="url(#timeShadow)">
    <polygon points="20,0 220,0 200,100 0,100" fill="url(#timeGrad2)"/>
    <text x="110" y="42" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">第二階段</text>
    <text x="110" y="76" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">執行</text>
  </g>
  <circle cx="550" cy="600" r="14" fill="#3B82F6" stroke="#FFFFFF" stroke-width="3"/>
  <text x="550" y="688" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#64748B">Week 3-6</text>

  <!-- 階段3: 檢核 -->
  <g transform="translate(700, 420)" filter="url(#timeShadow)">
    <polygon points="20,0 220,0 200,100 0,100" fill="url(#timeGrad2)"/>
    <text x="110" y="42" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">第三階段</text>
    <text x="110" y="76" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">檢核</text>
  </g>
  <circle cx="810" cy="600" r="14" fill="#3B82F6" stroke="#FFFFFF" stroke-width="3"/>
  <text x="810" y="688" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#64748B">Week 7</text>

  <!-- 階段4: 調整 -->
  <g transform="translate(960, 360)" filter="url(#timeShadow)">
    <polygon points="20,0 220,0 200,100 0,100" fill="url(#timeGrad1)"/>
    <text x="110" y="42" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">第四階段</text>
    <text x="110" y="76" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">調整</text>
  </g>
  <circle cx="1070" cy="600" r="14" fill="#1E40AF" stroke="#FFFFFF" stroke-width="3"/>
  <text x="1070" y="688" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#64748B">Week 8</text>

  <!-- 階段5: 報告 -->
  <g transform="translate(1220, 300)" filter="url(#timeShadow)">
    <polygon points="20,0 220,0 200,100 0,100" fill="url(#timeGrad3)"/>
    <text x="110" y="42" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">第五階段</text>
    <text x="110" y="76" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">報告</text>
  </g>
  <circle cx="1330" cy="600" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
  <text x="1330" y="688" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#64748B">Week 9-10</text>

  <!-- 階段6: 發表 -->
  <g transform="translate(1480, 240)" filter="url(#timeShadow)">
    <polygon points="20,0 220,0 200,100 0,100" fill="url(#timeGrad3)"/>
    <text x="110" y="42" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">第六階段</text>
    <text x="110" y="76" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">發表</text>
  </g>
  <circle cx="1590" cy="600" r="18" fill="#F59E0B" stroke="#FFFFFF" stroke-width="4"/>
  <polygon points="1585,592 1600,600 1585,608 1590,600" fill="#FFFFFF"/>

  <!-- 底部資訊列（一頁一訊息） -->
  <g transform="translate(160, 800)">
    <rect x="0" y="0" width="1600" height="180" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="6" height="180" fill="#F59E0B"/>
    <text x="40" y="50" font-family="Microsoft JhengHei, sans-serif" font-size="24" font-weight="700" fill="#1E40AF">時間軸透視重點</text>
    <text x="40" y="92" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#374151">· 平行四邊形階梯上行 = 階段進展，視覺引導由左至右、由低至高</text>
    <text x="40" y="124" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#374151">· 透視消失線 = 呈現時間縱深與遠近感，強化「歷程」感受</text>
    <text x="40" y="156" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#374151">· 黃色節點 = 關鍵里程碑（報告/發表），其餘為階段檢核點</text>
  </g>
</svg>
