<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="dcBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="dcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#FFFFFF"/>

  <text x="60" y="60" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#1E293B">雙重決策核心</text>
  <text x="60" y="90" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Dual Decision Core — 雙重菱形 × 五角星 疊加</text>

  <!-- 圖標主體 -->
  <g transform="translate(400, 320)">
    <!-- 外六邊形 -->
    <path d="M0,-180 L156,-90 L156,90 L0,180 L-156,90 L-156,-90 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-160 L138,-80 L138,80 L0,160 L-138,80 L-138,-80 Z" fill="url(#dcBlue)" opacity="0.05"/>

    <!-- 雙重菱形（深度感） -->
    <polygon points="0,-110 90,0 0,110 -90,0" fill="none" stroke="url(#dcBlue)" stroke-width="3"/>
    <polygon points="0,-110 90,0 0,110 -90,0" fill="url(#dcBlue)" opacity="0.15" transform="rotate(15)"/>

    <!-- 中心五角星 -->
    <polygon points="0,-60 18,0 60,0 28,22 40,70 0,42 -40,70 -28,22 -60,0 -18,0" fill="url(#dcGold)"/>

    <!-- 焦點高光 -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>

    <!-- 四角放射小五角星 -->
    <polygon points="0,-12 6,0 12,0 7,5 9,12 0,8 -9,12 -7,5 -12,0 -6,0" fill="url(#dcBlue)" transform="translate(0,-130) scale(0.8)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,12 0,8 -9,12 -7,5 -12,0 -6,0" fill="url(#dcBlue)" transform="translate(130,0) scale(0.8)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,12 0,8 -9,12 -7,5 -12,0 -6,0" fill="url(#dcBlue)" transform="translate(0,130) scale(0.8)"/>
    <polygon points="0,-12 6,0 12,0 7,5 9,12 0,8 -9,12 -7,5 -12,0 -6,0" fill="url(#dcBlue)" transform="translate(-130,0) scale(0.8)"/>

    <!-- 連接線 -->
    <line x1="0" y1="-110" x2="0" y2="-118" stroke="url(#dcBlue)" stroke-width="2"/>
    <line x1="90" y1="0" x2="98" y2="0" stroke="url(#dcBlue)" stroke-width="2"/>
    <line x1="0" y1="110" x2="0" y2="118" stroke="url(#dcBlue)" stroke-width="2"/>
    <line x1="-90" y1="0" x2="-98" y2="0" stroke="url(#dcBlue)" stroke-width="2"/>
  </g>

  <text x="400" y="555" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#64748B">適用於：核心價值、關鍵理念、策略中心</text>
  <text x="740" y="585" text-anchor="end" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="#94A3B8">2026-07-28 熊熊</text>
</svg>
