<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- 自然漸層 - 天空到暖陽 -->
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9"/>
      <stop offset="40%" stop-color="#C8E6C9"/>
      <stop offset="70%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    
    <!-- 陽光漸層 -->
    <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="60%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB74D"/>
    </radialGradient>
    
    <!-- 葉子漸層 -->
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
  </defs>
  
  <!-- 背景填充 -->
  <rect width="1920" height="1080" fill="url(#skyGradient)"/>
  
  <!-- 太陽裝飾 -->
  <g transform="translate(1500, 200)">
    <circle cx="0" cy="0" r="120" fill="url(#sunGradient)" opacity="0.6"/>
    <circle cx="0" cy="0" r="80" fill="#FFF59D" opacity="0.4"/>
  </g>
  
  <!-- 雲朵裝飾 -->
  <g fill="#FFFFFF" opacity="0.7">
    <ellipse cx="300" cy="150" rx="80" ry="40"/>
    <ellipse cx="360" cy="140" rx="60" ry="35"/>
    <ellipse cx="250" cy="160" rx="50" ry="30"/>
    
    <ellipse cx="1400" cy="350" rx="100" ry="45"/>
    <ellipse cx="1480" cy="340" rx="70" ry="40"/>
    <ellipse cx="1340" cy="360" rx="60" ry="32"/>
    
    <ellipse cx="800" cy="100" rx="70" ry="35"/>
    <ellipse cx="860" cy="90" rx="50" ry="28"/>
    <ellipse cx="750" cy="110" rx="45" ry="25"/>
  </g>
  
  <!-- 自然植物元素 - 葉子叢集 -->
  <g transform="translate(100, 600)">
    <!-- 大葉子 -->
    <path d="M0,300 Q30,200 0,100 Q-30,200 0,300" fill="url(#leafGradient)" opacity="0.8"/>
    <path d="M20,300 Q50,180 30,80 Q10,180 20,300" fill="#4CAF50" opacity="0.7"/>
    <path d="M-20,300 Q10,200 -10,120 Q-30,200 -20,300" fill="#81C784" opacity="0.6"/>
    
    <!-- 莖 -->
    <path d="M0,300 Q5,250 0,200 Q-5,150 0,100" stroke="#2E7D32" stroke-width="3" fill="none"/>
  </g>
  
  <g transform="translate(1750, 650)">
    <!-- 大葉子組 -->
    <path d="M0,280 Q35,180 0,80 Q-35,180 0,280" fill="url(#leafGradient)" opacity="0.8"/>
    <path d="M25,280 Q55,160 35,60 Q15,160 25,280" fill="#4CAF50" opacity="0.7"/>
    <path d="M-25,280 Q5,190 -15,110 Q-35,190 -25,280" fill="#81C784" opacity="0.6"/>
    
    <path d="M0,280 Q-5,220 0,180 Q5,140 0,100" stroke="#2E7D32" stroke-width="3" fill="none"/>
  </g>
  
  <!-- 地面草地裝飾 -->
  <g transform="translate(0, 950)">
    <path d="M0,130 Q40,100 80,130 Q120,160 160,130 Q200,100 240,130 Q280,160 320,130 Q360,100 400,130 Q440,160 480,130 Q520,100 560,130 Q600,160 640,130 Q680,100 720,130 Q760,160 800,130 Q840,100 880,130 Q920,160 960,130 Q1000,100 1040,130 Q1080,160 1120,130 Q1160,100 1200,130 Q1240,160 1280,130 Q1320,100 1360,130 Q1400,160 1440,130 Q1480,100 1520,130 Q1560,160 1600,130 Q1640,100 1680,130 Q1720,160 1760,130 Q1800,100 1840,130 Q1880,160 1920,130" 
          stroke="#43A047" stroke-width="3" fill="none"/>
    <path d="M0,130 Q30,110 60,130 Q90,150 120,130 Q150,110 180,130 Q210,150 240,130 Q270,110 300,130" 
          stroke="#66BB6A" stroke-width="2" fill="none"/>
  </g>
  
  <!-- 蜂窩小裝飾 - 右上角 -->
  <g transform="translate(1700, 80)">
    <path d="M20,3 L39.5,11.5 L39.5,30.5 L20,39 L0.5,30.5 L0.5,11.5 Z" 
          fill="#D4A574" opacity="0.5"/>
    <path d="M45,20 L64.5,28.5 L64.5,47.5 L45,56 L25.5,47.5 L25.5,28.5 Z" 
          fill="#D4A574" opacity="0.4"/>
  </g>
  
  <!-- 小花裝飾 -->
  <g fill="#FFEB3B" opacity="0.6">
    <circle cx="500" cy="920" r="5"/>
    <circle cx="520" cy="910" r="4"/>
    <circle cx="480" cy="915" r="3"/>
    
    <circle cx="1200" cy="940" r="5"/>
    <circle cx="1225" cy="930" r="4"/>
    <circle cx="1175" cy="935" r="3"/>
    
    <circle cx="900" cy="960" r="4"/>
    <circle cx="920" cy="950" r="3"/>
  </g>
  
  <!-- 手繪風格線條裝飾 - 呼應觸覺紋理趨勢 -->
  <g stroke="#8D6E63" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M100,400 Q200,380 300,400 Q400,420 500,400"/>
    <path d="M1400,500 Q1500,480 1600,500 Q1700,520 1800,500"/>
    <path d="M600,750 Q700,730 800,750 Q900,770 1000,750"/>
  </g>
</svg>