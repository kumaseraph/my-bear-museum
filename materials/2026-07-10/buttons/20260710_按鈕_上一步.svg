<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <title>上一步按鈕</title>
  <desc>商務風上一步操作按鈕</desc>
  <defs>
    <linearGradient id="prevBtnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#9CA3AF"/>
    </linearGradient>
    <filter id="prevBtnShadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#374151" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 按鈕主體 -->
  <g transform="translate(10, 10)" filter="url(#prevBtnShadow)">
    <!-- 平行四邊形按鈕形狀 -->
    <polygon points="40,0 280,20 240,80 0,60" fill="url(#prevBtnGrad)"/>
    
    <!-- 內部斜線裝飾 -->
    <line x1="200" y1="20" x2="240" y2="40" stroke="white" stroke-width="1" opacity="0.3"/>
    <line x1="220" y1="20" x2="260" y2="40" stroke="white" stroke-width="1" opacity="0.3"/>
    <line x1="240" y1="20" x2="280" y2="40" stroke="white" stroke-width="1" opacity="0.3"/>
    
    <!-- 按鈕文字 -->
    <text x="140" y="52" text-anchor="middle" fill="white" font-size="22" font-weight="bold" font-family="Microsoft JhengHei, Arial">上一步</text>
    
    <!-- 箭頭指示 -->
    <polygon points="50,30 30,40 50,50" fill="white"/>
  </g>
  
  <!-- 強調線裝飾 -->
  <line x1="200" y1="95" x2="300" y2="95" stroke="#9CA3AF" stroke-width="3"/>
</svg>