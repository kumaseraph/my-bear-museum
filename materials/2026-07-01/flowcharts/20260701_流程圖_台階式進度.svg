<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>
  
  <!-- 背景蜂巢紋理 -->
  <pattern id="honeycomb-bg" x="0" y="0" width="78" height="86.6" patternUnits="userSpaceOnUse">
    <path d="M39,0 L78,21.65 L78,64.95 L39,86.6 L0,64.95 L0,21.65 Z" 
          fill="none" stroke="#6B5CE7" stroke-width="0.5" opacity="0.1"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#honeycomb-bg)"/>
  
  <!-- 台階式流程 -->
  <g transform="translate(200, 300)">
    <!-- 台階1 -->
    <polygon points="20,0 320,0 300,150 0,150" fill="url(#step1)" opacity="0.9"/>
    <polygon points="20,0 320,0 300,150 0,150" fill="none" stroke="#4ECDC4" stroke-width="3"/>
    <text x="160" y="85" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">01 計畫啟動</text>
    
    <!-- 台階2 -->
    <polygon points="270,180 570,180 550,330 250,330" fill="url(#step2)" opacity="0.85"/>
    <polygon points="270,180 570,180 550,330 250,330" fill="none" stroke="#A78BFA" stroke-width="3"/>
    <text x="410" y="265" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">02 分析研究</text>
    
    <!-- 台階3 -->
    <polygon points="520,360 820,360 800,510 500,510" fill="url(#step3)" opacity="0.8"/>
    <polygon points="520,360 820,360 800,510 500,510" fill="none" stroke="#22D3EE" stroke-width="3"/>
    <text x="660" y="445" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">03 執行發展</text>
    
    <!-- 台階4 -->
    <polygon points="770,540 1070,540 1050,690 750,690" fill="url(#step4)" opacity="0.75"/>
    <polygon points="770,540 1070,540 1050,690 750,690" fill="none" stroke="#FB923C" stroke-width="3"/>
    <text x="910" y="625" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">04 完成交付</text>
    
    <!-- 連接箭頭 -->
    <path d="M310,150 L330,180" stroke="#4ECDC4" stroke-width="4" fill="none"/>
    <path d="M560,330 L580,360" stroke="#A78BFA" stroke-width="4" fill="none"/>
    <path d="M810,510 L830,540" stroke="#22D3EE" stroke-width="4" fill="none"/>
  </g>
  
  <!-- 右側數據裝飾 -->
  <g transform="translate(1300, 350)">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#6B5CE7" stroke-width="2" opacity="0.3"/>
    <circle cx="100" cy="100" r="60" fill="none" stroke="#4ECDC4" stroke-width="2" opacity="0.4"/>
    <circle cx="100" cy="100" r="40" fill="#6B5CE7" opacity="0.2"/>
    <text x="100" y="105" font-family="Arial, sans-serif" font-size="24" fill="#6B5CE7" text-anchor="middle" opacity="0.6">2026</text>
  </g>
  
  <!-- 底部趨勢線裝飾 -->
  <g transform="translate(200, 850)">
    <line x1="0" y1="0" x2="400" y2="0" stroke="#6B5CE7" stroke-width="2" opacity="0.3"/>
    <line x1="0" y1="0" x2="400" y2="30" stroke="#4ECDC4" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="0" x2="400" y2="60" stroke="#A78BFA" stroke-width="2" opacity="0.3"/>
  </g>
  
  <!-- Tactile Brutalism 風格裝飾線 -->
  <line x1="0" y1="50" x2="1920" y2="50" stroke="#6B5CE7" stroke-width="1"/>
  <line x1="0" y1="1030" x2="1920" y2="1030" stroke="#6B5CE7" stroke-width="1"/>
</svg>