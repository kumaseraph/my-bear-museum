<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#0F0A1E"/>
  
  <!-- 蜂巢網格背景 -->
  <pattern id="hexGrid" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
    <path d="M30,0 L60,15 L60,45 L30,60 L0,45 L0,15 Z" fill="none" stroke="#6B5CE7" stroke-width="0.3" opacity="0.15"/>
  </pattern>
  <rect width="100%" height="100%" fill="url(#hexGrid)"/>
  
  <!-- 連接線 -->
  <g stroke="#4ECDC4" stroke-width="2" opacity="0.6">
    <!-- 主中心到各節點 -->
    <line x1="960" y1="540" x2="500" y2="300"/>
    <line x1="960" y1="540" x2="1420" y2="300"/>
    <line x1="960" y1="540" x2="300" y2="600"/>
    <line x1="960" y1="540" x2="1620" y2="600"/>
    <line x1="960" y1="540" x2="500" y2="800"/>
    <line x1="960" y1="540" x2="1420" y2="800"/>
    <!-- 衛星節點連線 -->
    <line x1="500" y1="300" x2="700" y2="200"/>
    <line x1="500" y1="300" x2="300" y2="350"/>
    <line x1="1420" y1="300" x2="1220" y2="200"/>
    <line x1="1420" y1="300" x2="1620" y2="350"/>
    <line x1="500" y1="800" x2="300" y2="750"/>
    <line x1="500" y1="800" x2="700" y2="900"/>
    <line x1="1420" y1="800" x2="1220" y2="900"/>
    <line x1="1420" y1="800" x2="1620" y2="750"/>
  </g>
  
  <!-- 虛線連接 -->
  <g stroke="#A78BFA" stroke-width="1" stroke-dasharray="5,5" opacity="0.4">
    <line x1="700" y1="200" x2="1220" y2="200"/>
    <line x1="300" y1="350" x2="300" y2="600"/>
    <line x1="1620" y1="350" x2="1620" y2="600"/>
    <line x1="300" y1="750" x2="500" y2="800"/>
    <line x1="700" y1="900" x2="1220" y2="900"/>
  </g>
  
  <!-- 中心節點 -->
  <g transform="translate(960, 540)" filter="url(#glow)">
    <polygon points="0,-70 60.6,-35 60.6,35 0,70 -60.6,35 -60.6,-35" 
             fill="url(#nodeGrad)" stroke="#4ECDC4" stroke-width="3"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">核心</text>
  </g>
  
  <!-- 第一層節點 -->
  <g filter="url(#glow)">
    <!-- 左上 -->
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" 
             fill="#6B5CE7" stroke="#A78BFA" stroke-width="2" transform="translate(500, 300)"/>
    <text x="500" y="305" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">策略</text>
    
    <!-- 右上 -->
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" 
             fill="#6B5CE7" stroke="#A78BFA" stroke-width="2" transform="translate(1420, 300)"/>
    <text x="1420" y="305" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">技術</text>
    
    <!-- 左中 -->
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" 
             fill="#4ECDC4" stroke="#22D3EE" stroke-width="2" transform="translate(300, 600)"/>
    <text x="300" y="605" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">市場</text>
    
    <!-- 右中 -->
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" 
             fill="#4ECDC4" stroke="#22D3EE" stroke-width="2" transform="translate(1620, 600)"/>
    <text x="1620" y="605" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">資源</text>
    
    <!-- 左下 -->
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" 
             fill="#F97316" stroke="#FB923C" stroke-width="2" transform="translate(500, 800)"/>
    <text x="500" y="805" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">執行</text>
    
    <!-- 右下 -->
    <polygon points="0,-50 43.3,-25 43.3,25 0,50 -43.3,25 -43.3,-25" 
             fill="#F97316" stroke="#FB923C" stroke-width="2" transform="translate(1420, 800)"/>
    <text x="1420" y="805" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">交付</text>
  </g>
  
  <!-- 第二層小節點 -->
  <g opacity="0.7">
    <circle cx="700" cy="200" r="20" fill="#A78BFA"/>
    <circle cx="300" cy="350" r="20" fill="#A78BFA"/>
    <circle cx="1220" cy="200" r="20" fill="#A78BFA"/>
    <circle cx="1620" cy="350" r="20" fill="#A78BFA"/>
    <circle cx="300" cy="750" r="20" fill="#FB923C"/>
    <circle cx="700" cy="900" r="20" fill="#FB923C"/>
    <circle cx="1220" cy="900" r="20" fill="#FB923C"/>
    <circle cx="1620" cy="750" r="20" fill="#FB923C"/>
  </g>
  
  <!-- 標題 -->
  <text x="960" y="100" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">專案組織網絡圖</text>
  
  <!-- 底部裝飾 -->
  <line x1="200" y1="950" x2="1720" y2="950" stroke="#6B5CE7" stroke-width="1" opacity="0.3"/>
  <text x="960" y="1000" font-family="Arial, sans-serif" font-size="16" fill="#A78BFA" text-anchor="middle" opacity="0.6">Interactivity &amp; Storytelling · 2026 工作報告</text>
</svg>