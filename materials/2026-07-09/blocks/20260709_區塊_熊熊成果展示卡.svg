<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF8F0"/>
      <stop offset="100%" stop-color="#E8D5C0"/>
    </linearGradient>
    <linearGradient id="hexFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#C4956A"/>
    </linearGradient>
  </defs>
  
  <!-- 卡片背景 -->
  <rect x="20" y="20" width="360" height="260" rx="15" fill="url(#cardBg)" 
        stroke="#C4956A" stroke-width="2"/>
  
  <!-- 頂部六邊形裝飾帶 -->
  <g transform="translate(200, 50)">
    <!-- 中央大六邊形 -->
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#hexFill)" stroke="#8B6914" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="14" fill="#FDF8F0" font-weight="bold">成果</text>
  </g>
  
  <!-- 左側小型六邊形裝飾 -->
  <g transform="translate(80, 50)">
    <path d="M0,-20 L17.3,-10 L17.3,10 L0,20 L-17.3,10 L-17.3,-10 Z" 
          fill="#E8C9A0" stroke="#C4956A" stroke-width="1"/>
  </g>
  
  <g transform="translate(320, 50)">
    <path d="M0,-20 L17.3,-10 L17.3,10 L0,20 L-17.3,10 L-17.3,-10 Z" 
          fill="#E8C9A0" stroke="#C4956A" stroke-width="1"/>
  </g>
  
  <!-- 主要內容區 - 三個六邊形卡片 -->
  <g transform="translate(100, 140)">
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
          fill="none" stroke="#8B6914" stroke-width="2"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
          fill="#D4A574" fill-opacity="0.3"/>
    <text x="0" y="-5" text-anchor="middle" font-size="12" fill="#5C4A1F" font-weight="bold">完成度</text>
    <text x="0" y="15" text-anchor="middle" font-size="18" fill="#8B6914" font-weight="bold">95%</text>
  </g>
  
  <g transform="translate(200, 140)">
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
          fill="none" stroke="#8B6914" stroke-width="2"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
          fill="#D4A574" fill-opacity="0.3"/>
    <text x="0" y="-5" text-anchor="middle" font-size="12" fill="#5C4A1F" font-weight="bold">品質</text>
    <text x="0" y="15" text-anchor="middle" font-size="18" fill="#8B6914" font-weight="bold">A+</text>
  </g>
  
  <g transform="translate(300, 140)">
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
          fill="none" stroke="#8B6914" stroke-width="2"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
          fill="#D4A574" fill-opacity="0.3"/>
    <text x="0" y="-5" text-anchor="middle" font-size="12" fill="#5C4A1F" font-weight="bold">效率</text>
    <text x="0" y="15" text-anchor="middle" font-size="18" fill="#8B6914" font-weight="bold">★★★★</text>
  </g>
  
  <!-- 底部標註 -->
  <text x="200" y="240" text-anchor="middle" font-size="11" fill="#A67C4E">熊熊工作報告模板</text>
  
  <!-- 底部小六邊形裝飾 -->
  <g transform="translate(200, 265)">
    <path d="M0,-12 L10.4,-6 L10.4,6 L0,12 L-10.4,6 L-10.4,-6 Z" 
          fill="#C4956A" opacity="0.6"/>
  </g>
</svg>