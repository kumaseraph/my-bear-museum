<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 風格：創意活潑｜技巧 #122 變化6（尺寸漸層）+ #120 變化1（大小對比）+ 變化9（叢集與單一） -->
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6E5"/>
      <stop offset="50%" stop-color="#FFE8D6"/>
      <stop offset="100%" stop-color="#FFD6BA"/>
    </linearGradient>
    <linearGradient id="large1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#C44569"/>
    </linearGradient>
    <linearGradient id="med1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
    <linearGradient id="small1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>

    <linearGradient id="large2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
    <linearGradient id="med2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="small2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <!-- 背景漸層 -->
  <rect width="1920" height="1080" fill="url(#warmBg)"/>

  <!-- 左上 尺寸漸層叢集 A（暖色系） -->
  <g transform="translate(360, 360)">
    <!-- 中心超大六邊形 (s=70) -->
    <path d="M0,-70 L60.62,-35 L60.62,35 L0,70 L-60.62,35 L-60.62,-35 Z"
          fill="url(#large1)"/>
    <!-- 中環 s=42（6個） -->
    <path d="M0,-42 L36.37,-21 L36.37,21 L0,42 L-36.37,21 L-36.37,-21 Z"
          fill="url(#med1)" transform="rotate(0) translate(0,-95)"/>
    <path d="M0,-42 L36.37,-21 L36.37,21 L0,42 L-36.37,21 L-36.37,-21 Z"
          fill="url(#med1)" transform="rotate(60) translate(0,-95)"/>
    <path d="M0,-42 L36.37,-21 L36.37,21 L0,42 L-36.37,21 L-36.37,-21 Z"
          fill="url(#med1)" transform="rotate(120) translate(0,-95)"/>
    <path d="M0,-42 L36.37,-21 L36.37,21 L0,42 L-36.37,21 L-36.37,-21 Z"
          fill="url(#med1)" transform="rotate(180) translate(0,-95)"/>
    <path d="M0,-42 L36.37,-21 L36.37,21 L0,42 L-36.37,21 L-36.37,-21 Z"
          fill="url(#med1)" transform="rotate(240) translate(0,-95)"/>
    <path d="M0,-42 L36.37,-21 L36.37,21 L0,42 L-36.37,21 L-36.37,-21 Z"
          fill="url(#med1)" transform="rotate(300) translate(0,-95)"/>
    <!-- 外環 s=22（12個，交錯） -->
    <path d="M0,-22 L19.05,-11 L19.05,11 L0,22 L-19.05,11 L-19.05,-11 Z"
          fill="url(#small1)"
          transform="rotate(30) translate(0,-165)"/>
    <path d="M0,-22 L19.05,-11 L19.05,11 L0,22 L-19.05,11 L-19.05,-11 Z"
          fill="url(#small1)"
          transform="rotate(60) translate(0,-165)"/>
    <path d="M0,-22 L19.05,-11 L19.05,11 L0,22 L-19.05,11 L-19.05,-11 Z"
          fill="url(#small1)"
          transform="rotate(90) translate(0,-165)"/>
    <path d="M0,-22 L19.05,-11 L19.05,11 L0,22 L-19.05,11 L-19.05,-11 Z"
          fill="url(#small1)"
          transform="rotate(120) translate(0,-165)"/>
    <path d="M0,-22 L19.05,-11 L19.05,11 L0,22 L-19.05,11 L-19.05,-11 Z"
          fill="url(#small1)"
          transform="rotate(150) translate(0,-165)"/>
    <path d="M0,-22 L19.05,-11 L19.05,11 L0,22 L-19.05,11 L-19.05,-11 Z"
          fill="url(#small1)"
          transform="rotate(180) translate(0,-165)"/>
    <path d="M0,-22 L19.05,-11 L19.05,11 L0,22 L-19.05,11 L-19.05,-11 Z"
          fill="url(#small1)"
          transform="rotate(210) translate(0,-165)"/>
    <path d="M0,-22 L19.05,-11 L19.05,11 L0,22 L-19.05,11 L-19.05,-11 Z"
          fill="url(#small1)"
          transform="rotate(240) translate(0,-165)"/>
    <path d="M0,-22 L19.05,-11 L19.05,11 L0,22 L-19.05,11 L-19.05,-11 Z"
          fill="url(#small1)"
          transform="rotate(270) translate(0,-165)"/>
    <path d="M0,-22 L19.05,-11 L19.05,11 L0,22 L-19.05,11 L-19.05,-11 Z"
          fill="url(#small1)"
          transform="rotate(300) translate(0,-165)"/>
    <path d="M0,-22 L19.05,-11 L19.05,11 L0,22 L-19.05,11 L-19.05,-11 Z"
          fill="url(#small1)"
          transform="rotate(330) translate(0,-165)"/>
    <path d="M0,-22 L19.05,-11 L19.05,11 L0,22 L-19.05,11 L-19.05,-11 Z"
          fill="url(#small1)"
          transform="rotate(0) translate(0,-165)"/>
  </g>

  <!-- 右下 尺寸漸層叢集 B（紫色系） -->
  <g transform="translate(1500, 720)">
    <!-- 中心超大六邊形 -->
    <path d="M0,-85 L73.61,-42.5 L73.61,42.5 L0,85 L-73.61,42.5 L-73.61,-42.5 Z"
          fill="url(#large2)"/>
    <!-- 中環 -->
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="url(#med2)" transform="rotate(0) translate(0,-115)"/>
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="url(#med2)" transform="rotate(60) translate(0,-115)"/>
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="url(#med2)" transform="rotate(120) translate(0,-115)"/>
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="url(#med2)" transform="rotate(180) translate(0,-115)"/>
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="url(#med2)" transform="rotate(240) translate(0,-115)"/>
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="url(#med2)" transform="rotate(300) translate(0,-115)"/>
    <!-- 外環 -->
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="url(#small2)"
          transform="rotate(30) translate(0,-195)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="url(#small2)"
          transform="rotate(60) translate(0,-195)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="url(#small2)"
          transform="rotate(90) translate(0,-195)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="url(#small2)"
          transform="rotate(120) translate(0,-195)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="url(#small2)"
          transform="rotate(150) translate(0,-195)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="url(#small2)"
          transform="rotate(180) translate(0,-195)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="url(#small2)"
          transform="rotate(210) translate(0,-195)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="url(#small2)"
          transform="rotate(240) translate(0,-195)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="url(#small2)"
          transform="rotate(270) translate(0,-195)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="url(#small2)"
          transform="rotate(300) translate(0,-195)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="url(#small2)"
          transform="rotate(330) translate(0,-195)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="url(#small2)"
          transform="rotate(0) translate(0,-195)"/>
  </g>

  <!-- 中央留白焦點區（供文字覆蓋） -->
  <rect x="700" y="400" width="520" height="280" fill="#FFFFFF" fill-opacity="0.55" rx="24"/>

  <!-- 散落小六邊形（散景點綴） -->
  <g opacity="0.4">
    <path d="M0,-12 L10.39,-6 L10.39,6 L0,12 L-10.39,6 L-10.39,-6 Z"
          fill="#FF6B6B" transform="translate(800, 150)"/>
    <path d="M0,-10 L8.66,-5 L8.66,5 L0,10 L-8.66,5 L-8.66,-5 Z"
          fill="#9B59B6" transform="translate(1050, 200)"/>
    <path d="M0,-14 L12.12,-7 L12.12,7 L0,14 L-12.12,7 L-12.12,-7 Z"
          fill="#FFD93D" transform="translate(1280, 800)"/>
    <path d="M0,-11 L9.53,-5.5 L9.53,5.5 L0,11 L-9.53,5.5 L-9.53,-5.5 Z"
          fill="#4ECDC4" transform="translate(450, 880)"/>
    <path d="M0,-9 L7.79,-4.5 L7.79,4.5 L0,9 L-7.79,4.5 L-7.79,-4.5 Z"
          fill="#FF8C00" transform="translate(1700, 950)"/>
  </g>
</svg>
