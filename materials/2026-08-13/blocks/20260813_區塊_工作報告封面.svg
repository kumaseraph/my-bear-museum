<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <!-- 熊熊風格工作報告封面區塊 - 融合 tactile warmth, 認知負荷管控, 蜂巢叢集 -->
  <defs>
    <linearGradient id="warmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E3"/>
      <stop offset="100%" stop-color="#F5E6C8"/>
    </linearGradient>
    <linearGradient id="bearGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="50%" stop-color="#B8895A"/>
      <stop offset="100%" stop-color="#8B6239"/>
    </linearGradient>
    <pattern id="honeycombPattern" x="0" y="0" width="78" height="86.6" patternUnits="userSpaceOnUse">
      <path d="M39,0 L78,21.65 L78,64.95 L39,86.6 L0,64.95 L0,21.65 Z"
            fill="none" stroke="#B8895A" stroke-width="0.8" opacity="0.18"/>
    </pattern>
    <filter id="paperTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" result="noise"/>
      <feColorMatrix in="noise" values="0 0 0 0 0.55  0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0.04 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- 背景層：溫暖紙感底色 + 蜂巢襯底 -->
  <rect width="800" height="450" fill="url(#warmBg)"/>
  <rect width="800" height="450" fill="url(#honeycombPattern)"/>
  <rect width="800" height="450" filter="url(#paperTexture)" opacity="0.6"/>

  <!-- 主區塊：左上六邊形叢集（2.5D 焦點） -->
  <g transform="translate(150, 180)">
    <!-- 外粗空心大六邊形 (s=70) -->
    <path d="M70,5 L130.6,40 L130.6,110 L70,145 L9.4,110 L9.4,40 Z"
          fill="none" stroke="#8B6239" stroke-width="5"/>
    <!-- 內實心小六邊形 (s=35) -->
    <path d="M35,3 L65.3,19.5 L65.3,52.5 L35,73 L4.7,52.5 L4.7,19.5 Z"
          fill="url(#bearGold)"/>
    <!-- 內部迷你六邊形裝飾 -->
    <path d="M18,1 L33,9 L33,25 L18,35 L3,25 L3,9 Z"
          fill="#FDF6E3" opacity="0.85"/>
  </g>

  <!-- 右側：放射叢集 - 認知負荷管控示意 -->
  <g transform="translate(560, 225)">
    <!-- 中心圓 -->
    <circle r="28" fill="#8B6239"/>
    <!-- 環繞 6 個小六邊形 -->
    <g>
      <path d="M22,3 L41,13 L41,33 L22,43 L3,33 L3,13 Z" fill="#D4A574" transform="rotate(0) translate(0,-65)"/>
      <path d="M22,3 L41,13 L41,33 L22,43 L3,33 L3,13 Z" fill="#D4A574" transform="rotate(60) translate(0,-65)"/>
      <path d="M22,3 L41,13 L41,33 L22,43 L3,33 L3,13 Z" fill="#D4A574" transform="rotate(120) translate(0,-65)"/>
      <path d="M22,3 L41,13 L41,33 L22,43 L3,33 L3,13 Z" fill="#D4A574" transform="rotate(180) translate(0,-65)"/>
      <path d="M22,3 L41,13 L41,33 L22,43 L3,33 L3,13 Z" fill="#D4A574" transform="rotate(240) translate(0,-65)"/>
      <path d="M22,3 L41,13 L41,33 L22,43 L3,33 L3,13 Z" fill="#D4A574" transform="rotate(300) translate(0,-65)"/>
    </g>
  </g>

  <!-- 標題區塊：手繪感裝飾條 -->
  <g transform="translate(280, 195)">
    <rect x="0" y="0" width="260" height="3" fill="url(#bearGold)" rx="1.5"/>
    <rect x="0" y="10" width="180" height="2" fill="#B8895A" opacity="0.6" rx="1"/>
  </g>

  <!-- 主標題（人類痕跡 - 不完美手繪感字體） -->
  <text x="280" y="240" font-family="Georgia, serif" font-size="42" font-weight="bold" fill="#5C3A1E">
    工作報告
  </text>
  <text x="280" y="280" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#8B6239">
    Work Report — 2026.08
  </text>

  <!-- 副標題裝飾 -->
  <g transform="translate(280, 305)">
    <circle cx="6" cy="6" r="4" fill="#D4A574"/>
    <rect x="18" y="4" width="120" height="4" fill="#D4A574" rx="2"/>
    <circle cx="148" cy="6" r="4" fill="#B8895A"/>
  </g>

  <!-- 底部裝飾：蜂巢碎片 -->
  <g transform="translate(40, 380)" opacity="0.4">
    <path d="M18,2 L33,10 L33,26 L18,34 L3,26 L3,10 Z" fill="none" stroke="#8B6239" stroke-width="1.2"/>
    <path d="M18,2 L33,10 L33,26 L18,34 L3,26 L3,10 Z" fill="none" stroke="#8B6239" stroke-width="1.2" transform="translate(40,15)"/>
    <path d="M18,2 L33,10 L33,26 L18,34 L3,26 L3,10 Z" fill="#D4A574" transform="translate(80,5)"/>
  </g>

  <!-- 右下角裝飾：觸覺紋理塊 -->
  <g transform="translate(680, 360)">
    <rect x="0" y="0" width="80" height="50" fill="#FDF6E3" stroke="#B8895A" stroke-width="1.5" rx="4"/>
    <rect x="6" y="6" width="68" height="3" fill="#B8895A" opacity="0.5" rx="1"/>
    <rect x="6" y="14" width="50" height="3" fill="#B8895A" opacity="0.4" rx="1"/>
    <rect x="6" y="22" width="60" height="3" fill="#B8895A" opacity="0.3" rx="1"/>
    <circle cx="70" cy="38" r="3" fill="#8B6239"/>
  </g>

  <!-- 標籤：熊熊風格印章 -->
  <g transform="translate(620, 60)">
    <rect x="0" y="0" width="140" height="28" fill="#8B6239" rx="14"/>
    <text x="70" y="18" font-family="Georgia, serif" font-size="13" fill="#FDF6E3" text-anchor="middle" font-weight="bold">
      🐻 BEAR REPORT
    </text>
  </g>
</svg>