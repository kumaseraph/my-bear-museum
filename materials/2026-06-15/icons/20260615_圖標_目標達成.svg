<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- 目標達成圖標 -->
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8A87C"/>
      <stop offset="100%" style="stop-color:#F5D7B6"/>
    </linearGradient>
  </defs>
  <circle cx="40" cy="40" r="36" fill="#FFF5EB" stroke="#E8A87C" stroke-width="2"/>
  <!-- 靶心 -->
  <circle cx="40" cy="40" r="22" fill="none" stroke="#C68B59" stroke-width="2"/>
  <circle cx="40" cy="40" r="14" fill="none" stroke="#C68B59" stroke-width="2"/>
  <circle cx="40" cy="40" r="6" fill="#C68B59"/>
  <!-- 箭 -->
  <line x1="58" y1="22" x2="42" y2="38" stroke="#C68B59" stroke-width="3" stroke-linecap="round"/>
  <polygon points="40,40 58,22 52,26 54,34" fill="#E8A87C"/>
  <!-- 對勾 -->
  <circle cx="62" cy="58" r="10" fill="#E8A87C"/>
  <polyline points="57,58 60,61 66,55" fill="none" stroke="#FFF5EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>