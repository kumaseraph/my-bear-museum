<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>蜂巢叢集背景</title>
  <desc>採用蜂巢叢集技巧的背景設計，融合大小對比與交錯排列</desc>
  <defs>
    <!-- 漸層定義 -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6B5CE7" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5CE7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4ECDC4" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="bgGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.4"/>
    </linearGradient>
    <!-- 蜂巢圖案 -->
    <pattern id="hexPattern" patternUnits="userSpaceOnUse" width="120" height="208" patternTransform="scale(0.5)">
      <path d="M60,0 L120,35 L120,105 L60,140 L0,105 L0,35 Z" fill="none" stroke="#A78BFA" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>
  
  <!-- 背景底色 -->
  <rect width="1920" height="1080" fill="#0F0A1F"/>
  
  <!-- 蜂巢圖案疊加 -->
  <rect width="1920" height="1080" fill="url(#hexPattern)" opacity="0.5"/>
  
  <!-- 蜂巢叢集 - 左上區域 -->
  <g transform="translate(100,100)">
    <!-- 大六邊形 (s=80) -->
    <path d="M80,0 L160,46 L160,138 L80,184 L0,138 L0,46 Z" 
          fill="url(#bgGrad1)"/>
    <!-- 叢集小六邊形 -->
    <g transform="translate(100,60)">
      <path d="M40,0 L80,23 L80,69 L40,92 L0,69 L0,23 Z" 
            fill="url(#bgGrad2)" fill-opacity="0.8"/>
    </g>
    <g transform="translate(40,130)">
      <path d="M40,0 L80,23 L80,69 L40,92 L0,69 L0,23 Z" 
            fill="url(#bgGrad2)" fill-opacity="0.6"/>
    </g>
  </g>
  
  <!-- 蜂巢叢集 - 右上區域 -->
  <g transform="translate(1500,80)">
    <!-- 旋轉30度的六邊形 -->
    <g transform="rotate(30,80,80)">
      <path d="M80,0 L160,46 L160,138 L80,184 L0,138 L0,46 Z" 
            fill="url(#bgGrad3)" fill-opacity="0.7"/>
    </g>
    <!-- 交錯排列的小六邊形 -->
    <g transform="translate(60,100)">
      <path d="M40,0 L80,23 L80,69 L40,92 L0,69 L0,23 Z" 
            fill="none" stroke="#4ECDC4" stroke-width="2"/>
    </g>
    <g transform="translate(140,160)">
      <path d="M40,0 L80,23 L80,69 L40,92 L0,69 L0,23 Z" 
            fill="#4ECDC4" fill-opacity="0.3"/>
    </g>
  </g>
  
  <!-- 蜂巢叢集 - 中央區域（主要視覺焦點） -->
  <g transform="translate(800,400)">
    <!-- 超大六邊形 (s=120) -->
    <path d="M120,0 L240,69 L240,207 L120,276 L0,207 L0,69 Z" 
          fill="url(#bgGrad1)" fill-opacity="0.95"/>
    <!-- 內部裝飾六邊形 -->
    <g transform="translate(60,69)">
      <path d="M60,0 L120,35 L120,105 L60,140 L0,105 L0,35 Z" 
            fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.4"/>
    </g>
    <!-- 叢集裝飾 -->
    <g transform="translate(-80,180)">
      <path d="M50,0 L100,29 L100,87 L50,116 L0,87 L0,29 Z" 
            fill="url(#bgGrad2)" fill-opacity="0.6"/>
    </g>
    <g transform="translate(180,180)">
      <path d="M50,0 L100,29 L100,87 L50,116 L0,87 L0,29 Z" 
            fill="url(#bgGrad2)" fill-opacity="0.6"/>
    </g>
    <g transform="translate(50,280)">
      <path d="M40,0 L80,23 L80,69 L40,92 L0,69 L0,23 Z" 
            fill="#4ECDC4" fill-opacity="0.4"/>
    </g>
    <g transform="translate(150,280)">
      <path d="M40,0 L80,23 L80,69 L40,92 L0,69 L0,23 Z" 
            fill="#4ECDC4" fill-opacity="0.4"/>
    </g>
  </g>
  
  <!-- 蜂巢叢集 - 左下區域 -->
  <g transform="translate(200,750)">
    <!-- 2.5D效果：外粗空心 -->
    <path d="M70,0 L140,40 L140,120 L70,160 L0,120 L0,40 Z" 
          fill="none" stroke="#A78BFA" stroke-width="6"/>
    <!-- 內實心半透明 -->
    <path d="M70,0 L140,40 L140,120 L70,160 L0,120 L0,40 Z" 
          fill="#6B5CE7" fill-opacity="0.3"/>
    <!-- 小六邊形叢集 -->
    <g transform="translate(90,90)">
      <path d="M35,0 L70,20 L70,60 L35,80 L0,60 L0,20 Z" 
            fill="#A78BFA" fill-opacity="0.5"/>
    </g>
    <g transform="translate(30,140)">
      <path d="M35,0 L70,20 L70,60 L35,80 L0,60 L0,20 Z" 
            fill="none" stroke="#4ECDC4" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- 蜂巢叢集 - 右下區域 -->
  <g transform="translate(1400,800)">
    <!-- 實心大六邊形 -->
    <path d="M80,0 L160,46 L160,138 L80,184 L0,138 L0,46 Z" 
          fill="url(#bgGrad3)" fill-opacity="0.8"/>
    <!-- 半透明覆蓋 -->
    <path d="M80,0 L160,46 L160,138 L80,184 L0,138 L0,46 Z" 
          fill="#FFFFFF" fill-opacity="0.1"/>
    <!-- 虛實對比 -->
    <g transform="translate(80,69)">
      <path d="M50,0 L100,29 L100,87 L50,116 L0,87 L0,29 Z" 
            fill="none" stroke="#FFFFFF" stroke-width="2"/>
    </g>
  </g>
  
  <!-- 動態對比元素 - 脈衝圓形裝飾 -->
  <g opacity="0.3">
    <circle cx="200" cy="500" r="80" fill="none" stroke="#4ECDC4" stroke-width="1"/>
    <circle cx="200" cy="500" r="100" fill="none" stroke="#4ECDC4" stroke-width="0.5"/>
    <circle cx="1700" cy="400" r="60" fill="none" stroke="#A78BFA" stroke-width="1"/>
    <circle cx="1700" cy="400" r="80" fill="none" stroke="#A78BFA" stroke-width="0.5"/>
  </g>
</svg>