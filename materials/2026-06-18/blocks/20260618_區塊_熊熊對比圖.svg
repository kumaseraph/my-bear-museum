<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160">
  <defs>
    <linearGradient id="leftBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8D5C4"/>
      <stop offset="100%" style="stop-color:#F5EBE0"/>
    </linearGradient>
    <linearGradient id="rightBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="100%" style="stop-color:#C9956A"/>
    </linearGradient>
  </defs>
  <!-- Left card (Before) -->
  <rect x="10" y="20" width="180" height="120" rx="12" fill="url(#leftBg)"/>
  <text x="100" y="55" font-family="Arial, sans-serif" font-size="14" fill="#8B7355" text-anchor="middle">上季度</text>
  <text x="100" y="95" font-family="Arial, sans-serif" font-size="32" fill="#5D4E37" text-anchor="middle" font-weight="bold">65%</text>
  <!-- Left bear mini icon -->
  <circle cx="45" cy="45" r="10" fill="#D4A574" opacity="0.5"/>
  <circle cx="42" cy="42" r="3" fill="#5D4E37"/>
  <circle cx="48" cy="42" r="3" fill="#5D4E37"/>
  <ellipse cx="45" cy="47" rx="2" ry="1.5" fill="#5D4E37"/>

  <!-- Arrow -->
  <polygon points="200,80 220,65 220,75 240,75 240,85 220,85 220,95" fill="#8B6914"/>

  <!-- Right card (After) -->
  <rect x="210" y="20" width="180" height="120" rx="12" fill="url(#rightBg)"/>
  <text x="300" y="55" font-family="Arial, sans-serif" font-size="14" fill="#FFF8F0" text-anchor="middle">本季度</text>
  <text x="300" y="95" font-family="Arial, sans-serif" font-size="32" fill="#FFFFFF" text-anchor="middle" font-weight="bold">92%</text>
  <!-- Right bear mini icon -->
  <circle cx="245" cy="45" r="10" fill="#FFE8D6" opacity="0.6"/>
  <circle cx="242" cy="42" r="3" fill="#5D4E37"/>
  <circle cx="248" cy="42" r="3" fill="#5D4E37"/>
  <ellipse cx="245" cy="47" rx="2" ry="1.5" fill="#5D4E37"/>

  <!-- Celebratory paw prints -->
  <circle cx="370" cy="130" r="4" fill="#FFE8D6" opacity="0.4"/>
  <circle cx="365" cy="125" r="2" fill="#FFE8D6" opacity="0.4"/>
  <circle cx="375" cy="125" r="2" fill="#FFE8D6" opacity="0.4"/>
</svg>