<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>工作流程五步驟</title>
  <desc>企業工作報告流程圖，採用階梯排列設計</desc>
  <defs>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#1E3A8A" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景線條裝飾 -->
  <line x1="200" y1="540" x2="1720" y2="540" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="8,4"/>
  
  <!-- 步驟1：規劃 -->
  <g transform="translate(200, 320)" filter="url(#shadow)">
    <polygon points="20,0 220,0 200,80 0,80" fill="url(#stepGrad1)"/>
    <polygon points="20,0 220,0 200,80 0,80" fill="url(#stepGrad1)" fill-opacity="0.1"/>
    <text x="110" y="50" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="Microsoft JhengHei, Arial">1 規劃</text>
    <circle cx="110" cy="-15" r="20" fill="#F59E0B"/>
    <text x="110" y="-8" text-anchor="middle" fill="white" font-size="18" font-weight="bold">01</text>
  </g>
  
  <!-- 連接線1 -->
  <line x1="400" y1="360" x2="500" y2="360" stroke="#F59E0B" stroke-width="3"/>
  <polygon points="500,355 520,360 500,365" fill="#F59E0B"/>
  
  <!-- 步驟2：執行 -->
  <g transform="translate(520, 420)" filter="url(#shadow)">
    <polygon points="20,0 220,0 200,80 0,80" fill="url(#stepGrad2)"/>
    <text x="110" y="50" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="Microsoft JhengHei, Arial">2 執行</text>
    <circle cx="110" cy="-15" r="20" fill="#F59E0B"/>
    <text x="110" y="-8" text-anchor="middle" fill="white" font-size="18" font-weight="bold">02</text>
  </g>
  
  <!-- 連接線2 -->
  <line x1="720" y1="460" x2="820" y2="460" stroke="#F59E0B" stroke-width="3"/>
  <polygon points="820,455 840,460 820,465" fill="#F59E0B"/>
  
  <!-- 步驟3：檢核 -->
  <g transform="translate(840, 520)" filter="url(#shadow)">
    <polygon points="20,0 220,0 200,80 0,80" fill="url(#stepGrad1)"/>
    <text x="110" y="50" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="Microsoft JhengHei, Arial">3 檢核</text>
    <circle cx="110" cy="-15" r="20" fill="#F59E0B"/>
    <text x="110" y="-8" text-anchor="middle" fill="white" font-size="18" font-weight="bold">03</text>
  </g>
  
  <!-- 連接線3 -->
  <line x1="1040" y1="560" x2="1140" y2="560" stroke="#F59E0B" stroke-width="3"/>
  <polygon points="1140,555 1160,560 1140,565" fill="#F59E0B"/>
  
  <!-- 步驟4：改善 -->
  <g transform="translate(1160, 420)" filter="url(#shadow)">
    <polygon points="20,0 220,0 200,80 0,80" fill="url(#stepGrad2)"/>
    <text x="110" y="50" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="Microsoft JhengHei, Arial">4 改善</text>
    <circle cx="110" cy="-15" r="20" fill="#F59E0B"/>
    <text x="110" y="-8" text-anchor="middle" fill="white" font-size="18" font-weight="bold">04</text>
  </g>
  
  <!-- 連接線4 -->
  <line x1="1360" y1="460" x2="1460" y2="460" stroke="#F59E0B" stroke-width="3"/>
  <polygon points="1460,455 1480,460 1460,465" fill="#F59E0B"/>
  
  <!-- 步驟5：完成 -->
  <g transform="translate(1480, 320)" filter="url(#shadow)">
    <polygon points="20,0 220,0 200,80 0,80" fill="url(#stepGrad3)"/>
    <text x="110" y="50" text-anchor="middle" fill="white" font-size="28" font-weight="bold" font-family="Microsoft JhengHei, Arial">5 完成</text>
    <circle cx="110" cy="-15" r="20" fill="#F59E0B"/>
    <text x="110" y="-8" text-anchor="middle" fill="white" font-size="18" font-weight="bold">05</text>
  </g>
  
  <!-- 回饋箭頭（虛線） -->
  <path d="M 1500 420 Q 1600 380 1580 280" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,3" fill="none"/>
  <text x="1620" y="340" fill="#F59E0B" font-size="14" font-family="Microsoft JhengHei">回饋</text>
</svg>