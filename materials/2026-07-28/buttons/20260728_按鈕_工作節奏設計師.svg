<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="btnBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="btnCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="btnOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="btnGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="btnDiag" patternUnits="userSpaceOnUse" width="10" height="10">
      <line x1="0" y1="10" x2="10" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- 標題 -->
  <text x="120" y="100" font-family="Microsoft JhengHei, sans-serif" font-size="44" font-weight="700" fill="#1E293B">工作報告｜行動按鈕組</text>
  <text x="120" y="148" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#64748B">平行四邊形引導 × 條紋疊加 × 雙重交叉線 — 簡潔現代按鈕系統</text>

  <!-- 主按鈕：進入會議 -->
  <g transform="translate(200, 260)">
    <polygon points="20,0 360,0 340,80 0,80" fill="url(#btnBlue)"/>
    <polygon points="20,0 360,0 340,80 0,80" fill="url(#btnDiag)"/>
    <polygon points="20,0 360,0 340,80 0,80" fill="none" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round"/>
    <text x="180" y="50" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">▸ 進入會議簡報</text>
  </g>

  <!-- 次按鈕：下載報告 -->
  <g transform="translate(640, 260)">
    <polygon points="20,0 360,0 340,80 0,80" fill="url(#btnCyan)"/>
    <polygon points="20,0 360,0 340,80 0,80" fill="url(#btnDiag)"/>
    <polygon points="20,0 360,0 340,80 0,80" fill="none" stroke="#155E75" stroke-width="3"/>
    <text x="180" y="50" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">⬇ 下載本期報告</text>
  </g>

  <!-- 警示按鈕：風險提示 -->
  <g transform="translate(1080, 260)">
    <polygon points="20,0 360,0 340,80 0,80" fill="url(#btnOrange)"/>
    <polygon points="20,0 360,0 340,80 0,80" fill="url(#btnDiag)"/>
    <polygon points="20,0 360,0 340,80 0,80" fill="none" stroke="#9A3412" stroke-width="3"/>
    <text x="180" y="50" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">⚠ 風險提醒</text>
  </g>

  <!-- 完成按鈕：送出工作 -->
  <g transform="translate(200, 480)">
    <polygon points="20,0 360,0 340,80 0,80" fill="url(#btnGreen)"/>
    <polygon points="20,0 360,0 340,80 0,80" fill="url(#btnDiag)"/>
    <polygon points="20,0 360,0 340,80 0,80" fill="none" stroke="#065F46" stroke-width="3"/>
    <text x="180" y="50" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">✓ 提交工作回報</text>
  </g>

  <!-- 描邊型按鈕：瀏覽歷史 -->
  <g transform="translate(640, 480)">
    <polygon points="20,0 360,0 340,80 0,80" fill="#FFFFFF" stroke="#3B82F6" stroke-width="3"/>
    <polygon points="20,0 360,0 340,80 0,80" fill="url(#btnDiag)" opacity="0.3"/>
    <text x="180" y="50" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" fill="#1E40AF">↻ 瀏覽歷史回報</text>
  </g>

  <!-- 雙重交叉按鈕：上下一頁 -->
  <g transform="translate(200, 700)">
    <polygon points="20,0 180,0 160,80 0,80" fill="url(#btnBlue)"/>
    <polygon points="20,0 180,0 160,80 0,80" fill="url(#btnDiag)"/>
    <polygon points="20,0 180,0 160,80 0,80" fill="none" stroke="#1E3A8A" stroke-width="3"/>
    <text x="90" y="50" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">◂ 上一頁</text>
  </g>
  <g transform="translate(1080, 700)">
    <polygon points="20,0 180,0 160,80 0,80" fill="url(#btnBlue)"/>
    <polygon points="20,0 180,0 160,80 0,80" fill="url(#btnDiag)"/>
    <polygon points="20,0 180,0 160,80 0,80" fill="none" stroke="#1E3A8A" stroke-width="3"/>
    <text x="90" y="50" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">下一頁 ▸</text>
  </g>

  <!-- 透視線指示：跨頁引導 -->
  <line x1="390" y1="740" x2="1100" y2="740" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
  <text x="745" y="730" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#94A3B8">— 引導線：閱讀路徑 —</text>

  <!-- 圖示區塊：互動標籤 -->
  <g transform="translate(640, 880)">
    <rect x="0" y="0" width="640" height="60" rx="30" fill="#F1F5F9" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="50" cy="30" r="15" fill="url(#btnBlue)"/>
    <text x="50" y="36" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">i</text>
    <text x="80" y="36" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#1E293B">點擊按鈕執行對應的工作節奏動作</text>
  </g>

  <text x="120" y="1040" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#94A3B8">技巧 #124 平行四邊形按鈕 × 條紋疊加 × 雙重交叉線</text>
  <text x="1800" y="1040" text-anchor="end" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#94A3B8">2026-07-28 熊熊生成</text>
</svg>
