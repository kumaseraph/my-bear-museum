<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 熊熊工作報告 - 蜂巢角飾全框邊框 (蜂巢角飾 + grain) -->
  <defs>
    <!-- 印刷感 grain -->
    <filter id="borderGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="33"/>
      <feColorMatrix values="0 0 0 0 0.55
                             0 0 0 0 0.27
                             0 0 0 0 0.07
                             0 0 0 0.04 0"/>
    </filter>

    <!-- 蜂巢 pattern -->
    <pattern id="borderHoneycomb" x="0" y="0" width="42" height="46" patternUnits="userSpaceOnUse">
      <path d="M21,0 L42,11.5 L42,34.5 L21,46 L0,34.5 L0,11.5 Z"
            fill="none" stroke="#8B4513" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- 透明背景（邊框本身不填色） -->
  <rect width="1920" height="1080" fill="none"/>

  <!-- 四角蜂巢角飾（虛實對比 + 大小對比） -->
  <!-- 左上角 -->
  <g transform="translate(80, 80)">
    <!-- 主蜂巢（大，實心） -->
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="#8B4513"/>
    <!-- 內層（空心） -->
    <path d="M0,-38 L32.9,-19 L32.9,19 L0,38 L-32.9,19 L-32.9,-19 Z"
          fill="none" stroke="#FFF8DC" stroke-width="2"/>
    <!-- 裝飾小蜂巢（向外延伸） -->
    <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
          fill="none" stroke="#8B4513" stroke-width="2"
          transform="translate(58, 30)"/>
    <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
          fill="#B8860B"
          transform="translate(58, -30)"/>
    <path d="M0,-16 L13.8,-8 L13.8,8 L0,16 L-13.8,8 L-13.8,-8 Z"
          fill="none" stroke="#8B4513" stroke-width="1.5"
          transform="translate(35, 65)"/>
  </g>

  <!-- 右上角 -->
  <g transform="translate(1840, 80)">
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="#8B4513"/>
    <path d="M0,-38 L32.9,-19 L32.9,19 L0,38 L-32.9,19 L-32.9,-19 Z"
          fill="none" stroke="#FFF8DC" stroke-width="2"/>
    <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
          fill="none" stroke="#8B4513" stroke-width="2"
          transform="translate(-58, 30)"/>
    <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
          fill="#B8860B"
          transform="translate(-58, -30)"/>
    <path d="M0,-16 L13.8,-8 L13.8,8 L0,16 L-13.8,8 L-13.8,-8 Z"
          fill="none" stroke="#8B4513" stroke-width="1.5"
          transform="translate(-35, 65)"/>
  </g>

  <!-- 左下角 -->
  <g transform="translate(80, 1000)">
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="#8B4513"/>
    <path d="M0,-38 L32.9,-19 L32.9,19 L0,38 L-32.9,19 L-32.9,-19 Z"
          fill="none" stroke="#FFF8DC" stroke-width="2"/>
    <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
          fill="none" stroke="#8B4513" stroke-width="2"
          transform="translate(58, -30)"/>
    <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
          fill="#B8860B"
          transform="translate(58, 30)"/>
    <path d="M0,-16 L13.8,-8 L13.8,8 L0,16 L-13.8,8 L-13.8,-8 Z"
          fill="none" stroke="#8B4513" stroke-width="1.5"
          transform="translate(35, -65)"/>
  </g>

  <!-- 右下角 -->
  <g transform="translate(1840, 1000)">
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="#8B4513"/>
    <path d="M0,-38 L32.9,-19 L32.9,19 L0,38 L-32.9,19 L-32.9,-19 Z"
          fill="none" stroke="#FFF8DC" stroke-width="2"/>
    <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
          fill="none" stroke="#8B4513" stroke-width="2"
          transform="translate(-58, -30)"/>
    <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
          fill="#B8860B"
          transform="translate(-58, 30)"/>
    <path d="M0,-16 L13.8,-8 L13.8,8 L0,16 L-13.8,8 L-13.8,-8 Z"
          fill="none" stroke="#8B4513" stroke-width="1.5"
          transform="translate(-35, -65)"/>
  </g>

  <!-- 上邊框裝飾線（蜂巢 pattern + 中心大蜂巢） -->
  <g opacity="0.6">
    <line x1="180" y1="50" x2="900" y2="50" stroke="#8B4513" stroke-width="1.5"/>
    <line x1="1020" y1="50" x2="1740" y2="50" stroke="#8B4513" stroke-width="1.5"/>
    <!-- 中心裝飾蜂巢 -->
    <g transform="translate(960, 50)">
      <path d="M0,-26 L22.5,-13 L22.5,13 L0,26 L-22.5,13 L-22.5,-13 Z"
            fill="none" stroke="#8B4513" stroke-width="2"/>
      <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
            fill="#8B4513"/>
    </g>
  </g>

  <!-- 下邊框裝飾線 -->
  <g opacity="0.6">
    <line x1="180" y1="1030" x2="900" y2="1030" stroke="#8B4513" stroke-width="1.5"/>
    <line x1="1020" y1="1030" x2="1740" y2="1030" stroke="#8B4513" stroke-width="1.5"/>
    <g transform="translate(960, 1030)">
      <path d="M0,-26 L22.5,-13 L22.5,13 L0,26 L-22.5,13 L-22.5,-13 Z"
            fill="none" stroke="#8B4513" stroke-width="2"/>
      <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
            fill="#8B4513"/>
    </g>
  </g>

  <!-- 左邊框裝飾線 -->
  <g opacity="0.6">
    <line x1="50" y1="180" x2="50" y2="480" stroke="#8B4513" stroke-width="1.5"/>
    <line x1="50" y1="600" x2="50" y2="900" stroke="#8B4513" stroke-width="1.5"/>
    <g transform="translate(50, 540)">
      <path d="M0,-26 L22.5,-13 L22.5,13 L0,26 L-22.5,13 L-22.5,-13 Z"
            fill="none" stroke="#8B4513" stroke-width="2"/>
      <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
            fill="#8B4513"/>
    </g>
  </g>

  <!-- 右邊框裝飾線 -->
  <g opacity="0.6">
    <line x1="1870" y1="180" x2="1870" y2="480" stroke="#8B4513" stroke-width="1.5"/>
    <line x1="1870" y1="600" x2="1870" y2="900" stroke="#8B4513" stroke-width="1.5"/>
    <g transform="translate(1870, 540)">
      <path d="M0,-26 L22.5,-13 L22.5,13 L0,26 L-22.5,13 L-22.5,-13 Z"
            fill="none" stroke="#8B4513" stroke-width="2"/>
      <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
            fill="#8B4513"/>
    </g>
  </g>

  <!-- 印刷感 grain 覆蓋（Illustrated Worlds） -->
  <rect width="1920" height="1080" filter="url(#borderGrain)" opacity="0.5"/>
</svg>