<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>成長潛力</title>
  <desc>工作報告圖標 - 六邊形與星形組合，代表發展潛力與上升趨勢</desc>
  <!-- 背景六邊形（半透明） -->
  <path d="M50,5 L90,27.5 L90,72.5 L50,95 L10,72.5 L10,27.5 Z" 
        fill="#6B5CE7" fill-opacity="0.15"/>
  <!-- 內嵌六邊形 -->
  <path d="M50,18 L78,36 L78,64 L50,82 L22,64 L22,36 Z" 
        fill="none" stroke="#6B5CE7" stroke-width="2"/>
  <!-- 旋轉五角星（實心） -->
  <polygon points="50,25 56,42 74,42 60,52 66,70 50,60 34,70 40,52 26,42 44,42" 
           fill="#FF8C00" transform="rotate(18, 50, 50)"/>
  <!-- 外圈裝飾線 -->
  <path d="M50,5 L90,27.5 L90,72.5 L50,95 L10,72.5 L10,27.5 Z" 
        fill="none" stroke="#4ECDC4" stroke-width="1.5" stroke-dasharray="8,4"/>
  <!-- 頂部光芒裝飾 -->
  <circle cx="50" cy="8" r="4" fill="#FF8C00"/>
  <line x1="50" y1="5" x2="50" y2="15" stroke="#FF8C00" stroke-width="2"/>
  <line x1="40" y1="10" x2="45" y2="13" stroke="#FF8C00" stroke-width="1.5"/>
  <line x1="60" y1="10" x2="55" y2="13" stroke="#FF8C00" stroke-width="1.5"/>
</svg>