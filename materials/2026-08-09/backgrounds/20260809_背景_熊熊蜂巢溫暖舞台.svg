    <g transform="translate(-60, -250)">
      <path d="M28,2.8 L52,16 L52,40 L28,53.2 L4,40 L4,16 Z"
            fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.4"/>
    </g>
  </g>

