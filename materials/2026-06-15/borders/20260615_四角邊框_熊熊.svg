<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <!-- 四角邊框 - 結合 Simple shapes + Playful details -->
  <defs>
    <linearGradient id="cornerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8A87C"/>
      <stop offset="100%" style="stop-color:#C68B59"/>
    </linearGradient>
  </defs>
  
  <!-- 左上角 -->
  <g transform="translate(0, 0)">
    <!-- 水平線 -->
    <rect x="0" y="0" width="200" height="6" rx="3" fill="url(#cornerGrad)"/>
    <!-- 垂直線 -->
    <rect x="0" y="0" width="6" height="200" rx="3" fill="url(#cornerGrad)"/>
    <!-- 圓角弧形裝飾 -->
    <path d="M6,60 Q6,6 60,6" fill="none" stroke="#E8A87C" stroke-width="2" opacity="0.5"/>
    <!-- 小熊爪印裝飾 -->
    <g transform="translate(30, 30)" opacity="0.6">
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="#C68B59"/>
      <circle cx="-12" cy="-8" r="5" fill="#C68B59"/>
      <circle cx="0" cy="-12" r="5" fill="#C68B59"/>
      <circle cx="12" cy="-8" r="5" fill="#C68B59"/>
    </g>
  </g>
  
  <!-- 右上角 -->
  <g transform="translate(1920, 0) scale(-1, 1)">
    <rect x="0" y="0" width="200" height="6" rx="3" fill="url(#cornerGrad)"/>
    <rect x="0" y="0" width="6" height="200" rx="3" fill="url(#cornerGrad)"/>
    <path d="M6,60 Q6,6 60,6" fill="none" stroke="#E8A87C" stroke-width="2" opacity="0.5"/>
    <g transform="translate(30, 30)" opacity="0.6">
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="#C68B59"/>
      <circle cx="-12" cy="-8" r="5" fill="#C68B59"/>
      <circle cx="0" cy="-12" r="5" fill="#C68B59"/>
      <circle cx="12" cy="-8" r="5" fill="#C68B59"/>
    </g>
  </g>
  
  <!-- 左下角 -->
  <g transform="translate(0, 1080) scale(1, -1)">
    <rect x="0" y="0" width="200" height="6" rx="3" fill="url(#cornerGrad)"/>
    <rect x="0" y="0" width="6" height="200" rx="3" fill="url(#cornerGrad)"/>
    <path d="M6,60 Q6,6 60,6" fill="none" stroke="#E8A87C" stroke-width="2" opacity="0.5"/>
    <g transform="translate(30, 30)" opacity="0.6">
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="#C68B59"/>
      <circle cx="-12" cy="-8" r="5" fill="#C68B59"/>
      <circle cx="0" cy="-12" r="5" fill="#C68B59"/>
      <circle cx="12" cy="-8" r="5" fill="#C68B59"/>
    </g>
  </g>
  
  <!-- 右下角 -->
  <g transform="translate(1920, 1080) scale(-1, -1)">
    <rect x="0" y="0" width="200" height="6" rx="3" fill="url(#cornerGrad)"/>
    <rect x="0" y="0" width="6" height="200" rx="3" fill="url(#cornerGrad)"/>
    <path d="M6,60 Q6,6 60,6" fill="none" stroke="#E8A87C" stroke-width="2" opacity="0.5"/>
    <g transform="translate(30, 30)" opacity="0.6">
      <ellipse cx="0" cy="0" rx="10" ry="8" fill="#C68B59"/>
      <circle cx="-12" cy="-8" r="5" fill="#C68B59"/>
      <circle cx="0" cy="-12" r="5" fill="#C68B59"/>
      <circle cx="12" cy="-8" r="5" fill="#C68B59"/>
    </g>
  </g>
  
  <!-- 內側虛線裝飾 (可選，透明度低) -->
  <rect x="40" y="40" width="1840" height="1000" rx="8" fill="none" stroke="#E8A87C" stroke-width="1" stroke-dasharray="8,8" opacity="0.2"/>
</svg>