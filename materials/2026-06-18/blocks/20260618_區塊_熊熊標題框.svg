<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="bearBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B6914"/>
      <stop offset="100%" style="stop-color:#D4A574"/>
    </linearGradient>
  </defs>
  <!-- Background shape -->
  <rect x="0" y="0" width="400" height="100" rx="12" fill="url(#bearBg)"/>
  <!-- Bear face circle -->
  <circle cx="350" cy="50" r="35" fill="#FFE8D6" opacity="0.2"/>
  <!-- Bear ears -->
  <circle cx="320" cy="20" r="12" fill="#D4A574"/>
  <circle cx="380" cy="20" r="12" fill="#D4A574"/>
  <circle cx="320" cy="20" r="6" fill="#FFE8D6"/>
  <circle cx="380" cy="20" r="6" fill="#FFE8D6"/>
  <!-- Bear eyes -->
  <circle cx="340" cy="45" r="4" fill="#5D4E37"/>
  <circle cx="360" cy="45" r="4" fill="#5D4E37"/>
  <!-- Bear nose -->
  <ellipse cx="350" cy="55" rx="6" ry="4" fill="#5D4E37"/>
  <!-- Text -->
  <text x="30" y="58" font-family="Arial, sans-serif" font-size="28" fill="#FFFFFF" font-weight="bold">工作報告</text>
  <!-- Bear paw prints -->
  <circle cx="85" cy="75" r="5" fill="#FFE8D6" opacity="0.5"/>
  <circle cx="78" cy="68" r="3" fill="#FFE8D6" opacity="0.5"/>
  <circle cx="92" cy="68" r="3" fill="#FFE8D6" opacity="0.5"/>
</svg>