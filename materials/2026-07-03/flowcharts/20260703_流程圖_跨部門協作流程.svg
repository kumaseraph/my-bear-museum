<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="100%" style="stop-color:#F1F5F9"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748B"/>
    </marker>
  </defs>
  
  <rect width="960" height="540" fill="url(#bg4)"/>
  
  <!-- 標題 -->
  <text x="480" y="45" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="24" font-weight="bold" fill="#1E293B">跨部門協作流程</text>
  
  <!-- 中心專案管理 -->
  <g transform="translate(380, 220)">
    <polygon points="100,0 200,0 180,80 80,80" fill="#7C3AED"/>
    <text x="140" y="35" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="white" font-weight="bold">📋</text>
    <text x="140" y="55" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="white">專案管理</text>
    <text x="140" y="70" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="10" fill="#E9D5FF">PMO統籌</text>
  </g>
  
  <!-- 上方：業務部 -->
  <g transform="translate(400, 80)">
    <polygon points="80,0 160,0 145,50 65,50" fill="#3B82F6"/>
    <text x="112" y="30" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="white" font-weight="bold">💼 業務部</text>
  </g>
  <line x1="480" y1="130" x2="480" y2="210" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 左方：財務部 -->
  <g transform="translate(180, 220)">
    <polygon points="80,0 160,0 145,50 65,50" fill="#10B981"/>
    <text x="112" y="30" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="white" font-weight="bold">💰 財務部</text>
  </g>
  <line x1="300" y1="270" x2="370" y2="270" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 右方：技術部 -->
  <g transform="translate(620, 220)">
    <polygon points="80,0 160,0 145,50 65,50" fill="#F59E0B"/>
    <text x="112" y="30" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="white" font-weight="bold">⚙️ 技術部</text>
  </g>
  <line x1="620" y1="270" x2="550" y2="270" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 下方：人力資源部 -->
  <g transform="translate(400, 380)">
    <polygon points="80,0 160,0 145,50 65,50" fill="#EC4899"/>
    <text x="112" y="30" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="white" font-weight="bold">👥 人力資源</text>
  </g>
  <line x1="480" y1="380" x2="480" y2="320" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 左上：市場部 -->
  <g transform="translate(220, 130)">
    <polygon points="70,0 140,0 128,45 58,45" fill="#06B6D4"/>
    <text x="99" y="28" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="white" font-weight="bold">📢 市場部</text>
  </g>
  <line x1="290" y1="175" x2="380" y2="220" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 右上：客服部 -->
  <g transform="translate(600, 130)">
    <polygon points="70,0 140,0 128,45 58,45" fill="#8B5CF6"/>
    <text x="99" y="28" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="white" font-weight="bold">🎧 客服部</text>
  </g>
  <line x1="600" y1="175" x2="540" y2="220" stroke="#94A3B8" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 節點連接線裝飾 -->
  <circle cx="290" cy="175" r="4" fill="#06B6D4"/>
  <circle cx="630" cy="175" r="4" fill="#8B5CF6"/>
  <circle cx="220" cy="270" r="4" fill="#10B981"/>
  <circle cx="700" cy="270" r="4" fill="#F59E0B"/>
  <circle cx="480" cy="380" r="4" fill="#EC4899"/>
  
  <!-- 底部說明 -->
  <text x="480" y="490" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="#64748B">以專案管理為中心，各部門高效協同作業</text>
  
  <!-- 圖例 -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="12" height="12" fill="#7C3AED" rx="2"/>
    <text x="18" y="10" font-family="Microsoft JhengHei, sans-serif" font-size="11" fill="#64748B">統籌協調</text>
    <rect x="80" y="0" width="12" height="12" fill="#3B82F6" rx="2"/>
    <text x="98" y="10" font-family="Microsoft JhengHei, sans-serif" font-size="11" fill="#64748B">訊息傳遞</text>
    <rect x="160" y="0" width="12" height="12" fill="#10B981" rx="2"/>
    <text x="178" y="10" font-family="Microsoft JhengHei, sans-serif" font-size="11" fill="#64748B">資源支援</text>
  </g>
</svg>