<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- 配色方案：活力風 -->
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#8B7CF7"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#1E293B"/>
  
  <!-- 圖標主體：菱形×五角星交替排列 -->
  <g transform="translate(960,540)">
    <!-- 左菱形 -->
    <g transform="translate(-200,0)">
      <polygon points="60,0 120,80 60,160 0,80" 
               fill="url(#diamondGrad)" stroke="#4ECDC4" stroke-width="3"/>
      <polygon points="60,40 85,80 60,120 35,80" 
               fill="none" stroke="#FF8C00" stroke-width="2" transform="translate(0,-10) scale(0.6)"/>
    </g>
    
    <!-- 中央五角星 -->
    <g transform="translate(0,0)">
      <polygon points="50,5 61,40 95,40 68,60 79,95 50,75 21,95 32,60 5,40 39,40" 
               fill="url(#starGrad)" stroke="#C2410C" stroke-width="2"/>
      <!-- 內圈裝飾 -->
      <circle cx="50" cy="50" r="20" fill="none" stroke="#FF8C00" stroke-width="2" opacity="0.5"/>
    </g>
    
    <!-- 右菱形 -->
    <g transform="translate(200,0)">
      <polygon points="60,0 120,80 60,160 0,80" 
               fill="url(#diamondGrad)" stroke="#4ECDC4" stroke-width="3"/>
      <polygon points="60,40 85,80 60,120 35,80" 
               fill="none" stroke="#FF8C00" stroke-width="2" transform="translate(0,-10) scale(0.6)"/>
    </g>
    
    <!-- 連接線裝飾 -->
    <line x1="-140" y1="80" x2="-60" y2="80" stroke="#4ECDC4" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="60" y1="80" x2="140" y2="80" stroke="#4ECDC4" stroke-width="2" stroke-dasharray="5,5"/>
  </g>
  
  <!-- 底部標題區 -->
  <text x="960" y="850" text-anchor="middle" 
        font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#F8FAFC">
    策略思維
  </text>
  <text x="960" y="920" text-anchor="middle" 
        font-family="Arial, sans-serif" font-size="24" fill="#94A3B8">
    Strategic Thinking • 工作報告圖標
  </text>
</svg>