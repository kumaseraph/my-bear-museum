  <circle cx="48" cy="20" r="8" fill="#D4A574"/>
  <circle cx="16" cy="20" r="4" fill="#FFE8D6"/>
  <circle cx="48" cy="20" r="4" fill="#FFE8D6"/>
  <!-- Bear face -->
  <circle cx="32" cy="32" r="14" fill="#FFE8D6"/>
