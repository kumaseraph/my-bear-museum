<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" role="img" aria-label="現代下一步按鈕">
  <title>現代下一步</title>
  <desc>現代簡潔風格，下一步導航按鈕，雙重交叉局部細節+柔和曲線/箭頭。應用#124/#121技巧：雙重交叉線條+圓形曲線組合。融合趨勢：Soft curves、Playful details、工作流程場景。適用PowerPoint工作報告PPT，不含動畫與外部依賴。</desc>

  <defs>
    <linearGradient id="nsa_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="nsa_arrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <pattern id="nsa_diag" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(30)">
      <rect width="12" height="12" fill="transparent"/>
      <line x1="0" y1="12" x2="12" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.08"/>
    </pattern>
    <filter id="nsa_shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 左側引導曲線裝飾 (向內收 12px) -->
  <g fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.4">
    <path d="M12,50 Q37,35 62,50"/>
    <path d="M12,50 Q37,65 62,50"/>
    <circle cx="62" cy="50" r="3" fill="#A78BFA" fill-opacity="0.4"/>
  </g>

  <!-- 主按鈕 (圓角矩形) -->
  <g transform="translate(210, 50)" filter="url(#nsa_shadow)">
    <!-- 按鈕本體 -->
    <rect x="-150" y="-38" width="300" height="76" rx="38"
          fill="url(#nsa_grad)"/>
    <!-- 斜紋疊加 — 僅限左側裝飾區，不覆蓋文字 -->
    <rect x="-148" y="-38" width="110" height="76" rx="0"
          fill="url(#nsa_diag)"/>
    <!-- 左側淡出效果 -->
    <rect x="-150" y="-38" width="80" height="76" rx="0"
          fill="url(#nsa_grad)" fill-opacity="0.0"
          gradientUnits="userSpaceOnUse"/>
    <defs>
      <linearGradient id="nsa_leftFade" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect x="-150" y="-38" width="80" height="76" rx="38"
          fill="url(#nsa_leftFade)"/>

    <!-- 雙重交叉局部線條細節 (左側) -->
    <g stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.25">
      <line x1="-120" y1="-20" x2="-90" y2="20"/>
      <line x1="-115" y1="-20" x2="-85" y2="20"/>
    </g>

    <!-- 箭頭圖示 -->
    <g transform="translate(-80, 0)">
      <!-- 箭頭主體 (柔和曲線) -->
      <path d="M0,-12 L28,0 L0,12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0,-12 L28,0 L0,12" fill="none" stroke="url(#nsa_arrow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/>
      <!-- 圓點裝飾 -->
      <circle cx="32" cy="0" r="4" fill="#FF8C00" fill-opacity="0.8"/>
    </g>

    <!-- 文字 -->
    <text x="20" y="6" text-anchor="middle" fill="#FFFFFF"
          font-family="system-ui, sans-serif" font-size="20" font-weight="700"
          letter-spacing="0.5">下一步</text>
    <text x="20" y="22" text-anchor="middle" fill="#FFFFFF"
          font-family="system-ui, sans-serif" font-size="10" letter-spacing="1" fill-opacity="0.85">NEXT STEP</text>
  </g>

  <!-- 右側引導曲線裝飾 (向內收 12px) -->
  <g fill="none" stroke="#4ECDC4" stroke-width="1.5" stroke-opacity="0.4">
    <path d="M408,50 Q383,35 358,50"/>
    <path d="M408,50 Q383,65 358,50"/>
    <circle cx="358" cy="50" r="3" fill="#4ECDC4" fill-opacity="0.4"/>
  </g>

  <!-- 右側雙重交叉局部細節 (呼應左側按鈕雙線，向內收 12px) -->
  <g stroke="#4ECDC4" stroke-width="1" stroke-opacity="0.45">
    <line x1="363" y1="30" x2="398" y2="70"/>
    <line x1="370" y1="30" x2="405" y2="70"/>
  </g>
</svg>
