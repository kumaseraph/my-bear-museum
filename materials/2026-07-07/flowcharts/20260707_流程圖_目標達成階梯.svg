<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <linearGradient id="stair1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4C1D95"/>
      <stop offset="100%" style="stop-color:#6B5CE7"/>
    </linearGradient>
    <linearGradient id="stair2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6B5CE7"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="stair3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4"/>
      <stop offset="100%" style="stop-color:#0EA5E9"/>
    </linearGradient>
    <linearGradient id="stair4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bg5)"/>
  
  <!-- 標題 -->
  <text x="960" y="80" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="36" font-weight="bold">目標達成階梯</text>
  <text x="960" y="115" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">GOAL ACHIEVEMENT LADDER</text>
  
  <!-- 階梯主體 -->
  <g transform="translate(360, 300)">
    <!-- 第一階：設定目標 -->
    <g transform="translate(0, 0)">
      <polygon points="0,200 400,200 400,100 200,0 0,100" fill="url(#stair1)" opacity="0.9"/>
      <polygon points="0,200 400,200 400,100 200,0 0,100" fill="none" stroke="#A78BFA" stroke-width="2"/>
      <!-- 頂部裝飾 -->
      <polygon points="200,0 230,25 200,50 170,25" fill="#FF8C00" opacity="0.8"/>
      <!-- 階梯號碼 -->
      <circle cx="80" cy="150" r="25" fill="#4C1D95"/>
      <text x="80" y="158" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="20" font-weight="bold">1</text>
      <!-- 階梯文字 -->
      <text x="280" y="120" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="18" font-weight="bold">設定目標</text>
      <text x="280" y="150" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="14">明確定義KPI</text>
    </g>
    
    <!-- 第二階：制定計劃 -->
    <g transform="translate(150, -100)">
      <polygon points="0,200 400,200 400,100 200,0 0,100" fill="url(#stair2)" opacity="0.9"/>
      <polygon points="0,200 400,200 400,100 200,0 0,100" fill="none" stroke="#C4B5FD" stroke-width="2"/>
      <polygon points="200,0 230,25 200,50 170,25" fill="#FF8C00" opacity="0.8"/>
      <circle cx="80" cy="150" r="25" fill="#6B5CE7"/>
      <text x="80" y="158" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="20" font-weight="bold">2</text>
      <text x="280" y="120" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="18" font-weight="bold">制定計劃</text>
      <text x="280" y="150" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="14">時間規劃</text>
    </g>
    
    <!-- 第三階：執行行動 -->
    <g transform="translate(300, -200)">
      <polygon points="0,200 400,200 400,100 200,0 0,100" fill="url(#stair3)" opacity="0.9"/>
      <polygon points="0,200 400,200 400,100 200,0 0,100" fill="none" stroke="#67E8F9" stroke-width="2"/>
      <polygon points="200,0 230,25 200,50 170,25" fill="#FF8C00" opacity="0.8"/>
      <circle cx="80" cy="150" r="25" fill="#4ECDC4"/>
      <text x="80" y="158" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="20" font-weight="bold">3</text>
      <text x="280" y="120" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="18" font-weight="bold">執行行動</text>
      <text x="280" y="150" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="14">付諸實踐</text>
    </g>
    
    <!-- 第四階：達成目標 -->
    <g transform="translate(450, -300)">
      <polygon points="0,200 400,200 400,100 200,0 0,100" fill="url(#stair4)" opacity="0.9"/>
      <polygon points="0,200 400,200 400,100 200,0 0,100" fill="none" stroke="#FCD34D" stroke-width="2"/>
      <!-- 頂部星星裝飾 -->
      <polygon points="200,-20 212,10 245,10 220,30 230,60 200,42 170,60 180,30 155,10 188,10" fill="#FF8C00" filter="url(#glow5)"/>
      <circle cx="80" cy="150" r="25" fill="#FF8C00"/>
      <text x="80" y="158" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="20" font-weight="bold">4</text>
      <text x="280" y="120" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="18" font-weight="bold">達成目標</text>
      <text x="280" y="150" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="14">收穫成果</text>
    </g>
    
    <!-- 上升箭頭裝飾 -->
    <g transform="translate(850, 50)" opacity="0.6">
      <line x1="0" y1="150" x2="0" y2="0" stroke="#FF8C00" stroke-width="3"/>
      <polygon points="0,-20 -15,10 15,10" fill="#FF8C00"/>
      <line x1="30" y1="130" x2="30" y2="20" stroke="#4ECDC4" stroke-width="2" stroke-dasharray="5,5"/>
    </g>
  </g>
  
  <!-- 右側總結卡片 -->
  <g transform="translate(1400, 250)">
    <rect x="0" y="0" width="350" height="400" rx="15" fill="#4C1D95" opacity="0.4"/>
    <rect x="0" y="0" width="350" height="400" rx="15" fill="none" stroke="#6B5CE7" stroke-width="2"/>
    
    <text x="175" y="50" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="20" font-weight="bold">關鍵心法</text>
    
    <!-- 四個要點 -->
    <g transform="translate(30, 90)">
      <circle cx="15" cy="0" r="15" fill="#6B5CE7"/>
      <text x="15" y="6" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="14" font-weight="bold">1</text>
      <text x="45" y="5" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="14">目標具體化</text>
    </g>
    
    <g transform="translate(30, 150)">
      <circle cx="15" cy="0" r="15" fill="#4ECDC4"/>
      <text x="15" y="6" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="14" font-weight="bold">2</text>
      <text x="45" y="5" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="14">分階段執行</text>
    </g>
    
    <g transform="translate(30, 210)">
      <circle cx="15" cy="0" r="15" fill="#0EA5E9"/>
      <text x="15" y="6" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="14" font-weight="bold">3</text>
      <text x="45" y="5" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="14">定期檢視進度</text>
    </g>
    
    <g transform="translate(30, 270)">
      <circle cx="15" cy="0" r="15" fill="#FF8C00"/>
      <text x="15" y="6" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="14" font-weight="bold">4</text>
      <text x="45" y="5" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="14">彈性調整策略</text>
    </g>
    
    <!-- 底部裝飾線 -->
    <line x1="30" y1="330" x2="320" y2="330" stroke="#6B5CE7" stroke-width="2" opacity="0.5"/>
    <text x="175" y="365" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="12">親和設計 | 無障礙優先</text>
  </g>
  
  <!-- 底部裝飾 -->
  <g opacity="0.15">
    <polygon points="100,1000 130,1025 130,1075 100,1100 70,1075 70,1025" fill="#6B5CE7"/>
    <polygon points="300,950 330,975 330,1025 300,1050 270,1025 270,975" fill="#4ECDC4"/>
  </g>
  
  <!-- 技巧說明 -->
  <text x="960" y="1020" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="12">階梯排列（#124-3）| 童趣手繪 | 大膽層級</text>
</svg>