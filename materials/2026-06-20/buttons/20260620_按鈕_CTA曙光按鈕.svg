<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90">
  <title>CTA 曙光按鈕</title>
  <desc>溫暖金色風格的呼籲行動按鈕，採用雙重交叉線設計</desc>
  <defs>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </linearGradient>
    <linearGradient id="ctaShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="ctaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feFlood flood-color="#FF8C00" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 雙重交叉線背景裝飾 -->
  <g opacity="0.12">
    <line x1="20" y1="0" x2="20" y2="90" stroke="#FF8C00" stroke-width="2"/>
    <line x1="50" y1="0" x2="50" y2="90" stroke="#FF8C00" stroke-width="2"/>
    <line x1="80" y1="0" x2="80" y2="90" stroke="#FF8C00" stroke-width="2"/>
    <line x1="0" y1="30" x2="320" y2="30" stroke="#FF8C00" stroke-width="2"/>
    <line x1="0" y1="60" x2="320" y2="60" stroke="#FF8C00" stroke-width="2"/>
  </g>
  
  <!-- 按鈕主體 -->
  <g filter="url(#ctaGlow)">
    <!-- 外框（交叉線效果）-->
    <rect x="25" y="15" width="270" height="60" rx="12" 
          fill="none" stroke="#FF8C00" stroke-width="2.5"/>
    
    <!-- 內層填充 -->
    <rect x="28" y="18" width="264" height="54" rx="10" 
          fill="url(#ctaGrad)"/>
    
    <!-- 高光疊加 -->
    <rect x="28" y="18" width="264" height="27" rx="10" 
          fill="url(#ctaShine)"/>
  </g>
  
  <!-- 文字 -->
  <text x="160" y="53" fill="#FFFFFF" font-family="Arial, sans-serif" 
        font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="2">
    立即開始
  </text>
  
  <!-- 右側裝飾箭頭 -->
  <g transform="translate(260,45)">
    <polygon points="0,-6 12,0 0,6" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>