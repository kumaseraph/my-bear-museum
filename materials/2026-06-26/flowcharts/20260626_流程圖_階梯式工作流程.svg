<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60A5FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#93C5FD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 步驟1 -->
  <g transform="translate(10, 20)">
    <polygon points="20,0 100,0 80,50 0,50" fill="url(#grad1)"/>
    <text x="50" y="30" font-size="11" fill="white" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">計畫</text>
  </g>
  
  <!-- 連接線1 -->
  <line x1="100" y1="45" x2="130" y2="45" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,3"/>
  <polygon points="125,40 135,45 125,50" fill="#F59E0B"/>
  
  <!-- 步驟2 -->
  <g transform="translate(130, 35)">
    <polygon points="20,0 100,0 80,50 0,50" fill="url(#grad2)"/>
    <text x="50" y="30" font-size="11" fill="white" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">執行</text>
  </g>
  
  <!-- 連接線2 -->
  <line x1="220" y1="60" x2="250" y2="60" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,3"/>
  <polygon points="245,55 255,60 245,65" fill="#F59E0B"/>
  
  <!-- 步驟3 -->
  <g transform="translate(250, 50)">
    <polygon points="20,0 100,0 80,50 0,50" fill="url(#grad3)"/>
    <text x="50" y="30" font-size="11" fill="white" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">檢核</text>
  </g>
  
  <!-- 連接線3 -->
  <line x1="340" y1="75" x2="370" y2="75" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,3"/>
  <polygon points="365,70 375,75 365,80" fill="#F59E0B"/>
  
  <!-- 步驟4 -->
  <g transform="translate(310, 65)">
    <polygon points="20,0 80,0 60,50 0,50" fill="#1E40AF"/>
    <text x="40" y="30" font-size="11" fill="white" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">行動</text>
  </g>
</svg>