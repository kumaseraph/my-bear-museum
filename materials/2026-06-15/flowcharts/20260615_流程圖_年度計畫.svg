<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <!-- 年度計畫流程圖 -->
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8A87C"/>
      <stop offset="100%" style="stop-color:#F5D7B6"/>
    </linearGradient>
    <filter id="stepShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#C68B59" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- 標題區 -->
  <text x="400" y="35" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#8B5A3C" text-anchor="middle">年度計畫執行流程</text>
  
  <!-- 步驟 1 -->
  <g transform="translate(60, 70)">
    <rect width="120" height="80" rx="12" fill="url(#stepGrad)" filter="url(#stepShadow)"/>
    <text x="60" y="35" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">STEP 1</text>
    <text x="60" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">目標設定</text>
  </g>
  
  <!-- 箭頭 1 -->
  <g transform="translate(190, 100)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#C68B59" stroke-width="2"/>
    <polygon points="40,5 50,10 40,15" fill="#C68B59"/>
  </g>
  
  <!-- 步驟 2 -->
  <g transform="translate(250, 70)">
    <rect width="120" height="80" rx="12" fill="url(#stepGrad)" filter="url(#stepShadow)"/>
    <text x="60" y="35" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">STEP 2</text>
    <text x="60" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">策略規劃</text>
  </g>
  
  <!-- 箭頭 2 -->
  <g transform="translate(380, 100)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#C68B59" stroke-width="2"/>
    <polygon points="40,5 50,10 40,15" fill="#C68B59"/>
  </g>
  
  <!-- 步驟 3 -->
  <g transform="translate(440, 70)">
    <rect width="120" height="80" rx="12" fill="url(#stepGrad)" filter="url(#stepShadow)"/>
    <text x="60" y="35" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">STEP 3</text>
    <text x="60" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">執行追蹤</text>
  </g>
  
  <!-- 箭頭 3 -->
  <g transform="translate(570, 100)">
    <line x1="0" y1="10" x2="40" y2="10" stroke="#C68B59" stroke-width="2"/>
    <polygon points="40,5 50,10 40,15" fill="#C68B59"/>
  </g>
  
  <!-- 步驟 4 -->
  <g transform="translate(630, 70)">
    <rect width="120" height="80" rx="12" fill="#C68B59" filter="url(#stepShadow)"/>
    <text x="60" y="35" font-family="Arial, sans-serif" font-size="12" fill="#FFF5EB" text-anchor="middle">STEP 4</text>
    <text x="60" y="58" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF5EB" text-anchor="middle">成果檢視</text>
  </g>
  
  <!-- 底部時間軸 -->
  <line x1="120" y1="220" x2="680" y2="220" stroke="#E8A87C" stroke-width="2"/>
  
  <g transform="translate(120, 200)">
    <circle r="8" fill="#E8A87C"/>
    <text y="30" font-family="Arial, sans-serif" font-size="11" fill="#C68B59" text-anchor="middle">Q1</text>
  </g>
  <g transform="translate(310, 200)">
    <circle r="8" fill="#E8A87C"/>
    <text y="30" font-family="Arial, sans-serif" font-size="11" fill="#C68B59" text-anchor="middle">Q2</text>
  </g>
  <g transform="translate(500, 200)">
    <circle r="8" fill="#E8A87C"/>
    <text y="30" font-family="Arial, sans-serif" font-size="11" fill="#C68B59" text-anchor="middle">Q3</text>
  </g>
  <g transform="translate(690, 200)">
    <circle r="8" fill="#C68B59"/>
    <text y="30" font-family="Arial, sans-serif" font-size="11" fill="#C68B59" text-anchor="middle">Q4</text>
  </g>
  
  <!-- 連接虛線到步驟 -->
  <line x1="120" y1="150" x2="120" y2="212" stroke="#E8A87C" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="310" y1="150" x2="310" y2="212" stroke="#E8A87C" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="500" y1="150" x2="500" y2="212" stroke="#E8A87C" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="690" y1="150" x2="690" y2="212" stroke="#E8A87C" stroke-width="1" stroke-dasharray="4,4"/>
</svg>