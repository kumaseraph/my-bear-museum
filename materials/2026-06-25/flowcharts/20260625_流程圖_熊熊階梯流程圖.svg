<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bearStepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <linearGradient id="bearArrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="400" fill="#FDF8F3"/>
  
  <!-- 階梯式流程：4步驟 -->
  <!-- Step 1 -->
  <g transform="translate(80,280)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#bearStepGrad)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">Step 1</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFF8F0">規劃</text>
  </g>
  
  <!-- 連接線1 -->
  <path d="M140,265 L180,240 L220,240" fill="none" stroke="url(#bearArrowGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Step 2 -->
  <g transform="translate(240,220)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#bearStepGrad)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">Step 2</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFF8F0">執行</text>
  </g>
  
  <!-- 連接線2 -->
  <path d="M300,205 L340,180 L380,180" fill="none" stroke="url(#bearArrowGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Step 3 -->
  <g transform="translate(400,160)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#bearStepGrad)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">Step 3</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFF8F0">檢核</text>
  </g>
  
  <!-- 連接線3 -->
  <path d="M460,145 L500,120 L540,120" fill="none" stroke="url(#bearArrowGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Step 4 -->
  <g transform="translate(560,100)">
    <rect x="-60" y="-30" width="120" height="60" rx="10" fill="url(#bearStepGrad)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">Step 4</text>
    <text x="0" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#FFF8F0">改善</text>
  </g>
  
  <!-- 裝飾六邊形 -->
  <g transform="translate(700,100)">
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z" 
          fill="#D4A574" opacity="0.6"/>
    <path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z" 
          fill="none" stroke="#8B5A2B" stroke-width="1.5" transform="translate(30,30)"/>
  </g>
  
  <!-- 標題 -->
  <text x="400" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#8B5A2B">PDCA 循環流程</text>
</svg>