<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">結論摘要卡</title>
  <desc id="desc">以標題即結論、單一 insight、可見網格與 2.5D 六邊形焦點組成的摘要卡</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#66736A" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#263238" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#F7F7F2"/>
  <rect x="72" y="72" width="1776" height="936" rx="36" fill="url(#grid)"/>
  <rect x="112" y="112" width="1696" height="856" rx="28" fill="#F7F7F2" fill-opacity=".92" stroke="#87A96B" stroke-opacity=".45" stroke-width="2"/>
  <path d="M160 196H1760" stroke="#263238" stroke-opacity=".16" stroke-width="2"/>
  <text x="160" y="160" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="28" font-weight="600" letter-spacing="5">執行摘要  /  INSIGHT 01</text>
  <text x="160" y="306" fill="#263238" font-family="Noto Sans TC, sans-serif" font-size="78" font-weight="800">里程碑提前完成，團隊可轉入驗證</text>
  <text x="160" y="384" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="34">標題即結論：本週交付節奏穩定，下一個焦點是品質驗證。</text>
  <g filter="url(#shadow)">
    <rect x="160" y="494" width="760" height="310" rx="28" fill="#F7F7F2" stroke="#263238" stroke-width="3"/>
    <rect x="972" y="494" width="390" height="310" rx="28" fill="#87A96B" fill-opacity=".17" stroke="#87A96B" stroke-width="2"/>
    <rect x="1414" y="494" width="346" height="310" rx="28" fill="#F4D35E" fill-opacity=".48" stroke="#263238" stroke-width="2"/>
  </g>
  <text x="208" y="570" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="26" font-weight="700">單一關鍵洞察</text>
  <text x="208" y="652" fill="#263238" font-family="Noto Sans TC, sans-serif" font-size="52" font-weight="800">交付提前 2 天</text>
  <text x="208" y="714" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="30">完成率</text>
  <text x="208" y="776" fill="#263238" font-family="Noto Sans TC, sans-serif" font-size="54" font-weight="800">92%</text>
  <g transform="translate(1165 649)">
    <polygon points="0,-103 89,-52 89,52 0,103 -89,52 -89,-52" fill="#263238" fill-opacity=".16" transform="translate(14 16)"/>
    <polygon points="0,-103 89,-52 89,52 0,103 -89,52 -89,-52" fill="#F7F7F2" stroke="#263238" stroke-width="3"/>
    <polygon points="0,-73 63,-36 63,36 0,73 -63,36 -63,-36" fill="#87A96B" stroke="#87A96B" stroke-width="2"/>
    <circle cx="0" cy="0" r="23" fill="#F4D35E" stroke="#263238" stroke-width="3"/>
    <path d="M-9 1l7 7 15-19" fill="none" stroke="#263238" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1454" y="570" fill="#263238" font-family="Noto Sans TC, sans-serif" font-size="26" font-weight="700">下一個焦點</text>
  <text x="1454" y="650" fill="#263238" font-family="Noto Sans TC, sans-serif" font-size="42" font-weight="800">品質驗證</text>
  <path d="M1454 712h220" stroke="#263238" stroke-opacity=".38" stroke-width="3"/>
  <text x="1454" y="764" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="28">清晰、聚焦、可行動</text>
  <text x="160" y="902" fill="#66736A" font-family="Noto Sans TC, sans-serif" font-size="25">來源：工作報告週報  •  2026.07.21</text>
</svg>
