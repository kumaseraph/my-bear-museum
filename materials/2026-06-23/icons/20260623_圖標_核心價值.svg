<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- 配色：現代簡潔藍灰系 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <!-- 核心價值圖標：菱形包圍五角星 -->
  <g transform="translate(960,540)">
    <!-- 外層菱形邊框 -->
    <polygon points="0,-180 180,0 0,180 -180,0" 
             fill="none" stroke="#475569" stroke-width="8"/>
    <!-- 內層菱形裝飾 -->
    <polygon points="0,-140 140,0 0,140 -140,0" 
             fill="none" stroke="#94A3B8" stroke-width="3"/>
    <!-- 五角星中心 -->
    <polygon points="0,-80 24,-25 75,-25 34,8 50,60 0,35 -50,60 -34,8 -75,-25 -24,-25" 
             fill="#3B82F6"/>
    <!-- 五角星光芒線 -->
    <g stroke="#60A5FA" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-200" x2="0" y2="-160"/>
      <line x1="141" y1="-100" x2="113" y2="-80"/>
      <line x1="141" y1="100" x2="113" y2="80"/>
      <line x1="0" y1="200" x2="0" y2="160"/>
      <line x1="-141" y1="100" x2="-113" y2="80"/>
      <line x1="-141" y1="-100" x2="-113" y2="-80"/>
    </g>
  </g>
</svg>