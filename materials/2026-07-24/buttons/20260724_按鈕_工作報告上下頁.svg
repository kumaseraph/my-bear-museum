<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>工作報告上下頁按鈕組</title>
  <desc>應用#124技巧：條紋疊加+邊界引導線，融合可重組元件、跨情境清晰度趨勢</desc>

  <defs>
    <linearGradient id="btnGradPrev" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="btnGradNext" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <pattern id="btnStripes" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="transparent"/>
      <line x1="0" y1="14" x2="14" y2="0" stroke="#F59E0B" stroke-width="2" opacity="0.5"/>
    </pattern>
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#F8FAFC"/>

  <!-- 標題 -->
  <text x="960" y="200" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, sans-serif" font-size="56" font-weight="700" fill="#1E40AF">工作報告 · 上下頁按鈕組</text>
  <text x="960" y="250" text-anchor="middle" font-family="Microsoft JhengHei, PingFang TC, sans-serif" font-size="24" fill="#64748B">Navigation Buttons · 邊界引導 + 條紋疊加</text>
  <line x1="900" y1="280" x2="1020" y2="280" stroke="#F59E0B" stroke-width="4"/>

  <!-- 邊界引導線：左右兩條引導到按鈕組 -->
  <g stroke="#94A3B8" stroke-width="2" stroke-dasharray="8,4" opacity="0.5">
    <line x1="100" y1="600" x2="540" y2="600"/>
    <line x1="1820" y1="600" x2="1380" y2="600"/>
  </g>

  <!-- 上一頁按鈕（平行四邊形向左） -->
  <g transform="translate(380, 480)" filter="url(#btnShadow)">
    <polygon points="60,0 380,0 320,240 0,240" fill="url(#btnGradPrev)"/>
    <polygon points="60,0 380,0 320,240 0,240" fill="url(#btnStripes)" opacity="0.5"/>
    <polygon points="60,0 380,0 320,240 0,240" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <!-- 箭頭 -->
    <polygon points="100,120 200,80 200,100 240,100 240,140 200,140 200,160" fill="#FFFFFF"/>
    <text x="270" y="148" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">上一頁</text>
    <text x="190" y="210" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#D1D5DB">Previous Page</text>
  </g>

  <!-- 下一頁按鈕（平行四邊形向右） -->
  <g transform="translate(1180, 480)" filter="url(#btnShadow)">
    <polygon points="0,0 320,0 380,240 60,240" fill="url(#btnGradNext)"/>
    <polygon points="0,0 320,0 380,240 60,240" fill="url(#btnStripes)" opacity="0.5"/>
    <polygon points="0,0 320,0 380,240 60,240" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <text x="190" y="148" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">下一頁</text>
    <polygon points="280,120 180,80 180,100 140,100 140,140 180,140 180,160" fill="#FFFFFF" transform="translate(0,0)"/>
    <text x="190" y="210" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#DBEAFE">Next Page</text>
  </g>

  <!-- 底部說明 -->
  <g transform="translate(360, 820)">
    <rect x="0" y="0" width="1200" height="160" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="0" y="0" width="6" height="160" fill="#F59E0B"/>
    <text x="40" y="50" font-family="Microsoft JhengHei, sans-serif" font-size="24" font-weight="700" fill="#1E40AF">設計重點</text>
    <text x="40" y="92" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#374151">· 平行四邊形斜向 = 暗示方向感，與箭頭方向一致</text>
    <text x="40" y="124" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#374151">· 條紋疊加 = 動態引導；邊界引導線 = 視覺聚焦按鈕組</text>
  </g>
</svg>
