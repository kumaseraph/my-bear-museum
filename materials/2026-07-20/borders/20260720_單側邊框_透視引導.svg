<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="blueLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="perspGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect fill="#F8FAFC" width="1920" height="1080"/>

  <!-- ==================== 左側主裝飾區（寬度約 400px） ==================== -->

  <!-- 左側暗色豎帶 -->
  <rect x="0" y="0" width="320" height="1080" fill="url(#leftGrad)"/>
  <!-- 24px 內縮裁切線（覆蓋被裁切的裝飾框線） -->
  <rect x="0" y="0" width="24" height="1080" fill="#0F172A" opacity="0.85"/>

  <!-- 透視消失線叢集（從左向右發散） -->
  <g stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.4">
    <line x1="0" y1="200" x2="420" y2="300"/>
    <line x1="0" y1="400" x2="420" y2="420"/>
    <line x1="0" y1="600" x2="420" y2="540"/>
    <line x1="0" y1="800" x2="420" y2="660"/>
  </g>

  <!-- 透視消失線（細） -->
  <g stroke="#1E40AF" stroke-width="0.75" fill="none" opacity="0.25">
    <line x1="0" y1="300" x2="420" y2="360"/>
    <line x1="0" y1="500" x2="420" y2="480"/>
    <line x1="0" y1="700" x2="420" y2="600"/>
    <line x1="0" y1="900" x2="420" y2="720"/>
  </g>

  <!-- 平行四邊形階梯（台階式前進） -->
  <!-- 台階 1 -->
  <polygon points="24,150 204,150 244,220 64,220"
    fill="#1E40AF" fill-opacity="0.25"/>
  <polygon points="24,150 204,150 244,220 64,220"
    fill="none" stroke="#3B82F6" stroke-width="1.5"/>

  <!-- 台階 2 -->
  <polygon points="24,280 224,280 274,380 74,380"
    fill="#1E40AF" fill-opacity="0.3"/>
  <polygon points="24,280 224,280 274,380 74,380"
    fill="none" stroke="#3B82F6" stroke-width="1.5"/>

  <!-- 台階 3 -->
  <polygon points="24,430 244,430 304,560 84,560"
    fill="#1E40AF" fill-opacity="0.35"/>
  <polygon points="24,430 244,430 304,560 84,560"
    fill="none" stroke="#F59E0B" stroke-width="2"/>

  <!-- 台階 4 -->
  <polygon points="24,610 264,610 334,770 94,770"
    fill="#1E40AF" fill-opacity="0.4"/>
  <polygon points="24,610 264,610 334,770 94,770"
    fill="none" stroke="#3B82F6" stroke-width="1.5"/>

  <!-- 台階 5 -->
  <polygon points="24,820 224,820 284,940 84,940"
    fill="#1E40AF" fill-opacity="0.3"/>
  <polygon points="24,820 224,820 284,940 84,940"
    fill="none" stroke="#1E40AF" stroke-width="1.5"/>

  <!-- 六邊形大小對比裝飾（沿左側） -->
  <!-- 大六邊形 -->
  <g transform="translate(60, 320)">
    <polygon points="80,0 160,46 160,138 80,184 0,138 0,46"
      fill="none" stroke="#3B82F6" stroke-width="4"/>
    <polygon points="80,18 144,58 144,126 80,166 16,126 16,58"
      fill="#1E40AF" fill-opacity="0.3"/>
    <polygon points="80,36 128,67 128,117 80,148 32,117 32,67"
      fill="#F59E0B" fill-opacity="0.2"/>
  </g>

  <!-- 旋轉對比小六邊形 -->
  <g transform="translate(200, 180) rotate(15)">
    <polygon points="30,0 60,17 60,52 30,69 0,52 0,17"
      fill="#3B82F6" fill-opacity="0.5" stroke="#F59E0B" stroke-width="2"/>
  </g>
  <g transform="translate(40, 520) rotate(-10)">
    <polygon points="40,0 80,23 80,69 40,92 0,69 0,23"
      fill="none" stroke="#3B82F6" stroke-width="3"/>
    <polygon points="40,10 72,30 72,62 40,82 8,62 8,30"
      fill="#1E40AF" fill-opacity="0.3"/>
  </g>
  <g transform="translate(160, 620) rotate(25)">
    <polygon points="25,0 50,14 50,43 25,57 0,43 0,14"
      fill="#F59E0B" fill-opacity="0.4"/>
  </g>
  <g transform="translate(80, 800) rotate(-5)">
    <polygon points="35,0 70,20 70,60 35,80 0,60 0,20"
      fill="none" stroke="#3B82F6" stroke-width="2"/>
    <polygon points="35,8 63,26 63,54 35,72 7,54 7,26"
      fill="#1E40AF" fill-opacity="0.2"/>
  </g>

  <!-- 左側邊界引導線（垂直，24px 內縮） -->
  <line x1="344" y1="0" x2="344" y2="1080"
    stroke="#F59E0B" stroke-width="2" opacity="0.6"/>
  <line x1="354" y1="0" x2="354" y2="1080"
    stroke="#3B82F6" stroke-width="0.75" opacity="0.3" stroke-dasharray="6,6"/>

  <!-- 左側內部虛線引導（24px 內縮） -->
  <line x1="304" y1="0" x2="304" y2="1080"
    stroke="#1E40AF" stroke-width="0.5" opacity="0.2" stroke-dasharray="3,9"/>

  <!-- ==================== 右側內容區（乾淨留白） ==================== -->

  <!-- 右側頂部短線裝飾 -->
  <line x1="400" y1="80" x2="600" y2="80" stroke="#1E40AF" stroke-width="2.5" opacity="0.5"/>
  <line x1="620" y1="80" x2="800" y2="80" stroke="#3B82F6" stroke-width="1.5" opacity="0.35"/>
  <circle cx="810" cy="80" r="5" fill="#F59E0B" opacity="0.7"/>

  <!-- 右側底部短線裝飾 -->
  <line x1="400" y1="1000" x2="600" y2="1000" stroke="#1E40AF" stroke-width="2.5" opacity="0.5"/>
  <line x1="620" y1="1000" x2="800" y2="1000" stroke="#3B82F6" stroke-width="1.5" opacity="0.35"/>
  <circle cx="810" cy="1000" r="5" fill="#F59E0B" opacity="0.7"/>

  <!-- 右側內容區啞鈴暗示 -->
  <rect x="500" y="520" width="920" height="40" rx="20"
    fill="none" stroke="#1E40AF" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.15"/>
  <circle cx="560" cy="540" r="6" fill="#1E40AF" opacity="0.12"/>
  <circle cx="1360" cy="540" r="6" fill="#1E40AF" opacity="0.12"/>

  <!-- 右側內部六邊形點綴 -->
  <g transform="translate(1600, 500) rotate(30)">
    <polygon points="25,0 50,14 50,43 25,57 0,43 0,14"
      fill="none" stroke="#1E40AF" stroke-width="1.5" opacity="0.4"/>
  </g>
  <g transform="translate(1500, 700) rotate(-15)">
    <polygon points="18,0 36,10 36,30 18,40 0,30 0,10"
      fill="#3B82F6" fill-opacity="0.2"/>
  </g>

  <!-- 右下角六邊形 -->
  <g transform="translate(1700, 880)">
    <polygon points="50,0 100,29 100,86 50,115 0,86 0,29"
      fill="none" stroke="#1E40AF" stroke-width="3"/>
    <polygon points="50,12 90,37 90,78 50,103 10,78 10,37"
      fill="#1E40AF" fill-opacity="0.15"/>
    <polygon points="50,24 78,42 78,73 50,91 22,73 22,42"
      fill="#F59E0B" fill-opacity="0.25"/>
  </g>

  <!-- 透視消失點 -->
  <circle cx="1920" cy="540" r="8" fill="#F59E0B" opacity="0.9"/>
  <circle cx="1920" cy="540" r="16" fill="none" stroke="#F59E0B" stroke-width="1.5" opacity="0.4"/>
  <circle cx="1920" cy="540" r="28" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.2"/>

  <!-- 右上角小六邊形 -->
  <g transform="translate(1800, 100)">
    <polygon points="22,0 44,13 44,38 22,51 0,38 0,13"
      fill="#3B82F6" fill-opacity="0.3" stroke="#1E40AF" stroke-width="1.5"/>
  </g>

  <!-- 右側與底部交界過渡線 -->
  <line x1="1920" y1="1000" x2="1600" y2="1000"
    stroke="#1E40AF" stroke-width="2" opacity="0.3"/>
  <line x1="1920" y1="1000" x2="1700" y2="1000"
    stroke="#3B82F6" stroke-width="1" opacity="0.2"/>
</svg>