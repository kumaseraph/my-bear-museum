<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#C4956A"/>
    </linearGradient>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C9A0"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
  </defs>
  
  <!-- 標題 -->
  <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="bold" 
        fill="#5C4A1F" font-family="Arial, sans-serif">目標達成流程圖</text>
  
  <!-- 中心節點 -->
  <g transform="translate(400, 160)">
    <path d="M0,-55 L47.7,-27.5 L47.7,27.5 L0,55 L-47.7,27.5 L-47.7,-27.5 Z" 
          fill="url(#centerGrad)" stroke="#8B6914" stroke-width="3"/>
    <text x="0" y="-10" text-anchor="middle" font-size="14" fill="#5C4A1F" font-weight="bold">目標</text>
    <text x="0" y="12" text-anchor="middle" font-size="12" fill="#8B6914">達成</text>
  </g>
  
  <!-- 左上：計畫 -->
  <g transform="translate(180, 80)">
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#nodeGrad)" stroke="#8B6914" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#FDF8F0" font-weight="bold">1.計畫</text>
  </g>
  
  <!-- 左：執行 -->
  <g transform="translate(150, 160)">
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#nodeGrad)" stroke="#8B6914" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#FDF8F0" font-weight="bold">2.執行</text>
  </g>
  
  <!-- 左下：檢核 -->
  <g transform="translate(180, 240)">
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#nodeGrad)" stroke="#8B6914" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#FDF8F0" font-weight="bold">3.檢核</text>
  </g>
  
  <!-- 右上：資源 -->
  <g transform="translate(620, 80)">
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#nodeGrad)" stroke="#8B6914" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#FDF8F0" font-weight="bold">資源</text>
  </g>
  
  <!-- 右：協作 -->
  <g transform="translate(650, 160)">
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#nodeGrad)" stroke="#8B6914" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#FDF8F0" font-weight="bold">協作</text>
  </g>
  
  <!-- 右下：完成 -->
  <g transform="translate(620, 240)">
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#nodeGrad)" stroke="#8B6914" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" fill="#FDF8F0" font-weight="bold">完成</text>
  </g>
  
  <!-- 連接線 - 左上到中心 -->
  <line x1="210" y1="105" x2="355" y2="135" stroke="#C4956A" stroke-width="2"/>
  
  <!-- 連接線 - 左到中心 -->
  <line x1="185" y1="160" x2="350" y2="160" stroke="#C4956A" stroke-width="2"/>
  
  <!-- 連接線 - 左下到中心 -->
  <line x1="210" y1="215" x2="355" y2="185" stroke="#C4956A" stroke-width="2"/>
  
  <!-- 連接線 - 右上到中心 -->
  <line x1="590" y1="105" x2="445" y2="135" stroke="#C4956A" stroke-width="2"/>
  
  <!-- 連接線 - 右到中心 -->
  <line x1="615" y1="160" x2="450" y2="160" stroke="#C4956A" stroke-width="2"/>
  
  <!-- 連接線 - 右下到中心 -->
  <line x1="590" y1="215" x2="445" y2="185" stroke="#C4956A" stroke-width="2"/>
</svg>