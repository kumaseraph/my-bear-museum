<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 邊框_四角正式幾何全框 | 工作報告系列 | 🏛️ 正式專業 -->
  <!-- 技巧: #120 六邊形十式 + #124 平行四邊形線條 - 大小對比 + 2.5D效果 + 邊界引導線 + 階梯排列 -->
  <!-- 趨勢融合: Bento Blocks 分塊邏輯 + Calm Palette + 對齊比裝飾重要 + Motion 是溝通 -->
  <defs>
    <linearGradient id="formalNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#3B5998"/>
    </linearGradient>
    <linearGradient id="formalSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6FA5"/>
      <stop offset="100%" stop-color="#6B89B8"/>
    </linearGradient>
  </defs>

  <!-- 背景：乾淨象牙白 -->
  <rect width="1920" height="1080" fill="#FAFBFC"/>

  <!-- 主外框（精準對齊，極簡） -->
  <rect x="80" y="80" width="1760" height="920" fill="none" stroke="url(#formalNavy)" stroke-width="2.5"/>

  <!-- 內輔助框（內縮 20px，虛線引導） -->
  <rect x="100" y="100" width="1720" height="880" fill="none" stroke="#3B5998" stroke-width="0.75" stroke-dasharray="4,4" opacity="0.45"/>

  <!-- 四角：六邊形+平行四邊形 幾何組合（Bento Blocks 模組化） -->
  <!-- 左上：六邊形外框 + 平行四邊形斜切 -->
  <g transform="translate(80, 80)">
    <!-- 大六邊形外框 s=50（2.5D 外粗空心） -->
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z"
          fill="none" stroke="url(#formalNavy)" stroke-width="3.5"/>
    <!-- 內實心小六邊形 s=22 -->
    <path d="M22,2.2 L41.05,12.65 L41.05,33.35 L22,44 L2.95,33.35 L2.95,12.65 Z"
          fill="url(#formalNavy)"/>
    <!-- 平行四邊形點綴（技巧 #124 斜切） -->
    <polygon points="58,8 78,8 70,30 50,30" fill="url(#formalSteel)" opacity="0.7"/>
  </g>

  <!-- 右上 -->
  <g transform="translate(1840, 80) scale(-1, 1)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z"
          fill="none" stroke="url(#formalNavy)" stroke-width="3.5"/>
    <path d="M22,2.2 L41.05,12.65 L41.05,33.35 L22,44 L2.95,33.35 L2.95,12.65 Z"
          fill="url(#formalNavy)"/>
    <polygon points="58,8 78,8 70,30 50,30" fill="url(#formalSteel)" opacity="0.7"/>
  </g>

  <!-- 左下 -->
  <g transform="translate(80, 1000) scale(1, -1)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z"
          fill="none" stroke="url(#formalNavy)" stroke-width="3.5"/>
    <path d="M22,2.2 L41.05,12.65 L41.05,33.35 L22,44 L2.95,33.35 L2.95,12.65 Z"
          fill="url(#formalNavy)"/>
    <polygon points="58,8 78,8 70,30 50,30" fill="url(#formalSteel)" opacity="0.7"/>
  </g>

  <!-- 右下 -->
  <g transform="translate(1840, 1000) scale(-1, -1)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z"
          fill="none" stroke="url(#formalNavy)" stroke-width="3.5"/>
    <path d="M22,2.2 L41.05,12.65 L41.05,33.35 L22,44 L2.95,33.35 L2.95,12.65 Z"
          fill="url(#formalNavy)"/>
    <polygon points="58,8 78,8 70,30 50,30" fill="url(#formalSteel)" opacity="0.7"/>
  </g>

  <!-- 頂部引導線 + 中央重點標記 -->
  <line x1="280" y1="80" x2="880" y2="80" stroke="url(#formalNavy)" stroke-width="1" opacity="0.4"/>
  <line x1="1040" y1="80" x2="1640" y2="80" stroke="url(#formalNavy)" stroke-width="1" opacity="0.4"/>
  <!-- 中央焦點：嵌套六邊形（大小對比） -->
  <g transform="translate(960, 80)">
    <path d="M20,2 L37.3,11.5 L37.3,29.5 L20,38 L2.7,29.5 L2.7,11.5 Z"
          fill="none" stroke="url(#formalNavy)" stroke-width="2"/>
    <path d="M10,1 L18.65,5.75 L18.65,14.75 L10,19 L1.35,14.75 L1.35,5.75 Z"
          fill="url(#formalNavy)"/>
  </g>

  <!-- 底部對稱引導線 + 中央重點標記 -->
  <line x1="280" y1="1000" x2="880" y2="1000" stroke="url(#formalNavy)" stroke-width="1" opacity="0.4"/>
  <line x1="1040" y1="1000" x2="1640" y2="1000" stroke="url(#formalNavy)" stroke-width="1" opacity="0.4"/>
  <g transform="translate(960, 1000)">
    <path d="M20,2 L37.3,11.5 L37.3,29.5 L20,38 L2.7,29.5 L2.7,11.5 Z"
          fill="none" stroke="url(#formalNavy)" stroke-width="2"/>
    <path d="M10,1 L18.65,5.75 L18.65,14.75 L10,19 L1.35,14.75 L1.35,5.75 Z"
          fill="url(#formalNavy)"/>
  </g>

  <!-- 左右側邊界引導線（階梯式） -->
  <line x1="80" y1="280" x2="80" y2="500" stroke="url(#formalNavy)" stroke-width="1.2" opacity="0.5"/>
  <line x1="80" y1="540" x2="80" y2="620" stroke="url(#formalNavy)" stroke-width="2.5"/>
  <line x1="80" y1="660" x2="80" y2="880" stroke="url(#formalNavy)" stroke-width="1.2" opacity="0.5"/>

  <line x1="1840" y1="280" x2="1840" y2="500" stroke="url(#formalNavy)" stroke-width="1.2" opacity="0.5"/>
  <line x1="1840" y1="540" x2="1840" y2="620" stroke="url(#formalNavy)" stroke-width="2.5"/>
  <line x1="1840" y1="660" x2="1840" y2="880" stroke="url(#formalNavy)" stroke-width="1.2" opacity="0.5"/>
</svg>