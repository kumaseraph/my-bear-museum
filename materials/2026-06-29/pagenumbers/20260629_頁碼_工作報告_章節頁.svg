<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#5D3A1A"/>
    </linearGradient>
  </defs>
  
  <!-- 頁碼容器（六邊形组合） -->
  <g transform="translate(60,30)">
    <!-- 大六邊形（背景） -->
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z" 
          fill="url(#pageGrad)" fill-opacity="0.2"/>
    
    <!-- 小六邊形疊加（實心） -->
    <g transform="rotate(30)">
      <path d="M0,-15 L12.99,-7.5 L12.99,7.5 L0,15 L-12.99,7.5 L-12.99,-7.5 Z" 
            fill="url(#pageGrad)"/>
    </g>
    
    <!-- 頁碼數字 -->
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F5DEB3">03</text>
  </g>
  
  <!-- 右側引導小六邊形裝飾 -->
  <g transform="translate(95,30)" fill="#D4A574" fill-opacity="0.4">
    <path d="M0,-10 L8.66,-5 L8.66,5 L0,10 L-8.66,5 L-8.66,-5 Z"/>
  </g>
</svg>