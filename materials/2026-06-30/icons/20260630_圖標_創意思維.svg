<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>創意思維</title>
  <desc>工作報告圖標 - 菱形放射五角星，代表創意擴散與多元思維</desc>
  <!-- 背景圓形裝飾 -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#6B5CE7" stroke-width="1" opacity="0.2"/>
  <!-- 中心菱形 -->
  <polygon points="50,15 75,50 50,85 25,50" fill="#6B5CE7"/>
  <!-- 放射五角星 - 四個方向 -->
  <polygon points="50,28 54,42 68,42 56,50 60,64 50,55 40,64 44,50 32,42 46,42" 
           fill="#FF8C00" transform="translate(0,-35) scale(0.5)"/>
  <polygon points="50,28 54,42 68,42 56,50 60,64 50,55 40,64 44,50 32,42 46,42" 
           fill="#FF8C00" transform="translate(38,25) scale(0.5)"/>
  <polygon points="50,28 54,42 68,42 56,50 60,64 50,55 40,64 44,50 32,42 46,42" 
           fill="#FF8C00" transform="translate(0,50) scale(0.5)"/>
  <polygon points="50,28 54,42 68,42 56,50 60,64 50,55 40,64 44,50 32,42 46,42" 
           fill="#FF8C00" transform="translate(-38,25) scale(0.5)"/>
  <!-- 連接線條 -->
  <line x1="50" y1="50" x2="50" y2="15" stroke="#4ECDC4" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="50" y1="50" x2="85" y2="50" stroke="#4ECDC4" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="50" y1="50" x2="50" y2="85" stroke="#4ECDC4" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="50" y1="50" x2="15" y2="50" stroke="#4ECDC4" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>