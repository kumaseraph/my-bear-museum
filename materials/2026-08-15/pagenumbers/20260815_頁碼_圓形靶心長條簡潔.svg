<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <!-- 頁碼：圓形靶心長條 - 技巧 #121 #1 圓形靶心 + #120 #5 顏色深淺對比 -->
  <!-- 設計原則：系統化頁碼（10 顆代表 10 頁量化）、human-made 手作痕跡、品牌識別漸層 -->
  <defs>
    <linearGradient id="dotActive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
  </defs>

  <!-- 左側頁碼大字（決策基準 - 量化呈現） -->
  <text x="50" y="62" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#374151" letter-spacing="-1">07</text>
  <line x1="98" y1="42" x2="98" y2="78" stroke="#9CA3AF" stroke-width="1.2" opacity="0.5"/>

  <!-- 右側靶心點陣（10 顆代表 10 頁量化進度） -->
  <!-- 已完成（深色實心靶心） -->
  <g transform="translate(125,50)">
    <circle cx="0" cy="0" r="10" fill="url(#dotActive)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <g transform="translate(155,50)">
    <circle cx="0" cy="0" r="10" fill="url(#dotActive)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <g transform="translate(185,50)">
    <circle cx="0" cy="0" r="10" fill="url(#dotActive)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <g transform="translate(215,50)">
    <circle cx="0" cy="0" r="10" fill="url(#dotActive)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <g transform="translate(245,50)">
    <circle cx="0" cy="0" r="10" fill="url(#dotActive)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <g transform="translate(275,50)">
    <circle cx="0" cy="0" r="10" fill="url(#dotActive)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>

  <!-- 當前頁（放大靶心 + 強調光環） -->
  <g transform="translate(305,50)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#4ECDC4" stroke-width="1.5" opacity="0.5"/>
    <circle cx="0" cy="0" r="14" fill="#4ECDC4"/>
    <circle cx="0" cy="0" r="10" fill="url(#dotActive)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#4F46E5" text-anchor="middle">現在</text>
  </g>

  <!-- 未完成（淺灰空心） -->
  <g transform="translate(340,50)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>
  </g>
  <g transform="translate(370,50)">
    <circle cx="0" cy="0" r="10" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>
  </g>

  <!-- 上方裝飾虛線（量化基準條） -->
  <line x1="125" y1="22" x2="380" y2="22" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="2,4" opacity="0.5"/>
  <line x1="125" y1="82" x2="380" y2="82" stroke="#9CA3AF" stroke-width="0.8" stroke-dasharray="2,4" opacity="0.5"/>
</svg>
