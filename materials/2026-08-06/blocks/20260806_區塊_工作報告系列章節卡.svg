<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FFF8E7"/><stop offset="1" stop-color="#F5E6D3"/></linearGradient>
    <linearGradient id="g1" x2="1" y2="1"><stop stop-color="#5C3A0E"/><stop offset="1" stop-color="#8B6914"/></linearGradient>
    <linearGradient id="g2" x2="1" y2="1"><stop stop-color="#B8860B"/><stop offset="1" stop-color="#F2B94B"/></linearGradient>
    <pattern id="honeycomb" x="0" y="0" width="78" height="86.6" patternUnits="userSpaceOnUse">
      <path d="M39,0 L78,21.65 L78,64.95 L39,86.6 L0,64.95 L0,21.65 Z" fill="none" stroke="#B8860B" stroke-width="0.6" opacity="0.12"/>
    </pattern>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.27  0 0 0 0 0.07  0 0 0 0.04 0"/></filter>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#8B6914" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#honeycomb)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.5"/>
  <g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
    <text x="120" y="130" font-size="28" fill="#B8860B" font-weight="700" letter-spacing="5">SECTION CARDS · 系列章節卡</text>
    <text x="120" y="205" font-size="62" fill="#5C3A0E" font-weight="800">工作報告 · 章節導覽</text>
    <text x="120" y="253" font-size="25" fill="#8B6914">同構圖語言 · 章節一眼可辨</text>
  </g>
  <!-- 4 個章節卡：第 1 個深色突出（叢集與單一焦點），其餘淺色（#120 變化9） -->
  <g transform="translate(120 340)" filter="url(#s)">
    <path d="M55 0h440l55 55v460l-55 55H55L0 515V55z" fill="url(#g1)"/>
    <path d="M92 45h366l42 42v396l-42 42H92l-42-42V87z" fill="none" stroke="#F2B94B" stroke-opacity=".5" stroke-width="3" stroke-dasharray="10 10"/>
    <text x="55" y="95" font-family="Arial" font-size="22" fill="#F2B94B" letter-spacing="4">SECTION 01</text>
    <text x="55" y="270" font-family="Arial" font-size="140" font-weight="800" fill="#FFFFFF">A</text>
    <text x="55" y="345" font-size="40" font-weight="700" fill="#FFFFFF">現況摘要</text>
    <text x="55" y="400" font-size="23" fill="#F2B94B">成果與關鍵變化</text>
    <text x="55" y="450" font-size="20" fill="#FFFFFF" opacity="0.7">本期 KPI · 重點摘要</text>
    <!-- 進度條 -->
    <rect x="55" y="475" width="395" height="14" rx="7" fill="#FFFFFF" opacity="0.2"/>
    <rect x="55" y="475" width="316" height="14" rx="7" fill="#F2B94B"/>
    <text x="455" y="487" font-size="18" fill="#F2B94B" text-anchor="end">80%</text>
  </g>
  <g transform="translate(575 340)" filter="url(#s)">
    <path d="M55 0h440l55 55v460l-55 55H55L0 515V55z" fill="#FFFFFF" stroke="#B8860B" stroke-width="5"/>
    <path d="M92 45h366l42 42v396l-42 42H92l-42-42V87z" fill="none" stroke="#B8860B" stroke-opacity=".3" stroke-width="3" stroke-dasharray="10 10"/>
    <text x="55" y="95" font-family="Arial" font-size="22" fill="#B8860B" letter-spacing="4">SECTION 02</text>
    <text x="55" y="270" font-family="Arial" font-size="140" font-weight="800" fill="#B8860B">B</text>
    <text x="55" y="345" font-size="40" font-weight="700" fill="#5C3A0E">績效洞察</text>
    <text x="55" y="400" font-size="23" fill="#8B6914">數據背後的訊號</text>
    <text x="55" y="450" font-size="20" fill="#5C3A0E" opacity="0.7">深入分析 · 找出原因</text>
    <rect x="55" y="475" width="395" height="14" rx="7" fill="#F5E6D3"/>
    <rect x="55" y="475" width="356" height="14" rx="7" fill="url(#g2)"/>
    <text x="455" y="487" font-size="18" fill="#B8860B" text-anchor="end">90%</text>
  </g>
  <g transform="translate(1030 340)" filter="url(#s)">
    <path d="M55 0h440l55 55v460l-55 55H55L0 515V55z" fill="#FFFFFF" stroke="#B8860B" stroke-width="5"/>
    <path d="M92 45h366l42 42v396l-42 42H92l-42-42V87z" fill="none" stroke="#B8860B" stroke-opacity=".3" stroke-width="3" stroke-dasharray="10 10"/>
    <text x="55" y="95" font-family="Arial" font-size="22" fill="#B8860B" letter-spacing="4">SECTION 03</text>
    <text x="55" y="270" font-family="Arial" font-size="140" font-weight="800" fill="#B8860B">C</text>
    <text x="55" y="345" font-size="40" font-weight="700" fill="#5C3A0E">行動方案</text>
    <text x="55" y="400" font-size="23" fill="#8B6914">下一步怎麼走</text>
    <text x="55" y="450" font-size="20" fill="#5C3A0E" opacity="0.7">策略對齊 · 執行節奏</text>
    <rect x="55" y="475" width="395" height="14" rx="7" fill="#F5E6D3"/>
    <rect x="55" y="475" width="277" height="14" rx="7" fill="url(#g2)"/>
    <text x="455" y="487" font-size="18" fill="#B8860B" text-anchor="end">70%</text>
  </g>
  <g transform="translate(1485 340)" filter="url(#s)">
    <path d="M55 0h270l55 55v460l-55 55H55L0 515V55z" fill="#FFF8E7" stroke="#B8860B" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="55" y="90" font-family="Arial" font-size="20" fill="#B8860B" letter-spacing="3">SECTION 04</text>
    <text x="55" y="200" font-family="Arial" font-size="100" font-weight="800" fill="#B8860B" opacity="0.5">D</text>
    <text x="55" y="280" font-size="32" font-weight="700" fill="#5C3A0E">風險與展望</text>
    <text x="55" y="325" font-size="20" fill="#8B6914">尚未開始</text>
    <circle cx="180" cy="450" r="22" fill="#B8860B" opacity="0.3"/>
    <text x="180" y="458" font-size="14" fill="#5C3A0E" text-anchor="middle" font-weight="700">?</text>
  </g>
  <!-- 底部說明（What Sets It Apart + Strengths 兩段式） -->
  <g transform="translate(120 920)" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
    <rect x="0" y="0" width="1680" height="80" rx="14" fill="#FFFFFF" stroke="#D4A017" stroke-width="2"/>
    <text x="30" y="32" font-size="20" fill="#B8860B" font-weight="700">獨特設計選擇</text>
    <text x="30" y="60" font-size="18" fill="#5C3A0E">暖棕蜂蜜色 + 六邊形章節框，跨章節同構圖語言</text>
    <line x1="860" y1="15" x2="860" y2="65" stroke="#D4A017" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="890" y="32" font-size="20" fill="#B8860B" font-weight="700">可量化優勢</text>
    <text x="890" y="60" font-size="18" fill="#5C3A0E">讀者 50ms 內辨識章節進度 · 結構化導覽</text>
  </g>
</svg>
