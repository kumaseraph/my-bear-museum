<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- 暖暖棕漸層 -->
    <linearGradient id="warmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="50%" stop-color="#C49B6F"/>
      <stop offset="100%" stop-color="#A67C52"/>
    </linearGradient>
  </defs>

  <!-- 四角熊掌裝飾（實心強調 + 描邊輔助） -->
  <!-- 左上角熊掌 -->
  <g transform="translate(100,100)" opacity="0.85">
    <!-- 掌心大圓 -->
    <circle r="24" fill="url(#warmGold)"/>
    <!-- 4 趾印 -->
    <circle cx="-16" cy="-18" r="9" fill="url(#warmGold)"/>
    <circle cx="-2" cy="-24" r="9" fill="url(#warmGold)"/>
    <circle cx="12" cy="-18" r="9" fill="url(#warmGold)"/>
    <circle cx="20" cy="-6" r="8" fill="url(#warmGold)"/>
  </g>
  <!-- 右上角熊掌（旋轉 90°） -->
  <g transform="translate(1820,100)" opacity="0.85">
    <circle r="24" fill="url(#warmGold)"/>
    <circle cx="-16" cy="-18" r="9" fill="url(#warmGold)"/>
    <circle cx="-2" cy="-24" r="9" fill="url(#warmGold)"/>
    <circle cx="12" cy="-18" r="9" fill="url(#warmGold)"/>
    <circle cx="20" cy="-6" r="8" fill="url(#warmGold)"/>
  </g>
  <!-- 左下角熊掌 -->
  <g transform="translate(100,980)" opacity="0.85">
    <circle r="24" fill="url(#warmGold)"/>
    <circle cx="-16" cy="-18" r="9" fill="url(#warmGold)"/>
    <circle cx="-2" cy="-24" r="9" fill="url(#warmGold)"/>
    <circle cx="12" cy="-18" r="9" fill="url(#warmGold)"/>
    <circle cx="20" cy="-6" r="8" fill="url(#warmGold)"/>
  </g>
  <!-- 右下角熊掌 -->
  <g transform="translate(1820,980)" opacity="0.85">
    <circle r="24" fill="url(#warmGold)"/>
    <circle cx="-16" cy="-18" r="9" fill="url(#warmGold)"/>
    <circle cx="-2" cy="-24" r="9" fill="url(#warmGold)"/>
    <circle cx="12" cy="-18" r="9" fill="url(#warmGold)"/>
    <circle cx="20" cy="-6" r="8" fill="url(#warmGold)"/>
  </g>

  <!-- 邊緣裝飾：六邊形節點鏈（技巧 #120 交錯排列） -->
  <!-- 上邊 -->
  <g opacity="0.55">
    <g transform="translate(360,80)"><path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
                                        fill="#B8845C"/></g>
    <g transform="translate(440,80)"><path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
                                        fill="#B8845C"/></g>
    <g transform="translate(520,80)"><path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
                                        fill="#B8845C"/></g>
    <g transform="translate(1400,80)"><path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
                                         fill="#B8845C"/></g>
    <g transform="translate(1480,80)"><path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
                                         fill="#B8845C"/></g>
    <g transform="translate(1560,80)"><path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
                                         fill="#B8845C"/></g>
  </g>
  <!-- 下邊 -->
  <g opacity="0.55">
    <g transform="translate(360,1000)"><path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
                                          fill="#B8845C"/></g>
    <g transform="translate(440,1000)"><path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
                                          fill="#B8845C"/></g>
    <g transform="translate(520,1000)"><path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
                                          fill="#B8845C"/></g>
    <g transform="translate(1400,1000)"><path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
                                           fill="#B8845C"/></g>
    <g transform="translate(1480,1000)"><path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
                                           fill="#B8845C"/></g>
    <g transform="translate(1560,1000)"><path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
                                           fill="#B8845C"/></g>
  </g>

  <!-- 內框引導（雙重邊框：外粗實心 + 內細虛線） -->
  <rect x="160" y="160" width="1600" height="760"
        fill="none" stroke="#B8845C" stroke-width="2.5" rx="8"/>
  <rect x="180" y="180" width="1560" height="720"
        fill="none" stroke="#B8845C" stroke-width="0.8"
        stroke-dasharray="4,4" opacity="0.5" rx="6"/>
</svg>