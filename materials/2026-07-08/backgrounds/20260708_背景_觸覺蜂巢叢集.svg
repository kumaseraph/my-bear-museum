<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- 蜂巢圖案背景 -->
    <pattern id="honeycombPattern" x="0" y="0" width="78" height="86.6" patternUnits="userSpaceOnUse">
      <path d="M39,0 L78,21.65 L78,64.95 L39,86.6 L0,64.95 L0,21.65 Z" 
            fill="none" stroke="#6B5CE7" stroke-width="1" opacity="0.15"/>
    </pattern>
    
    <!-- 漸層 - 溫暖棕金色系 -->
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3E2"/>
      <stop offset="50%" stop-color="#FDEBD0"/>
      <stop offset="100%" stop-color="#F5E6D3"/>
    </linearGradient>
    
    <!-- 強調色漸層 -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>
  
  <!-- 背景填充 -->
  <rect width="1920" height="1080" fill="url(#warmGradient)"/>
  
  <!-- 蜂巢圖案襯底 -->
  <rect width="1920" height="1080" fill="url(#honeycombPattern)"/>
  
  <!-- 蜂巢叢集 - 左上角大叢集 -->
  <g transform="translate(100, 80)">
    <!-- 中心大六邊形 (s=60) -->
    <path d="M60,5 L119.5,32.5 L119.5,87.5 L60,115 L0.5,87.5 L0.5,32.5 Z" 
          fill="#8B6914" opacity="0.9"/>
    <path d="M60,5 L119.5,32.5 L119.5,87.5 L60,115 L0.5,87.5 L0.5,32.5 Z" 
          fill="none" stroke="#D4A574" stroke-width="3"/>
    
    <!-- 中環六邊形 (s=40) -->
    <g fill="#A67C52" opacity="0.7">
      <path d="M60,-60 L94.6,-30 L94.6,30 L60,60 L25.4,30 L25.4,-30 Z" transform="rotate(0) translate(0,-86.6)"/>
      <path d="M60,-60 L94.6,-30 L94.6,30 L60,60 L25.4,30 L25.4,-30 Z" transform="rotate(60) translate(0,-86.6)"/>
      <path d="M60,-60 L94.6,-30 L94.6,30 L60,60 L25.4,30 L25.4,-30 Z" transform="rotate(120) translate(0,-86.6)"/>
      <path d="M60,-60 L94.6,-30 L94.6,30 L60,60 L25.4,30 L25.4,-30 Z" transform="rotate(180) translate(0,-86.6)"/>
      <path d="M60,-60 L94.6,-30 L94.6,30 L60,60 L25.4,30 L25.4,-30 Z" transform="rotate(240) translate(0,-86.6)"/>
      <path d="M60,-60 L94.6,-30 L94.6,30 L60,60 L25.4,30 L25.4,-30 Z" transform="rotate(300) translate(0,-86.6)"/>
    </g>
    
    <!-- 外環小六邊形 (s=25) -->
    <g fill="none" stroke="#D4A574" stroke-width="1.5">
      <path d="M60,-35 L81.65,-17.5 L81.65,17.5 L60,35 L38.35,17.5 L38.35,-17.5 Z" transform="rotate(30) translate(0,-120)"/>
      <path d="M60,-35 L81.65,-17.5 L81.65,17.5 L60,35 L38.35,17.5 L38.35,-17.5 Z" transform="rotate(90) translate(0,-120)"/>
      <path d="M60,-35 L81.65,-17.5 L81.65,17.5 L60,35 L38.35,17.5 L38.35,-17.5 Z" transform="rotate(150) translate(0,-120)"/>
      <path d="M60,-35 L81.65,-17.5 L81.65,17.5 L60,35 L38.35,17.5 L38.35,-17.5 Z" transform="rotate(210) translate(0,-120)"/>
      <path d="M60,-35 L81.65,-17.5 L81.65,17.5 L60,35 L38.35,17.5 L38.35,-17.5 Z" transform="rotate(270) translate(0,-120)"/>
      <path d="M60,-35 L81.65,-17.5 L81.65,17.5 L60,35 L38.35,17.5 L38.35,-17.5 Z" transform="rotate(330) translate(0,-120)"/>
    </g>
  </g>
  
  <!-- 蜂巢叢集 - 右下角叢集 -->
  <g transform="translate(1650, 850)">
    <!-- 中心大六邊形 -->
    <path d="M50,5 L99.5,27.5 L99.5,72.5 L50,95 L0.5,72.5 L0.5,27.5 Z" 
          fill="#6B5CE7" opacity="0.8"/>
    <path d="M50,5 L99.5,27.5 L99.5,72.5 L50,95 L0.5,72.5 L0.5,27.5 Z" 
          fill="none" stroke="#A78BFA" stroke-width="2.5"/>
    
    <!-- 中環 -->
    <g fill="#8B6914" opacity="0.5">
      <path d="M50,-50 L78.65,-25 L78.65,25 L50,50 L21.35,25 L21.35,-25 Z" transform="rotate(0) translate(0,-70)"/>
      <path d="M50,-50 L78.65,-25 L78.65,25 L50,50 L21.35,25 L21.35,-25 Z" transform="rotate(60) translate(0,-70)"/>
      <path d="M50,-50 L78.65,-25 L78.65,25 L50,50 L21.35,25 L21.35,-25 Z" transform="rotate(120) translate(0,-70)"/>
      <path d="M50,-50 L78.65,-25 L78.65,25 L50,50 L21.35,25 L21.35,-25 Z" transform="rotate(180) translate(0,-70)"/>
      <path d="M50,-50 L78.65,-25 L78.65,25 L50,50 L21.35,25 L21.35,-25 Z" transform="rotate(240) translate(0,-70)"/>
      <path d="M50,-50 L78.65,-25 L78.65,25 L50,50 L21.35,25 L21.35,-25 Z" transform="rotate(300) translate(0,-70)"/>
    </g>
  </g>
  
  <!-- 蜂巢叢集 - 右上角小叢集 -->
  <g transform="translate(1750, 150)">
    <path d="M35,3.5 L69.65,19.25 L69.65,50.75 L35,66.5 L0.35,50.75 L0.35,19.25 Z" 
          fill="#D4A574" opacity="0.6"/>
    <path d="M35,3.5 L69.65,19.25 L69.65,50.75 L35,66.5 L0.35,50.75 L0.35,19.25 Z" 
          fill="none" stroke="#8B6914" stroke-width="2"/>
  </g>
  
  <!-- 觸覺紋理元素 - 手繪風格圓點裝飾 -->
  <g fill="#D4A574" opacity="0.4">
    <circle cx="300" cy="900" r="8"/>
    <circle cx="330" cy="920" r="5"/>
    <circle cx="280" cy="930" r="6"/>
    <circle cx="350" cy="880" r="4"/>
    
    <circle cx="1600" cy="200" r="7"/>
    <circle cx="1630" cy="180" r="5"/>
    <circle cx="1570" cy="190" r="4"/>
    
    <circle cx="960" cy="100" r="6"/>
    <circle cx="1000" cy="80" r="4"/>
    <circle cx="920" cy="70" r="5"/>
  </g>
  
  <!-- 自然主義植物元素 - 底部裝飾 -->
  <g transform="translate(0, 980)" opacity="0.3">
    <path d="M0,100 Q50,80 100,100 Q150,120 200,100 Q250,80 300,100" 
          stroke="#6B8E23" stroke-width="2" fill="none"/>
    <path d="M200,100 Q250,60 300,100 Q350,140 400,100" 
          stroke="#6B8E23" stroke-width="2" fill="none"/>
    <path d="M400,100 Q450,50 500,100 Q550,150 600,100" 
          stroke="#6B8E23" stroke-width="2" fill="none"/>
    <path d="M600,100 Q650,70 700,100 Q750,130 800,100" 
          stroke="#6B8E23" stroke-width="2" fill="none"/>
    <path d="M800,100 Q850,60 900,100 Q950,140 1000,100" 
          stroke="#6B8E23" stroke-width="2" fill="none"/>
    <path d="M1000,100 Q1050,80 1100,100 Q1150,120 1200,100" 
          stroke="#6B8E23" stroke-width="2" fill="none"/>
    <path d="M1200,100 Q1250,50 1300,100 Q1350,150 1400,100" 
          stroke="#6B8E23" stroke-width="2" fill="none"/>
    <path d="M1400,100 Q1450,70 1500,100 Q1550,130 1600,100" 
          stroke="#6B8E23" stroke-width="2" fill="none"/>
    <path d="M1600,100 Q1650,60 1700,100 Q1750,140 1800,100" 
          stroke="#6B8E23" stroke-width="2" fill="none"/>
    <path d="M1800,100 Q1850,80 1920,100" 
          stroke="#6B8E23" stroke-width="2" fill="none"/>
  </g>
</svg>