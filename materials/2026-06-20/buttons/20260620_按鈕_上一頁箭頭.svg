<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <title>上一頁按鈕</title>
  <desc>帶有邊界引導線的現代化上一頁按鈕，採用平行四邊形設計</desc>
  <defs>
    <linearGradient id="btnGradPrev" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glowPrev" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景引導線（條紋疊加效果） -->
  <g opacity="0.15">
    <line x1="300" y1="20" x2="0" y2="10" stroke="#6B5CE7" stroke-width="1"/>
    <line x1="300" y1="35" x2="0" y2="25" stroke="#6B5CE7" stroke-width="1"/>
    <line x1="300" y1="50" x2="0" y2="40" stroke="#6B5CE7" stroke-width="1"/>
    <line x1="300" y1="65" x2="0" y2="55" stroke="#6B5CE7" stroke-width="1"/>
  </g>
  
  <!-- 平行四邊形按鈕主體 -->
  <g transform="translate(150,40)" filter="url(#glowPrev)">
    <!-- 外層空心（2.5D效果） -->
    <polygon points="-30,-25 60,-25 40,25 -50,25" 
             fill="none" stroke="#6B5CE7" stroke-width="3" transform="skewX(15)"/>
    <!-- 內層實心 -->
    <polygon points="-30,-25 60,-25 40,25 -50,25" 
             fill="url(#btnGradPrev)" fill-opacity="0.85" transform="skewX(15)"/>
  </g>
  
  <!-- 箭頭圖標（向左） -->
  <g transform="translate(100,40)">
    <polygon points="0,-8 -16,0 0,8" fill="#FFFFFF" opacity="0.95"/>
    <line x1="8" y1="0" x2="-8" y2="0" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- 文字標籤 -->
  <text x="195" y="45" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="bold" opacity="0.95">
    上一步
  </text>
</svg>