<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img">
  <title>工作報告敘事階梯流程圖</title>
  <desc>5步驟平行四邊形階梯式工作報告流程圖</desc>
  <defs>
    <filter id="paperTexture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="textured"/>
      <feComposite in="textured" in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="step1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="step2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="step3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="step4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="step5Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L12,6 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowPink" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L12,6 z" fill="#FB7185"/>
    </marker>
    <marker id="arrowYellow" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L12,6 z" fill="#FBBF24"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L12,6 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L12,6 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- 標題區 -->
  <text x="960" y="75" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="52" font-weight="bold" fill="#F8FAFC" text-anchor="middle">工作報告敘事流程</text>
  <text x="960" y="115" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="24" fill="#22D3EE" text-anchor="middle" opacity="0.85">5步驟完成高效工作報告</text>

  <!-- 步驟節點：先畫形狀 -->
  <!-- STEP 1: translate(100,200), bbox (100..360, 200..350) -->
  <g transform="translate(100,200)">
    <polygon points="0,0 220,0 260,150 40,150" fill="url(#step1Grad)" opacity="0.92"/>
    <polygon points="0,0 220,0 260,150 40,150" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="130" y="55" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC" text-anchor="middle">STEP 1</text>
    <text x="130" y="95" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#172554" text-anchor="middle">明確目標</text>
    <text x="130" y="125" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#1e3a5f" text-anchor="middle">設定SMART目標</text>
  </g>

  <!-- STEP 2: translate(440,320), bbox (440..700, 320..470) -->
  <g transform="translate(440,320)">
    <polygon points="0,0 220,0 260,150 40,150" fill="url(#step2Grad)" opacity="0.92"/>
    <polygon points="0,0 220,0 260,150 40,150" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="130" y="55" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC" text-anchor="middle">STEP 2</text>
    <text x="130" y="95" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">資料收集</text>
    <text x="130" y="125" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#fce7f3" text-anchor="middle">數據與事實</text>
  </g>

  <!-- STEP 3: translate(780,440), bbox (780..1040, 440..590) -->
  <g transform="translate(780,440)">
    <polygon points="0,0 220,0 260,150 40,150" fill="url(#step3Grad)" opacity="0.92"/>
    <polygon points="0,0 220,0 260,150 40,150" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="130" y="55" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="24" font-weight="bold" fill="#172554" text-anchor="middle">STEP 3</text>
    <text x="130" y="95" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#172554" text-anchor="middle">結構建構</text>
    <text x="130" y="125" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#422006" text-anchor="middle">金字塔原理</text>
  </g>

  <!-- STEP 4: translate(1120,560), bbox (1120..1380, 560..710) -->
  <g transform="translate(1120,560)">
    <polygon points="0,0 220,0 260,150 40,150" fill="url(#step4Grad)" opacity="0.92"/>
    <polygon points="0,0 220,0 260,150 40,150" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="130" y="55" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC" text-anchor="middle">STEP 4</text>
    <text x="130" y="95" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">行動方案</text>
    <text x="130" y="125" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#d1fae5" text-anchor="middle">具體可行</text>
  </g>

  <!-- STEP 5: translate(1460,680), bbox (1460..1720, 680..830) -->
  <g transform="translate(1460,680)">
    <polygon points="0,0 220,0 260,150 40,150" fill="url(#step5Grad)" opacity="0.92"/>
    <polygon points="0,0 220,0 260,150 40,150" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="130" y="55" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="24" font-weight="bold" fill="#F8FAFC" text-anchor="middle">STEP 5</text>
    <text x="130" y="95" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">成果展現</text>
    <text x="130" y="125" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#ddd6fe" text-anchor="middle">總結與呼籲</text>
  </g>

  <!-- 連接線：端點僅接觸邊界 -->
  <path d="M 340 275 L 460 395" fill="none" stroke="#22D3EE" stroke-width="4" marker-end="url(#arrowCyan)"/>
  <path d="M 680 395 L 800 515" fill="none" stroke="#FB7185" stroke-width="4" marker-end="url(#arrowPink)"/>
  <path d="M 1020 515 L 1140 635" fill="none" stroke="#FBBF24" stroke-width="4" marker-end="url(#arrowYellow)"/>
  <path d="M 1360 635 L 1480 755" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <!-- 底部裝飾 -->
  <rect x="0" y="1000" width="1920" height="80" fill="#172554" opacity="0.5"/>
  <text x="960" y="1045" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">一圖一洞見 · 可訪問性高對比 · 行動優先資料極簡</text>

  <!-- 紙紋覆蓋 -->
  <rect width="1920" height="1080" fill="#f8fafc" opacity="0.025" filter="url(#paperTexture)"/>
</svg>