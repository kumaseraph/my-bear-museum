<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <pattern id="diagonalLines" patternUnits="userSpaceOnUse" width="8" height="8">
      <line x1="0" y1="8" x2="8" y2="0" stroke="#6B5CE7" stroke-width="1" opacity="0.3"/>
    </pattern>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bg4)"/>
  
  <!-- 斜向條紋裝飾 -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#diagonalLines)" opacity="0.5"/>
  
  <!-- 標題 -->
  <text x="960" y="80" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="36" font-weight="bold">資料處理流程</text>
  <text x="960" y="115" text-anchor="middle" fill="#94A3B8" font-family="Arial, sans-serif" font-size="18">DATA PROCESSING WORKFLOW</text>
  
  <!-- 流程主軸線 -->
  <line x1="200" y1="550" x2="1720" y2="550" stroke="#4ECDC4" stroke-width="3" opacity="0.5"/>
  
  <!-- 輸入節點 -->
  <g transform="translate(200, 550)">
    <polygon points="0,-40 60,-40 80,0 60,40 0,40 -20,0" fill="#6B5CE7" filter="url(#glow4)"/>
    <polygon points="0,-40 60,-40 80,0 60,40 0,40 -20,0" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <text x="30" y="8" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="14" font-weight="bold">輸入</text>
  </g>
  
  <!-- 連接線1 -->
  <g transform="translate(300, 550)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#4ECDC4" stroke-width="3"/>
    <polygon points="120,-8 140,0 120,8" fill="#4ECDC4"/>
  </g>
  
  <!-- 處理節點1：驗證 -->
  <g transform="translate(500, 550)">
    <rect x="-80" y="-50" width="160" height="100" rx="10" fill="#4ECDC4" filter="url(#glow4)"/>
    <rect x="-80" y="-50" width="160" height="100" rx="10" fill="none" stroke="#67E8F9" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="16" font-weight="bold">資料驗證</text>
    <text x="0" y="15" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="12">檢查完整性</text>
  </g>
  
  <!-- 連接線2 -->
  <g transform="translate(600, 550)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#4ECDC4" stroke-width="3"/>
    <polygon points="120,-8 140,0 120,8" fill="#4ECDC4"/>
  </g>
  
  <!-- 處理節點2：清洗 -->
  <g transform="translate(800, 550)">
    <rect x="-80" y="-50" width="160" height="100" rx="10" fill="#0EA5E9" filter="url(#glow4)"/>
    <rect x="-80" y="-50" width="160" height="100" rx="10" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="16" font-weight="bold">資料清洗</text>
    <text x="0" y="15" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="12">去除雜訊</text>
  </g>
  
  <!-- 連接線3 -->
  <g transform="translate(900, 550)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#4ECDC4" stroke-width="3"/>
    <polygon points="120,-8 140,0 120,8" fill="#4ECDC4"/>
  </g>
  
  <!-- 處理節點3：分析 -->
  <g transform="translate(1100, 550)">
    <rect x="-80" y="-50" width="160" height="100" rx="10" fill="#6B5CE7" filter="url(#glow4)"/>
    <rect x="-80" y="-50" width="160" height="100" rx="10" fill="none" stroke="#A78BFA" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="16" font-weight="bold">數據分析</text>
    <text x="0" y="15" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="12">統計建模</text>
  </g>
  
  <!-- 連接線4 -->
  <g transform="translate(1200, 550)">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#4ECDC4" stroke-width="3"/>
    <polygon points="120,-8 140,0 120,8" fill="#4ECDC4"/>
  </g>
  
  <!-- 輸出節點 -->
  <g transform="translate(1400, 550)">
    <polygon points="0,-40 60,-40 80,0 60,40 0,40 -20,0" fill="#FF8C00" filter="url(#glow4)"/>
    <polygon points="0,-40 60,-40 80,0 60,40 0,40 -20,0" fill="none" stroke="#FBBF24" stroke-width="2"/>
    <text x="30" y="8" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="14" font-weight="bold">輸出</text>
  </g>
  
  <!-- 上方說明區 -->
  <g transform="translate(200, 250)">
    <rect x="0" y="0" width="1520" height="180" rx="15" fill="#4C1D95" opacity="0.3"/>
    <rect x="0" y="0" width="1520" height="180" rx="15" fill="none" stroke="#6B5CE7" stroke-width="1" opacity="0.5"/>
    
    <!-- 四個要點卡片 -->
    <g transform="translate(120, 90)">
      <rect x="-80" y="-40" width="160" height="80" rx="8" fill="#6B5CE7" opacity="0.8"/>
      <rect x="-80" y="-40" width="160" height="80" rx="8" fill="none" stroke="#A78BFA" stroke-width="1"/>
      <text x="0" y="-5" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="13" font-weight="bold">資料輸入</text>
      <text x="0" y="15" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="11">收集原始資料</text>
    </g>
    
    <g transform="translate(500, 90)">
      <rect x="-80" y="-40" width="160" height="80" rx="8" fill="#4ECDC4" opacity="0.8"/>
      <rect x="-80" y="-40" width="160" height="80" rx="8" fill="none" stroke="#67E8F9" stroke-width="1"/>
      <text x="0" y="-5" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="13" font-weight="bold">驗證清洗</text>
      <text x="0" y="15" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="11">品質管控</text>
    </g>
    
    <g transform="translate(880, 90)">
      <rect x="-80" y="-40" width="160" height="80" rx="8" fill="#0EA5E9" opacity="0.8"/>
      <rect x="-80" y="-40" width="160" height="80" rx="8" fill="none" stroke="#38BDF8" stroke-width="1"/>
      <text x="0" y="-5" text-anchor="middle" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="13" font-weight="bold">分析建模</text>
      <text x="0" y="15" text-anchor="middle" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="11">洞察發現</text>
    </g>
    
    <g transform="translate(1260, 90)">
      <rect x="-80" y="-40" width="160" height="80" rx="8" fill="#FF8C00" opacity="0.8"/>
      <rect x="-80" y="-40" width="160" height="80" rx="8" fill="none" stroke="#FBBF24" stroke-width="1"/>
      <text x="0" y="-5" text-anchor="middle" fill="#0F172A" font-family="Arial, sans-serif" font-size="13" font-weight="bold">報告產出</text>
      <text x="0" y="15" text-anchor="middle" fill="#1E293B" font-family="Arial, sans-serif" font-size="11">決策支持</text>
    </g>
  </g>
  
  <!-- 底部裝飾六邊形 -->
  <g opacity="0.15">
    <polygon points="1500,850 1530,875 1530,925 1500,950 1470,925 1470,875" fill="#4ECDC4"/>
    <polygon points="1650,800 1680,825 1680,875 1650,900 1620,875 1620,825" fill="#FF8C00"/>
  </g>
  
  <!-- 技巧說明 -->
  <text x="960" y="1000" text-anchor="middle" fill="#64748B" font-family="Arial, sans-serif" font-size="12">條紋疊加（#124-5）| 線條引導（#124-2）| 觸覺極繁</text>
</svg>