<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <!-- 溫暖棕金漸層 -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="50%" stop-color="#FDEBD0"/>
      <stop offset="100%" stop-color="#F5E6D3"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <!-- 蜂巢圖案 -->
    <pattern id="hexPattern" x="0" y="0" width="30" height="26" patternUnits="userSpaceOnUse">
      <path d="M15,0 L30,8.66 L30,17.32 L15,26 L0,17.32 L0,8.66 Z" 
            fill="none" stroke="#D4A574" stroke-width="0.5" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- 卡片背景 -->
  <rect x="10" y="10" width="380" height="180" rx="12" fill="url(#cardGrad)"/>
  <rect x="10" y="10" width="380" height="180" rx="12" fill="url(#hexPattern)"/>
  
  <!-- 外框 - 蜂巢風格 2.5D 效果 -->
  <rect x="10" y="10" width="380" height="180" rx="12" 
        fill="none" stroke="#8B6914" stroke-width="3"/>
  
  <!-- 左側強調條 -->
  <rect x="10" y="10" width="8" height="180" rx="4" fill="url(#accentGrad)"/>
  
  <!-- 蜂巢裝飾 - 右上角 -->
  <g transform="translate(340, 25)">
    <path d="M15,1.5 L28.5,9 L28.5,24 L15,31.5 L1.5,24 L1.5,9 Z" 
          fill="#D4A574" opacity="0.3"/>
    <path d="M15,1.5 L28.5,9 L28.5,24 L15,31.5 L1.5,24 L1.5,9 Z" 
          fill="none" stroke="#8B6914" stroke-width="1.5"/>
  </g>
  
  <!-- 標題區 -->
  <rect x="30" y="30" width="100" height="10" rx="3" fill="#8B6914" opacity="0.8"/>
  
  <!-- 內容區 - 三行文字示意 -->
  <g stroke="#D4A574" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="30" y1="60" x2="280" y2="60"/>
    <line x1="30" y1="75" x2="350" y2="75"/>
    <line x1="30" y1="90" x2="320" y2="90"/>
  </g>
  
  <!-- 底部裝飾 - 小蜂巢叢集 -->
  <g transform="translate(300, 140)">
    <path d="M10,1 L19,5.5 L19,14.5 L10,19 L1,14.5 L1,5.5 Z" 
          fill="#6B5CE7" opacity="0.2"/>
    <path d="M30,6 L39,10.5 L39,19.5 L30,24 L21,19.5 L21,10.5 Z" 
          fill="#6B5CE7" opacity="0.15"/>
    <path d="M20,16 L29,20.5 L29,29.5 L20,34 L11,29.5 L11,20.5 Z" 
          fill="#6B5CE7" opacity="0.1"/>
  </g>
  
  <!-- 數據指標裝飾 -->
  <g transform="translate(30, 130)">
    <circle cx="10" cy="10" r="8" fill="#D4A574" opacity="0.6"/>
    <circle cx="40" cy="10" r="8" fill="#8B6914" opacity="0.4"/>
    <circle cx="70" cy="10" r="8" fill="#D4A574" opacity="0.3"/>
  </g>
</svg>