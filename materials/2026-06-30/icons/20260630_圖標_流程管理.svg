<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="240" height="160">
  <title>流程管理</title>
  <desc>工作報告圖標 - 菱形與五角星交替排列，代表流程節奏與階段管理</desc>
  <!-- 第一組：菱形 + 五角星 -->
  <g transform="translate(10,10)">
    <polygon points="25,0 50,25 25,50 0,25" fill="#6B5CE7"/>
    <polygon points="25,8 29,20 42,20 31,27 35,40 25,33 15,40 19,27 8,20 21,20" 
             fill="none" stroke="#FF8C00" stroke-width="2" transform="translate(25,25) scale(0.5)"/>
  </g>
  <!-- 第二組：五角星 + 菱形 -->
  <g transform="translate(55,10)">
    <polygon points="25,0 50,25 25,50 0,25" fill="none" stroke="#4ECDC4" stroke-width="2"/>
    <polygon points="25,8 29,20 42,20 31,27 35,40 25,33 15,40 19,27 8,20 21,20" 
             fill="#FF8C00" transform="translate(25,25) scale(0.5)"/>
  </g>
  <!-- 第三組：菱形 + 五角星 -->
  <g transform="translate(100,10)">
    <polygon points="25,0 50,25 25,50 0,25" fill="#6B5CE7"/>
    <polygon points="25,8 29,20 42,20 31,27 35,40 25,33 15,40 19,27 8,20 21,20" 
             fill="none" stroke="#FF8C00" stroke-width="2" transform="translate(25,25) scale(0.5)"/>
  </g>
  <!-- 連接箭頭 -->
  <path d="M45,35 L50,30 L55,35 L50,40 Z" fill="#4ECDC4"/>
  <path d="M90,35 L95,30 L100,35 L95,40 Z" fill="#4ECDC4"/>
</svg>