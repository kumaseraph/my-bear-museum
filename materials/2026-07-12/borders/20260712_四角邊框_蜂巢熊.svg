<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>蜂巢熊四角邊框</title>
  <desc>熊熊風格蜂巢六邊形四角邊框，工作報告素材</desc>
  
  <defs>
    <!-- 熊熊暖色調漸層 -->
    <linearGradient id="bearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="50%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#F5DEB3"/>
    </linearGradient>
    <linearGradient id="bearGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
  </defs>
  
  <!-- 左上角蜂巢叢集 -->
  <g transform="translate(30,30)">
    <!-- 大六邊形 (s=50) - 外粗空心 2.5D效果 -->
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="none" stroke="#8B5A2B" stroke-width="6"/>
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="#D4A574" fill-opacity="0.4"/>
    
    <!-- 小六邊形叢集 (s=25) -->
    <g transform="translate(60,70)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z" 
            fill="#6B4423" fill-opacity="0.8"/>
    </g>
    <g transform="translate(85,50)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z" 
            fill="none" stroke="#8B5A2B" stroke-width="2"/>
    </g>
    <g transform="translate(10,60)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z" 
            fill="#D4A574" fill-opacity="0.6"/>
    </g>
  </g>
  
  <!-- 右上角蜂巢叢集 -->
  <g transform="translate(1750,30)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="none" stroke="#8B5A2B" stroke-width="6"/>
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="#D4A574" fill-opacity="0.4"/>
    
    <g transform="translate(-60,70)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z" 
            fill="#6B4423" fill-opacity="0.8"/>
    </g>
    <g transform="translate(-85,50)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z" 
            fill="none" stroke="#8B5A2B" stroke-width="2"/>
    </g>
    <g transform="translate(-10,60)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z" 
            fill="#D4A574" fill-opacity="0.6"/>
    </g>
  </g>
  
  <!-- 左下角蜂巢叢集 -->
  <g transform="translate(30,930)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="none" stroke="#8B5A2B" stroke-width="6"/>
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="#D4A574" fill-opacity="0.4"/>
    
    <g transform="translate(60,-70)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z" 
            fill="#6B4423" fill-opacity="0.8"/>
    </g>
    <g transform="translate(85,-90)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z" 
            fill="none" stroke="#8B5A2B" stroke-width="2"/>
    </g>
    <g transform="translate(10,-80)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z" 
            fill="#D4A574" fill-opacity="0.6"/>
    </g>
  </g>
  
  <!-- 右下角蜂巢叢集 -->
  <g transform="translate(1750,930)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="none" stroke="#8B5A2B" stroke-width="6"/>
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="#D4A574" fill-opacity="0.4"/>
    
    <g transform="translate(-60,-70)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z" 
            fill="#6B4423" fill-opacity="0.8"/>
    </g>
    <g transform="translate(-85,-90)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z" 
            fill="none" stroke="#8B5A2B" stroke-width="2"/>
    </g>
    <g transform="translate(-10,-80)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z" 
            fill="#D4A574" fill-opacity="0.6"/>
    </g>
  </g>
  
  <!-- 頂部邊界裝飾線 -->
  <line x1="150" y1="25" x2="1770" y2="25" stroke="#8B5A2B" stroke-width="2" stroke-dasharray="15,8"/>
  <line x1="150" y1="35" x2="1770" y2="35" stroke="#D4A574" stroke-width="1" stroke-dasharray="8,5"/>
  
  <!-- 底部邊界裝飾線 -->
  <line x1="150" y1="1055" x2="1770" y2="1055" stroke="#8B5A2B" stroke-width="2" stroke-dasharray="15,8"/>
  <line x1="150" y1="1045" x2="1770" y2="1045" stroke="#D4A574" stroke-width="1" stroke-dasharray="8,5"/>
</svg>