<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- 蜂蜜色徑向漸層（聚焦效果） -->
    <radialGradient id="honeyRadial" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFE4B5"/>
      <stop offset="40%" stop-color="#F5C77E"/>
      <stop offset="80%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#A67C52"/>
    </radialGradient>
  </defs>

  <!-- 主底色 -->
  <rect width="1920" height="1080" fill="url(#honeyRadial)"/>

  <!-- 放射環形蜂巢（技巧 #122 變化3，三環結構） -->
  <g transform="translate(960,540)" opacity="0.55">
    <!-- 中心 -->
    <path d="M0,-60 L52,-30 L52,30 L0,60 L-52,30 L-52,-30 Z"
          fill="#8B5A2B" fill-opacity="0.7"/>
    <!-- 1環：6個 -->
    <g transform="rotate(0)">
      <path d="M0,-45 L39,-22.5 L39,22.5 L0,45 L-39,22.5 L-39,-22.5 Z"
            fill="#B8845C" fill-opacity="0.6" transform="translate(0,-100)"/>
    </g>
    <g transform="rotate(60)">
      <path d="M0,-45 L39,-22.5 L39,22.5 L0,45 L-39,22.5 L-39,-22.5 Z"
            fill="#B8845C" fill-opacity="0.6" transform="translate(0,-100)"/>
    </g>
    <g transform="rotate(120)">
      <path d="M0,-45 L39,-22.5 L39,22.5 L0,45 L-39,22.5 L-39,-22.5 Z"
            fill="#B8845C" fill-opacity="0.6" transform="translate(0,-100)"/>
    </g>
    <g transform="rotate(180)">
      <path d="M0,-45 L39,-22.5 L39,22.5 L0,45 L-39,22.5 L-39,-22.5 Z"
            fill="#B8845C" fill-opacity="0.6" transform="translate(0,-100)"/>
    </g>
    <g transform="rotate(240)">
      <path d="M0,-45 L39,-22.5 L39,22.5 L0,45 L-39,22.5 L-39,-22.5 Z"
            fill="#B8845C" fill-opacity="0.6" transform="translate(0,-100)"/>
    </g>
    <g transform="rotate(300)">
      <path d="M0,-45 L39,-22.5 L39,22.5 L0,45 L-39,22.5 L-39,-22.5 Z"
            fill="#B8845C" fill-opacity="0.6" transform="translate(0,-100)"/>
    </g>

    <!-- 2環：12個（小六邊形） -->
    <g transform="rotate(0)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="1.2" transform="translate(0,-180)"/>
    </g>
    <g transform="rotate(30)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="1.2" transform="translate(0,-180)"/>
    </g>
    <g transform="rotate(60)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="1.2" transform="translate(0,-180)"/>
    </g>
    <g transform="rotate(90)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="1.2" transform="translate(0,-180)"/>
    </g>
    <g transform="rotate(120)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="1.2" transform="translate(0,-180)"/>
    </g>
    <g transform="rotate(150)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="1.2" transform="translate(0,-180)"/>
    </g>
    <g transform="rotate(180)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="1.2" transform="translate(0,-180)"/>
    </g>
    <g transform="rotate(210)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="1.2" transform="translate(0,-180)"/>
    </g>
    <g transform="rotate(240)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="1.2" transform="translate(0,-180)"/>
    </g>
    <g transform="rotate(270)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="1.2" transform="translate(0,-180)"/>
    </g>
    <g transform="rotate(300)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="1.2" transform="translate(0,-180)"/>
    </g>
    <g transform="rotate(330)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="1.2" transform="translate(0,-180)"/>
    </g>

    <!-- 3環：18個最小六邊形（虛線裝飾） -->
    <g transform="rotate(0)" opacity="0.5">
      <path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
            fill="none" stroke="#8B5A2B" stroke-width="0.6" stroke-dasharray="3,2"
            transform="translate(0,-260)"/>
    </g>
  </g>

  <!-- 四角小裝飾 -->
  <g opacity="0.35">
    <g transform="translate(180,180)">
      <path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
            fill="#8B5A2B" transform="rotate(30)"/>
    </g>
    <g transform="translate(1740,180)">
      <path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
            fill="#8B5A2B" transform="rotate(60)"/>
    </g>
    <g transform="translate(180,900)">
      <path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
            fill="#8B5A2B" transform="rotate(120)"/>
    </g>
    <g transform="translate(1740,900)">
      <path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
            fill="#8B5A2B" transform="rotate(180)"/>
    </g>
