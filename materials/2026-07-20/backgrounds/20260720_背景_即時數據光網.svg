<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <filter id="handDrawn" x="-3%" y="-3%" width="106%" height="106%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="2" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect fill="url(#bgGrad)" width="1920" height="1080"/>

  <!-- ==================== 左中內容區（乾淨） ==================== -->
  <!-- 啞鈴暗示 -->
  <rect x="200" y="510" width="400" height="60" rx="30"
    fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="6,10" opacity="0.1"/>
  <circle cx="280" cy="540" r="5" fill="#3B82F6" opacity="0.1"/>
  <circle cx="520" cy="540" r="5" fill="#3B82F6" opacity="0.1"/>

  <!-- 中央內容區啞鈴 -->
  <rect x="760" y="520" width="400" height="40" rx="20"
    fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="8,8" opacity="0.12"/>
  <circle cx="840" cy="540" r="5" fill="#3B82F6" opacity="0.1"/>
  <circle cx="1080" cy="540" r="5" fill="#3B82F6" opacity="0.1"/>

  <!-- ==================== 邊緣 Bento 模組節點（左側，36px 內縮） ==================== -->
  <rect x="36" y="180" width="120" height="160"
    fill="#1E40AF" fill-opacity="0.15" stroke="#1E40AF" stroke-width="1.5"/>
  <rect x="36" y="180" width="120" height="160"
    fill="url(#glowBg)"/>
  <!-- 內部節點線 -->
  <line x1="46" y1="260" x2="146" y2="260" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
  <line x1="46" y1="220" x2="116" y2="220" stroke="#3B82F6" stroke-width="0.75" opacity="0.25"/>

  <rect x="36" y="360" width="120" height="120"
    fill="none" stroke="#1E40AF" stroke-width="1"/>
  <circle cx="96" cy="420" r="8" fill="#3B82F6" opacity="0.6"/>

  <rect x="36" y="500" width="120" height="180"
    fill="#1E40AF" fill-opacity="0.1" stroke="#1E40AF" stroke-width="1"/>
  <!-- 微型六邊形 -->
  <g transform="translate(96, 590)">
    <polygon points="25,0 50,14 50,43 25,57 0,43 0,14"
      fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    <polygon points="25,6 44,18 44,40 25,52 6,40 6,18"
      fill="#3B82F6" fill-opacity="0.2"/>
  </g>

  <rect x="36" y="700" width="120" height="140"
    fill="none" stroke="#1E40AF" stroke-width="1"/>
  <circle cx="96" cy="770" r="12" fill="none" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="96" cy="770" r="5" fill="#F59E0B" opacity="0.7"/>

  <rect x="36" y="860" width="120" height="140"
    fill="#1E40AF" fill-opacity="0.08" stroke="#1E40AF" stroke-width="1"/>

  <!-- ==================== 邊緣 Bento 模組節點（頂部） ==================== -->
  <rect x="176" y="36" width="200" height="44"
    fill="#1E40AF" fill-opacity="0.12" stroke="#1E40AF" stroke-width="1.5"/>
  <line x1="196" y1="58" x2="356" y2="58" stroke="#3B82F6" stroke-width="1" opacity="0.35"/>

  <rect x="396" y="36" width="300" height="44"
    fill="none" stroke="#1E40AF" stroke-width="1"/>
  <rect x="416" y="47" width="180" height="22"
    fill="#3B82F6" fill-opacity="0.08"/>
  <line x1="416" y1="58" x2="596" y2="58" stroke="#3B82F6" stroke-width="0.75" opacity="0.3" stroke-dasharray="4,6"/>

  <rect x="716" y="36" width="220" height="44"
    fill="#1E40AF" fill-opacity="0.08" stroke="#1E40AF" stroke-width="1"/>
  <circle cx="826" cy="58" r="6" fill="#3B82F6" opacity="0.6"/>

  <rect x="956" y="36" width="360" height="44"
    fill="none" stroke="#1E40AF" stroke-width="1.5"/>
  <rect x="976" y="47" width="220" height="22"
    fill="url(#flowGrad)" opacity="0.15"/>

  <rect x="1336" y="36" width="200" height="44"
    fill="#1E40AF" fill-opacity="0.1" stroke="#1E40AF" stroke-width="1"/>
  <circle cx="1436" cy="58" r="10" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="1436" cy="58" r="4" fill="#F59E0B"/>

  <rect x="1556" y="36" width="200" height="44"
    fill="none" stroke="#1E40AF" stroke-width="1"/>
  <rect x="1576" y="47" width="100" height="22"
    fill="#1E40AF" fill-opacity="0.2"/>

  <rect x="1776" y="36" width="180" height="44"
    fill="#1E40AF" fill-opacity="0.08" stroke="#1E40AF" stroke-width="1"/>
  <circle cx="1866" cy="58" r="8" fill="#3B82F6" opacity="0.5"/>

  <!-- ==================== 邊緣 Bento 模組節點（底部，36px 內縮） ==================== -->
  <rect x="176" y="1000" width="200" height="44"
    fill="#1E40AF" fill-opacity="0.1" stroke="#1E40AF" stroke-width="1"/>
  <line x1="196" y1="1022" x2="356" y2="1022" stroke="#3B82F6" stroke-width="1" opacity="0.3"/>

  <rect x="396" y="1000" width="300" height="44"
    fill="none" stroke="#1E40AF" stroke-width="1.5"/>
  <circle cx="546" cy="1022" r="5" fill="#F59E0B" opacity="0.6"/>

  <rect x="716" y="1000" width="220" height="44"
    fill="#1E40AF" fill-opacity="0.08" stroke="#1E40AF" stroke-width="1"/>
  <rect x="736" y="1011" width="120" height="22"
    fill="none" stroke="#3B82F6" stroke-width="0.75" stroke-dasharray="3,5" opacity="0.4"/>

  <rect x="956" y="1000" width="360" height="44"
    fill="none" stroke="#1E40AF" stroke-width="1"/>
  <rect x="976" y="1011" width="220" height="22"
    fill="url(#flowGrad)" opacity="0.1"/>

  <rect x="1336" y="1000" width="200" height="44"
    fill="#1E40AF" fill-opacity="0.12" stroke="#1E40AF" stroke-width="1"/>
  <circle cx="1436" cy="1022" r="8" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <rect x="1556" y="1000" width="200" height="44"
    fill="none" stroke="#1E40AF" stroke-width="1.5"/>
  <circle cx="1656" cy="1022" r="5" fill="#3B82F6" opacity="0.7"/>

  <rect x="1776" y="1000" width="180" height="44"
    fill="#1E40AF" fill-opacity="0.1" stroke="#1E40AF" stroke-width="1"/>

  <!-- ==================== 節點網絡線（限制於外圍 20%） ==================== -->
  <g stroke="#3B82F6" stroke-width="1" fill="none" opacity="0.18">
    <path d="M 36 240 Q 180 210, 360 240"/>
    <path d="M 36 840 Q 180 810, 360 840"/>
    <path d="M 1560 240 Q 1740 210, 1884 240"/>
    <path d="M 1560 840 Q 1740 870, 1884 840"/>
    <line x1="1560" y1="240" x2="1560" y2="350" stroke-dasharray="5,10" opacity="0.2"/>
    <line x1="360" y1="730" x2="360" y2="840" stroke-dasharray="5,10" opacity="0.2"/>
  </g>

  <!-- ==================== 平行四邊形透視線（右緣局部） ==================== -->
  <g stroke="#1E40AF" stroke-width="1" fill="none" opacity="0.14">
    <line x1="1884" y1="230" x2="1620" y2="350"/>
    <line x1="1884" y1="310" x2="1660" y2="390"/>
    <line x1="1884" y1="770" x2="1660" y2="690"/>
    <line x1="1884" y1="850" x2="1620" y2="730"/>
  </g>

  <!-- ==================== 柔和流光（靜態無縫循環暗示） ==================== -->
  <g opacity="0.2">
    <!-- 流光帶1 -->
    <path d="M 0 300 Q 500 280, 960 300 Q 1420 320, 1920 300"
      stroke="#3B82F6" stroke-width="3" fill="none">
    </path>
    <ellipse cx="960" cy="300" rx="120" ry="8" fill="url(#glowBg)" filter="url(#softBlur)" opacity="0.5"/>
    <!-- 流光帶2 -->
    <path d="M 0 780 Q 500 800, 960 780 Q 1420 760, 1920 780"
      stroke="#3B82F6" stroke-width="2.5" fill="none" stroke-dasharray="12,8"/>
    <ellipse cx="960" cy="780" rx="100" ry="6" fill="url(#glowBg)" filter="url(#softBlur)" opacity="0.4"/>
  </g>

  <!-- ==================== 六邊形節點點綴（邊緣） ==================== -->
  <!-- 左上角叢集 -->
  <g transform="translate(100, 60)">
    <polygon points="30,0 60,17 60,52 30,69 0,52 0,17"
      fill="#1E40AF" fill-opacity="0.25" stroke="#3B82F6" stroke-width="1.5"/>
    <polygon points="30,7 54,21 54,47 30,61 6,47 6,21"
      fill="#3B82F6" fill-opacity="0.15"/>
  </g>
  <!-- 右下角 -->
  <g transform="translate(1740, 920)">
    <polygon points="40,0 80,23 80,69 40,92 0,69 0,23"
      fill="none" stroke="#3B82F6" stroke-width="2"/>
    <polygon points="40,10 72,30 72,62 40,82 8,62 8,30"
      fill="#1E40AF" fill-opacity="0.2"/>
  </g>
  <!-- 右上角 -->
  <g transform="translate(1800, 160)">
    <polygon points="25,0 50,14 50,43 25,57 0,43 0,14"
      fill="#3B82F6" fill-opacity="0.4"/>
  </g>
  <!-- 左下角 -->
  <g transform="translate(60, 980)">
    <polygon points="22,0 44,13 44,38 22,51 0,38 0,13"
      fill="none" stroke="#F59E0B" stroke-width="1.5"/>
    <polygon points="22,6 38,18 38,34 22,44 6,34 6,18"
      fill="#F59E0B" fill-opacity="0.2"/>
  </g>

  <!-- ==================== 節點光點（暗示即時數據） ==================== -->
  <circle cx="240" cy="260" r="4" fill="#3B82F6" opacity="0.7"/>
  <circle cx="660" cy="240" r="4" fill="#3B82F6" opacity="0.5"/>
  <circle cx="1260" cy="280" r="4" fill="#F59E0B" opacity="0.7"/>
  <circle cx="1660" cy="260" r="4" fill="#3B82F6" opacity="0.5"/>
  <circle cx="240" cy="840" r="4" fill="#3B82F6" opacity="0.5"/>
  <circle cx="660" cy="860" r="4" fill="#F59E0B" opacity="0.6"/>
  <circle cx="1260" cy="820" r="4" fill="#3B82F6" opacity="0.6"/>
  <circle cx="1660" cy="840" r="4" fill="#3B82F6" opacity="0.4"/>

  <!-- ==================== 微手繪瑕疵（邊緣細微抖動） ==================== -->
  <g stroke="#3B82F6" stroke-width="0.5" fill="none" opacity="0.08">
    <path d="M 0 20 Q 80 18, 160 22 Q 240 25, 320 19"/>
    <path d="M 0 1060 Q 100 1058, 200 1062 Q 300 1065, 400 1059"/>
    <path d="M 1900 100 Q 1880 200, 1902 300 Q 1885 400, 1900 500"/>
  </g>
</svg>