<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="diamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="yesGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="noGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <pattern id="checkPattern" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="skewX(-15)">
      <line x1="0" y1="7" x2="14" y2="7" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
    </pattern>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad3)"/>

  <!-- 標題 -->
  <text x="120" y="120" font-family="Microsoft JhengHei, sans-serif" font-size="56" font-weight="700" fill="#1E3A8A">專案決策分支圖</text>
  <text x="120" y="170" font-family="Microsoft JhengHei, sans-serif" font-size="24" fill="#64748B">Decision Branch · 是/否 → 行動路徑</text>
  <line x1="120" y1="200" x2="320" y2="200" stroke="#F59E0B" stroke-width="4"/>

  <!-- 起點 -->
  <g filter="url(#cardShadow)" transform="translate(180, 460)">
    <polygon points="0,80 120,0 240,80 120,160" fill="url(#diamondGrad)"/>
    <polygon points="0,80 120,0 240,80 120,160" fill="url(#checkPattern)"/>
    <text x="120" y="75" font-family="Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">START</text>
    <text x="120" y="105" font-family="Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">任務啟動</text>
  </g>

  <!-- 決策菱形 (技巧#123 菱形組合) -->
  <g filter="url(#cardShadow)" transform="translate(560, 460)">
    <polygon points="180,0 360,80 180,160 0,80" fill="url(#diamondGrad)" stroke="#F59E0B" stroke-width="3"/>
    <text x="180" y="68" font-family="Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">DECISION</text>
    <text x="180" y="98" font-family="Microsoft JhengHei, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">資料齊備？</text>
    <circle cx="50" cy="30" r="6" fill="#F59E0B"/>
    <circle cx="310" cy="130" r="6" fill="#F59E0B"/>
  </g>

  <!-- YES 路徑 → 進行分析 -->
  <g filter="url(#cardShadow)" transform="translate(1080, 280)">
    <polygon points="20,0 280,0 260,120 0,120" fill="url(#yesGrad)"/>
    <text x="140" y="45" font-family="Microsoft JhengHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">YES PATH</text>
    <text x="140" y="80" font-family="Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">資料分析</text>
    <text x="140" y="105" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#D1FAE5" text-anchor="middle">30% 時間投入</text>
  </g>

  <!-- YES 路徑 → 撰寫報告 -->
  <g filter="url(#cardShadow)" transform="translate(1500, 280)">
    <polygon points="20,0 280,0 260,120 0,120" fill="url(#yesGrad)"/>
    <polygon points="20,0 280,0 260,120 0,120" fill="url(#checkPattern)"/>
    <text x="140" y="45" font-family="Microsoft JhengHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">STEP</text>
    <text x="140" y="80" font-family="Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">撰寫報告</text>
    <text x="140" y="105" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#D1FAE5" text-anchor="middle">50% 時間投入</text>
  </g>

  <!-- 終點 → 完成 -->
  <g filter="url(#cardShadow)" transform="translate(1640, 580)">
    <polygon points="0,80 120,0 240,80 120,160" fill="url(#yesGrad)"/>
    <text x="120" y="75" font-family="Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">END</text>
    <text x="120" y="105" font-family="Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">完成</text>
  </g>

  <!-- NO 路徑 → 補資料 -->
  <g filter="url(#cardShadow)" transform="translate(1080, 680)">
    <polygon points="20,0 280,0 260,120 0,120" fill="url(#noGrad)"/>
    <text x="140" y="45" font-family="Microsoft JhengHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">NO PATH</text>
    <text x="140" y="80" font-family="Microsoft JhengHei, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">補資料</text>
    <text x="140" y="105" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#FEE2E2" text-anchor="middle">+2 天延遲</text>
  </g>

  <!-- 連接線（雙重交叉線 組合#6） -->
  <g stroke-width="3" fill="none">
    <!-- 起點 → 決策 -->
    <line x1="420" y1="540" x2="560" y2="540" stroke="#1E40AF" stroke-width="4"/>
    <polygon points="560,540 552,534 552,546" fill="#1E40AF"/>

    <!-- 決策 YES 上 -->
    <line x1="920" y1="490" x2="1080" y2="370" stroke="#059669" stroke-width="4"/>
    <polygon points="1080,370 1070,370 1078,378" fill="#059669"/>
    <rect x="950" y="400" width="60" height="28" rx="14" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="980" y="420" font-family="Arial" font-size="18" font-weight="700" fill="#065F46" text-anchor="middle">YES</text>

    <!-- 決策 NO 下 -->
    <line x1="920" y1="590" x2="1080" y2="710" stroke="#DC2626" stroke-width="4"/>
    <polygon points="1080,710 1070,710 1078,702" fill="#DC2626"/>
    <rect x="950" y="608" width="60" height="28" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
    <text x="980" y="628" font-family="Arial" font-size="18" font-weight="700" fill="#991B1B" text-anchor="middle">NO</text>

    <!-- 補資料 → 決策 (回饋線) -->
    <line x1="1080" y1="680" x2="920" y2="600" stroke="#DC2626" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="920,600 928,594 928,604" fill="#DC2626"/>

    <!-- 撰寫 → 完成 -->
    <line x1="1640" y1="660" x2="1640" y2="660" stroke="#059669" stroke-width="4"/>
    <path d="M 1620 400 Q 1700 490 1700 580" stroke="#059669" stroke-width="4" fill="none"/>
    <polygon points="1700,580 1692,572 1692,580" fill="#059669"/>

    <!-- 補資料 → 完成 (替代路徑) -->
    <path d="M 1360 680 Q 1500 760 1700 700" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
    <polygon points="1700,700 1690,694 1694,706" fill="#94A3B8"/>
  </g>

  <!-- 圖例 -->
  <g transform="translate(140, 920)">
    <text font-family="Microsoft JhengHei, sans-serif" font-size="18" font-weight="700" fill="#1E40AF">決策邏輯</text>
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="20" height="14" rx="2" fill="#059669"/>
      <text x="30" y="12" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#475569">綠色 = 正向路徑</text>
    </g>
    <g transform="translate(220, 30)">
      <rect x="0" y="0" width="20" height="14" rx="2" fill="#DC2626"/>
      <text x="30" y="12" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#475569">紅色 = 修正路徑</text>
    </g>
    <g transform="translate(440, 30)">
      <line x1="0" y1="7" x2="30" y2="7" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4"/>
      <text x="40" y="12" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#475569">虛線 = 替代路徑</text>
    </g>
    <g transform="translate(660, 30)">
      <polygon points="10,0 20,10 10,20 0,10" fill="#1E40AF"/>
      <text x="30" y="14" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#475569">菱形 = 決策點</text>
    </g>
  </g>

  <!-- 底部頁碼 -->
  <g transform="translate(120, 990)">
    <text font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#64748B">熊熊設計 · 工作報告素材庫</text>
    <text x="1680" font-family="Arial" font-size="18" fill="#64748B">03 / 06</text>
  </g>
</svg>
