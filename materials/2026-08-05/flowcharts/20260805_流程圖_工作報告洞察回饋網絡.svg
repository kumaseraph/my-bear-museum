<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img">
  <title>工作報告洞察回饋網絡流程圖</title>
  <desc>5節點循環回饋網絡工作報告流程圖</desc>
  <defs>
    <filter id="textureGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="grainy"/>
      <feComposite in="grainy" in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1a365d"/>
    </linearGradient>
    <linearGradient id="node1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="node2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="node3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="node4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="node5Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arrow1" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L12,6 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L12,6 z" fill="#FB7185"/>
    </marker>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L12,6 z" fill="#FBBF24"/>
    </marker>
    <marker id="arrow4" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L12,6 z" fill="#34d399"/>
    </marker>
    <marker id="arrow5" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L12,6 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>

  <!-- 標題 -->
  <text x="960" y="75" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="52" font-weight="bold" fill="#F8FAFC" text-anchor="middle">工作報告洞察回饋網絡</text>
  <text x="960" y="115" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="24" fill="#22D3EE" text-anchor="middle" opacity="0.85">持續優化的循環流程</text>

  <!-- 外圈5節點順時針連接路徑 - 用粗弧線連接各節點邊界 -->
  <!-- 01右邊界(1060,260) → 02上邊界(1320,430) -->
  <path d="M 1060 260 Q 1200 260 1320 430" fill="none" stroke="#22D3EE" stroke-width="4" marker-end="url(#arrow1)"/>
  <!-- 02右下邊界(1450,610) → 03左上邊界(1100,720) -->
  <path d="M 1450 610 Q 1300 720 1100 720" fill="none" stroke="#FB7185" stroke-width="4" marker-end="url(#arrow2)"/>
  <!-- 03左邊界(1050,770) → 04右邊界(720,770) -->
  <path d="M 1050 770 Q 880 770 720 770" fill="none" stroke="#FBBF24" stroke-width="4" marker-end="url(#arrow3)"/>
  <!-- 04左上邊界(580,610) → 05右下邊界(470,520) -->
  <path d="M 580 610 Q 470 560 470 520" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrow4)"/>
  <!-- 05左上邊界(470,390) → 01左邊界(860,260) -->
  <path d="M 470 390 Q 600 260 860 260" fill="none" stroke="#a78bfa" stroke-width="4" marker-end="url(#arrow5)"/>

  <!-- 節點 1：01 數據收集 (上方) -->
  <g transform="translate(960, 260)">
    <rect x="-100" y="-60" width="200" height="120" rx="12" fill="url(#node1Grad)" opacity="0.92"/>
    <rect x="-100" y="-60" width="200" height="120" rx="12" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="0" y="-15" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC" text-anchor="middle">01</text>
    <text x="0" y="18" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">數據收集</text>
    <text x="0" y="48" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#cffafe" text-anchor="middle">定量＋定性</text>
  </g>

  <!-- 節點 2：02 分析洞察 (右上) -->
  <g transform="translate(1320, 430)">
    <rect x="-100" y="-60" width="200" height="120" rx="12" fill="url(#node2Grad)" opacity="0.92"/>
    <rect x="-100" y="-60" width="200" height="120" rx="12" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="0" y="-15" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC" text-anchor="middle">02</text>
    <text x="0" y="18" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">分析洞察</text>
    <text x="0" y="48" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#fce7f3" text-anchor="middle">趨勢與模式</text>
  </g>

  <!-- 節點 3：03 決策方案 (右下) -->
  <g transform="translate(1050, 720)">
    <rect x="-100" y="-60" width="200" height="120" rx="12" fill="url(#node3Grad)" opacity="0.92"/>
    <rect x="-100" y="-60" width="200" height="120" rx="12" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="0" y="-15" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="20" font-weight="bold" fill="#172554" text-anchor="middle">03</text>
    <text x="0" y="18" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#172554" text-anchor="middle">決策方案</text>
    <text x="0" y="48" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#422006" text-anchor="middle">策略與計畫</text>
  </g>

  <!-- 節點 4：04 行動執行 (左下) -->
  <g transform="translate(720, 720)">
    <rect x="-100" y="-60" width="200" height="120" rx="12" fill="url(#node4Grad)" opacity="0.92"/>
    <rect x="-100" y="-60" width="200" height="120" rx="12" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="0" y="-15" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC" text-anchor="middle">04</text>
    <text x="0" y="18" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">行動執行</text>
    <text x="0" y="48" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#d1fae5" text-anchor="middle">落地與追蹤</text>
  </g>

  <!-- 節點 5：05 回饋修正 (左上) -->
  <g transform="translate(470, 430)">
    <rect x="-100" y="-60" width="200" height="120" rx="12" fill="url(#node5Grad)" opacity="0.92"/>
    <rect x="-100" y="-60" width="200" height="120" rx="12" fill="none" stroke="#F8FAFC" stroke-width="2.5"/>
    <text x="0" y="-15" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="20" font-weight="bold" fill="#F8FAFC" text-anchor="middle">05</text>
    <text x="0" y="18" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="28" font-weight="bold" fill="#F8FAFC" text-anchor="middle">回饋修正</text>
    <text x="0" y="48" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#ede9fe" text-anchor="middle">Loop Back</text>
  </g>

  <!-- 中心焦點：成果評估／持續優化 -->
  <g transform="translate(960, 500)">
    <circle cx="0" cy="0" r="80" fill="#172554" opacity="0.88"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#22D3EE" stroke-width="3" stroke-dasharray="8,4"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#FB7185" stroke-width="2" opacity="0.5"/>
    <text x="0" y="-8" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="22" font-weight="bold" fill="#F8FAFC" text-anchor="middle">成果評估</text>
    <text x="0" y="20" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="22" font-weight="bold" fill="#22D3EE" text-anchor="middle">持續優化</text>
  </g>

  <!-- 底部敘事 -->
  <rect x="0" y="1000" width="1920" height="80" fill="#172554" opacity="0.4"/>
  <text x="960" y="1045" font-family="system-ui, -apple-system, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">敘事儀表板 · 分章節敘事 · Narrative Illustration</text>

  <!-- 顆粒紋理覆蓋 -->
  <rect width="1920" height="1080" fill="#f8fafc" opacity="0.02" filter="url(#textureGrain)"/>
</svg>