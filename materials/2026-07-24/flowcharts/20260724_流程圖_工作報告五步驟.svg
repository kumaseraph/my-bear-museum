<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>工作報告五步驟流程</title>
  <desc>應用#124技巧：階梯排列+節點網絡，融合跨情境清晰度、模組化設計趨勢</desc>

  <defs>
    <linearGradient id="stepGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="stepGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="stepGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#93C5FD"/>
    </linearGradient>
    <pattern id="diagStripes" patternUnits="userSpaceOnUse" width="14" height="14" patternTransform="rotate(20)">
      <rect width="14" height="14" fill="transparent"/>
      <line x1="0" y1="14" x2="14" y2="0" stroke="#F59E0B" stroke-width="2" opacity="0.4"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#F8FAFC"/>
  <!-- 背景透視線 -->
  <g opacity="0.06">
    <line x1="200" y1="0" x2="960" y2="540" stroke="#1E40AF" stroke-width="1"/>
    <line x1="960" y1="540" x2="1720" y2="0" stroke="#1E40AF" stroke-width="1"/>
    <line x1="400" y1="0" x2="960" y2="540" stroke="#1E40AF" stroke-width="1"/>
    <line x1="960" y1="540" x2="1520" y2="0" stroke="#1E40AF" stroke-width="1"/>
  </g>

  <!-- 標題 -->
  <text x="160" y="130" font-family="Microsoft JhengHei, PingFang TC, sans-serif" font-size="56" font-weight="700" fill="#1E40AF">工作報告 · 五步驟流程</text>
  <text x="160" y="180" font-family="Microsoft JhengHei, PingFang TC, sans-serif" font-size="24" fill="#64748B">Work Report · Five-Step Workflow</text>
  <line x1="160" y1="210" x2="320" y2="210" stroke="#F59E0B" stroke-width="4"/>

  <!-- 階梯流程：5 個平行四邊形，階梯上行 -->
  <g filter="url(#softShadow)">
    <!-- 步驟1 -->
    <g transform="translate(160, 340)">
      <polygon points="20,0 320,0 300,140 0,140" fill="url(#stepGrad1)"/>
      <polygon points="20,0 320,0 300,140 0,140" fill="url(#diagStripes)" opacity="0.35"/>
      <circle cx="60" cy="70" r="32" fill="#F59E0B"/>
      <text x="60" y="84" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">1</text>
      <text x="180" y="58" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">資料蒐集</text>
      <text x="180" y="98" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#DBEAFE">Data Collection</text>
    </g>

    <!-- 連接線 1→2 -->
    <line x1="480" y1="410" x2="560" y2="380" stroke="#3B82F6" stroke-width="3"/>
    <polygon points="560,380 545,372 547,388" fill="#3B82F6"/>

    <!-- 步驟2 -->
    <g transform="translate(540, 300)">
      <polygon points="20,0 320,0 300,140 0,140" fill="url(#stepGrad2)"/>
      <polygon points="20,0 320,0 300,140 0,140" fill="url(#diagStripes)" opacity="0.35"/>
      <circle cx="60" cy="70" r="32" fill="#F59E0B"/>
      <text x="60" y="84" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">2</text>
      <text x="180" y="58" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">數據分析</text>
      <text x="180" y="98" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#DBEAFE">Data Analysis</text>
    </g>

    <line x1="860" y1="370" x2="940" y2="340" stroke="#3B82F6" stroke-width="3"/>
    <polygon points="940,340 925,332 927,348" fill="#3B82F6"/>

    <!-- 步驟3 -->
    <g transform="translate(920, 260)">
      <polygon points="20,0 320,0 300,140 0,140" fill="url(#stepGrad3)"/>
      <polygon points="20,0 320,0 300,140 0,140" fill="url(#diagStripes)" opacity="0.35"/>
      <circle cx="60" cy="70" r="32" fill="#F59E0B"/>
      <text x="60" y="84" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">3</text>
      <text x="180" y="58" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">洞察彙整</text>
      <text x="180" y="98" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#DBEAFE">Insight Summary</text>
    </g>

    <line x1="1240" y1="330" x2="1320" y2="300" stroke="#3B82F6" stroke-width="3"/>
    <polygon points="1320,300 1305,292 1307,308" fill="#3B82F6"/>

    <!-- 步驟4 -->
    <g transform="translate(1300, 220)">
      <polygon points="20,0 320,0 300,140 0,140" fill="url(#stepGrad1)"/>
      <polygon points="20,0 320,0 300,140 0,140" fill="url(#diagStripes)" opacity="0.35"/>
      <circle cx="60" cy="70" r="32" fill="#F59E0B"/>
      <text x="60" y="84" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">4</text>
      <text x="180" y="58" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">簡報製作</text>
      <text x="180" y="98" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#DBEAFE">Slide Creation</text>
    </g>

    <line x1="1620" y1="290" x2="1700" y2="260" stroke="#3B82F6" stroke-width="3"/>
    <polygon points="1700,260 1685,252 1687,268" fill="#3B82F6"/>

    <!-- 步驟5 -->
    <g transform="translate(1680, 180)">
      <polygon points="20,0 320,0 300,140 0,140" fill="url(#stepGrad2)"/>
      <polygon points="20,0 320,0 300,140 0,140" fill="url(#diagStripes)" opacity="0.35"/>
      <circle cx="60" cy="70" r="32" fill="#F59E0B"/>
      <text x="60" y="84" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">5</text>
      <text x="180" y="58" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">成果發表</text>
      <text x="180" y="98" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="18" fill="#DBEAFE">Presentation</text>
    </g>
  </g>

  <!-- 底部說明（一頁一訊息） -->
  <g transform="translate(160, 800)">
    <rect x="0" y="0" width="1600" height="160" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="160" fill="#F59E0B"/>
    <text x="40" y="50" font-family="Microsoft JhengHei, sans-serif" font-size="24" font-weight="700" fill="#1E40AF">核心訊息</text>
    <text x="40" y="92" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#374151">從資料蒐集到成果發表，每一步都有清楚的輸入與輸出，</text>
    <text x="40" y="124" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#374151">確保報告結構完整、訊息一致、便於跨情境閱讀。</text>
  </g>
</svg>
