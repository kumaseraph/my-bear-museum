<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" role="img" aria-label="現代章節軌跡頁碼設計">
  <title>現代章節軌跡</title>
  <desc>現代簡潔風格，01/08章節索引，六邊形+圓形靶心，模組化骨架。應用#120技巧：大小對比+填充方式對比+2.5D效果。融合趨勢：Simple shapes、Accessibility as design、Modular skeleton。適用工作報告PPT場景。</desc>

  <defs>
    <linearGradient id="hct_hex1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
    <linearGradient id="hct_hex2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
    <linearGradient id="hct_accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="hct_glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#6B5CE7" flood-opacity="0.3" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 背景襯托線 — 僅左側區域，不穿越中央主圖形 -->
  <line x1="0" y1="80" x2="175" y2="80" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.6"/>

  <!-- 左側六邊形叢集襯托 (0°旋轉) -->
  <g transform="translate(60, 80)">
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
          fill="#6B5CE7" fill-opacity="0.15"/>
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
          fill="none" stroke="#6B5CE7" stroke-width="1" stroke-opacity="0.3"/>
  </g>
  <g transform="translate(38, 55)">
    <path d="M0,-12 L10.4,-6 L10.4,6 L0,12 L-10.4,6 L-10.4,-6 Z"
          fill="#4ECDC4" fill-opacity="0.2"/>
  </g>
  <g transform="translate(38, 105)">
    <path d="M0,-12 L10.4,-6 L10.4,6 L0,12 L-10.4,6 L-10.4,-6 Z"
          fill="#4ECDC4" fill-opacity="0.2"/>
  </g>

  <!-- 主六邊形：外粗空心+內實心 (2.5D) -->
  <g transform="translate(250, 80)" filter="url(#hct_glow)">
    <!-- 外六邊形 - 粗空心 -->
    <path d="M0,-52 L45.1,-26 L45.1,26 L0,52 L-45.1,26 L-45.1,-26 Z"
          fill="none" stroke="url(#hct_hex2)" stroke-width="5"/>
    <!-- 中六邊形 - 半透明 -->
    <path d="M0,-38 L32.9,-19 L32.9,19 L0,38 L-32.9,19 L-32.9,-19 Z"
          fill="url(#hct_hex1)" fill-opacity="0.25"/>
    <!-- 白底圓形 — 將數字與靶心圖層隔離，確保對比 -->
    <circle cx="0" cy="0" r="31" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- 圓形靶心 — 僅保留外圈，不穿越數字 -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#4ECDC4" stroke-width="1.5" stroke-opacity="0.55"/>
    <!-- 橙點強調 — 移至主六邊形右上方，不干擾數字 -->
    <circle cx="34" cy="-34" r="5" fill="#FF8C00" fill-opacity="0.85"/>
    <!-- 章節數字 -->
    <text x="0" y="-60" text-anchor="middle" fill="#6B5CE7"
          font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CHAPTER</text>
    <text x="0" y="3" text-anchor="middle" fill="#4C1D95"
          font-family="system-ui, sans-serif" font-size="32" font-weight="800">01</text>
    <text x="0" y="21" text-anchor="middle" fill="#94A3B8"
          font-family="system-ui, sans-serif" font-size="12">/ 08</text>
  </g>

  <!-- 右側六邊形叢集襯托 (30°旋轉) -->
  <g transform="translate(440, 80) rotate(30)">
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
          fill="#6B5CE7" fill-opacity="0.15"/>
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
          fill="none" stroke="#6B5CE7" stroke-width="1" stroke-opacity="0.3"/>
  </g>
  <g transform="translate(462, 55) rotate(30)">
    <path d="M0,-12 L10.4,-6 L10.4,6 L0,12 L-10.4,6 L-10.4,-6 Z"
          fill="#4ECDC4" fill-opacity="0.2"/>
  </g>
  <g transform="translate(462, 105) rotate(30)">
    <path d="M0,-12 L10.4,-6 L10.4,6 L0,12 L-10.4,6 L-10.4,-6 Z"
          fill="#4ECDC4" fill-opacity="0.2"/>
  </g>

  <!-- 底部連接線 (模組化骨架) — 在主六邊形兩側斷開，不穿越中央數字 -->
  <line x1="115" y1="80" x2="204" y2="80" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3,3"/>
  <line x1="296" y1="80" x2="385" y2="80" stroke="#A78BFA" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3,3"/>
</svg>
