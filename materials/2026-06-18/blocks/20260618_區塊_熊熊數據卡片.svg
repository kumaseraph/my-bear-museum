<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8F0"/>
      <stop offset="100%" style="stop-color:#FFE8D6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="200" rx="16" fill="url(#bg)"/>
  <!-- Top accent bar -->
  <rect x="24" y="24" width="80" height="6" rx="3" fill="url(#accent)"/>
  <!-- Bear paw decoration -->
  <circle cx="340" cy="40" r="18" fill="#D4A574" opacity="0.3"/>
  <circle cx="330" cy="30" r="6" fill="#D4A574" opacity="0.4"/>
  <circle cx="350" cy="30" r="6" fill="#D4A574" opacity="0.4"/>
  <circle cx="322" cy="42" r="5" fill="#D4A574" opacity="0.4"/>
  <circle cx="358" cy="42" r="5" fill="#D4A574" opacity="0.4"/>
  <!-- Title -->
  <text x="24" y="65" font-family="Arial, sans-serif" font-size="14" fill="#8B6914" font-weight="bold">月度報告</text>
  <!-- Main number -->
  <text x="24" y="130" font-family="Arial, sans-serif" font-size="56" fill="#5D4E37" font-weight="bold">92%</text>
  <!-- Subtitle -->
  <text x="24" y="165" font-family="Arial, sans-serif" font-size="16" fill="#8B7355">目標達成率</text>
  <!-- Bottom decoration -->
  <rect x="24" y="180" width="60" height="4" rx="2" fill="#D4A574"/>
  <!-- Trend arrow -->
  <polygon points="130,115 145,95 160,115 150,115 150,135 140,135" fill="#4CAF50"/>
  <text x="170" y="125" font-family="Arial, sans-serif" font-size="14" fill="#4CAF50">+12%</text>
</svg>