<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="baseGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- 背景六邊形容器（大六邊形外框 - 叢集襯托） -->
  <g transform="translate(200, 200)">
    <!-- 外粗空心（2.5D 效果） -->
    <path d="M0,-150 L130,-75 L130,75 L0,150 L-130,75 L-130,-75 Z"
          fill="none" stroke="#7C3AED" stroke-width="5" opacity="0.4"/>
    <!-- 內實心（虛實對比） -->
    <path d="M0,-130 L112.6,-65 L112.6,65 L0,130 L-112.6,65 L-112.6,-65 Z"
          fill="#EDE9FE" opacity="0.5"/>
  </g>

  <!-- 旗桿（中心垂直） -->
  <line x1="200" y1="320" x2="200" y2="120" stroke="url(#baseGrad2)" stroke-width="8" stroke-linecap="round"/>

  <!-- 旗桿底部基座（小六邊形 - 大小對比） -->
  <g transform="translate(200, 330)">
    <path d="M0,-15 L26,0 L26,15 L0,30 L-26,15 L-26,0 Z"
          fill="url(#baseGrad2)"/>
    <path d="M0,-10 L17.3,0 L17.3,10 L0,20 L-17.3,10 L-17.3,0 Z"
          fill="#FEF3C7" opacity="0.3"/>
  </g>

  <!-- 旗幟（大六邊形 + 漸層 + 旋轉角度） -->
  <g transform="translate(220, 145)">
    <!-- 旗幟主體（六邊形 - 尺寸漸層） -->
    <path d="M0,-60 L52,-30 L52,30 L0,60 L-52,30 L-52,-30 Z"
          fill="url(#flagGrad)"/>
    <!-- 內框（2.5D 效果 - 外粗空心） -->
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7"/>
    <!-- 中心星星（單一主指標 - 少而深刻） -->
    <g transform="translate(0, 5)">
      <path d="M0,-25 L7,-7 L26,-7 L11,4 L17,22 L0,11 L-17,22 L-11,4 L-26,-7 L-7,-7 Z"
            fill="url(#starGrad)" stroke="#F59E0B" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 周圍小六邊形裝飾（叢集 + 旋轉角度對比） -->
  <g transform="translate(90, 100) rotate(15)">
    <path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
          fill="#A78BFA" opacity="0.7"/>
  </g>
  <g transform="translate(310, 100) rotate(45)">
    <path d="M0,-12 L10.4,-6 L10.4,6 L0,12 L-10.4,6 L-10.4,-6 Z"
          fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.7"/>
  </g>
  <g transform="translate(70, 250) rotate(60)">
    <path d="M0,-12 L10.4,-6 L10.4,6 L0,12 L-10.4,6 L-10.4,-6 Z"
          fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.7"/>
  </g>
  <g transform="translate(330, 240) rotate(75)">
    <path d="M0,-15 L13,-7.5 L13,7.5 L0,15 L-13,7.5 L-13,-7.5 Z"
          fill="#A78BFA" opacity="0.7"/>
  </g>

  <!-- 飄動線條（旗幟動感） -->
  <path d="M275,150 Q295,155 305,150" stroke="#A78BFA" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M275,170 Q295,175 305,170" stroke="#A78BFA" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M275,190 Q295,195 305,190" stroke="#A78BFA" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- 底部光點（動態對比） -->
  <circle cx="200" cy="350" r="4" fill="#FBBF24" opacity="0.8"/>
</svg>
