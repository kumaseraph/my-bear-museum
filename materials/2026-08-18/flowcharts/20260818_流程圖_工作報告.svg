<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!-- 現代簡潔：工作報告流程圖 - 4 步驟階梯 (補缺口 flowcharts) -->
  <defs>
    <linearGradient id="gradStep1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="gradStep2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="gradStep3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="gradStep4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="#F8FAFC"/>
  <!-- 標題 -->
  <text x="600" y="50" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="700" fill="#0F172A" text-anchor="middle">工作報告流程</text>
  <!-- 步驟 1: 資料收集 -->
  <g transform="translate(120,180)">
    <rect x="-90" y="-50" width="180" height="100" rx="12" fill="url(#gradStep1)"/>
    <text x="0" y="-12" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">STEP 01</text>
    <text x="0" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">資料收集</text>
    <text x="0" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.9" text-anchor="middle">數據與案例彙整</text>
  </g>
  <!-- 箭頭 1→2 -->
  <g transform="translate(230,180)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#CBD5E1" stroke-width="3"/>
    <polygon points="100,-8 116,0 100,8" fill="#CBD5E1"/>
  </g>
  <!-- 步驟 2: 分析彙整 -->
  <g transform="translate(420,180)">
    <rect x="-90" y="-50" width="180" height="100" rx="12" fill="url(#gradStep2)"/>
    <text x="0" y="-12" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">STEP 02</text>
    <text x="0" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">分析彙整</text>
    <text x="0" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.9" text-anchor="middle">重點洞察萃取</text>
  </g>
  <!-- 箭頭 2→3 -->
  <g transform="translate(530,180)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#CBD5E1" stroke-width="3"/>
    <polygon points="100,-8 116,0 100,8" fill="#CBD5E1"/>
  </g>
  <!-- 步驟 3: 製作簡報 -->
  <g transform="translate(720,180)">
    <rect x="-90" y="-50" width="180" height="100" rx="12" fill="url(#gradStep3)"/>
    <text x="0" y="-12" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">STEP 03</text>
    <text x="0" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">製作簡報</text>
    <text x="0" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.9" text-anchor="middle">視覺化呈現</text>
  </g>
  <!-- 箭頭 3→4 -->
  <g transform="translate(830,180)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#CBD5E1" stroke-width="3"/>
    <polygon points="100,-8 116,0 100,8" fill="#CBD5E1"/>
  </g>
  <!-- 步驟 4: 報告交付 (六邊形強調終點) -->
  <g transform="translate(1020,180)">
    <polygon points="-100,-60 100,-60 110,0 100,60 -100,60 -110,0" fill="url(#gradStep4)"/>
    <text x="0" y="-12" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">STEP 04</text>
    <text x="0" y="14" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">報告交付</text>
    <text x="0" y="36" font-family="-apple-system, system-ui, sans-serif" font-size="12" fill="#FFFFFF" opacity="0.9" text-anchor="middle">簡報說明與 Q&A</text>
  </g>
  <!-- 底部說明 -->
  <text x="600" y="340" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#475569" text-anchor="middle">從資料到交付的完整閉環，每個階段聚焦一個關鍵任務</text>
</svg>