<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="group1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="group2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="group3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="960" height="540" fill="#fafaff"/>
  
  <!-- 分組叢集 - 技巧#122 變化5：2-3叢為一組 -->
  <g transform="translate(480,270)">
    <!-- 組1：左上方 -->
    <g transform="translate(-200,-100)">
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group1)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group1)" transform="rotate(60) translate(0,-70)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group1)" transform="rotate(120) translate(0,-70)"/>
    </g>
    
    <!-- 組2：右上方 -->
    <g transform="translate(200,-80)">
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group2)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group2)" transform="rotate(60) translate(0,-70)"/>
    </g>
    
    <!-- 組3：中央 -->
    <g transform="translate(0,20)">
      <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z" fill="url(#group3)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group3)" transform="rotate(0) translate(0,-70)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group3)" transform="rotate(60) translate(0,-70)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group3)" transform="rotate(120) translate(0,-70)"/>
    </g>
    
    <!-- 組4：左下方 -->
    <g transform="translate(-220,100)">
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group1)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group1)" transform="rotate(60) translate(0,-70)"/>
    </g>
    
    <!-- 組5：右下方 -->
    <g transform="translate(180,120)">
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group2)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group2)" transform="rotate(0) translate(0,-70)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" fill="url(#group2)" transform="rotate(300) translate(0,-70)"/>
    </g>
  </g>
  
  <text x="480" y="520" text-anchor="middle" font-family="Noto Sans TC, sans-serif" 
        font-size="18" font-weight="600" fill="#4C1D95">分組叢集</text>
</svg>