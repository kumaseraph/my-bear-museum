<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="step5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="step6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="diagLines" patternUnits="userSpaceOnUse" width="10" height="10">
      <line x1="0" y1="10" x2="10" y2="0" stroke="#FFFFFF" stroke-width="1" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- 標題 -->
  <text x="120" y="100" font-family="Microsoft JhengHei, sans-serif" font-size="44" font-weight="700" fill="#1E293B">工作報告｜六步驟節奏流程</text>
  <text x="120" y="148" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#64748B">平行四邊形階梯 × 節點網絡 × 透視線 — 簡潔的現代節奏</text>

  <!-- 階梯六步驟（兩列三行） -->
  <!-- Step 1: 啟動 -->
  <g transform="translate(180, 280)">
    <polygon points="20,0 240,0 260,80 40,80" fill="url(#step1)"/>
    <polygon points="20,0 240,0 260,80 40,80" fill="url(#diagLines)"/>
    <text x="130" y="40" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" opacity="0.8">STEP 01</text>
    <text x="130" y="65" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">啟動會議</text>
    <text x="130" y="115" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Kick-off</text>
    <circle cx="270" cy="40" r="5" fill="url(#step1)"/>
  </g>

  <!-- Step 2: 規劃 -->
  <g transform="translate(560, 350)">
    <polygon points="20,0 240,0 260,80 40,80" fill="url(#step2)"/>
    <polygon points="20,0 240,0 260,80 40,80" fill="url(#diagLines)"/>
    <text x="130" y="40" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" opacity="0.8">STEP 02</text>
    <text x="130" y="65" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">規劃藍圖</text>
    <text x="130" y="115" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Planning</text>
    <circle cx="270" cy="40" r="5" fill="url(#step2)"/>
  </g>

  <!-- Step 3: 執行 -->
  <g transform="translate(940, 420)">
    <polygon points="20,0 240,0 260,80 40,80" fill="url(#step3)"/>
    <polygon points="20,0 240,0 260,80 40,80" fill="url(#diagLines)"/>
    <text x="130" y="40" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" opacity="0.8">STEP 03</text>
    <text x="130" y="65" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">執行推進</text>
    <text x="130" y="115" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Execution</text>
    <circle cx="270" cy="40" r="5" fill="url(#step3)"/>
  </g>

  <!-- 透視線連接 -->
  <line x1="450" y1="320" x2="580" y2="390" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
  <line x1="830" y1="390" x2="960" y2="460" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>

  <!-- Step 4: 校對 -->
  <g transform="translate(1320, 490)">
    <polygon points="20,0 240,0 260,80 40,80" fill="url(#step4)"/>
    <polygon points="20,0 240,0 260,80 40,80" fill="url(#diagLines)"/>
    <text x="130" y="40" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" opacity="0.8">STEP 04</text>
    <text x="130" y="65" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">校對覆核</text>
    <text x="130" y="115" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Review</text>
    <circle cx="270" cy="40" r="5" fill="url(#step4)"/>
  </g>

  <line x1="1210" y1="460" x2="1340" y2="530" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>

  <!-- 下排：Step 5 → Step 6 -->
  <g transform="translate(940, 720)">
    <polygon points="20,0 240,0 260,80 40,80" fill="url(#step5)"/>
    <polygon points="20,0 240,0 260,80 40,80" fill="url(#diagLines)"/>
    <text x="130" y="40" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" opacity="0.8">STEP 05</text>
    <text x="130" y="65" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">數據決策</text>
    <text x="130" y="115" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Decision</text>
    <circle cx="-20" cy="40" r="5" fill="url(#step5)"/>
  </g>

  <g transform="translate(560, 790)">
    <polygon points="20,0 240,0 260,80 40,80" fill="url(#step6)"/>
    <polygon points="20,0 240,0 260,80 40,80" fill="url(#diagLines)"/>
    <text x="130" y="40" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" opacity="0.8">STEP 06</text>
    <text x="130" y="65" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">循環優化</text>
    <text x="130" y="115" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Iteration</text>
    <circle cx="-20" cy="40" r="5" fill="url(#step6)"/>
  </g>

  <!-- 連接線 -->
  <line x1="1450" y1="570" x2="1210" y2="700" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
  <line x1="930" y1="760" x2="830" y2="830" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>

  <!-- 循環指示 -->
  <path d="M 700 870 Q 280 970 180 320" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="2 6" opacity="0.5"/>
  <polygon points="180,330 173,318 188,316" fill="#94A3B8" opacity="0.7"/>

  <!-- 底部技術標籤 -->
  <text x="120" y="1040" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#94A3B8">技巧 #124 平行四邊形階梯 × 條紋疊加 × 透視線</text>
  <text x="1800" y="1040" text-anchor="end" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#94A3B8">2026-07-28 熊熊生成</text>
</svg>
