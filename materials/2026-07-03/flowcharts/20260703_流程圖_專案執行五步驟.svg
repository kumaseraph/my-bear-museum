<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="100%" style="stop-color:#E2E8F0"/>
    </linearGradient>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#60A5FA"/>
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1D4ED8"/>
      <stop offset="100%" style="stop-color:#4F8FE8"/>
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A8A"/>
      <stop offset="100%" style="stop-color:#3B5EA8"/>
    </linearGradient>
    <linearGradient id="step5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#172554"/>
      <stop offset="100%" style="stop-color:#1E3A5C"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="960" height="540" fill="url(#bg)"/>
  
  <!-- 標題 -->
  <text x="480" y="50" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="24" font-weight="bold" fill="#1E293B">專案執行五步驟</text>
  
  <!-- 連接線 -->
  <line x1="200" y1="190" x2="200" y2="250" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="380" y1="190" x2="380" y2="250" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="560" y1="190" x2="560" y2="250" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="740" y1="190" x2="740" y2="250" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- 階梯排列的平行四邊形流程 -->
  <g transform="translate(60, 220)">
    <!-- 步驟1 -->
    <polygon points="30,0 140,0 115,70 5,70" fill="url(#step1)" opacity="0.95"/>
    <text x="72" y="40" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="white" font-weight="bold">📋</text>
    <text x="72" y="58" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="white">需求確認</text>
    
    <!-- 步驟2 -->
    <polygon points="180,70 290,70 265,140 155,140" fill="url(#step2)" opacity="0.9" transform="translate(30, 20)"/>
    <text x="267" y="115" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="white" font-weight="bold">✏️</text>
    <text x="267" y="133" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="white">計畫制定</text>
    
    <!-- 步驟3 -->
    <polygon points="330,140 440,140 415,210 305,210" fill="url(#step3)" opacity="0.85" transform="translate(60, 40)"/>
    <text x="417" y="185" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="white" font-weight="bold">⚙️</text>
    <text x="417" y="203" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="white">執行落實</text>
    
    <!-- 步驟4 -->
    <polygon points="480,210 590,210 565,280 455,280" fill="url(#step4)" opacity="0.8" transform="translate(90, 60)"/>
    <text x="567" y="255" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="white" font-weight="bold">📊</text>
    <text x="567" y="273" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="white">進度管控</text>
    
    <!-- 步驟5 -->
    <polygon points="630,280 740,280 715,350 605,350" fill="url(#step5)" opacity="0.75" transform="translate(120, 80)"/>
    <text x="717" y="325" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="white" font-weight="bold">✅</text>
    <text x="717" y="343" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="white">成果驗收</text>
  </g>
  
  <!-- 底部說明 -->
  <text x="480" y="500" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">清晰的階梯流程，確保專案按步驟有序推進</text>
  
  <!-- 數字標記 -->
  <g font-family="Microsoft JhengHei, sans-serif" fill="#1E293B" font-weight="bold">
    <circle cx="95" cy="205" r="16" fill="#F59E0B"/>
    <text x="95" y="211" text-anchor="middle" font-size="14" fill="white">1</text>
    
    <circle cx="375" cy="265" r="16" fill="#F59E0B"/>
    <text x="375" y="271" text-anchor="middle" font-size="14" fill="white">2</text>
    
    <circle cx="555" cy="325" r="16" fill="#F59E0B"/>
    <text x="555" y="331" text-anchor="middle" font-size="14" fill="white">3</text>
    
    <circle cx="735" cy="385" r="16" fill="#F59E0B"/>
    <text x="735" y="391" text-anchor="middle" font-size="14" fill="white">4</text>
    
    <circle cx="915" cy="445" r="16" fill="#F59E0B"/>
    <text x="915" y="451" text-anchor="middle" font-size="14" fill="white">5</text>
  </g>
</svg>