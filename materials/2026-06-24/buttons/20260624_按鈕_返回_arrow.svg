<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <title>返回箭頭按鈕</title>
  <desc>熊熊溫暖風格的返回操作按鈕，採用棕金色系與溫暖曲線設計</desc>
  
  <!-- 背景：溫暖棕金色塊 -->
  <defs>
    <linearGradient id="warmGradPrev" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="50%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#F5DEB3"/>
    </linearGradient>
    <filter id="softShadowPrev" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#5D3A1A" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 主體：圓角矩形按鈕 -->
  <rect x="10" y="15" width="380" height="90" rx="45" ry="45" 
        fill="url(#warmGradPrev)" filter="url(#softShadowPrev)"/>
  
  <!-- 內部蜂巢紋理裝飾（應用技巧#122蜂巢叢集） -->
  <g opacity="0.15" transform="translate(120, 60)">
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z" 
          fill="#4C1D95" stroke="#6B5CE7" stroke-width="0.5"/>
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z" 
          fill="#4C1D95" stroke="#6B5CE7" stroke-width="0.5" transform="rotate(60) translate(0,-31)"/>
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z" 
          fill="#4C1D95" stroke="#6B5CE7" stroke-width="0.5" transform="rotate(-60) translate(0,-31)"/>
  </g>
  
  <!-- 引導線條裝飾（應用技巧#124線條引導） -->
  <line x1="370" y1="60" x2="280" y2="60" stroke="#FFFFFF" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  
  <!-- 箭頭符號（向左） -->
  <g transform="translate(80, 60)">
    <polygon points="0,-15 -30,0 0,15 -10,0" fill="#FFFFFF"/>
    <line x1="-15" y1="0" x2="-45" y2="0" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- 文字：返回 -->
  <text x="240" y="67" font-family="'Noto Sans TC', 'Microsoft JhengHei', sans-serif" 
        font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    返回
  </text>
  
  <!-- 熊掌印裝飾（熊熊元素） -->
  <g transform="translate(315, 60)" opacity="0.25">
    <ellipse cx="0" cy="5" rx="8" ry="10" fill="#FFFFFF"/>
    <circle cx="-7" cy="-8" r="4" fill="#FFFFFF"/>
    <circle cx="7" cy="-8" r="4" fill="#FFFFFF"/>
    <circle cx="-10" cy="-2" r="3" fill="#FFFFFF"/>
    <circle cx="10" cy="-2" r="3" fill="#FFFFFF"/>
  </g>
</svg>