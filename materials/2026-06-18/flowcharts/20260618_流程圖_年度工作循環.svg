<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180">
  <defs>
    <linearGradient id="bearGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
  </defs>
  
  <!-- Step 1 -->
  <rect x="20" y="50" width="100" height="80" rx="12" fill="url(#bearGradient)"/>
  <text x="70" y="85" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">計畫</text>
  <text x="70" y="105" font-family="Arial, sans-serif" font-size="12" fill="#FFE8D6" text-anchor="middle">Planning</text>
  <!-- Bear mini -->
  <circle cx="100" cy="115" r="8" fill="#FFE8D6" opacity="0.4"/>
  <circle cx="97" cy="113" r="2" fill="#5D4E37"/>
  <circle cx="103" cy="113" r="2" fill="#5D4E37"/>
  <ellipse cx="100" cy="117" rx="2" ry="1" fill="#5D4E37"/>

  <!-- Arrow 1 -->
  <polygon points="130,90 145,80 145,86 160,86 160,94 145,94 145,100" fill="#C9956A"/>

  <!-- Step 2 -->
  <rect x="170" y="50" width="100" height="80" rx="12" fill="#E8D5C4"/>
  <text x="220" y="85" font-family="Arial, sans-serif" font-size="14" fill="#5D4E37" text-anchor="middle" font-weight="bold">執行</text>
  <text x="220" y="105" font-family="Arial, sans-serif" font-size="12" fill="#8B7355" text-anchor="middle">Execution</text>
  <!-- Bear mini -->
  <circle cx="250" cy="115" r="8" fill="#D4A574" opacity="0.5"/>
  <circle cx="247" cy="113" r="2" fill="#5D4E37"/>
  <circle cx="253" cy="113" r="2" fill="#5D4E37"/>
  <ellipse cx="250" cy="117" rx="2" ry="1" fill="#5D4E37"/>

  <!-- Arrow 2 -->
  <polygon points="280,90 295,80 295,86 310,86 310,94 295,94 295,100" fill="#C9956A"/>

  <!-- Step 3 -->
  <rect x="320" y="50" width="100" height="80" rx="12" fill="url(#bearGradient)"/>
  <text x="370" y="85" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">檢討</text>
  <text x="370" y="105" font-family="Arial, sans-serif" font-size="12" fill="#FFE8D6" text-anchor="middle">Review</text>
  <!-- Bear mini -->
  <circle cx="400" cy="115" r="8" fill="#FFE8D6" opacity="0.4"/>
  <circle cx="397" cy="113" r="2" fill="#5D4E37"/>
  <circle cx="403" cy="113" r="2" fill="#5D4E37"/>
  <ellipse cx="400" cy="117" rx="2" ry="1" fill="#5D4E37"/>

  <!-- Arrow 3 -->
  <polygon points="430,90 445,80 445,86 460,86 460,94 445,94 445,100" fill="#C9956A"/>

  <!-- Step 4 -->
  <rect x="380" y="50" width="100" height="80" rx="12" fill="#E8D5C4"/>
  <text x="430" y="85" font-family="Arial, sans-serif" font-size="14" fill="#5D4E37" text-anchor="middle" font-weight="bold">改進</text>
  <text x="430" y="105" font-family="Arial, sans-serif" font-size="12" fill="#8B7355" text-anchor="middle">Improve</text>
  <!-- Star decoration -->
  <polygon points="455,25 458,32 466,32 460,37 462,45 455,40 448,45 450,37 444,32 452,32" fill="#FFD700" opacity="0.7"/>

  <!-- Title -->
  <text x="250" y="25" font-family="Arial, sans-serif" font-size="16" fill="#5D4E37" text-anchor="middle" font-weight="bold">年度工作循環</text>
</svg>