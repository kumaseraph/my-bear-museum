<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <defs>
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="50%" stop-color="#E8C9A0"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#C4956A"/>
    </linearGradient>
  </defs>
  
  <!-- 標題 -->
  <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" 
        fill="#5C4A1F" font-family="Arial, sans-serif">工作流程階梯</text>
  
  <!-- 步驟 1 -->
  <g transform="translate(100, 140)">
    <!-- 六邊形台階 -->
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#stepGrad)" stroke="#8B6914" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-size="11" fill="#5C4A1F" font-weight="bold">計畫</text>
    <text x="0" y="12" text-anchor="middle" font-size="10" fill="#8B6914">Plan</text>
  </g>
  
  <!-- 連接箭頭 1 -->
  <g transform="translate(160, 140)">
    <path d="M0,0 L25,0 L20,-8 L35,0 L20,8 L25,0" fill="url(#arrowGrad)"/>
  </g>
  
  <!-- 步驟 2 -->
  <g transform="translate(240, 140)">
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#stepGrad)" stroke="#8B6914" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-size="11" fill="#5C4A1F" font-weight="bold">執行</text>
    <text x="0" y="12" text-anchor="middle" font-size="10" fill="#8B6914">Do</text>
  </g>
  
  <!-- 連接箭頭 2 -->
  <g transform="translate(300, 140)">
    <path d="M0,0 L25,0 L20,-8 L35,0 L20,8 L25,0" fill="url(#arrowGrad)"/>
  </g>
  
  <!-- 步驟 3 -->
  <g transform="translate(380, 140)">
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#stepGrad)" stroke="#8B6914" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-size="11" fill="#5C4A1F" font-weight="bold">檢查</text>
    <text x="0" y="12" text-anchor="middle" font-size="10" fill="#8B6914">Check</text>
  </g>
  
  <!-- 連接箭頭 3 -->
  <g transform="translate(440, 140)">
    <path d="M0,0 L25,0 L20,-8 L35,0 L20,8 L25,0" fill="url(#arrowGrad)"/>
  </g>
  
  <!-- 步驟 4 -->
  <g transform="translate(520, 140)">
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#stepGrad)" stroke="#8B6914" stroke-width="2"/>
    <text x="0" y="-5" text-anchor="middle" font-size="11" fill="#5C4A1F" font-weight="bold">行動</text>
    <text x="0" y="12" text-anchor="middle" font-size="10" fill="#8B6914">Act</text>
  </g>
  
  <!-- 連接箭頭 4 -->
  <g transform="translate(580, 140)">
    <path d="M0,0 L25,0 L20,-8 L35,0 L20,8 L25,0" fill="url(#arrowGrad)"/>
  </g>
  
  <!-- 步驟 5 -->
  <g transform="translate(660, 140)">
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#stepGrad)" stroke="#8B6914" stroke-width="3"/>
    <text x="0" y="-5" text-anchor="middle" font-size="11" fill="#5C4A1F" font-weight="bold">完成</text>
    <text x="0" y="12" text-anchor="middle" font-size="10" fill="#8B6914">Done</text>
  </g>
  
  <!-- 底部裝飾線 -->
  <line x1="50" y1="210" x2="750" y2="210" stroke="#C4956A" stroke-width="1" opacity="0.4" stroke-dasharray="5,5"/>
</svg>