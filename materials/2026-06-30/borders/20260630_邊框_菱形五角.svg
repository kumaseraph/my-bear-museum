<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>菱形邊框</title>
  <desc>工作報告邊框 - 菱形與五角星交織，動態活潑風格</desc>
  <!-- 左側垂直菱形裝飾 -->
  <g transform="translate(30,100)">
    <polygon points="30,0 60,40 30,80 0,40" fill="#6B5CE7" fill-opacity="0.15" stroke="#6B5CE7" stroke-width="2"/>
    <polygon points="30,100 60,140 30,180 0,140" fill="#FF8C00" fill-opacity="0.2" stroke="#FF8C00" stroke-width="2"/>
    <polygon points="30,200 60,240 30,280 0,240" fill="#6B5CE7" fill-opacity="0.15" stroke="#6B5CE7" stroke-width="2"/>
    <polygon points="30,300 60,340 30,380 0,340" fill="#4ECDC4" fill-opacity="0.2" stroke="#4ECDC4" stroke-width="2"/>
    <polygon points="30,400 60,440 30,480 0,440" fill="#6B5CE7" fill-opacity="0.15" stroke="#6B5CE7" stroke-width="2"/>
    <polygon points="30,500 60,540 30,580 0,540" fill="#FF8C00" fill-opacity="0.2" stroke="#FF8C00" stroke-width="2"/>
    <polygon points="30,600 60,640 30,680 0,640" fill="#6B5CE7" fill-opacity="0.15" stroke="#6B5CE7" stroke-width="2"/>
    <polygon points="30,700 60,740 30,780 0,740" fill="#4ECDC4" fill-opacity="0.2" stroke="#4ECDC4" stroke-width="2"/>
    <polygon points="30,800 60,840 30,880 0,840" fill="#6B5CE7" fill-opacity="0.15" stroke="#6B5CE7" stroke-width="2"/>
  </g>
  <!-- 右側垂直菱形裝飾 -->
  <g transform="translate(1830,100)">
    <polygon points="30,0 60,40 30,80 0,40" fill="#6B5CE7" fill-opacity="0.15" stroke="#6B5CE7" stroke-width="2"/>
    <polygon points="30,100 60,140 30,180 0,140" fill="#FF8C00" fill-opacity="0.2" stroke="#FF8C00" stroke-width="2"/>
    <polygon points="30,200 60,240 30,280 0,240" fill="#6B5CE7" fill-opacity="0.15" stroke="#6B5CE7" stroke-width="2"/>
    <polygon points="30,300 60,340 30,380 0,340" fill="#4ECDC4" fill-opacity="0.2" stroke="#4ECDC4" stroke-width="2"/>
    <polygon points="30,400 60,440 30,480 0,440" fill="#6B5CE7" fill-opacity="0.15" stroke="#6B5CE7" stroke-width="2"/>
    <polygon points="30,500 60,540 30,580 0,540" fill="#FF8C00" fill-opacity="0.2" stroke="#FF8C00" stroke-width="2"/>
    <polygon points="30,600 60,640 30,680 0,640" fill="#6B5CE7" fill-opacity="0.15" stroke="#6B5CE7" stroke-width="2"/>
    <polygon points="30,700 60,740 30,780 0,740" fill="#4ECDC4" fill-opacity="0.2" stroke="#4ECDC4" stroke-width="2"/>
    <polygon points="30,800 60,840 30,880 0,840" fill="#6B5CE7" fill-opacity="0.15" stroke="#6B5CE7" stroke-width="2"/>
  </g>
  <!-- 頂部五角星裝飾 -->
  <polygon points="960,20 968,40 990,40 972,52 980,72 960,60 940,72 948,52 930,40 952,40" 
           fill="#FF8C00" opacity="0.8"/>
  <!-- 底部五角星裝置 -->
  <polygon points="960,1008 968,1028 990,1028 972,1040 980,1060 960,1048 940,1060 948,1040 930,1028 952,1028" 
           fill="#FF8C00" opacity="0.8"/>
  <!-- 左右角五角星 -->
  <polygon points="50,540 56,552 70,552 59,560 64,573 50,565 36,573 41,560 30,552 44,552" 
           fill="#FF8C00" opacity="0.6"/>
  <polygon points="1870,540 1876,552 1890,552 1879,560 1884,573 1870,565 1856,573 1861,560 1850,552 1864,552" 
           fill="#FF8C00" opacity="0.6"/>
</svg>