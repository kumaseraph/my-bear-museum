<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>創意邊框</title>
  <desc>工作報告邊框 - 六邊形十形組合，幾何活潑風格</desc>
  <!-- 左上角六邊形裝飾群 -->
  <g transform="translate(0,0)">
    <path d="M80,40 L130,65 L130,115 L80,140 L30,115 L30,65 Z" fill="#6B5CE7" fill-opacity="0.2"/>
    <path d="M55,20 L90,40 L90,80 L55,100 L20,80 L20,40 Z" fill="none" stroke="#6B5CE7" stroke-width="2"/>
    <path d="M55,20 L90,40 L90,80 L55,100 L20,80 L20,40 Z" fill="none" stroke="#4ECDC4" stroke-width="1" transform="translate(-15,20) scale(0.6)"/>
  </g>
  <!-- 右上角六邊形裝飾群 -->
  <g transform="translate(1840,0)">
    <path d="M80,40 L130,65 L130,115 L80,140 L30,115 L30,65 Z" fill="#6B5CE7" fill-opacity="0.2"/>
    <path d="M55,20 L90,40 L90,80 L55,100 L20,80 L20,40 Z" fill="none" stroke="#6B5CE7" stroke-width="2"/>
    <path d="M55,20 L90,40 L90,80 L55,100 L20,80 L20,40 Z" fill="none" stroke="#4ECDC4" stroke-width="1" transform="translate(-15,20) scale(0.6)"/>
  </g>
  <!-- 左下角六邊形裝飾群 -->
  <g transform="translate(0,940)">
    <path d="M80,40 L130,65 L130,115 L80,140 L30,115 L30,65 Z" fill="#6B5CE7" fill-opacity="0.2"/>
    <path d="M55,20 L90,40 L90,80 L55,100 L20,80 L20,40 Z" fill="none" stroke="#6B5CE7" stroke-width="2"/>
    <path d="M55,20 L90,40 L90,80 L55,100 L20,80 L20,40 Z" fill="none" stroke="#4ECDC4" stroke-width="1" transform="translate(-15,20) scale(0.6)"/>
  </g>
  <!-- 右下角六邊形裝飾群 -->
  <g transform="translate(1840,940)">
    <path d="M80,40 L130,65 L130,115 L80,140 L30,115 L30,65 Z" fill="#6B5CE7" fill-opacity="0.2"/>
    <path d="M55,20 L90,40 L90,80 L55,100 L20,80 L20,40 Z" fill="none" stroke="#6B5CE7" stroke-width="2"/>
    <path d="M55,20 L90,40 L90,80 L55,100 L20,80 L20,40 Z" fill="none" stroke="#4ECDC4" stroke-width="1" transform="translate(-15,20) scale(0.6)"/>
  </g>
  <!-- 頂部裝飾線 -->
  <line x1="150" y1="30" x2="1770" y2="30" stroke="#6B5CE7" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="40" x2="1720" y2="40" stroke="#4ECDC4" stroke-width="1" stroke-dasharray="10,5" opacity="0.5"/>
  <!-- 底部裝飾線 -->
  <line x1="150" y1="1050" x2="1770" y2="1050" stroke="#6B5CE7" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="1040" x2="1720" y2="1040" stroke="#4ECDC4" stroke-width="1" stroke-dasharray="10,5" opacity="0.5"/>
</svg>