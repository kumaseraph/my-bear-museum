<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- 數據卡片區塊 -->
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#FFF9F0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C68B59" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- 卡片本體 -->
  <rect x="10" y="10" width="380" height="180" rx="16" fill="url(#cardGrad)" filter="url(#shadow)"/>
  
  <!-- 左側色條裝飾 -->
  <rect x="10" y="10" width="8" height="180" rx="4" fill="#E8A87C"/>
  
  <!-- 頂部標題區 -->
  <rect x="30" y="25" width="80" height="28" rx="6" fill="#E8A87C" opacity="0.15"/>
  <text x="70" y="45" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C68B59" text-anchor="middle">數據指標</text>
  
  <!-- 主數字 -->
  <text x="70" y="120" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#8B5A3C" text-anchor="middle">87.5%</text>
  
  <!-- 趨勢箭頭 -->
  <g transform="translate(120, 85)">
    <polygon points="0,20 12,0 24,20" fill="#E8A87C"/>
    <rect x="8" y="20" width="8" height="25" fill="#E8A87C"/>
  </g>
  
  <!-- 趨勢數字 -->
  <text x="70" y="160" font-family="Arial, sans-serif" font-size="14" fill="#C68B59" text-anchor="middle">↑ 12.3%</text>
  
  <!-- 分隔線 -->
  <line x1="160" y1="40" x2="160" y2="160" stroke="#E8A87C" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
  
  <!-- 右側圖表區 -->
  <g transform="translate(180, 40)">
    <!-- 柱狀圖 -->
    <rect x="0" y="80" width="30" height="40" rx="4" fill="#E8A87C" opacity="0.4"/>
    <rect x="40" y="60" width="30" height="60" rx="4" fill="#E8A87C" opacity="0.6"/>
    <rect x="80" y="40" width="30" height="80" rx="4" fill="#E8A87C" opacity="0.8"/>
    <rect x="120" y="20" width="30" height="100" rx="4" fill="#C68B59"/>
  </g>
  
  <!-- 底部標籤 -->
  <rect x="30" y="165" width="100" height="18" rx="9" fill="#E8A87C" opacity="0.1"/>
  <text x="80" y="178" font-family="Arial, sans-serif" font-size="11" fill="#C68B59" text-anchor="middle">Q4 2026</text>
</svg>