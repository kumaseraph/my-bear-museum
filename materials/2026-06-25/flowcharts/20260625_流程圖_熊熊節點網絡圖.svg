<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bearNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <marker id="arrowHead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#D4A574"/>
    </marker>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="400" fill="#FDF8F3"/>
  
  <!-- 中心節點 -->
  <g transform="translate(400,200)">
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
          fill="url(#bearNodeGrad)" stroke="#8B5A2B" stroke-width="3"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFF">中心</text>
  </g>
  
  <!-- 周圍節點 -->
  <!-- 上 -->
  <g transform="translate(400,80)">
    <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" 
          fill="#D4A574" fill-opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5D4037">節點A</text>
  </g>
  <path d="M400,110 L400,160" stroke="#8B5A2B" stroke-width="2" marker-end="url(#arrowHead)"/>
  
  <!-- 右上 -->
  <g transform="translate(560,140)">
    <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" 
          fill="#D4A574" fill-opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5D4037">節點B</text>
  </g>
  <path d="M434,160 L520,165" stroke="#8B5A2B" stroke-width="2" marker-end="url(#arrowHead)"/>
  
  <!-- 右下 -->
  <g transform="translate(560,260)">
    <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" 
          fill="#D4A574" fill-opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5D4037">節點C</text>
  </g>
  <path d="M434,235 L520,240" stroke="#8B5A2B" stroke-width="2" marker-end="url(#arrowHead)"/>
  
  <!-- 下 -->
  <g transform="translate(400,320)">
    <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" 
          fill="#D4A574" fill-opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5D4037">節點D</text>
  </g>
  <path d="M400,290 L400,240" stroke="#8B5A2B" stroke-width="2" marker-end="url(#arrowHead)"/>
  
  <!-- 左下 -->
  <g transform="translate(240,260)">
    <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" 
          fill="#D4A574" fill-opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5D4037">節點E</text>
  </g>
  <path d="M366,235 L280,240" stroke="#8B5A2B" stroke-width="2" marker-end="url(#arrowHead)"/>
  
  <!-- 左上 -->
  <g transform="translate(240,140)">
    <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" 
          fill="#D4A574" fill-opacity="0.8"/>
    <text x="0" y="4" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#5D4037">節點F</text>
  </g>
  <path d="M366,160 L280,165" stroke="#8B5A2B" stroke-width="2" marker-end="url(#arrowHead)"/>
  
  <!-- 標題 -->
  <text x="400" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#8B5A2B">節點網絡 · 連結關係</text>
</svg>