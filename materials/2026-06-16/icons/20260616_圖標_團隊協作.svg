<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>團隊協作</title>
  <desc>工作報告圖標 - 三人組成的齒輪圖案</desc>
  <!-- 背景圓 -->
  <circle cx="60" cy="60" r="54" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <!-- 齒輪外圈 -->
  <circle cx="60" cy="60" r="35" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <!-- 齒輪齒 -->
  <g stroke="#F59E0B" stroke-width="6" stroke-linecap="round">
    <line x1="60" y1="18" x2="60" y2="28"/>
    <line x1="60" y1="92" x2="60" y2="102"/>
    <line x1="18" y1="60" x2="28" y2="60"/>
    <line x1="92" y1="60" x2="102" y2="60"/>
    <line x1="30" y1="30" x2="37" y2="37"/>
    <line x1="83" y1="83" x2="90" y2="90"/>
    <line x1="90" y1="30" x2="83" y2="37"/>
    <line x1="37" y1="83" x2="30" y2="90"/>
  </g>
  <!-- 中心人像 -->
  <circle cx="52" cy="52" r="8" fill="#D97706"/>
  <circle cx="68" cy="52" r="8" fill="#D97706"/>
  <circle cx="60" cy="68" r="8" fill="#D97706"/>
</svg>