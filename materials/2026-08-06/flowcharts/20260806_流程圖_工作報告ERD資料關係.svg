<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#FFF8E7"/><stop offset="1" stop-color="#F5E6D3"/></linearGradient>
    <linearGradient id="warm" x2="1" y2="1"><stop stop-color="#B8860B"/><stop offset="1" stop-color="#F2B94B"/></linearGradient>
    <linearGradient id="dark" x2="1" y2="1"><stop stop-color="#5C3A0E"/><stop offset="1" stop-color="#8B6914"/></linearGradient>
    <pattern id="honeycomb" x="0" y="0" width="78" height="86.6" patternUnits="userSpaceOnUse">
      <path d="M39,0 L78,21.65 L78,64.95 L39,86.6 L0,64.95 L0,21.65 Z" fill="none" stroke="#B8860B" stroke-width="0.6" opacity="0.1"/>
    </pattern>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.27  0 0 0 0 0.07  0 0 0 0.04 0"/></filter>
    <filter id="s" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#8B6914" flood-opacity=".15"/></filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#honeycomb)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.5"/>
  <g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
    <text x="120" y="130" font-size="28" fill="#B8860B" font-weight="700" letter-spacing="5">DATA SCHEMA · ERD 資料關係圖</text>
    <text x="120" y="205" font-size="62" fill="#5C3A0E" font-weight="800">工作報告 · 資料關聯網</text>
    <text x="120" y="253" font-size="25" fill="#8B6914">從圖表升級成綱要可視化 · ERD 結構呈現</text>
  </g>
  <!-- 中央樞紐：業績 (核心表) -->
  <g transform="translate(960 580)" filter="url(#s)">
    <path d="M-180,-110 L180,-110 L240,0 L180,110 L-180,110 L-240,0 Z" fill="url(#dark)"/>
    <text x="0" y="-50" font-size="22" fill="#F2B94B" text-anchor="middle" letter-spacing="3">CORE TABLE</text>
    <text x="0" y="10" font-size="56" font-weight="800" fill="#FFFFFF" text-anchor="middle">業績</text>
    <text x="0" y="60" font-size="20" fill="#F2B94B" text-anchor="middle">id · 期間 · 營收 · 完成率</text>
  </g>
  <!-- 4 個周邊資料表（六邊形節點，#120 變化4：邊框粗細對比） -->
  <g transform="translate(320 280)" filter="url(#s)">
    <path d="M-140,-90 L140,-90 L180,0 L140,90 L-140,90 L-180,0 Z" fill="#FFFFFF" stroke="#B8860B" stroke-width="6"/>
    <text x="0" y="-30" font-size="18" fill="#B8860B" text-anchor="middle" letter-spacing="2">TABLE A</text>
    <text x="0" y="20" font-size="34" font-weight="700" fill="#5C3A0E" text-anchor="middle">用戶</text>
    <text x="0" y="55" font-size="16" fill="#8B6914" text-anchor="middle">活躍 · 留存 · 偏好</text>
  </g>
  <g transform="translate(1600 280)" filter="url(#s)">
    <path d="M-140,-90 L140,-90 L180,0 L140,90 L-140,90 L-180,0 Z" fill="#FFFFFF" stroke="#B8860B" stroke-width="6"/>
    <text x="0" y="-30" font-size="18" fill="#B8860B" text-anchor="middle" letter-spacing="2">TABLE B</text>
    <text x="0" y="20" font-size="34" font-weight="700" fill="#5C3A0E" text-anchor="middle">產品</text>
    <text x="0" y="55" font-size="16" fill="#8B6914" text-anchor="middle">SKU · 價格 · 銷量</text>
  </g>
  <g transform="translate(320 880)" filter="url(#s)">
    <path d="M-140,-90 L140,-90 L180,0 L140,90 L-140,90 L-180,0 Z" fill="#FFFFFF" stroke="#B8860B" stroke-width="6"/>
    <text x="0" y="-30" font-size="18" fill="#B8860B" text-anchor="middle" letter-spacing="2">TABLE C</text>
    <text x="0" y="20" font-size="34" font-weight="700" fill="#5C3A0E" text-anchor="middle">行銷</text>
    <text x="0" y="55" font-size="16" fill="#8B6914" text-anchor="middle">渠道 · 預算 · ROI</text>
  </g>
  <g transform="translate(1600 880)" filter="url(#s)">
    <path d="M-140,-90 L140,-90 L180,0 L140,90 L-140,90 L-180,0 Z" fill="#FFFFFF" stroke="#B8860B" stroke-width="6"/>
    <text x="0" y="-30" font-size="18" fill="#B8860B" text-anchor="middle" letter-spacing="2">TABLE D</text>
    <text x="0" y="20" font-size="34" font-weight="700" fill="#5C3A0E" text-anchor="middle">客服</text>
    <text x="0" y="55" font-size="16" fill="#8B6914" text-anchor="middle">滿意度 · 客訴 · NPS</text>
  </g>
  <!-- 4 條連接線（#120 變化7：連接方式；#122 放射環形） -->
  <g stroke="#B8860B" stroke-width="3" stroke-dasharray="8 6" fill="none">
    <line x1="500" y1="280" x2="720" y2="580"/>
    <line x1="1420" y1="280" x2="1200" y2="580"/>
    <line x1="500" y1="880" x2="720" y2="580"/>
    <line x1="1420" y1="880" x2="1200" y2="580"/>
  </g>
  <!-- 連接線上的關係標籤（#120 變化3：填充方式對比 - 小實心六邊形） -->
  <g fill="url(#warm)">
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z" transform="translate(610 430) scale(0.5)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z" transform="translate(1310 430) scale(0.5)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z" transform="translate(610 730) scale(0.5)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z" transform="translate(1310 730) scale(0.5)"/>
  </g>
  <g font-family="Noto Sans TC, Microsoft JhengHei, sans-serif" font-size="16" fill="#5C3A0E" font-weight="700">
    <text x="625" y="425" text-anchor="middle">1:N</text>
    <text x="1325" y="425" text-anchor="middle">N:1</text>
    <text x="625" y="725" text-anchor="middle">N:M</text>
    <text x="1325" y="725" text-anchor="middle">1:1</text>
  </g>
  <!-- 底部說明 -->
  <g transform="translate(120 980)" font-family="Noto Sans TC, Microsoft JhengHei, sans-serif">
    <text x="0" y="20" font-size="20" fill="#8B6914" font-weight="700">獨特設計選擇</text>
    <text x="0" y="48" font-size="18" fill="#5C3A0E">六邊形節點表達實體 · 放射連線呈現關係 · 跨章節同構圖語言</text>
    <text x="900" y="20" font-size="20" fill="#8B6914" font-weight="700">可量化優勢</text>
    <text x="900" y="48" font-size="18" fill="#5C3A0E">結構化綱要 · 視覺化資料複雜度 · 50ms 內識別資料流向</text>
  </g>
</svg>
