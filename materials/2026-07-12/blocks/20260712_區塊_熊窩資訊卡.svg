<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <title>熊窩資訊卡</title>
  <desc>熊熊風格資訊卡片，蜂巢叢集設計，工作報告素材</desc>
  
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="50%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5DEB3"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <!-- 蜂巢圖案 -->
    <pattern id="honeycomb" patternUnits="userSpaceOnUse" width="60" height="52" patternTransform="scale(0.8)">
      <path d="M30,2 L57.7,17 L57.7,47 L30,62 L2.3,47 L2.3,17 Z" 
            fill="#8B5A2B" fill-opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- 卡片背景 -->
  <rect x="10" y="10" width="580" height="380" rx="20" ry="20" 
        fill="url(#cardGrad)" stroke="#6B4423" stroke-width="3"/>
  
  <!-- 蜂巢圖案疊加 -->
  <rect x="10" y="10" width="580" height="380" rx="20" ry="20" 
        fill="url(#honeycomb)"/>
  
  <!-- 頂部標題區 -->
  <rect x="30" y="30" width="540" height="80" rx="12" ry="12" 
        fill="#F5DEB3" fill-opacity="0.9"/>
  
  <!-- 熊熊標誌六邊形 -->
  <g transform="translate(70,70)">
    <path d="M0,-25 L21.7,-12.5 L21.7,12.5 L0,25 L-21.7,12.5 L-21.7,-12.5 Z" 
          fill="#6B4423"/>
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z" 
          fill="#D4A574"/>
  </g>
  
  <!-- 標題文字 -->
  <text x="110" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#6B4423">工作報告</text>
  <text x="110" y="90" font-family="Arial, sans-serif" font-size="16" fill="#8B5A2B">Project Report</text>
  
  <!-- 分隔線 -->
  <line x1="30" y1="130" x2="570" y2="130" stroke="#8B5A2B" stroke-width="2" stroke-dasharray="10,5"/>
  
  <!-- 內容區 - 三個蜂巢卡片 -->
  <g transform="translate(50,160)">
    <!-- 卡片1 -->
    <g transform="translate(0,0)">
      <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
            fill="#6B4423" fill-opacity="0.8"/>
      <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
            fill="none" stroke="#F5DEB3" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
            fill="#F5DEB3" text-anchor="middle">进度</text>
    </g>
    
    <!-- 卡片2 -->
    <g transform="translate(80,0)">
      <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
            fill="#8B5A2B" fill-opacity="0.8"/>
      <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
            fill="none" stroke="#F5DEB3" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
            fill="#F5DEB3" text-anchor="middle">成果</text>
    </g>
    
    <!-- 卡片3 -->
    <g transform="translate(160,0)">
      <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
            fill="#D4A574" fill-opacity="0.9"/>
      <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
            fill="none" stroke="#6B4423" stroke-width="2"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="14" font-weight="bold" 
            fill="#6B4423" text-anchor="middle">计划</text>
    </g>
  </g>
  
  <!-- 底部裝飾線 -->
  <line x1="50" y1="280" x2="550" y2="280" stroke="#6B4423" stroke-width="1.5" stroke-dasharray="5,3"/>
  
  <!-- 底部叢集裝飾 -->
  <g transform="translate(500,340)">
    <g transform="scale(0.5)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" fill="#6B4423" fill-opacity="0.5"/>
    </g>
    <g transform="translate(-40,10) scale(0.4)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" fill="none" stroke="#8B5A2B" stroke-width="2"/>
    </g>
    <g transform="translate(30,15) scale(0.35)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" fill="#D4A574" fill-opacity="0.7"/>
    </g>
  </g>
</svg>