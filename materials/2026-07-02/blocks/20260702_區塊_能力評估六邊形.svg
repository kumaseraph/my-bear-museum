<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="skillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CD853F"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
    <linearGradient id="skillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEB887"/>
      <stop offset="100%" stop-color="#D2691E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#DAA520"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="#FFF8DC"/>
  
  <!-- 分組叢集設計 - 三組六邊形代表三種能力 -->
  <g transform="translate(100,100)">
    <!-- 組1：核心能力 -->
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#skillGrad1)" stroke="#5D2E0C" stroke-width="2"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="#D2691E" fill-opacity="0.5" transform="scale(0.7)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="8" fill="#FFF">核心</text>
  </g>
  
  <g transform="translate(200,80)">
    <!-- 組2：專業技能 -->
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#skillGrad1)" stroke="#5D2E0C" stroke-width="2"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="#D2691E" fill-opacity="0.5" transform="scale(0.7)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="8" fill="#FFF">專業</text>
  </g>
  
  <g transform="translate(300,100)">
    <!-- 組3：軟實力 -->
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="url(#skillGrad1)" stroke="#5D2E0C" stroke-width="2"/>
    <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z" 
          fill="#D2691E" fill-opacity="0.5" transform="scale(0.7)"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial" font-size="8" fill="#FFF">軟實力</text>
  </g>
  
  <!-- 連接線 -->
  <g stroke="#DAA520" stroke-width="2" stroke-dasharray="5,3">
    <line x1="130" y1="100" x2="170" y2="85"/>
    <line x1="230" y1="85" x2="270" y2="100"/>
  </g>
  
  <!-- 第二排叢集 -->
  <g transform="translate(150,160)">
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z" 
          fill="url(#skillGrad2)" stroke="#8B4513" stroke-width="1.5"/>
  </g>
  <g transform="translate(200,170)">
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z" 
          fill="url(#goldGrad)" stroke="#8B4513" stroke-width="1.5"/>
  </g>
  <g transform="translate(250,160)">
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z" 
          fill="url(#skillGrad2)" stroke="#8B4513" stroke-width="1.5"/>
  </g>
  
  <!-- 標題 -->
  <text x="200" y="230" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#5D2E0C">能力評估</text>
  <text x="200" y="250" text-anchor="middle" font-family="Arial" font-size="10" fill="#8B4513">熊熊團隊 · 年度考核</text>
  
  <!-- 裝飾熊掌 -->
  <g transform="translate(50,250)" fill="#D2691E">
    <ellipse cx="0" cy="0" rx="8" ry="6"/>
    <circle cx="-6" cy="-8" r="3"/>
    <circle cx="0" cy="-10" r="3"/>
    <circle cx="6" cy="-8" r="3"/>
  </g>
  <g transform="translate(350,250)" fill="#D2691E">
    <ellipse cx="0" cy="0" rx="8" ry="6"/>
    <circle cx="-6" cy="-8" r="3"/>
    <circle cx="0" cy="-10" r="3"/>
    <circle cx="6" cy="-8" r="3"/>
  </g>
</svg>