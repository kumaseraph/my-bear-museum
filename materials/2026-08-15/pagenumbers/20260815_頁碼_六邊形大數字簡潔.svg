<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- 頁碼：六邊形大數字 - 技巧 #120 大小對比 + 2.5D 效果 + #121 圓形靶心 -->
  <!-- 設計原則：量化基準（清晰可數）、決策導向（頁碼本身就是導航決策點） -->
  <defs>
    <!-- 主六邊形漸層 -->
    <linearGradient id="hexMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
  </defs>

  <!-- 背景淡色六邊形群（小六邊形叢集） -->
  <g opacity="0.15">
    <path d="M40,30 60,42 60,66 40,78 20,66 20,42 Z" fill="#6B5CE7"/>
    <path d="M340,30 360,42 360,66 340,78 320,66 320,42 Z" fill="#6B5CE7"/>
    <path d="M40,130 60,142 60,166 40,178 20,166 20,142 Z" fill="#4ECDC4"/>
    <path d="M340,130 360,142 360,166 340,178 320,166 320,142 Z" fill="#4ECDC4"/>
  </g>

  <!-- 主大六邊形（2.5D 效果：外粗空心 + 內實心） -->
  <!-- 外粗框 -->
  <path d="M200,30 280,75 280,165 200,180 120,165 120,75 Z" fill="none" stroke="#4F46E5" stroke-width="4"/>
  <!-- 內實心 -->
  <path d="M200,40 270,80 270,160 200,170 130,160 130,80 Z" fill="url(#hexMainGrad)" opacity="0.95"/>

  <!-- 圓形靶心裝飾（技巧 #121 #1：圓形靶心） -->
  <circle cx="200" cy="105" r="38" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"/>
  <circle cx="200" cy="105" r="28" fill="none" stroke="#FFFFFF" stroke-width="0.8" opacity="0.3"/>

  <!-- 三角裝飾（技巧 #121 #3：六個頂點各一個裝飾三角） -->
  <polygon points="200,30 204,38 196,38" fill="#4ECDC4"/>
  <polygon points="280,75 288,77 282,84" fill="#4ECDC4"/>
  <polygon points="280,165 288,163 282,156" fill="#4ECDC4"/>
  <polygon points="200,180 204,172 196,172" fill="#4ECDC4"/>
  <polygon points="120,165 112,163 118,156" fill="#4ECDC4"/>
  <polygon points="120,75 112,77 118,84" fill="#4ECDC4"/>

  <!-- 頁碼大數字（量化基準） -->
  <text x="200" y="125" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">03</text>

  <!-- 左側小六邊形（總頁碼區） -->
  <path d="M60,90 80,102 80,124 60,136 40,124 40,102 Z" fill="#374151"/>
  <text x="60" y="120" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">12</text>
  <line x1="78" y1="113" x2="120" y2="113" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 右側小六邊形（標籤） -->
  <text x="320" y="120" font-family="Microsoft JhengHei, PingFang TC, sans-serif" font-size="14" fill="#374151" text-anchor="middle" font-weight="600">第 03 頁</text>
</svg>
