<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>圖標_目標達成</title>
  <desc>工作報告主題圖標 - 目標達成</desc>
  <defs>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
  </defs>
  
  <!-- 六邊形背景（大小對比：小六邊形襯托） -->
  <path d="M50,8 L86.6,30 L86.6,70 L50,92 L13.4,70 L13.4,30 Z" 
        fill="none" stroke="#6B5CE7" stroke-width="2"/>
  <path d="M50,8 L86.6,30 L86.6,70 L50,92 L13.4,70 L13.4,30 Z" 
        fill="#6B5CE7" fill-opacity="0.1"/>
  
  <!-- 靶心圖示 -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#6B5CE7" stroke-width="2"/>
  <circle cx="50" cy="50" r="20" fill="none" stroke="#6B5CE7" stroke-width="2"/>
  <circle cx="50" cy="50" r="10" fill="none" stroke="#6B5CE7" stroke-width="2"/>
  <circle cx="50" cy="50" r="4" fill="#FF8C00"/>
  
  <!-- 箭矢 -->
  <line x1="85" y1="15" x2="50" y2="50" stroke="url(#targetGrad)" stroke-width="3" stroke-linecap="round"/>
  <polygon points="50,50 42,42 48,38 52,44" fill="url(#targetGrad)"/>
  
  <!-- 裝飾小六邊形 -->
  <path d="M82,20 L91.2,27.5 L91.2,42.5 L82,50 L72.8,42.5 L72.8,27.5 Z" 
        fill="#4ECDC4" fill-opacity="0.7"/>
</svg>