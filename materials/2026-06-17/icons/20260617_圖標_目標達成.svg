<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>目標達成</title>
  <desc>工作報告中表示目標達成的圖標</desc>
  <!-- 背景圓圈 -->
  <circle cx="32" cy="32" r="30" fill="#F5E6D3" stroke="#8B6914" stroke-width="2"/>
  <!-- 靶心 -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#C4A35A" stroke-width="2"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#C4A35A" stroke-width="2"/>
  <circle cx="32" cy="32" r="6" fill="#8B6914"/>
  <!-- 箭（從左上射入） -->
  <path d="M10 10 L30 30" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <path d="M10 10 L14 10 M10 10 L10 14" stroke="#8B6914" stroke-width="2" stroke-linecap="round"/>
  <!-- 對勾裝飾 -->
  <path d="M44 42 L48 48 L56 36" fill="none" stroke="#C4A35A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>