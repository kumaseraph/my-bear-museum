<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="500" height="100">
  <defs>
    <pattern id="pg2Dots" patternUnits="userSpaceOnUse" width="8" height="8">
      <circle cx="4" cy="4" r="0.8" fill="#CBD5E1"/>
    </pattern>
  </defs>

  <!-- 底部點陣底紋（簡潔質感）-->
  <rect x="0" y="60" width="500" height="40" fill="url(#pg2Dots)" opacity="0.6"/>

  <!-- 左側小六邊形群組（#120 大小對比 + 旋轉角度對比）-->
  <g transform="translate(40,40)">
    <!-- 當前頁：大實心六邊形 -->
    <path d="M25,0 L46.6,12 L46.6,36 L25,48 L3.4,36 L3.4,12 Z"
          fill="#3B82F6" transform="rotate(0, 25, 24)"/>
    <!-- 上一頁：小空心六邊形 -->
    <g transform="translate(-40,12) rotate(30, 12, 12)">
      <path d="M12,0 L22.4,5.5 L22.4,16.5 L12,22 L1.6,16.5 L1.6,5.5 Z"
            fill="none" stroke="#94A3B8" stroke-width="1"/>
    </g>
    <!-- 下一頁：小空心六邊形 -->
    <g transform="translate(48,12) rotate(30, 12, 12)">
      <path d="M12,0 L22.4,5.5 L22.4,16.5 L12,22 L1.6,16.5 L1.6,5.5 Z"
            fill="none" stroke="#94A3B8" stroke-width="1"/>
    </g>
  </g>

  <!-- 中央大字 -->
  <text x="250" y="55" font-family="'Helvetica Neue',sans-serif"
        font-size="32" font-weight="700" fill="#1E40AF" text-anchor="middle">05</text>

  <!-- 斜向引導線（#124 邊界引導線）-->
  <line x1="160" y1="20" x2="340" y2="80" stroke="#3B82F6" stroke-width="0.8" opacity="0.4"/>

  <!-- 進度條（簡潔長條）-->
  <g transform="translate(330,42)">
    <rect x="0" y="0" width="140" height="3" rx="1.5" fill="#E2E8F0"/>
    <rect x="0" y="0" width="25" height="3" rx="1.5" fill="#3B82F6"/>
  </g>

  <!-- 進度文字 -->
  <text x="330" y="68" font-family="'PingFang TC',sans-serif"
        font-size="10" fill="#94A3B8" letter-spacing="1">5 / 28 PROGRESS</text>
</svg>
