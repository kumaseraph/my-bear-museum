<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 頂部邊框 -->
  <g transform="translate(0, 0)">
    <!-- 左上角六邊形裝飾 -->
    <polygon points="15,0 30,0 37,8 30,16 15,16 8,8" fill="#F59E0B"/>
    <polygon points="15,4 27,4 32,9 27,14 15,14 10,9" fill="#1E40AF"/>
    
    <!-- 頂部線條 -->
    <rect x="40" y="6" width="320" height="4" fill="url(#borderGrad)"/>
    
    <!-- 右上角六邊形裝飾 -->
    <polygon points="385,0 370,0 363,8 370,16 385,16 392,8" fill="#F59E0B"/>
    <polygon points="385,4 373,4 368,9 373,14 385,14 390,9" fill="#1E40AF"/>
  </g>
  
  <!-- 底部邊框 -->
  <g transform="translate(0, 84)">
    <!-- 左下角六邊形裝飾 -->
    <polygon points="15,0 30,0 37,8 30,16 15,16 8,8" fill="#F59E0B"/>
    <polygon points="15,4 27,4 32,9 27,14 15,14 10,9" fill="#1E40AF"/>
    
    <!-- 底部線條 -->
    <rect x="40" y="6" width="320" height="4" fill="url(#borderGrad)"/>
    
    <!-- 右下角六邊形裝飾 -->
    <polygon points="385,0 370,0 363,8 370,16 385,16 392,8" fill="#F59E0B"/>
    <polygon points="385,4 373,4 368,9 373,14 385,14 390,9" fill="#1E40AF"/>
  </g>
  
  <!-- 左側垂直裝飾線 -->
  <rect x="8" y="20" width="3" height="60" fill="#1E40AF" opacity="0.6"/>
  <rect x="14" y="24" width="2" height="52" fill="#3B82F6" opacity="0.4"/>
  
  <!-- 右側垂直裝飾線 -->
  <rect x="389" y="20" width="3" height="60" fill="#1E40AF" opacity="0.6"/>
  <rect x="384" y="24" width="2" height="52" fill="#3B82F6" opacity="0.4"/>
</svg>