<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#f9f8f5"/>
  <defs>
    <!-- 標準圓角六邊形 path（side=30, r=4.5, flat-top） -->
    <path id="hex" d="M39 5 L52 20 A4.5 4.5 0 0 0 52 40 L39 55 A4.5 4.5 0 0 0 26 60 L13 55 A4.5 4.5 0 0 0 13 45 L0 40 A4.5 4.5 0 0 0 0 20 L13 5 A4.5 4.5 0 0 0 26 0 L39 5 Z"/>
  </defs>

  <text x="200" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#1a1a2e" letter-spacing="2">HONEYCOMB INFOGRAPHIC</text>
  <text x="200" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" fill="#6b7280">iOS-Style Smooth Corners · Flat-top · r = 15% · No Sharp Vertices</text>

  <!-- 外圈 6 顆 -->
  <!-- 上 -->
  <g transform="translate(174, 68)">
    <use href="#hex" stroke="#7c3aed" stroke-width="1.2" fill="rgba(124,58,237,0.15)"/>
    <text x="26" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#7c3aed">策略</text>
    <text x="26" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="7" fill="#7c3aed">核心</text>
  </g>
  <!-- 右上 -->
  <g transform="translate(226, 83)">
    <use href="#hex" stroke="#0891b2" stroke-width="1.2" fill="rgba(8,145,178,0.12)"/>
    <text x="26" y="33" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#0891b2">執行</text>
  </g>
  <!-- 右下 -->
  <g transform="translate(226, 143)">
    <use href="#hex" stroke="#059669" stroke-width="1.2" fill="rgba(5,150,105,0.12)"/>
    <text x="26" y="33" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#059669">效率</text>
  </g>
  <!-- 下 -->
  <g transform="translate(174, 158)">
    <use href="#hex" stroke="#db2777" stroke-width="1.2" fill="rgba(219,39,119,0.12)"/>
    <text x="26" y="33" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#db2777">品質</text>
  </g>
  <!-- 左下 -->
  <g transform="translate(122, 143)">
    <use href="#hex" stroke="#2563eb" stroke-width="1.2" fill="rgba(37,99,235,0.12)"/>
    <text x="26" y="33" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#2563eb">成長</text>
  </g>
  <!-- 左上 -->
  <g transform="translate(122, 83)">
    <use href="#hex" stroke="#6b7280" stroke-width="1.2" fill="rgba(107,114,128,0.12)"/>
    <text x="26" y="33" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" font-weight="700" fill="#374151">團隊</text>
  </g>

  <!-- 中心 -->
  <g transform="translate(174, 113)">
    <use href="#hex" stroke="#7c3aed" stroke-width="1.5" fill="rgba(124,58,237,0.22)"/>
    <text x="26" y="26" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" font-weight="800" fill="#6d28d9">核心</text>
    <text x="26" y="39" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9" font-weight="800" fill="#6d28d9">價值</text>
  </g>

  <text x="200" y="258" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#9ca3af">技巧 #82 · Honeycomb Geometry Standard · Flat-top Regular Hexagon</text>
  <text x="200" y="272" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="8" fill="#9ca3af">Arc Rounded Corners · r = s × 15% · All Corners Identical</text>
</svg>
