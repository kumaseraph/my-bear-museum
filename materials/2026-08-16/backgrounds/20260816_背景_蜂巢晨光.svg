<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- 蜂蜜漸層 -->
    <radialGradient id="honeyGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FFF4DC"/>
      <stop offset="60%" stop-color="#F8F1E4"/>
      <stop offset="100%" stop-color="#EFE0C2"/>
    </radialGradient>
    <!-- 蜂蜜色 -->
    <linearGradient id="honeyCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#C77B22"/>
    </linearGradient>
    <linearGradient id="honeyRing1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4B860"/>
      <stop offset="100%" stop-color="#D89030"/>
    </linearGradient>
    <!-- 蜂巢pattern 背景層 -->
    <pattern id="honeycombBg" x="0" y="0" width="78" height="86.6" patternUnits="userSpaceOnUse">
      <path d="M39,0 L78,21.65 L78,64.95 L39,86.6 L0,64.95 L0,21.65 Z"
            fill="none" stroke="#D9B870" stroke-width="0.8" opacity="0.35"/>
    </pattern>
    <!-- 手繪粗糙濾鏡 (Imperfect by Design) -->
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2"/>
    </filter>
  </defs>

  <!-- 背景漸層 -->
  <rect width="1920" height="1080" fill="url(#honeyGlow)"/>
  <!-- 蜂巢底紋 -->
  <rect width="1920" height="1080" fill="url(#honeycombBg)" opacity="0.7"/>

  <!-- 放射環形蜂巢 中心+2環=19個六邊形 -->
  <g transform="translate(960, 540)" filter="url(#rough)">
    <!-- 中心大六邊形 (s=120) — 主視覺 -->
    <path d="M0,-120 L103.9,-60 L103.9,60 L0,120 L-103.9,60 L-103.9,-60 Z"
          fill="url(#honeyCenter)" stroke="#8B5A2B" stroke-width="3"/>
    <!-- 中心內嵌 2.5D 效果 -->
    <path d="M0,-75 L64.95,-37.5 L64.95,37.5 L0,75 L-64.95,37.5 L-64.95,-37.5 Z"
          fill="none" stroke="#FFE4A8" stroke-width="4"/>

    <!-- 第一環 6個中型六邊形 (s=80) -->
    <path d="M0,-80 L69.3,-40 L69.3,40 L0,80 L-69.3,40 L-69.3,-40 Z"
          fill="url(#honeyRing1)" stroke="#8B5A2B" stroke-width="2"
          transform="rotate(0) translate(0,-170)"/>
    <path d="M0,-80 L69.3,-40 L69.3,40 L0,80 L-69.3,40 L-69.3,-40 Z"
          fill="url(#honeyRing1)" stroke="#8B5A2B" stroke-width="2"
          transform="rotate(60) translate(0,-170)"/>
    <path d="M0,-80 L69.3,-40 L69.3,40 L0,80 L-69.3,40 L-69.3,-40 Z"
          fill="url(#honeyRing1)" stroke="#8B5A2B" stroke-width="2"
          transform="rotate(120) translate(0,-170)"/>
    <path d="M0,-80 L69.3,-40 L69.3,40 L0,80 L-69.3,40 L-69.3,-40 Z"
          fill="url(#honeyRing1)" stroke="#8B5A2B" stroke-width="2"
          transform="rotate(180) translate(0,-170)"/>
    <path d="M0,-80 L69.3,-40 L69.3,40 L0,80 L-69.3,40 L-69.3,-40 Z"
          fill="url(#honeyRing1)" stroke="#8B5A2B" stroke-width="2"
          transform="rotate(240) translate(0,-170)"/>
    <path d="M0,-80 L69.3,-40 L69.3,40 L0,80 L-69.3,40 L-69.3,-40 Z"
          fill="url(#honeyRing1)" stroke="#8B5A2B" stroke-width="2"
          transform="rotate(300) translate(0,-170)"/>

    <!-- 第二環 12個小型六邊形 (s=40) -->
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
          fill="#F4B860" stroke="#8B5A2B" stroke-width="1.5"
          transform="rotate(0) translate(0,-280)"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
          fill="none" stroke="#8B5A2B" stroke-width="1.5"
          transform="rotate(30) translate(0,-280)"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
          fill="#F4B860" stroke="#8B5A2B" stroke-width="1.5"
          transform="rotate(60) translate(0,-280)"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
          fill="none" stroke="#8B5A2B" stroke-width="1.5"
          transform="rotate(90) translate(0,-280)"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
          fill="#F4B860" stroke="#8B5A2B" stroke-width="1.5"
          transform="rotate(120) translate(0,-280)"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
          fill="none" stroke="#8B5A2B" stroke-width="1.5"
          transform="rotate(150) translate(0,-280)"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
          fill="#F4B860" stroke="#8B5A2B" stroke-width="1.5"
          transform="rotate(180) translate(0,-280)"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
          fill="none" stroke="#8B5A2B" stroke-width="1.5"
          transform="rotate(210) translate(0,-280)"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
          fill="#F4B860" stroke="#8B5A2B" stroke-width="1.5"
          transform="rotate(240) translate(0,-280)"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
          fill="none" stroke="#8B5A2B" stroke-width="1.5"
          transform="rotate(270) translate(0,-280)"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
          fill="#F4B860" stroke="#8B5A2B" stroke-width="1.5"
          transform="rotate(300) translate(0,-280)"/>
    <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
          fill="none" stroke="#8B5A2B" stroke-width="1.5"
          transform="rotate(330) translate(0,-280)"/>
  </g>

  <!-- 角落裝飾 (Bento Grid 區塊) -->
  <g transform="translate(120, 120)">
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="#E8A33D" opacity="0.85"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="none" stroke="#8B5A2B" stroke-width="2"/>
  </g>
  <g transform="translate(1800, 960)">
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="#E8A33D" opacity="0.85"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="none" stroke="#8B5A2B" stroke-width="2"/>
  </g>

  <!-- 標題文字 (熊熊風格) -->
  <g transform="translate(960, 880)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
          fill="#5C3A1E" text-anchor="middle">工作報告 · 蜂巢晨光</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="22"
          fill="#8B5A2B" text-anchor="middle" opacity="0.85">Work Report · Honeycomb Morning</text>
  </g>
</svg>
