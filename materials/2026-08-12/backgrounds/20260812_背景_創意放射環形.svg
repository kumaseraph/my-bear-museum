<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 風格：創意活潑｜技巧 #122 變化3（放射環形）+ #120 變化5（顏色深淺對比）+ 動態對比 -->
  <defs>
    <radialGradient id="radialBg" cx="80%" cy="20%" r="100%">
      <stop offset="0%" stop-color="#FFE5EC"/>
      <stop offset="50%" stop-color="#FFD6E0"/>
      <stop offset="100%" stop-color="#E8D5F2"/>
    </radialGradient>
    <linearGradient id="centerHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ECDC4"/>
      <stop offset="100%" stop-color="#26A69A"/>
    </linearGradient>
    <linearGradient id="ring2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FFA726"/>
    </linearGradient>
    <linearGradient id="ring3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>
  </defs>

  <!-- 背景漸層 -->
  <rect width="1920" height="1080" fill="url(#radialBg)"/>

  <!-- 右上放射環形（主視覺焦點） -->
  <g transform="translate(1480, 280)">
    <!-- 中心大六邊形 -->
    <path d="M0,-90 L77.94,-45 L77.94,45 L0,90 L-77.94,45 L-77.94,-45 Z"
          fill="url(#centerHex)"/>

    <!-- 內環（6個） -->
    <path d="M0,-55 L47.63,-27.5 L47.63,27.5 L0,55 L-47.63,27.5 L-47.63,-27.5 Z"
          fill="url(#ring1)" transform="rotate(0) translate(0,-120)"/>
    <path d="M0,-55 L47.63,-27.5 L47.63,27.5 L0,55 L-47.63,27.5 L-47.63,-27.5 Z"
          fill="url(#ring1)" transform="rotate(60) translate(0,-120)"/>
    <path d="M0,-55 L47.63,-27.5 L47.63,27.5 L0,55 L-47.63,27.5 L-47.63,-27.5 Z"
          fill="url(#ring1)" transform="rotate(120) translate(0,-120)"/>
    <path d="M0,-55 L47.63,-27.5 L47.63,27.5 L0,55 L-47.63,27.5 L-47.63,-27.5 Z"
          fill="url(#ring1)" transform="rotate(180) translate(0,-120)"/>
    <path d="M0,-55 L47.63,-27.5 L47.63,27.5 L0,55 L-47.63,27.5 L-47.63,-27.5 Z"
          fill="url(#ring1)" transform="rotate(240) translate(0,-120)"/>
    <path d="M0,-55 L47.63,-27.5 L47.63,27.5 L0,55 L-47.63,27.5 L-47.63,-27.5 Z"
          fill="url(#ring1)" transform="rotate(300) translate(0,-120)"/>

    <!-- 中環（12個，交錯） -->
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z"
          fill="url(#ring2)" opacity="0.9"
          transform="rotate(30) translate(0,-200)"/>
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z"
          fill="url(#ring2)" opacity="0.9"
          transform="rotate(60) translate(0,-200)"/>
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z"
          fill="url(#ring2)" opacity="0.9"
          transform="rotate(90) translate(0,-200)"/>
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z"
          fill="url(#ring2)" opacity="0.9"
          transform="rotate(120) translate(0,-200)"/>
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z"
          fill="url(#ring2)" opacity="0.9"
          transform="rotate(150) translate(0,-200)"/>
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z"
          fill="url(#ring2)" opacity="0.9"
          transform="rotate(180) translate(0,-200)"/>
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z"
          fill="url(#ring2)" opacity="0.9"
          transform="rotate(210) translate(0,-200)"/>
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z"
          fill="url(#ring2)" opacity="0.9"
          transform="rotate(240) translate(0,-200)"/>
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z"
          fill="url(#ring2)" opacity="0.9"
          transform="rotate(270) translate(0,-200)"/>
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z"
          fill="url(#ring2)" opacity="0.9"
          transform="rotate(300) translate(0,-200)"/>
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z"
          fill="url(#ring2)" opacity="0.9"
          transform="rotate(330) translate(0,-200)"/>
    <path d="M0,-40 L34.64,-20 L34.64,20 L0,40 L-34.64,20 L-34.64,-20 Z"
          fill="url(#ring2)" opacity="0.9"
          transform="rotate(0) translate(0,-200)"/>

    <!-- 外環虛線（半透明，數量增加） -->
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"
          transform="rotate(15) translate(0,-275)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"
          transform="rotate(45) translate(0,-275)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"
          transform="rotate(75) translate(0,-275)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"
          transform="rotate(105) translate(0,-275)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"
          transform="rotate(135) translate(0,-275)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"
          transform="rotate(165) translate(0,-275)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"
          transform="rotate(195) translate(0,-275)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"
          transform="rotate(225) translate(0,-275)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"
          transform="rotate(255) translate(0,-275)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"
          transform="rotate(285) translate(0,-275)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"
          transform="rotate(315) translate(0,-275)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.5"
          transform="rotate(345) translate(0,-275)"/>
  </g>

  <!-- 左下裝飾放射環（小） -->
  <g transform="translate(220, 880)" opacity="0.7">
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
          fill="url(#ring3)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#FFD93D"
          transform="rotate(0) translate(0,-70)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#FFD93D"
          transform="rotate(60) translate(0,-70)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#FFD93D"
          transform="rotate(120) translate(0,-70)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#FFD93D"
          transform="rotate(180) translate(0,-70)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#FFD93D"
          transform="rotate(240) translate(0,-70)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#FFD93D"
          transform="rotate(300) translate(0,-70)"/>
  </g>

  <!-- 中央留白焦點區（供文字覆蓋） -->
  <rect x="380" y="380" width="900" height="320" fill="#FFFFFF" fill-opacity="0.5" rx="24"/>

  <!-- 散落小六邊形點綴 -->
  <g opacity="0.35">
    <path d="M0,-15 L12.99,-7.5 L12.99,7.5 L0,15 L-12.99,7.5 L-12.99,-7.5 Z"
          fill="#9B59B6" transform="translate(600, 150)"/>
    <path d="M0,-12 L10.39,-6 L10.39,6 L0,12 L-10.39,6 L-10.39,-6 Z"
          fill="#4ECDC4" transform="translate(820, 920)"/>
    <path d="M0,-18 L15.59,-9 L15.59,9 L0,18 L-15.59,9 L-15.59,-9 Z"
          fill="#FFD93D" transform="translate(1400, 850)"/>
    <path d="M0,-14 L12.12,-7 L12.12,7 L0,14 L-12.12,7 L-12.12,-7 Z"
          fill="#FF6B6B" transform="translate(1500, 920)"/>
  </g>
</svg>
