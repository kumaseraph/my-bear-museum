<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <title>協調合作</title>
  <desc>工作報告圖標 - 六邊形十形設計，代表團隊協作與資源整合</desc>
  <!-- 外圈六邊形 -->
  <path d="M50,8 L88,29 L88,71 L50,92 L12,71 L12,29 Z" 
        fill="none" stroke="#6B5CE7" stroke-width="2"/>
  <!-- 內圈六邊形（虛線） -->
  <path d="M50,20 L76,36 L76,64 L50,80 L24,64 L24,36 Z" 
        fill="none" stroke="#4ECDC4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- 中心靶心圓 -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#6B5CE7" stroke-width="2"/>
  <circle cx="50" cy="50" r="10" fill="#6B5CE7"/>
  <circle cx="50" cy="50" r="4" fill="#4ECDC4"/>
  <!-- 六個頂點裝飾 -->
  <circle cx="50" cy="12" r="3" fill="#FF8C00"/>
  <circle cx="85" cy="32" r="3" fill="#FF8C00"/>
  <circle cx="85" cy="68" r="3" fill="#FF8C00"/>
  <circle cx="50" cy="88" r="3" fill="#FF8C00"/>
  <circle cx="15" cy="68" r="3" fill="#FF8C00"/>
  <circle cx="15" cy="32" r="3" fill="#FF8C00"/>
</svg>