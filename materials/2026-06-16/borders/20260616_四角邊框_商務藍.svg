<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <title>商務藍四角邊框</title>
  <desc>正式專業風格的四角邊框，適用於工作報告</desc>
  <!-- 背景留白 -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>
  <!-- 頂部左角 -->
  <path d="M0,80 L0,0 L80,0" fill="none" stroke="#1E40AF" stroke-width="6"/>
  <path d="M0,60 L0,20 Q0,0 20,0 L60,0" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <!-- 頂部右角 -->
  <path d="M1920,80 L1920,0 L1840,0" fill="none" stroke="#1E40AF" stroke-width="6"/>
  <path d="M1920,60 L1920,20 Q1920,0 1900,0 L1860,0" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <!-- 底部左角 -->
  <path d="M0,1000 L0,1080 L80,1080" fill="none" stroke="#1E40AF" stroke-width="6"/>
  <path d="M0,1020 L0,1060 Q0,1080 20,1080 L60,1080" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <!-- 底部右角 -->
  <path d="M1920,1000 L1920,1080 L1840,1080" fill="none" stroke="#1E40AF" stroke-width="6"/>
  <path d="M1920,1020 L1920,1060 Q1920,1080 1900,1080 L1860,1080" fill="none" stroke="#3B82F6" stroke-width="2"/>
  <!-- 頂部橫線裝飾 -->
  <line x1="100" y1="40" x2="400" y2="40" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
  <line x1="1520" y1="40" x2="1820" y2="40" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
  <!-- 底部橫線裝飾 -->
  <line x1="100" y1="1040" x2="400" y2="1040" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
  <line x1="1520" y1="1040" x2="1820" y2="1040" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>
</svg>