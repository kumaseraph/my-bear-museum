<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熊熊簡報列表 | Bear Slides</title>
<style>
:root {
  --bg: #0F0F1A;
  --card: #1A1A2E;
  --card-hover: #252540;
  --primary: #C9A96E;
  --accent: #E8C39E;
  --text: #F0EDE8;
  --text-mid: #A8A8B8;
  --text-light: #6B6B7B;
  --border: #2A2A3E;
}
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  height: 52px;
  background: rgba(15,15,26,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-brand {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 0.5px;
}
.nav-link {
  font-size: 13px;
  color: var(--text-mid);
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 6px;
  transition: all 0.2s;
}
.nav-link:hover {
  color: var(--text);
  background: var(--card);
}
.nav-link.active {
  color: var(--primary);
}

.main {
  padding: 80px 40px 60px;
  max-width: 1200px;
  margin: 0 auto;
}
.page-header {
  margin-bottom: 40px;
}
.page-title {
  font-size: 32px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 8px;
}
.page-subtitle {
  font-size: 14px;
  color: var(--text-mid);
}

.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
  flex-wrap: wrap;
}
.filter-tag {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 12px;
  color: var(--text-mid);
  background: var(--card);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.filter-tag:hover,
.filter-tag.active {
  color: var(--primary);
  border-color: var(--primary);
  background: rgba(201,169,110,0.08);
}

.slides-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}
.slide-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  text-decoration: none;
  color: inherit;
  transition: all 0.25s;
  display: block;
}
.slide-card:hover {
  border-color: var(--primary);
  background: var(--card-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3), 0 0 0 1px rgba(201,169,110,0.2);
}
.card-thumb {
  width: 100%;
  height: 160px;
  background: linear-gradient(135deg, var(--card-hover) 0%, var(--card) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.card-thumb svg {
  width: 48px;
  height: 48px;
  opacity: 0.3;
}
.card-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.card-body {
  padding: 16px;
}
.card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-date {
  font-size: 11px;
  color: var(--text-light);
}
.card-footer {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-link {
  font-size: 11px;
  color: var(--primary);
  text-decoration: none;
}
.card-color {
  width: 12px;
  height: 12px;
  border-radius: 50%;
}

@media (max-width: 600px) {
  .main { padding: 72px 16px 40px; }
  .page-title { font-size: 24px; }
  .slides-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">🐾 Bear Slides</div>
  <div>
    <a href="/ppt" class="nav-link">素材庫</a>
    <a href="/slides" class="nav-link active">簡報列表</a>
  </div>
</nav>

<main class="main">
  <div class="page-header">
    <h1 class="page-title">熊熊簡報列表</h1>
    <p class="page-subtitle">共 <span id="total-count">0</span> 份簡報</p>
  </div>

  <div class="filter-bar" id="filter-bar">
    <span class="filter-tag active" data-filter="all">全部</span>
    <span class="filter-tag" data-filter="government">政府</span>
    <span class="filter-tag" data-filter="tech">科技</span>
    <span class="filter-tag" data-filter="creative">創意</span>
    <span class="filter-tag" data-filter="business">商業</span>
    <span class="filter-tag" data-filter="life">生活</span>
    <span class="filter-tag" data-filter="review">回顧</span>
  </div>

  <div class="slides-grid" id="slides-grid"></div>
</main>

<script>

  {
    file: "2026-06-16-rounded-honeycomb.html",

  },
  {

    date: "2026-06-16",

    color: "#C9A96E"
  },
  {
    file: "2026-06-17-honeycomb-lv-demo.html",
    title: "圓角蜂巢系統 — Lv1~Lv4 示範（技巧#82）",
    date: "2026-06-17",
    category: "creative",
    color: "#C9A96E"
  },
  {
    file: "2026-06-18-ntpc-personnel-evaluation-briefing.html",
    title: "新北市政府115年員額評鑑行前會議",
    date: "2026-06-18",
    category: "government",
    color: "#1565C0"
  },
  {
    file: "2026-06-19-ntpc-personnel-evaluation-meeting.html",
    title: "新北市政府115年員額評鑑行前會議",
    date: "2026-06-19",
    category: "government",

  },
  {
    file: "2026-06-21-hexagon-honeycomb-guide.html",
    title: "蜂巢圖聖典 | 熊熊簡報",
    date: "2026-06-21",
    category: "creative",
    color: "#C9A96E"
  },
  {
    file: "2026-06-21-sustainability-environment.html",
    title: "永續未來：環境保護行動 | 熊熊簡報",
    date: "2026-06-21",
    category: "life",
    color: "#2E7D32"
  },
  {
    file: "2026-06-22-bear-ai-growth-journey.html",
    title: "熊熊的 AI 成長之路",
    date: "2026-06-22",

  },
  {

    date: "2026-06-22",

  },
  {
    file: "2026-06-22-zheng-fu-gong-wu.html",

  },
  {

    date: "2026-06-22",

  },
  {
    file: "bear-museum-2026-review.html",
    title: "熊熊博物館 2026 年度回顧",
    date: "2026-06-13",
    category: "review",
    color: "#C9A96E"
  },
  {
    file: "earth-tone-cover-demo.html",
    title: "大地暖色系封面示範 | 熊熊簡報",

    color: "#A26769"
  },
  {
    file: "work-report-2026.html",
    title: "工作報告 - 熊熊簡報",
    date: "2026-06-14",
    category: "business",
    color: "#C9A96E"
  }
];

const CATEGORY_LABELS = {
  government: "政府",
  tech: "科技",
  creative: "創意",
  business: "商業",
  life: "生活",
  review: "回顧"
};

function formatDate(d) {
  const [y, m, day] = d.split("-");
  return `${parseInt(m)}/${parseInt(day)}`;
}

function renderSlides(filter) {
  const grid = document.getElementById("slides-grid");
  const filtered = filter === "all" ? SLIDES : SLIDES.filter(s => s.category === filter);
  grid.innerHTML = filtered.map(slide => `
    <a class="slide-card" href="${slide.file}">
      <div class="card-thumb">
        <svg viewBox="0 0 64 64" fill="none" stroke="${slide.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="12" width="48" height="36" rx="4"/>
          <line x1="8" y1="52" x2="56" y2="52"/>
          <circle cx="32" cy="36" r="8"/>
          <line x1="40" y1="36" x2="48" y2="36"/>
        </svg>
        <span class="card-badge" style="background:${slide.color}20;color:${slide.color};border:1px solid ${slide.color}40">
          ${CATEGORY_LABELS[slide.category] || slide.category}
        </span>
      </div>
      <div class="card-body">
        <div class="card-title">${slide.title}</div>
        <div class="card-date">${formatDate(slide.date)}</div>
      </div>
      <div class="card-footer">
        <span class="card-link">開啟簡報 →</span>
        <span class="card-color" style="background:${slide.color}"></span>
      </div>
    </a>
  `).join("");
}

document.getElementById("total-count").textContent = SLIDES.length;
renderSlides("all");

document.querySelectorAll(".filter-tag").forEach(tag => {
  tag.addEventListener("click", () => {
    document.querySelectorAll(".filter-tag").forEach(t => t.classList.remove("active"));
    tag.classList.add("active");
    renderSlides(tag.dataset.filter);
  });
});
</script>
</body>
</html>
