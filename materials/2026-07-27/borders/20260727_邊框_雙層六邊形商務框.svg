<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- 商務深藍漸層 -->
    <linearGradient id="bizGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="innerHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <!-- 內部斜線紋理 -->
    <pattern id="diagLines" patternUnits="userSpaceOnUse" width="14" height="14">
      <line x1="0" y1="14" x2="14" y2="0" stroke="#1E3A8A" stroke-width="0.5" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#F8FAFC"/>
  <rect width="1920" height="1080" fill="url(#diagLines)"/>

  <!-- 標題列 -->
  <text x="120" y="100" font-family="Microsoft JhengHei, sans-serif" font-size="44" font-weight="700" fill="#1E3A8A">工作報告｜雙層六邊形商務框</text>
  <text x="120" y="148" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#64748B">#120 大小對比 × 2.5D 效果 × bento 敘事並排</text>

  <!-- ===== 主框：四角色六邊形 2.5D 效果 ===== -->
  <!-- 左上角 -->
  <g transform="translate(120, 220)">
    <path d="M0,50 L43.3,72.5 L43.3,127.5 L0,150 L-43.3,127.5 L-43.3,72.5 Z" fill="none" stroke="#1E40AF" stroke-width="4"/>
    <path d="M0,65 L29,82 L29,118 L0,135 L-29,118 L-29,82 Z" fill="url(#innerHex)" opacity="0.9"/>
  </g>
  <!-- 右上角 -->
  <g transform="translate(1800, 220)">
    <path d="M0,50 L43.3,72.5 L43.3,127.5 L0,150 L-43.3,127.5 L-43.3,72.5 Z" fill="none" stroke="#1E40AF" stroke-width="4"/>
    <path d="M0,65 L29,82 L29,118 L0,135 L-29,118 L-29,82 Z" fill="url(#innerHex)" opacity="0.9"/>
  </g>
  <!-- 左下角 -->
  <g transform="translate(120, 860)">
    <path d="M0,50 L43.3,72.5 L43.3,127.5 L0,150 L-43.3,127.5 L-43.3,72.5 Z" fill="none" stroke="#1E40AF" stroke-width="4"/>
    <path d="M0,65 L29,82 L29,118 L0,135 L-29,118 L-29,82 Z" fill="url(#innerHex)" opacity="0.9"/>
  </g>
  <!-- 右下角 -->
  <g transform="translate(1800, 860)">
    <path d="M0,50 L43.3,72.5 L43.3,127.5 L0,150 L-43.3,127.5 L-43.3,72.5 Z" fill="none" stroke="#1E40AF" stroke-width="4"/>
    <path d="M0,65 L29,82 L29,118 L0,135 L-29,118 L-29,82 Z" fill="url(#innerHex)" opacity="0.9"/>
  </g>

  <!-- 邊框線（虛實對比）-->
  <rect x="190" y="290" width="1540" height="500" fill="none" stroke="#1E40AF" stroke-width="2" stroke-dasharray="0"/>
  <rect x="180" y="280" width="1560" height="520" fill="none" stroke="#3B82F6" stroke-width="1" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- 中央三段標題（bento 敘事並排）-->
  <g transform="translate(960, 380)">
    <line x1="-700" y1="0" x2="700" y2="0" stroke="#1E40AF" stroke-width="1" opacity="0.35"/>
  </g>
  <text x="960" y="540" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="72" font-weight="800" fill="url(#bizGrad)">KEY MESSAGE</text>
  <text x="960" y="600" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" fill="#475569">請置入一句話結論，每張 slide 單獨成立</text>
  <g transform="translate(960, 680)">
    <line x1="-700" y1="0" x2="700" y2="0" stroke="#1E40AF" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- 底部三小六邊形（叢集強調）-->
  <g transform="translate(800, 800)">
    <path d="M0,0 L40,12 L40,42 L0,54 L-40,42 L-40,12 Z" fill="url(#hexGrad)" opacity="0.85"/>
  </g>
  <g transform="translate(960, 800)">
    <path d="M0,0 L40,12 L40,42 L0,54 L-40,42 L-40,12 Z" fill="url(#hexGrad)" opacity="0.85"/>
  </g>
  <g transform="translate(1120, 800)">
    <path d="M0,0 L40,12 L40,42 L0,54 L-40,42 L-40,12 Z" fill="url(#hexGrad)" opacity="0.85"/>
  </g>

  <!-- 角落輔助文字 -->
  <text x="700" y="836" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Q1</text>
  <text x="960" y="836" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Q2</text>
  <text x="1220" y="836" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Q3</text>

  <!-- 註腳技術標籤 -->
  <text x="120" y="990" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#94A3B8">技巧 #120 六邊形十式｜大小對比 + 2.5D 虛實對比</text>
  <text x="1800" y="990" text-anchor="end" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#94A3B8">2026-07-27 熊熊生成</text>
</svg>
