<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="ganttGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <!-- 技巧#124 平行四邊形（節點網絡）
       工作報告 - 專案進度甘特圖 icon -->

  <!-- 外框六邊形（外粗空心 = 2.5D） -->
  <path d="M200,30 L338,108 L338,292 L200,370 L62,292 L62,108 Z"
        fill="none" stroke="url(#ganttGrad)" stroke-width="5"/>

  <!-- 甘特圖標題列 -->
  <rect x="90" y="110" width="220" height="22" rx="3" fill="#1E40AF"/>
  <text x="200" y="127" text-anchor="middle"
        font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
        font-size="13" fill="#FFFFFF" font-weight="600">
    專案甘特圖
  </text>

  <!-- 三條甘特條（不同進度，平行四邊形節點） -->
  <!-- 第一列 -->
  <g transform="translate(90,150)">
    <text x="-2" y="20" text-anchor="end"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="11" fill="#1E40AF">A</text>
    <polygon points="5,8 110,8 105,28 0,28" fill="url(#ganttGrad)"/>
    <rect x="5" y="8" width="105" height="20" fill="url(#ganttGrad)"/>
  </g>

  <!-- 第二列 -->
  <g transform="translate(90,190)">
    <text x="-2" y="20" text-anchor="end"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="11" fill="#1E40AF">B</text>
    <polygon points="5,8 150,8 145,28 0,28" fill="url(#ganttGrad)" opacity="0.75"/>
    <rect x="5" y="8" width="145" height="20" fill="url(#ganttGrad)" opacity="0.75"/>
    <!-- 進度分隔 -->
    <rect x="5" y="8" width="90" height="20" fill="#1E40AF"/>
    <!-- 完成點 -->
    <circle cx="95" cy="18" r="5" fill="#F59E0B"/>
  </g>

  <!-- 第三列 -->
  <g transform="translate(90,230)">
    <text x="-2" y="20" text-anchor="end"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="11" fill="#1E40AF">C</text>
    <polygon points="5,8 180,8 175,28 0,28" fill="url(#ganttGrad)" opacity="0.55"/>
    <rect x="5" y="8" width="180" height="20" fill="url(#ganttGrad)" opacity="0.55"/>
    <rect x="5" y="8" width="50" height="20" fill="#1E40AF"/>
    <circle cx="55" cy="18" r="5" fill="#F59E0B"/>
  </g>

  <!-- 第四列 -->
  <g transform="translate(90,270)">
    <text x="-2" y="20" text-anchor="end"
          font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
          font-size="11" fill="#1E40AF">D</text>
    <polygon points="5,8 70,8 65,28 0,28" fill="#1E40AF"/>
    <rect x="5" y="8" width="70" height="20" fill="#1E40AF"/>
  </g>

  <!-- 今日時間軸線（虛線，標示當前） -->
  <line x1="190" y1="140" x2="190" y2="298" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="190" cy="298" r="6" fill="#F59E0B"/>
  <text x="190" y="320" text-anchor="middle"
        font-family="'PingFang TC','Microsoft JhengHei',sans-serif"
        font-size="10" fill="#F59E0B" font-weight="600">
    Today
  </text>

  <!-- 時間軸標尺 -->
  <line x1="90" y1="105" x2="310" y2="105" stroke="#1E40AF" stroke-width="1" stroke-opacity="0.3"/>
</svg>