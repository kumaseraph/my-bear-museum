<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="handmadeLines" patternUnits="userSpaceOnUse" width="6" height="6">
      <line x1="0" y1="6" x2="6" y2="0" stroke="#1E40AF" stroke-width="0.4" opacity="0.15"/>
    </pattern>
    <marker id="arrowGold2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#F59E0B"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#FBF7EE"/>
  <rect width="1920" height="1080" fill="url(#handmadeLines)"/>

  <!-- 結論式標題 -->
  <text x="160" y="140" font-family="'Noto Sans TC', sans-serif" font-size="64" font-weight="900" fill="#1E1E1E">12 週交付 · 5 階段節奏</text>
  <text x="160" y="195" font-family="'Noto Sans TC', sans-serif" font-size="26" fill="#6B5B3C">專案甘特圖 · 平行四邊形階梯排列 · 線條引導進展</text>
  <line x1="160" y1="225" x2="380" y2="225" stroke="#F59E0B" stroke-width="4"/>

  <!-- 時間軸標題 -->
  <g font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#6B5B3C" font-weight="700">
    <text x="280" y="320" text-anchor="middle">W1-W3</text>
    <text x="540" y="320" text-anchor="middle">W4-W6</text>
    <text x="800" y="320" text-anchor="middle">W7-W8</text>
    <text x="1060" y="320" text-anchor="middle">W9-W10</text>
    <text x="1320" y="320" text-anchor="middle">W11-W12</text>
  </g>
  <line x1="160" y1="340" x2="1760" y2="340" stroke="#1E40AF" stroke-width="2" opacity="0.4"/>

  <!-- 5 個階段：平行四邊形階梯排列（技巧 #124 變化 #3）-->
  <!-- 階段 1：需求收集 -->
  <g transform="translate(160,400)">
    <polygon points="40,0 320,0 280,80 0,80" fill="#1E40AF" stroke="#F59E0B" stroke-width="2"/>
    <text x="180" y="38" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="900" fill="#F59E0B">階段 1</text>
    <text x="180" y="65" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#FBF7EE">需求收集</text>
  </g>
  <text x="180" y="510" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#1E40AF">User Story 23 則</text>

  <!-- 階段 2：設計 -->
  <g transform="translate(440,510)">
    <polygon points="40,0 320,0 280,80 0,80" fill="#3B82F6" stroke="#F59E0B" stroke-width="2"/>
    <text x="180" y="38" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="900" fill="#F59E0B">階段 2</text>
    <text x="180" y="65" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#FBF7EE">系統設計</text>
  </g>
  <text x="620" y="620" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#1E40AF">Wireframe 8 頁</text>

  <!-- 階段 3：開發 -->
  <g transform="translate(720,620)">
    <polygon points="40,0 320,0 280,80 0,80" fill="#1E40AF" stroke="#F59E0B" stroke-width="2"/>
    <text x="180" y="38" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="900" fill="#F59E0B">階段 3</text>
    <text x="180" y="65" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#FBF7EE">開發實作</text>
  </g>
  <text x="900" y="730" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#1E40AF">前端 API 42 支</text>

  <!-- 階段 4：測試 -->
  <g transform="translate(1000,730)">
    <polygon points="40,0 320,0 280,80 0,80" fill="#3B82F6" stroke="#F59E0B" stroke-width="2"/>
    <text x="180" y="38" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="900" fill="#F59E0B">階段 4</text>
    <text x="180" y="65" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#FBF7EE">整合測試</text>
  </g>
  <text x="1180" y="840" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#1E40AF">UAT 通過率 96%</text>

  <!-- 階段 5：上線 -->
  <g transform="translate(1280,840)">
    <polygon points="40,0 320,0 280,80 0,80" fill="#F59E0B" stroke="#1E40AF" stroke-width="2"/>
    <text x="180" y="38" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="900" fill="#1E40AF">階段 5</text>
    <text x="180" y="65" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#FBF7EE">正式上線</text>
  </g>
  <text x="1460" y="950" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="16" fill="#1E40AF" font-weight="700">成果交付 ✓</text>

  <!-- 連接線：線條引導（技巧 #124 變化 #2）-->
  <path d="M 480 480 L 600 510" stroke="#F59E0B" stroke-width="3" fill="none" marker-end="url(#arrowGold2)"/>
  <path d="M 760 590 L 880 620" stroke="#F59E0B" stroke-width="3" fill="none" marker-end="url(#arrowGold2)"/>
  <path d="M 1040 700 L 1160 730" stroke="#F59E0B" stroke-width="3" fill="none" marker-end="url(#arrowGold2)"/>
  <path d="M 1320 810 L 1440 840" stroke="#F59E0B" stroke-width="3" fill="none" marker-end="url(#arrowGold2)"/>

  <!-- 進度標記 -->
  <line x1="640" y1="380" x2="640" y2="960" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,4" opacity="0.55"/>
  <g transform="translate(620,360)">
    <rect x="0" y="0" width="60" height="28" fill="#F59E0B" rx="14"/>
    <text x="30" y="20" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" fill="#1E1E1E">現在</text>
  </g>

  <!-- Footer -->
  <line x1="160" y1="970" x2="1760" y2="970" stroke="#1E40AF" stroke-width="1" opacity="0.3"/>
  <text x="160" y="1020" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#6B5B3C">🏛️ 熊熊素材庫 · 工作報告系列</text>
  <text x="1760" y="1020" text-anchor="end" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#6B5B3C">技巧 #124 階梯排列 + 線條引導</text>
</svg>
