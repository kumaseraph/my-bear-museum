<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="warmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DEB3"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
    <linearGradient id="coolBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#5D3A1A"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="#FFFAF5"/>
  
  <!-- 標題區塊 -->
  <rect x="20" y="20" width="360" height="40" rx="8" fill="url(#coolBrown)"/>
  <text x="200" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F5DEB3">📊 數據儀表 Data Dashboard</text>
  
  <!-- 三個數據卡片（交錯蜂巢排列） -->
  <g transform="translate(100,130)">
    <!-- 左卡片 -->
    <g>
      <path d="M0,-35 L30.31,-17.5 L30.31,17.5 L0,35 L-30.31,17.5 L-30.31,-17.5 Z" 
            fill="url(#warmGold)" stroke="#8B5A2B" stroke-width="2"/>
      <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5D3A1A">128</text>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8B5A2B">專案數</text>
    </g>
  </g>
  
  <g transform="translate(200,155)">
    <!-- 中間卡片（較大） -->
    <g>
      <path d="M0,-45 L38.97,-22.5 L38.97,22.5 L0,45 L-38.97,22.5 L-38.97,-22.5 Z" 
            fill="url(#coolBrown)" stroke="#D4A574" stroke-width="3"/>
      <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#F5DEB3">92%</text>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#D4A574">完成率</text>
    </g>
  </g>
  
  <g transform="translate(300,130)">
    <!-- 右卡片 -->
    <g>
      <path d="M0,-35 L30.31,-17.5 L30.31,17.5 L0,35 L-30.31,17.5 L-30.31,-17.5 Z" 
            fill="url(#warmGold)" stroke="#8B5A2B" stroke-width="2"/>
      <text x="0" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5D3A1A">24</text>
      <text x="0" y="12" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#8B5A2B">團隊成員</text>
    </g>
  </g>
  
  <!-- 底部裝飾蜂巢 -->
  <g transform="translate(200,260)" fill="#D4A574" fill-opacity="0.2">
    <path d="M0,-15 L12.99,-7.5 L12.99,7.5 L0,15 L-12.99,7.5 L-12.99,-7.5 Z"/>
    <path d="M0,-15 L12.99,-7.5 L12.99,7.5 L0,15 L-12.99,7.5 L-12.99,-7.5 Z" transform="translate(26,0)"/>
    <path d="M0,-15 L12.99,-7.5 L12.99,7.5 L0,15 L-12.99,7.5 L-12.99,-7.5 Z" transform="translate(-26,0)"/>
  </g>
</svg>