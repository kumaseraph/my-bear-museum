<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 邊框_六邊蜂巢報告全框 | 工作報告系列 | 🐻 熊熊風格 -->
  <!-- 技巧: #120 六邊形十式 - 大小對比 + 2.5D效果(外粗空心+內實心) + 虛實對比 + 顏色深淺對比 -->
  <!-- 趨勢融合: 品牌色克制使用 + 對齊比裝飾重要 + 刻意保留人類痕跡(手繪感) -->
  <defs>
    <linearGradient id="bearGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92750C"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="bearBrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#D4A574"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#FFFBF0"/>

  <!-- 主外框 -->
  <rect x="80" y="80" width="1760" height="920" fill="none" stroke="url(#bearGold)" stroke-width="3"/>
  <!-- 內輔助框(精準對齊) -->
  <rect x="100" y="100" width="1720" height="880" fill="none" stroke="#D4A574" stroke-width="1" opacity="0.4"/>

  <!-- 四角六邊形叢集(2.5D: 外粗空心+內實心) -->
  <!-- 左上 -->
  <g transform="translate(80, 80)">
    <!-- 大六邊形 s=50 -->
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z"
          fill="none" stroke="url(#bearGold)" stroke-width="4"/>
    <!-- 內實心小六邊形 s=25 -->
    <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z"
          fill="url(#bearGold)" fill-opacity="0.85"/>
    <!-- 點綴小六邊形 s=12(虛實對比) -->
    <path d="M12,1.2 L22.4,6.9 L22.4,17.4 L12,23 L1.6,17.4 L1.6,6.9 Z"
          fill="none" stroke="#8B5A2B" stroke-width="1.5"/>
  </g>

  <!-- 右上 -->
  <g transform="translate(1840, 80) scale(-1, 1)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z"
          fill="none" stroke="url(#bearGold)" stroke-width="4"/>
    <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z"
          fill="url(#bearGold)" fill-opacity="0.85"/>
    <path d="M12,1.2 L22.4,6.9 L22.4,17.4 L12,23 L1.6,17.4 L1.6,6.9 Z"
          fill="none" stroke="#8B5A2B" stroke-width="1.5"/>
  </g>

  <!-- 左下 -->
  <g transform="translate(80, 1000) scale(1, -1)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z"
          fill="none" stroke="url(#bearGold)" stroke-width="4"/>
    <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z"
          fill="url(#bearGold)" fill-opacity="0.85"/>
    <path d="M12,1.2 L22.4,6.9 L22.4,17.4 L12,23 L1.6,17.4 L1.6,6.9 Z"
          fill="none" stroke="#8B5A2B" stroke-width="1.5"/>
  </g>

  <!-- 右下 -->
  <g transform="translate(1840, 1000) scale(-1, -1)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z"
          fill="none" stroke="url(#bearGold)" stroke-width="4"/>
    <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z"
          fill="url(#bearGold)" fill-opacity="0.85"/>
    <path d="M12,1.2 L22.4,6.9 L22.4,17.4 L12,23 L1.6,17.4 L1.6,6.9 Z"
          fill="none" stroke="#8B5A2B" stroke-width="1.5"/>
  </g>

  <!-- 頂部蜂巢序列(邊界引導 - 大小對比 + 顏色深淺對比) -->
  <g transform="translate(480, 60)">
    <!-- 7 個小六邊形排列 -->
    <g transform="translate(0, 15)">
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearGold)" opacity="0.6"/>
    </g>
    <g transform="translate(30, 15)">
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearGold)" opacity="0.7"/>
    </g>
    <g transform="translate(60, 15)">
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearGold)" opacity="0.8"/>
    </g>
    <!-- 中央焦點：大六邊形 -->
    <g transform="translate(90, 0)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z"
            fill="none" stroke="url(#bearBrown)" stroke-width="2"/>
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearBrown)"/>
    </g>
    <g transform="translate(150, 15)">
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearGold)" opacity="0.8"/>
    </g>
    <g transform="translate(180, 15)">
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearGold)" opacity="0.7"/>
    </g>
    <g transform="translate(210, 15)">
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearGold)" opacity="0.6"/>
    </g>
  </g>

  <!-- 底部對稱蜂巢序列 -->
  <g transform="translate(480, 1020)">
    <g transform="translate(0, 0)">
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearGold)" opacity="0.6"/>
    </g>
    <g transform="translate(30, 0)">
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearGold)" opacity="0.7"/>
    </g>
    <g transform="translate(60, 0)">
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearGold)" opacity="0.8"/>
    </g>
    <g transform="translate(90, -15)">
      <path d="M25,2.5 L46.65,13.75 L46.65,36.25 L25,47.5 L3.35,36.25 L3.35,13.75 Z"
            fill="none" stroke="url(#bearBrown)" stroke-width="2"/>
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearBrown)"/>
    </g>
    <g transform="translate(150, 0)">
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearGold)" opacity="0.8"/>
    </g>
    <g transform="translate(180, 0)">
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearGold)" opacity="0.7"/>
    </g>
    <g transform="translate(210, 0)">
      <path d="M15,1.5 L28,7.5 L28,22.5 L15,28.5 L2,22.5 L2,7.5 Z"
            fill="url(#bearGold)" opacity="0.6"/>
    </g>
  </g>

  <!-- 左右側邊界引導線(對齊軸 - 精準對齊) -->
  <line x1="160" y1="220" x2="160" y2="860" stroke="url(#bearGold)" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.35"/>
  <line x1="1760" y1="220" x2="1760" y2="860" stroke="url(#bearGold)" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.35"/>

  <!-- 角落小圓點(手繪痕跡 - 不完美辨識度) -->
  <circle cx="960" cy="80" r="3" fill="#8B5A2B" opacity="0.6"/>
  <circle cx="960" cy="1000" r="3" fill="#8B5A2B" opacity="0.6"/>
</svg>