<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <pattern id="paperLines" patternUnits="userSpaceOnUse" width="100" height="3">
      <line x1="0" y1="1.5" x2="100" y2="1.5" stroke="#1E40AF" stroke-width="0.4" opacity="0.12"/>
    </pattern>
    <linearGradient id="cardGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cardBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E40AF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="#FBF7EE"/>
  <rect width="1920" height="1080" fill="url(#paperLines)"/>

  <!-- 卡片標題 -->
  <text x="160" y="140" font-family="'Noto Sans TC', sans-serif" font-size="64" font-weight="900" fill="#1E1E1E">本月 KPI 4 指標全部達標</text>
  <text x="160" y="195" font-family="'Noto Sans TC', sans-serif" font-size="26" fill="#6B5B3C">關鍵指標儀表板 · 一頁看出業績 · 數據即結論</text>
  <line x1="160" y1="225" x2="380" y2="225" stroke="#F59E0B" stroke-width="4"/>

  <!-- 4 個 KPI 卡片（平行四邊形組合，技巧 #124 + 區塊應用）-->
  <!-- KPI 1：營收 -->
  <g transform="translate(160,320)">
    <polygon points="40,0 410,0 370,300 0,300" fill="url(#cardBlue)" stroke="#F59E0B" stroke-width="3"/>
    <text x="220" y="60" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#F59E0B">📈 營收</text>
    <text x="220" y="155" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="72" font-weight="900" fill="#FBF7EE">$2.4M</text>
    <text x="220" y="195" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#FBF7EE" opacity="0.85">本月營收</text>
    <line x1="60" y1="220" x2="380" y2="220" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
    <text x="220" y="255" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#F59E0B">▲ 18% vs 上月</text>
  </g>

  <!-- KPI 2：活躍用戶 -->
  <g transform="translate(580,320)">
    <polygon points="40,0 410,0 370,300 0,300" fill="#3B82F6" stroke="#F59E0B" stroke-width="3"/>
    <text x="220" y="60" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#F59E0B">👥 活躍用戶</text>
    <text x="220" y="155" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="72" font-weight="900" fill="#FBF7EE">42.8K</text>
    <text x="220" y="195" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#FBF7EE" opacity="0.85">月活躍用戶</text>
    <line x1="60" y1="220" x2="380" y2="220" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
    <text x="220" y="255" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#F59E0B">▲ 12% vs 上月</text>
  </g>

  <!-- KPI 3：任務完成率 -->
  <g transform="translate(1000,320)">
    <polygon points="40,0 410,0 370,300 0,300" fill="url(#cardBlue)" stroke="#F59E0B" stroke-width="3"/>
    <text x="220" y="60" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#F59E0B">✅ 完成率</text>
    <text x="220" y="155" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="72" font-weight="900" fill="#FBF7EE">96%</text>
    <text x="220" y="195" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#FBF7EE" opacity="0.85">任務完成率</text>
    <line x1="60" y1="220" x2="380" y2="220" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
    <text x="220" y="255" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#F59E0B">▲ 4% vs 上月</text>
  </g>

  <!-- KPI 4：NPS -->
  <g transform="translate(1420,320)">
    <polygon points="40,0 410,0 370,300 0,300" fill="#3B82F6" stroke="#F59E0B" stroke-width="3"/>
    <text x="220" y="60" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="20" font-weight="700" fill="#F59E0B">💯 NPS</text>
    <text x="220" y="155" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="72" font-weight="900" fill="#FBF7EE">+58</text>
    <text x="220" y="195" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="18" fill="#FBF7EE" opacity="0.85">淨推薦值</text>
    <line x1="60" y1="220" x2="380" y2="220" stroke="#F59E0B" stroke-width="1.5" opacity="0.6"/>
    <text x="220" y="255" text-anchor="middle" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="700" fill="#F59E0B">▲ 7 分 vs 上月</text>
  </g>

  <!-- 底部洞察區塊（結論式）-->
  <g transform="translate(160,710)">
    <polygon points="40,0 1600,0 1560,170 0,170" fill="#1E40AF" stroke="#F59E0B" stroke-width="3"/>
    <polygon points="40,0 1600,0 1560,170 0,170" fill="none" stroke="#FBF7EE" stroke-width="1" stroke-dasharray="4,4" opacity="0.3"/>
    <text x="80" y="55" font-family="'Noto Sans TC', sans-serif" font-size="24" font-weight="700" fill="#F59E0B">本月關鍵洞察</text>
    <text x="80" y="100" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="#FBF7EE">· 營收超目標 18%，歸功於 Q3 企業方案上線</text>
    <text x="80" y="135" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="#FBF7EE">· 活躍用戶突破 4 萬，行動端佔比達 68%</text>
    <text x="800" y="100" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="#FBF7EE">· 完成率連續 3 月 > 90%，團隊節奏穩定</text>
    <text x="800" y="135" font-family="'Noto Sans TC', sans-serif" font-size="22" fill="#FBF7EE">· NPS 創新高，下季目標挑戰 +65</text>
  </g>

  <!-- Footer -->
  <line x1="160" y1="970" x2="1760" y2="970" stroke="#1E40AF" stroke-width="1" opacity="0.3"/>
  <text x="160" y="1020" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#6B5B3C">🏛️ 熊熊素材庫 · 工作報告系列</text>
  <text x="1760" y="1020" text-anchor="end" font-family="'Noto Sans TC', sans-serif" font-size="20" fill="#6B5B3C">技巧 #124 平行四邊形 + 區塊組合</text>
</svg>
