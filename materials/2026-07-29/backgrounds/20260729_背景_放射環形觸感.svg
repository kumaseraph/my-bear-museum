<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- 紫漸層底色 -->
    <radialGradient id="purpleBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="50%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </radialGradient>

    <!-- 環形蜂巢 pattern（淡化） -->
    <pattern id="honeycombRing" x="0" y="0" width="130" height="150" patternUnits="userSpaceOnUse">
      <path d="M65,0 L130,37.5 L130,112.5 L65,150 L0,112.5 L0,37.5 Z"
            fill="none" stroke="#8B5CF6" stroke-width="0.6" opacity="0.18"/>
    </pattern>

    <!-- 觸感顆粒 -->
    <pattern id="tactileGrain" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <g opacity="0.15">
        <circle cx="15" cy="20" r="0.8" fill="#5B21B6"/>
        <circle cx="50" cy="40" r="0.6" fill="#7C3AED"/>
        <circle cx="70" cy="15" r="0.5" fill="#5B21B6"/>
        <circle cx="30" cy="60" r="0.7" fill="#7C3AED"/>
        <circle cx="65" cy="70" r="0.4" fill="#5B21B6"/>
      </g>
    </pattern>

    <!-- 中央焦點光暈 -->
    <radialGradient id="focusGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- 強調色光暈（酸綠 + 鮭魚橙） -->
    <radialGradient id="accentGlowA" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#84CC16" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentGlowB" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底色：紫漸層 -->
  <rect width="1920" height="1080" fill="url(#purpleBg)"/>
  <rect width="1920" height="1080" fill="url(#honeycombRing)"/>
  <rect width="1920" height="1080" fill="url(#tactileGrain)"/>
  <rect width="1920" height="1080" fill="url(#accentGlowA)"/>
  <rect width="1920" height="1080" fill="url(#accentGlowB)"/>

  <!-- 放射環形焦點群（中心 (960, 540)，尺寸漸層 3 環） -->
  <g transform="translate(960, 540)">

    <!-- 第 1 環 (外圍) - 12 個小六邊形 -->
    <g opacity="0.55">
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="#8B5CF6" transform="rotate(0)   translate(0, -380)"/>
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="#8B5CF6" transform="rotate(30)  translate(0, -380)"/>
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="#8B5CF6" transform="rotate(60)  translate(0, -380)"/>
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="#8B5CF6" transform="rotate(90)  translate(0, -380)"/>
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="#8B5CF6" transform="rotate(120) translate(0, -380)"/>
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="#8B5CF6" transform="rotate(150) translate(0, -380)"/>
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="#8B5CF6" transform="rotate(180) translate(0, -380)"/>
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="#8B5CF6" transform="rotate(210) translate(0, -380)"/>
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="#8B5CF6" transform="rotate(240) translate(0, -380)"/>
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="#8B5CF6" transform="rotate(270) translate(0, -380)"/>
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="#8B5CF6" transform="rotate(300) translate(0, -380)"/>
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="#8B5CF6" transform="rotate(330) translate(0, -380)"/>
    </g>

    <!-- 第 2 環 (中環) - 6 個中六邊形 (虛實對比 + 大小對比) -->
    <g opacity="0.78">
      <path d="M0,-42 L36.4,-21 L36.4,21 L0,42 L-36.4,21 L-36.4,-21 Z"
            fill="#7C3AED"
            transform="rotate(0) translate(0, -220)"/>
      <path d="M0,-42 L36.4,-21 L36.4,21 L0,42 L-36.4,21 L-36.4,-21 Z"
            fill="#7C3AED"
            transform="rotate(60) translate(0, -220)"/>
      <path d="M0,-42 L36.4,-21 L36.4,21 L0,42 L-36.4,21 L-36.4,-21 Z"
            fill="#7C3AED"
            transform="rotate(120) translate(0, -220)"/>
      <path d="M0,-42 L36.4,-21 L36.4,21 L0,42 L-36.4,21 L-36.4,-21 Z"
            fill="#7C3AED"
            transform="rotate(180) translate(0, -220)"/>
      <path d="M0,-42 L36.4,-21 L36.4,21 L0,42 L-36.4,21 L-36.4,-21 Z"
            fill="#7C3AED"
            transform="rotate(240) translate(0, -220)"/>
      <path d="M0,-42 L36.4,-21 L36.4,21 L0,42 L-36.4,21 L-36.4,-21 Z"
            fill="#7C3AED"
            transform="rotate(300) translate(0, -220)"/>
    </g>

    <!-- 連接虛線（第 2 環到中心）-->
    <g stroke="#FBBF24" stroke-width="2" stroke-dasharray="6,5" fill="none" opacity="0.55">
      <line x1="0" y1="-178" x2="0" y2="-70" transform="rotate(0)"/>
      <line x1="0" y1="-178" x2="0" y2="-70" transform="rotate(60)"/>
      <line x1="0" y1="-178" x2="0" y2="-70" transform="rotate(120)"/>
      <line x1="0" y1="-178" x2="0" y2="-70" transform="rotate(180)"/>
      <line x1="0" y1="-178" x2="0" y2="-70" transform="rotate(240)"/>
      <line x1="0" y1="-178" x2="0" y2="-70" transform="rotate(300)"/>
    </g>

    <!-- 中心焦點光暈 -->
    <circle cx="0" cy="0" r="220" fill="url(#focusGlow)"/>

    <!-- 中心大六邊形 (核心) - 2.5D 效果 -->
    <path d="M0,-95 L82.3,-47.5 L82.3,47.5 L0,95 L-82.3,47.5 L-82.3,-47.5 Z"
          fill="none" stroke="#5B21B6" stroke-width="5"/>
    <path d="M0,-95 L82.3,-47.5 L82.3,47.5 L0,95 L-82.3,47.5 L-82.3,-47.5 Z"
          fill="#FBBF24" fill-opacity="0.85"/>

    <!-- 內部裝飾：中心小六邊形 + 五角星 -->
    <path d="M0,-55 L47.6,-27.5 L47.6,27.5 L0,55 L-47.6,27.5 L-47.6,-27.5 Z"
          fill="none" stroke="#5B21B6" stroke-width="2.5"/>

    <!-- 五角星 (#123 菱形包圍五角星 變化) -->
    <polygon points="0,-30 9,-9 30,-9 13,5 19,28 0,14 -19,28 -13,5 -30,-9 -9,-9"
             fill="#5B21B6" transform="translate(0, 0)"/>
  </g>

  <!-- 角落小型裝飾（旋轉六邊形，補 4 角） -->
  <g opacity="0.65">
    <!-- 左上 -->
    <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
          fill="none" stroke="#FB7185" stroke-width="2.5"
          transform="translate(160, 160) rotate(15)"/>
    <!-- 右上 -->
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="#FB7185" fill-opacity="0.7"
          transform="translate(1760, 160) rotate(-20)"/>
    <!-- 左下 -->
    <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
          fill="#84CC16" fill-opacity="0.7"
          transform="translate(160, 920) rotate(30)"/>
    <!-- 右下 -->
    <path d="M0,-28 L24.2,-14 L24.2,14 L0,28 L-24.2,14 L-24.2,-14 Z"
          fill="none" stroke="#84CC16" stroke-width="2.5"
          transform="translate(1760, 920) rotate(-15)"/>
  </g>

  <!-- 強調裝飾條紋（左下角，條紋疊加效果）-->
  <g transform="translate(160, 980)" opacity="0.6">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#5B21B6" stroke-width="2"/>
    <line x1="0" y1="8" x2="120" y2="8" stroke="#5B21B6" stroke-width="2"/>
    <line x1="0" y1="16" x2="120" y2="16" stroke="#5B21B6" stroke-width="2"/>
  </g>
  <g transform="translate(1640, 60)" opacity="0.6">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#FB7185" stroke-width="2"/>
    <line x1="0" y1="8" x2="120" y2="8" stroke="#FB7185" stroke-width="2"/>
    <line x1="0" y1="16" x2="120" y2="16" stroke="#FB7185" stroke-width="2"/>
  </g>
</svg>