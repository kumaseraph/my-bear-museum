<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- 熊熊工作報告 - 不完美蜂巢拼貼背景 (Illustrated Worlds + 隨機碎片蜂巢) -->
  <defs>
    <!-- 主背景漸層（暖棕 → 奶油） -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="50%" stop-color="#F5E6D3"/>
      <stop offset="100%" stop-color="#E8D5B7"/>
    </linearGradient>

    <!-- 印刷感 grain (Illustrated Worlds 趨勢核心) -->
    <filter id="bgGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" seed="21"/>
      <feColorMatrix values="0 0 0 0 0.55
                             0 0 0 0 0.27
                             0 0 0 0 0.07
                             0 0 0 0.08 0"/>
    </filter>

    <!-- 蜂巢叢集 pattern -->
    <pattern id="bgHoneycomb" x="0" y="0" width="78" height="86.6" patternUnits="userSpaceOnUse">
      <path d="M39,0 L78,21.65 L78,64.95 L39,86.6 L0,64.95 L0,21.65 Z"
            fill="none" stroke="#B8860B" stroke-width="0.6" opacity="0.25"/>
    </pattern>

    <!-- 漸層六邊形 -->
    <linearGradient id="hexGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A0826D"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
    <linearGradient id="hexGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>

  <!-- 底層漸層 -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- 中層蜂巢 pattern -->
  <rect width="1920" height="1080" fill="url(#bgHoneycomb)" opacity="0.7"/>

  <!-- 隨機碎片蜂巢（技巧 #122 第 7 變化 — 隨機碎片） -->
  <g opacity="0.6">
    <!-- 左上區域 -->
    <g transform="translate(220, 200) rotate(-8)">
      <path d="M0,-55 L47.6,-27.5 L47.6,27.5 L0,55 L-47.6,27.5 L-47.6,-27.5 Z"
            fill="none" stroke="#8B4513" stroke-width="3"/>
      <path d="M0,-45 L39,-22.5 L39,22.5 L0,45 L-39,22.5 L-39,-22.5 Z"
            fill="url(#hexGradA)" fill-opacity="0.7"/>
    </g>

    <g transform="translate(140, 320) rotate(12)">
      <path d="M0,-32 L27.7,-16 L27.7,16 L0,32 L-27.7,16 L-27.7,-16 Z"
            fill="none" stroke="#B8860B" stroke-width="2"/>
    </g>

    <g transform="translate(330, 380) rotate(-15)">
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="url(#hexGradB)" fill-opacity="0.5"/>
    </g>

    <!-- 右下區域 -->
    <g transform="translate(1700, 880) rotate(8)">
      <path d="M0,-65 L56.3,-32.5 L56.3,32.5 L0,65 L-56.3,32.5 L-56.3,-32.5 Z"
            fill="none" stroke="#8B4513" stroke-width="3"/>
      <path d="M0,-55 L47.6,-27.5 L47.6,27.5 L0,55 L-47.6,27.5 L-47.6,-27.5 Z"
            fill="url(#hexGradA)" fill-opacity="0.6"/>
    </g>

    <g transform="translate(1820, 760) rotate(-10)">
      <path d="M0,-38 L32.9,-19 L32.9,19 L0,38 L-32.9,19 L-32.9,-19 Z"
            fill="none" stroke="#B8860B" stroke-width="2.5"/>
    </g>

    <g transform="translate(1620, 980) rotate(15)">
      <path d="M0,-25 L21.6,-12.5 L21.6,12.5 L0,25 L-21.6,12.5 L-21.6,-12.5 Z"
            fill="url(#hexGradB)" fill-opacity="0.6"/>
    </g>

    <!-- 中下區域 -->
    <g transform="translate(1100, 920) rotate(-5)">
      <path d="M0,-48 L41.6,-24 L41.6,24 L0,48 L-41.6,24 L-41.6,-24 Z"
            fill="none" stroke="#8B4513" stroke-width="2.5"/>
    </g>

    <g transform="translate(960, 880) rotate(20)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#hexGradA)" fill-opacity="0.5"/>
    </g>

    <g transform="translate(820, 950) rotate(-12)">
      <path d="M0,-22 L19,-11 L19,11 L0,22 L-19,11 L-19,-11 Z"
            fill="none" stroke="#B8860B" stroke-width="1.8"/>
    </g>

    <!-- 右上區域 -->
    <g transform="translate(1700, 200) rotate(10)">
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z"
            fill="url(#hexGradB)" fill-opacity="0.5"/>
    </g>

    <g transform="translate(1820, 320) rotate(-7)">
      <path d="M0,-26 L22.5,-13 L22.5,13 L0,26 L-22.5,13 L-22.5,-13 Z"
            fill="none" stroke="#8B4513" stroke-width="2"/>
    </g>

    <!-- 左下區域 -->
    <g transform="translate(220, 850) rotate(15)">
      <path d="M0,-35 L30.3,-17.5 L30.3,17.5 L0,35 L-30.3,17.5 L-30.3,-17.5 Z"
            fill="url(#hexGradA)" fill-opacity="0.4"/>
    </g>

    <g transform="translate(120, 950) rotate(-8)">
      <path d="M0,-20 L17.3,-10 L17.3,10 L0,20 L-17.3,10 L-17.3,-10 Z"
            fill="none" stroke="#B8860B" stroke-width="1.8"/>
    </g>
  </g>

  <!-- 印刷感 grain 覆蓋層（Illustrated Worlds） -->
  <rect width="1920" height="1080" filter="url(#bgGrain)" opacity="0.85"/>

  <!-- 中心放置區暗示（留白 Bokeh） -->
  <g transform="translate(960, 540)" opacity="0.3">
    <!-- 3 個裝飾蜂巢暗示中心放置區 -->
    <path d="M0,-180 L155.9,-90 L155.9,90 L0,180 L-155.9,90 L-155.9,-90 Z"
          fill="none" stroke="#8B4513" stroke-width="2" stroke-dasharray="6,8"/>
  </g>

  <!-- 底部小蜂巢裝飾線（連接方式：邊對邊） -->
  <g opacity="0.4">
    <path d="M0,-8 L6.9,-4 L6.9,4 L0,8 L-6.9,4 L-6.9,-4 Z" fill="#8B4513"
          transform="translate(820, 1020)"/>
    <path d="M0,-8 L6.9,-4 L6.9,4 L0,8 L-6.9,4 L-6.9,-4 Z" fill="#8B4513"
          transform="translate(855, 1020)"/>
    <path d="M0,-8 L6.9,-4 L6.9,4 L0,8 L-6.9,4 L-6.9,-4 Z" fill="#8B4513"
          transform="translate(890, 1020)"/>
    <path d="M0,-8 L6.9,-4 L6.9,4 L0,8 L-6.9,4 L-6.9,-4 Z" fill="#8B4513"
          transform="translate(925, 1020)"/>
    <path d="M0,-8 L6.9,-4 L6.9,4 L0,8 L-6.9,4 L-6.9,-4 Z" fill="#8B4513"
          transform="translate(960, 1020)"/>
    <path d="M0,-8 L6.9,-4 L6.9,4 L0,8 L-6.9,4 L-6.9,-4 Z" fill="#8B4513"
          transform="translate(995, 1020)"/>
    <path d="M0,-8 L6.9,-4 L6.9,4 L0,8 L-6.9,4 L-6.9,-4 Z" fill="#8B4513"
          transform="translate(1030, 1020)"/>
    <path d="M0,-8 L6.9,-4 L6.9,4 L0,8 L-6.9,4 L-6.9,-4 Z" fill="#8B4513"
          transform="translate(1065, 1020)"/>
    <path d="M0,-8 L6.9,-4 L6.9,4 L0,8 L-6.9,4 L-6.9,-4 Z" fill="#8B4513"
          transform="translate(1100, 1020)"/>
  </g>
</svg>