<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>團隊協作</title>
  <desc>工作報告中表示團隊合作的圖標</desc>
  <!-- 背景圓圈 -->
  <circle cx="32" cy="32" r="30" fill="#F5E6D3" stroke="#8B6914" stroke-width="2"/>
  <!-- 三個人形（手繪風格） -->
  <!-- 左邊人 -->
  <circle cx="20" cy="26" r="5" fill="#8B6914"/>
  <path d="M12 42 Q20 34 28 42" fill="none" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <!-- 中間人（較大） -->
  <circle cx="32" cy="22" r="6" fill="#C4A35A"/>
  <path d="M22 42 Q32 32 42 42" fill="none" stroke="#C4A35A" stroke-width="3" stroke-linecap="round"/>
  <!-- 右邊人 -->
  <circle cx="44" cy="26" r="5" fill="#8B6914"/>
  <path d="M36 42 Q44 34 52 42" fill="none" stroke="#8B6914" stroke-width="3" stroke-linecap="round"/>
  <!-- 連接線（虛線手繪感） -->
  <path d="M24 30 Q28 26 30 28" fill="none" stroke="#C4A35A" stroke-width="2" stroke-dasharray="2,2"/>
  <path d="M34 28 Q36 26 40 30" fill="none" stroke="#C4A35A" stroke-width="2" stroke-dasharray="2,2"/>
</svg>