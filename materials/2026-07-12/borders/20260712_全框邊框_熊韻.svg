<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>熊韻全框邊框</title>
  <desc>熊熊風格蜂巢叢集全框邊框，工作報告素材</desc>
  
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="50%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
    <!-- 六邊形叢集圖案 -->
    <pattern id="hexCluster" patternUnits="userSpaceOnUse" width="120" height="104" patternTransform="scale(1.5)">
      <!-- 主六邊形 -->
      <path d="M60,4 L111.9,33 L111.9,87 L60,116 L8.1,87 L8.1,33 Z" fill="#6B4423" fill-opacity="0.3"/>
      <!-- 周圍小六邊形 -->
      <path d="M30,2 L46.6,13.75 L46.6,36.25 L30,47.5 L13.4,36.25 L13.4,13.75 Z" fill="#8B5A2B" fill-opacity="0.4"/>
      <path d="M90,2 L106.6,13.75 L106.6,36.25 L90,47.5 L73.4,36.25 L73.4,13.75 Z" fill="#8B5A2B" fill-opacity="0.4"/>
      <path d="M60,58 L76.6,69.75 L76.6,92.25 L60,103.5 L43.4,92.25 L43.4,69.75 Z" fill="#D4A574" fill-opacity="0.5"/>
    </pattern>
  </defs>
  
  <!-- 頂部邊框 -->
  <rect x="20" y="20" width="1880" height="60" fill="url(#frameGrad)" rx="5"/>
  <rect x="30" y="30" width="1860" height="40" fill="url(#hexCluster)" rx="3"/>
  
  <!-- 底部邊框 -->
  <rect x="20" y="1000" width="1880" height="60" fill="url(#frameGrad)" rx="5"/>
  <rect x="30" y="1010" width="1860" height="40" fill="url(#hexCluster)" rx="3"/>
  
  <!-- 左側邊框 -->
  <rect x="20" y="20" width="60" height="1040" fill="url(#frameGrad)" rx="5"/>
  <rect x="30" y="30" width="40" height="1020" fill="url(#hexCluster)" rx="3"/>
  
  <!-- 右側邊框 -->
  <rect x="1840" y="20" width="60" height="1040" fill="url(#frameGrad)" rx="5"/>
  <rect x="1850" y="30" width="40" height="1020" fill="url(#hexCluster)" rx="3"/>
  
  <!-- 四角加強裝飾 -->
  <g transform="translate(20,20)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="none" stroke="#F5DEB3" stroke-width="4"/>
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="#D4A574" fill-opacity="0.6"/>
  </g>
  
  <g transform="translate(1750,20)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="none" stroke="#F5DEB3" stroke-width="4"/>
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="#D4A574" fill-opacity="0.6"/>
  </g>
  
  <g transform="translate(20,885)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="none" stroke="#F5DEB3" stroke-width="4"/>
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="#D4A574" fill-opacity="0.6"/>
  </g>
  
  <g transform="translate(1750,885)">
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="none" stroke="#F5DEB3" stroke-width="4"/>
    <path d="M50,5 L93.3,27.5 L93.3,72.5 L50,95 L6.7,72.5 L6.7,27.5 Z" 
          fill="#D4A574" fill-opacity="0.6"/>
  </g>
</svg>