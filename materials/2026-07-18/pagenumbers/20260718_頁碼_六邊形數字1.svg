<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <!-- 六邊形路徑定義 -->
    <path id="hexPath" d="M50,10 L85,30 L85,70 L50,90 L15,70 L15,30 Z"/>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#bgGrad3)"/>
  
  <!-- 大六邊形 (實心) -->
  <g transform="translate(960, 540)">
    <!-- 外六邊形 - 實心 #6B5CE7 -->
    <use href="#hexPath" fill="#6B5CE7" transform="scale(3)"/>
    
    <!-- 中六邊形 - 半透明空心 -->
    <use href="#hexPath" fill="none" stroke="#4ECDC4" stroke-width="3" 
         transform="scale(2)"/>
    
    <!-- 小六邊形 - 實心強調 -->
    <use href="#hexPath" fill="#FF8C00" transform="scale(1)"/>
    
    <!-- 數字 1 -->
    <text x="0" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white">
      1
    </text>
  </g>
  
  <text x="960" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#64748B">
    頁碼設計 · 六邊形大小對比
  </text>
</svg>