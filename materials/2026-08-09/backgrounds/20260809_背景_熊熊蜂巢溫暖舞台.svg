  <g opacity="0.5">
    <g transform="translate(560, 480)">
      <path d="M30,3 L56,17 L56,43 L30,57 L4,43 L4,17 Z"
            fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    </g>
    <g transform="translate(650, 540)">
      <path d="M30,3 L56,17 L56,43 L30,57 L4,43 L4,17 Z"
            fill="#D4AF37" fill-opacity="0.4"/>
    </g>
    <g transform="translate(740, 480)">
      <path d="M30,3 L56,17 L56,43 L30,57 L4,43 L4,17 Z"
            fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    </g>
    <g transform="translate(830, 540)">
      <path d="M30,3 L56,17 L56,43 L30,57 L4,43 L4,17 Z"
            fill="#D4AF37" fill-opacity="0.4"/>
    </g>
    <g transform="translate(920, 480)">
      <path d="M30,3 L56,17 L56,43 L30,57 L4,43 L4,17 Z"
            fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    </g>
    <g transform="translate(1010, 540)">
      <path d="M30,3 L56,17 L56,43 L30,57 L4,43 L4,17 Z"
            fill="#D4AF37" fill-opacity="0.4"/>
    </g>
    <g transform="translate(1100, 480)">
      <path d="M30,3 L56,17 L56,43 L30,57 L4,43 L4,17 Z"
            fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    </g>
    <g transform="translate(1190, 540)">
      <path d="M30,3 L56,17 L56,43 L30,57 L4,43 L4,17 Z"
            fill="#D4AF37" fill-opacity="0.4"/>
    </g>
    <g transform="translate(1280, 480)">
      <path d="M30,3 L56,17 L56,43 L30,57 L4,43 L4,17 Z"
            fill="none" stroke="#D4AF37" stroke-width="1.5"/>
    </g>
  </g>

  <!-- 漂浮小六邊形(留白空間的點綴) -->
  <g opacity="0.3">
    <path d="M12,1.2 L22.4,6.9 L22.4,17.4 L12,23 L1.6,17.4 L1.6,6.9 Z"
          fill="#D4AF37" transform="translate(400, 100)"/>
    <path d="M12,1.2 L22.4,6.9 L22.4,17.4 L12,23 L1.6,17.4 L1.6,6.9 Z"
          fill="#D4AF37" transform="translate(1500, 200)"/>
    <path d="M12,1.2 L22.4,6.9 L22.4,17.4 L12,23 L1.6,17.4 L1.6,6.9 Z"
          fill="#D4AF37" transform="translate(1700, 880)"/>
    <path d="M12,1.2 L22.4,6.9 L22.4,17.4 L12,23 L1.6,17.4 L1.6,6.9 Z"
          fill="#D4AF37" transform="translate(300, 950)"/>
  </g>

  <!-- 中央虛線對齊軸(對齊比裝飾重要) -->
  <line x1="960" y1="200" x2="960" y2="880" stroke="#D4AF37" stroke-width="1" stroke-dasharray="6,8" opacity="0.25"/>
</svg>