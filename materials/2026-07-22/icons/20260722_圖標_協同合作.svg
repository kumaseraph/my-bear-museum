<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <title>協同合作圖標 - 工作報告</title>
  <desc>三六邊形互扣組合，應用#121連接方式+虛實對比，熊熊溫暖風格</desc>

  <defs>
    <linearGradient id="coopGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C572"/>
      <stop offset="100%" stop-color="#D89B3F"/>
    </linearGradient>
    <linearGradient id="coopBrown" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C97B4A"/>
      <stop offset="100%" stop-color="#7A3F1D"/>
    </linearGradient>
  </defs>

  <!-- 中心容器六邊形（虛實對比 #6） -->
  <g transform="translate(50,50)">
    <!-- 外圍六邊形：粗空心 -->
    <path d="M0,-38 L32.9,-19 L32.9,19 L0,38 L-32.9,19 L-32.9,-19 Z"
          fill="none" stroke="#7A3F1D" stroke-width="3"/>

    <!-- 三個互扣六邊形（旋轉角度對比 #2 0°/120°/240°） -->
    <!-- 上方六邊形 -->
    <g transform="translate(0,-15)">
      <path d="M0,-16 L13.9,-8 L13.9,8 L0,16 L-13.9,8 L-13.9,-8 Z"
            fill="url(#coopGold)" stroke="#7A3F1D" stroke-width="1.5"/>
    </g>

    <!-- 左下六邊形 -->
    <g transform="translate(-13.9,8)">
      <path d="M0,-16 L13.9,-8 L13.9,8 L0,16 L-13.9,8 L-13.9,-8 Z"
            fill="url(#coopBrown)" stroke="#5C2F18" stroke-width="1.5"/>
    </g>

    <!-- 右下六邊形 -->
    <g transform="translate(13.9,8)">
      <path d="M0,-16 L13.9,-8 L13.9,8 L0,16 L-13.9,8 L-13.9,-8 Z"
            fill="url(#coopBrown)" stroke="#5C2F18" stroke-width="1.5"/>
    </g>

    <!-- 中心交會點小菱形（#123 菱形） -->
    <polygon points="0,-7 6,0 0,7 -6,0" fill="#F4C572" stroke="#7A3F1D" stroke-width="1.2"/>
  </g>
</svg>
