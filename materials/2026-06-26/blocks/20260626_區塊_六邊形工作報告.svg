<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <defs>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 主體六邊形背景 -->
  <g transform="translate(150, 50)">
    <!-- 外層六邊形（2.5D效果：外粗空心）-->
    <polygon points="0,-45 39,-22.5 39,22.5 0,45 -39,22.5 -39,-22.5" 
             fill="none" stroke="#1E40AF" stroke-width="4"/>
    
    <!-- 內層六邊形（實心填充）-->
    <polygon points="0,-35 30,-17.5 30,17.5 0,35 -30,17.5 -30,-17.5" 
             fill="url(#blockGrad)"/>
    
    <!-- 內部菱形裝飾 -->
    <polygon points="0,-20 15,0 0,20 -15,0" fill="#F59E0B" opacity="0.9"/>
    
    <!-- 中心強調點 -->
    <circle cx="0" cy="0" r="5" fill="white"/>
  </g>
  
  <!-- 左側標題區 -->
  <g transform="translate(15, 30)">
    <rect x="0" y="0" width="80" height="40" rx="4" fill="#1E40AF" opacity="0.1"/>
    <text x="40" y="18" font-size="9" fill="#1E40AF" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">工作報告</text>
    <text x="40" y="32" font-size="7" fill="#3B82F6" text-anchor="middle" font-family="Arial, sans-serif">WORK REPORT</text>
  </g>
  
  <!-- 右側裝飾線 -->
  <line x1="260" y1="30" x2="285" y2="50" stroke="#F59E0B" stroke-width="2"/>
  <line x1="265" y1="35" x2="285" y2="50" stroke="#3B82F6" stroke-width="1.5"/>
</svg>