<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- 主背景漸層：晨曦橘金 -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5B4"/>
      <stop offset="50%" stop-color="#FFD89B"/>
      <stop offset="100%" stop-color="#FFA07A"/>
    </linearGradient>

    <!-- 放射環形蜂巢漸層（單一主指標 Hero） -->
    <linearGradient id="heroHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F7931E"/>
    </linearGradient>

    <linearGradient id="ring1Hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA07A"/>
      <stop offset="100%" stop-color="#FF8C42"/>
    </linearGradient>

    <linearGradient id="ring2Hex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD89B"/>
      <stop offset="100%" stop-color="#FFA07A"/>
    </linearGradient>

    <!-- 背景蜂巢 pattern（虛實對比 - 空心描邊） -->
    <pattern id="bgHoneycomb" x="0" y="0" width="78" height="86.6" patternUnits="userSpaceOnUse">
      <path d="M39,0 L78,21.65 L78,64.95 L39,86.6 L0,64.95 L0,21.65 Z"
            fill="none" stroke="#FF6B35" stroke-width="0.6" opacity="0.18"/>
    </pattern>

    <!-- 角落裝飾小六邊形 pattern -->
    <pattern id="cornerHex" x="0" y="0" width="156" height="173.2" patternUnits="userSpaceOnUse">
      <path d="M78,30 L120,54 L120,102 L78,126 L36,102 L36,54 Z"
            fill="none" stroke="#F7931E" stroke-width="1" opacity="0.25"/>
      <circle cx="78" cy="78" r="3" fill="#FF6B35" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- 主背景漸層 -->
  <rect width="1920" height="1080" fill="url(#bgGrad1)"/>

  <!-- 蜂巢背景襯底 -->
  <rect width="1920" height="1080" fill="url(#bgHoneycomb)"/>

  <!-- 角落裝飾 -->
  <rect width="400" height="450" fill="url(#cornerHex)" opacity="0.6"/>
  <rect x="1520" y="630" width="400" height="450" fill="url(#cornerHex)" opacity="0.6"/>

  <!-- 放射環形蜂巢主視覺（中心 → 焦點主指標） -->
  <g transform="translate(960, 540)">
    <!-- 中心大六邊形 Hero（單一主指標） -->
    <path d="M0,-100 L86.6,-50 L86.6,50 L0,100 L-86.6,50 L-86.6,-50 Z"
          fill="none" stroke="#FF6B35" stroke-width="8" opacity="0.9"/>
    <path d="M0,-85 L73.6,-42.5 L73.6,42.5 L0,85 L-73.6,42.5 L-73.6,-42.5 Z"
          fill="url(#heroHex)" opacity="0.95"/>
    <!-- 中心裝飾圓點（少而深刻的焦點） -->
    <circle cx="0" cy="0" r="20" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="0" cy="0" r="10" fill="#FF6B35"/>

    <!-- 第一環：6 個中六邊形 -->
    <g transform="rotate(0)">
      <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
            fill="url(#ring1Hex)" opacity="0.85" transform="translate(0,-150)"/>
    </g>
    <g transform="rotate(60)">
      <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
            fill="url(#ring1Hex)" opacity="0.85" transform="translate(0,-150)"/>
    </g>
    <g transform="rotate(120)">
      <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
            fill="url(#ring1Hex)" opacity="0.85" transform="translate(0,-150)"/>
    </g>
    <g transform="rotate(180)">
      <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
            fill="url(#ring1Hex)" opacity="0.85" transform="translate(0,-150)"/>
    </g>
    <g transform="rotate(240)">
      <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
            fill="url(#ring1Hex)" opacity="0.85" transform="translate(0,-150)"/>
    </g>
    <g transform="rotate(300)">
      <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z"
            fill="url(#ring1Hex)" opacity="0.85" transform="translate(0,-150)"/>
    </g>

    <!-- 第二環：12 個小六邊形（外圍擴散） -->
    <g transform="rotate(0)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#ring2Hex)" opacity="0.7" stroke="#FF6B35" stroke-width="1" transform="translate(0,-260)"/>
    </g>
    <g transform="rotate(30)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#ring2Hex)" opacity="0.7" stroke="#FF6B35" stroke-width="1" transform="translate(0,-260)"/>
    </g>
    <g transform="rotate(60)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#ring2Hex)" opacity="0.7" stroke="#FF6B35" stroke-width="1" transform="translate(0,-260)"/>
    </g>
    <g transform="rotate(90)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#ring2Hex)" opacity="0.7" stroke="#FF6B35" stroke-width="1" transform="translate(0,-260)"/>
    </g>
    <g transform="rotate(120)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#ring2Hex)" opacity="0.7" stroke="#FF6B35" stroke-width="1" transform="translate(0,-260)"/>
    </g>
    <g transform="rotate(150)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#ring2Hex)" opacity="0.7" stroke="#FF6B35" stroke-width="1" transform="translate(0,-260)"/>
    </g>
    <g transform="rotate(180)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#ring2Hex)" opacity="0.7" stroke="#FF6B35" stroke-width="1" transform="translate(0,-260)"/>
    </g>
    <g transform="rotate(210)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#ring2Hex)" opacity="0.7" stroke="#FF6B35" stroke-width="1" transform="translate(0,-260)"/>
    </g>
    <g transform="rotate(240)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#ring2Hex)" opacity="0.7" stroke="#FF6B35" stroke-width="1" transform="translate(0,-260)"/>
    </g>
    <g transform="rotate(270)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#ring2Hex)" opacity="0.7" stroke="#FF6B35" stroke-width="1" transform="translate(0,-260)"/>
    </g>
    <g transform="rotate(300)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#ring2Hex)" opacity="0.7" stroke="#FF6B35" stroke-width="1" transform="translate(0,-260)"/>
    </g>
    <g transform="rotate(330)">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z"
            fill="url(#ring2Hex)" opacity="0.7" stroke="#FF6B35" stroke-width="1" transform="translate(0,-260)"/>
    </g>
  </g>

  <!-- 散落裝飾小六邊形（隨機碎片） -->
  <path d="M200,150 L230,168 L230,203 L200,220 L170,203 L170,168 Z"
        fill="#FF6B35" opacity="0.4"/>
  <path d="M1700,200 L1730,218 L1730,253 L1700,270 L1670,253 L1670,218 Z"
        fill="#F7931E" opacity="0.5"/>
  <path d="M150,900 L180,918 L180,953 L150,970 L120,953 L120,918 Z"
        fill="#FF8C42" opacity="0.4"/>
  <path d="M1750,850 L1780,868 L1780,903 L1750,920 L1720,903 L1720,868 Z"
        fill="#FF6B35" opacity="0.45"/>

  <!-- 旋轉角度裝飾（30°/60°） -->
  <g transform="translate(350, 250) rotate(30)">
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#FF6B35" stroke-width="2" opacity="0.5"/>
  </g>
  <g transform="translate(1570, 280) rotate(60)">
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="none" stroke="#F7931E" stroke-width="2" opacity="0.5"/>
  </g>
</svg>
