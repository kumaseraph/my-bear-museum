<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- 現代簡潔：專案管理 - 菱形節點網絡 (技巧#123 #3 交替節奏) -->
  <rect width="400" height="400" fill="#F8FAFC"/>
  <!-- 連接線 (虛實對比 - 技巧#123) -->
  <line x1="100" y1="120" x2="200" y2="180" stroke="#6366F1" stroke-width="2.5"/>
  <line x1="300" y1="120" x2="200" y2="180" stroke="#6366F1" stroke-width="2.5"/>
  <line x1="200" y1="180" x2="100" y2="290" stroke="#6366F1" stroke-width="2.5" stroke-dasharray="4 5"/>
  <line x1="200" y1="180" x2="300" y2="290" stroke="#6366F1" stroke-width="2.5" stroke-dasharray="4 5"/>
  <line x1="100" y1="290" x2="300" y2="290" stroke="#6366F1" stroke-width="2.5" stroke-dasharray="2 5"/>
  <!-- 四角菱形節點 -->
  <polygon points="100,90 130,120 100,150 70,120" fill="#0EA5E9"/>
  <polygon points="300,90 330,120 300,150 270,120" fill="#3B82F6"/>
  <!-- 中心五角星 (決策核心) -->
  <polygon points="200,150 211,178 240,178 217,194 226,222 200,206 174,222 183,194 160,178 189,178" fill="#FF8C00" stroke="#C2410C" stroke-width="2"/>
  <!-- 底部菱形 -->
  <polygon points="100,260 130,290 100,320 70,290" fill="#22C55E"/>
  <polygon points="300,260 330,290 300,320 270,290" fill="#10B981"/>
  <!-- 標籤 (極簡字) -->
  <text x="100" y="115" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">A</text>
  <text x="300" y="115" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">B</text>
  <text x="200" y="184" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">★</text>
  <text x="100" y="295" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">C</text>
  <text x="300" y="295" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">D</text>
  <text x="200" y="375" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">專案管理</text>
</svg>