<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>數據卡片</title>
  <desc>工作報告數據展示卡片，溫暖棕金色系</desc>
  <!-- 卡片背景 -->
  <rect x="10" y="10" width="380" height="280" rx="16" fill="#FFFFFF" stroke="#E8D5C4" stroke-width="2"/>
  <!-- 頂部色帶 -->
  <rect x="10" y="10" width="380" height="60" rx="16" fill="#C4A35A"/>
  <rect x="10" y="50" width="380" height="20" fill="#C4A35A"/>
  <!-- 標題區 -->
  <text x="30" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">季度報告</text>
  <!-- 主要數據 -->
  <text x="200" y="140" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#8B6914" text-anchor="middle">87%</text>
  <!-- 說明文字 -->
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle">目標達成率</text>
  <!-- 底部裝飾線 -->
  <rect x="30" y="200" width="340" height="4" rx="2" fill="#F5E6D3"/>
  <rect x="30" y="200" width="280" height="4" rx="2" fill="#C4A35A"/>
  <!-- 標籤 -->
  <text x="30" y="250" font-family="Arial, sans-serif" font-size="14" fill="#8B6914">Q2 2026</text>
  <text x="350" y="250" font-family="Arial, sans-serif" font-size="14" fill="#C4A35A" text-anchor="end">↑ 12%</text>
</svg>