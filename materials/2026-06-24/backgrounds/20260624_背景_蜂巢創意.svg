<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>蜂巢創意背景</title>
  <desc>採用蜂巢叢集七變化設計的創意活潑背景，融合2026觸覺最大主義與自然主義趨勢</desc>
  
  <defs>
    <!-- 溫暖棕金色系漸層 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6E3"/>
      <stop offset="50%" stop-color="#FAF0E6"/>
      <stop offset="100%" stop-color="#F5DEB3"/>
    </linearGradient>
    
    <!-- 熊熊紫填充 -->
    <linearGradient id="hexFill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    
    <!-- 溫暖金填充 -->
    <linearGradient id="hexFill2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
    
    <!-- 蜂巢圖案（應用技巧#122標準排列） -->
    <pattern id="honeycomb" x="0" y="0" width="78" height="86.6" patternUnits="userSpaceOnUse">
      <path d="M39,0 L78,21.65 L78,64.95 L39,86.6 L0,64.95 L0,21.65 Z" 
            fill="none" stroke="#D4A574" stroke-width="1" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- 背景填充 -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- 蜂巢底紋襯底 -->
  <rect width="1920" height="1080" fill="url(#honeycomb)" opacity="0.5"/>
  
  <!-- 放射環形蜂巢叢集（應用技巧#122放射環形 + #120尺寸漸層） -->
  <g transform="translate(960, 540)">
    <!-- 中心大六邊形 -->
    <path d="M0,-100 L86.6,-50 L86.6,50 L0,100 L-86.6,50 L-86.6,-50 Z" 
          fill="url(#hexFill1)" opacity="0.9"/>
    
    <!-- 第二環：6個中六邊形 -->
    <g fill="url(#hexFill1)" opacity="0.7">
      <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z" 
            transform="rotate(0) translate(0,-156)"/>
      <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z" 
            transform="rotate(60) translate(0,-156)"/>
      <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z" 
            transform="rotate(120) translate(0,-156)"/>
      <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z" 
            transform="rotate(180) translate(0,-156)"/>
      <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z" 
            transform="rotate(240) translate(0,-156)"/>
      <path d="M0,-70 L60.6,-35 L60.6,35 L0,70 L-60.6,35 L-60.6,-35 Z" 
            transform="rotate(300) translate(0,-156)"/>
    </g>
    
    <!-- 第三環：12個小六邊形 -->
    <g fill="url(#hexFill2)" opacity="0.5">
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
            transform="rotate(30) translate(0,-218)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
            transform="rotate(90) translate(0,-218)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
            transform="rotate(150) translate(0,-218)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
            transform="rotate(210) translate(0,-218)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
            transform="rotate(270) translate(0,-218)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
            transform="rotate(330) translate(0,-218)"/>
      <!-- 間隔一個位置 -->
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
            transform="rotate(0) translate(0,-218)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
            transform="rotate(60) translate(0,-218)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
            transform="rotate(120) translate(0,-218)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
            transform="rotate(180) translate(0,-218)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
            transform="rotate(240) translate(0,-218)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" 
            transform="rotate(300) translate(0,-218)"/>
    </g>
  </g>
  
  <!-- 左上角裝飾蜂巢（應用技巧#122分組叢集） -->
  <g transform="translate(200, 200)" opacity="0.6">
    <path d="M0,-35 L30.31,-17.5 L30.31,17.5 L0,35 L-30.31,17.5 L-30.31,-17.5 Z" 
          fill="#6B5CE7"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z" 
          fill="#D4A574" transform="translate(0,-52)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z" 
          fill="#D4A574" transform="translate(45,-26)"/>
  </g>
  
  <!-- 右下角裝飾蜂巢 -->
  <g transform="translate(1720, 880)" opacity="0.6">
    <path d="M0,-35 L30.31,-17.5 L30.31,17.5 L0,35 L-30.31,17.5 L-30.31,-17.5 Z" 
          fill="#D4A574"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z" 
          fill="#6B5CE7" transform="translate(0,52)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z" 
          fill="#6B5CE7" transform="translate(-45,26)"/>
  </g>
</svg>