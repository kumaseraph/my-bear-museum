<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF6EC"/>
      <stop offset="50%" stop-color="#F4E9D2"/>
      <stop offset="100%" stop-color="#E8D0A0"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4C572" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F4C572" stop-opacity="0"/>
    </radialGradient>
    <filter id="paperTex3" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="soft-light"/>
    </filter>
    <filter id="handDrawn3" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="turbulence" baseFrequency="0.04" numOctaves="2" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="1.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- 暖棕底色 -->
  <rect fill="url(#bgGrad3)" width="1920" height="1080"/>

  <!-- 中央柔光 -->
  <ellipse cx="960" cy="540" rx="600" ry="380" fill="url(#centerGlow)"/>

  <!-- ============== 尺寸漸層蜂巢（七變化 #6 中心→外圍） ============== -->
  <g transform="translate(960, 540)" filter="url(#handDrawn3)">
    <!-- 中心最大（深棕） -->
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55"
             fill="#7A3F1D" stroke="#5C2F18" stroke-width="3"/>
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40"
             fill="#A0552A" stroke="#5C2F18" stroke-width="2"/>

    <!-- 第一環 6 個中（六邊形 #5 同色深淺對比） -->
    <g>
      <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"
               fill="#C97B4A" stroke="#7A3F1D" stroke-width="2"
               transform="translate(0,-130)"/>
      <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"
               fill="#C97B4A" stroke="#7A3F1D" stroke-width="2"
               transform="rotate(60) translate(0,-130)"/>
      <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"
               fill="#C97B4A" stroke="#7A3F1D" stroke-width="2"
               transform="rotate(120) translate(0,-130)"/>
      <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"
               fill="#C97B4A" stroke="#7A3F1D" stroke-width="2"
               transform="rotate(180) translate(0,-130)"/>
      <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"
               fill="#C97B4A" stroke="#7A3F1D" stroke-width="2"
               transform="rotate(240) translate(0,-130)"/>
      <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"
               fill="#C97B4A" stroke="#7A3F1D" stroke-width="2"
               transform="rotate(300) translate(0,-130)"/>
    </g>

    <!-- 第二環 12 個小（淺金） -->
    <g>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"
               fill="#F4C572" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(30) translate(0,-230)"/>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"
               fill="#F4C572" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(60) translate(0,-230)"/>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"
               fill="#F4C572" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(90) translate(0,-230)"/>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"
               fill="#F4C572" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(120) translate(0,-230)"/>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"
               fill="#F4C572" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(150) translate(0,-230)"/>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"
               fill="#F4C572" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(180) translate(0,-230)"/>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"
               fill="#F4C572" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(210) translate(0,-230)"/>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"
               fill="#F4C572" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(240) translate(0,-230)"/>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"
               fill="#F4C572" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(270) translate(0,-230)"/>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"
               fill="#F4C572" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(300) translate(0,-230)"/>
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"
               fill="#F4C572" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(330) translate(0,-230)"/>
    </g>

    <!-- 第三環 18 個極小（半透明虛線） -->
    <g opacity="0.55">
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(15) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(35) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(55) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(75) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(95) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(115) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(135) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(155) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(175) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(195) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(215) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(235) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(255) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(275) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(295) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(315) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(335) translate(0,-340)"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
               fill="none" stroke="#D89B3F" stroke-width="1.5"
               transform="rotate(355) translate(0,-340)"/>
    </g>
  </g>

  <!-- ============== 四角小蜂巢裝飾（六邊形十式 #9 叢集與單一） ============== -->
  <g transform="translate(120, 120)">
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
             fill="#A0552A" fill-opacity="0.55" stroke="#7A3F1D" stroke-width="1.5"/>
    <polygon points="0,-15 13,-7 13,7 0,15 -13,7 -13,-7" fill="#F4C572"/>
  </g>
  <g transform="translate(60, 200)">
    <polygon points="0,-15 13,-7 13,7 0,15 -13,7 -13,-7" fill="none" stroke="#7A3F1D" stroke-width="1.5"/>
  </g>
  <g transform="translate(180, 240)">
    <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="#7A3F1D" fill-opacity="0.65"/>
  </g>

  <g transform="translate(1800, 940)">
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"
             fill="#A0552A" fill-opacity="0.55" stroke="#7A3F1D" stroke-width="1.5"/>
    <polygon points="0,-15 13,-7 13,7 0,15 -13,7 -13,-7" fill="#F4C572"/>
  </g>
  <g transform="translate(1860, 860)">
    <polygon points="0,-15 13,-7 13,7 0,15 -13,7 -13,-7" fill="none" stroke="#7A3F1D" stroke-width="1.5"/>
  </g>
  <g transform="translate(1740, 820)">
    <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="#7A3F1D" fill-opacity="0.65"/>
  </g>

  <!-- 手繪邊緣細線 -->
  <g stroke="#7A3F1D" stroke-width="0.8" fill="none" opacity="0.18">
    <path d="M 0 50 Q 200 48, 400 52 Q 600 55, 800 49 Q 1000 46, 1200 53 Q 1400 56, 1600 50 Q 1800 47, 1920 51"/>
    <path d="M 0 1030 Q 200 1028, 400 1032 Q 600 1035, 800 1029 Q 1000 1026, 1200 1031 Q 1400 1034, 1600 1028 Q 1800 1025, 1920 1030"/>
  </g>

  <!-- 紙張紋理 -->
  <rect x="0" y="0" width="1920" height="1080" fill="#FBF6EC" fill-opacity="0.07" filter="url(#paperTex3)"/>
</svg>
