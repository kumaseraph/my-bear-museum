<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <defs>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B4423"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#C4956A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#4A2C17" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="300" height="80" fill="#FDF8F3"/>
  
  <!-- 按鈕本體 -->
  <g transform="translate(150,40)" filter="url(#shadow)">
    <!-- 外層邊界引導線 -->
    <rect x="-100" y="-30" width="200" height="60" rx="30" fill="none" stroke="#D4A574" stroke-width="1" opacity="0.4"/>
    
    <!-- 按鈕主體 -->
    <rect x="-90" y="-25" width="180" height="50" rx="25" fill="url(#btnGrad)"/>
    
    <!-- 內部亮邊 -->
    <rect x="-88" y="-23" width="176" height="22" rx="11" fill="#FFFFFF" opacity="0.15"/>
    
    <!-- 文字 -->
    <text x="0" y="6" text-anchor="middle" fill="#F5E6D3" font-family="Arial, sans-serif" font-size="18" font-weight="bold">下一步</text>
    
    <!-- 右側箭頭 -->
    <g transform="translate(55,0)">
      <path d="M-8,-8 L8,0 L-8,8" fill="none" stroke="#D4A574" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="2" y1="0" x2="15" y2="0" stroke="#D4A574" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>