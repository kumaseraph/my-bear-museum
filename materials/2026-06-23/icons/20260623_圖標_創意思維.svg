<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <!-- 創意思維圖標：菱形放射五角星 -->
  <g transform="translate(960,540)">
    <!-- 中心菱形 -->
    <polygon points="0,-100 100,0 0,100 -100,0" fill="#6366F1"/>
    <!-- 四個方向放射五角星 -->
    <polygon points="0,-40 12,-12 37,-12 17,4 25,30 0,17 -25,30 -17,4 -37,-12 -12,-12" 
             fill="#F59E0B" transform="translate(0,-160) scale(1.2)"/>
    <polygon points="0,-40 12,-12 37,-12 17,4 25,30 0,17 -25,30 -17,4 -37,-12 -12,-12" 
             fill="#F59E0B" transform="translate(160,0) scale(1.2)"/>
    <polygon points="0,-40 12,-12 37,-12 17,4 25,30 0,17 -25,30 -17,4 -37,-12 -12,-12" 
             fill="#F59E0B" transform="translate(0,160) scale(1.2)"/>
    <polygon points="0,-40 12,-12 37,-12 17,4 25,30 0,17 -25,30 -17,4 -37,-12 -12,-12" 
             fill="#F59E0B" transform="translate(-160,0) scale(1.2)"/>
    <!-- 連接線 -->
    <g stroke="#CBD5E1" stroke-width="2" stroke-dasharray="8,4">
      <line x1="0" y1="-100" x2="0" y2="-192"/>
      <line x1="100" y1="0" x2="192" y2="0"/>
      <line x1="0" y1="100" x2="0" y2="192"/>
      <line x1="-100" y1="0" x2="-192" y2="0"/>
    </g>
  </g>
</svg>