<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- 配色：專業藍灰 -->
    <linearGradient id="borderGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="100%" stop-color="#2D5A87"/>
    </linearGradient>
    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>
  
  <!-- 左上角六邊形裝飾（大） -->
  <g transform="translate(0,0)">
    <path d="M60,10 L110,35 L110,85 L60,110 L10,85 L10,35 Z" 
          fill="#1E3A5F" opacity="0.9"/>
    <path d="M60,10 L110,35 L110,85 L60,110 L10,85 L10,35 Z" 
          fill="none" stroke="#3B82F6" stroke-width="3"/>
    <!-- 內部小六邊形 -->
    <path d="M60,35 L85,50 L85,75 L60,90 L35,75 L35,50 Z" 
          fill="#3B82F6" opacity="0.4"/>
  </g>
  
  <!-- 右上角六邊形裝置 -->
  <g transform="translate(1860,0)">
    <path d="M60,10 L110,35 L110,85 L60,110 L10,85 L10,35 Z" 
          fill="#1E3A5F" opacity="0.9"/>
    <path d="M60,10 L110,35 L110,85 L60,110 L10,85 L10,35 Z" 
          fill="none" stroke="#3B82F6" stroke-width="3"/>
    <path d="M60,35 L85,50 L85,75 L60,90 L35,75 L35,50 Z" 
          fill="#3B82F6" opacity="0.4"/>
  </g>
  
  <!-- 左下角六邊形 -->
  <g transform="translate(0,970)">
    <path d="M60,10 L110,35 L110,85 L60,110 L10,85 L10,35 Z" 
          fill="#1E3A5F" opacity="0.9"/>
    <path d="M60,10 L110,35 L110,85 L60,110 L10,85 L10,35 Z" 
          fill="none" stroke="#3B82F6" stroke-width="3"/>
    <path d="M60,35 L85,50 L85,75 L60,90 L35,75 L35,50 Z" 
          fill="#3B82F6" opacity="0.4"/>
  </g>
  
  <!-- 右下角六邊形 -->
  <g transform="translate(1860,970)">
    <path d="M60,10 L110,35 L110,85 L60,110 L10,85 L10,35 Z" 
          fill="#1E3A5F" opacity="0.9"/>
    <path d="M60,10 L110,35 L110,85 L60,110 L10,85 L10,35 Z" 
          fill="none" stroke="#3B82F6" stroke-width="3"/>
    <path d="M60,35 L85,50 L85,75 L60,90 L35,75 L35,50 Z" 
          fill="#3B82F6" opacity="0.4"/>
  </g>
  
  <!-- 頂部連接線（引導線效果） -->
  <line x1="120" y1="55" x2="1800" y2="55" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <line x1="70" y1="110" x2="1850" y2="110" stroke="#1E3A5F" stroke-width="2"/>
  
  <!-- 底部連接線 -->
  <line x1="120" y1="1025" x2="1800" y2="1025" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <line x1="70" y1="970" x2="1850" y2="970" stroke="#1E3A5F" stroke-width="2"/>
  
  <!-- 左側連接線 -->
  <line x1="55" y1="120" x2="55" y2="960" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <line x1="110" y1="70" x2="110" y2="1010" stroke="#1E3A5F" stroke-width="2"/>
  
  <!-- 右側連接線 -->
  <line x1="1865" y1="120" x2="1865" y2="960" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  <line x1="1810" y1="70" x2="1810" y2="1010" stroke="#1E3A5F" stroke-width="2"/>
</svg>