<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <!-- 風格：🏛️ 正式專業｜主題：工作報告
       技巧 #122 蜂巢叢集 + #120 變化5（顏色深淺對比）
       融合今日洞察：「時間 × 表現二維」、「視覺縮放（氣泡大小）綁定數字」 -->
  <defs>
    <linearGradient id="formalBlockBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="hexDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="hexMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="hexLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- 卡片背景 -->
  <rect width="1200" height="700" fill="url(#formalBlockBg)" rx="16"/>

  <!-- 標題區 -->
  <text x="60" y="80" font-family="'Microsoft JhengHei', sans-serif" font-size="32" font-weight="700" fill="#FFFFFF">工作報告 · 關鍵指標時序儀表板</text>
  <text x="60" y="115" font-family="'Microsoft JhengHei', sans-serif" font-size="16" fill="#93C5FD" opacity="0.85">2026 Q1 – Q3 時序 × 表現二維視覺化</text>

  <!-- 標題分隔線（金色重點） -->
  <line x1="60" y1="135" x2="280" y2="135" stroke="url(#accentGrad)" stroke-width="3"/>
  <line x1="290" y1="135" x2="500" y2="135" stroke="#3B82F6" stroke-width="1" opacity="0.5"/>

  <!-- 時序軸（月度標記） -->
  <line x1="100" y1="580" x2="1140" y2="580" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
  <g font-family="'Microsoft JhengHei', sans-serif" font-size="14" fill="#93C5FD" text-anchor="middle">
    <text x="160" y="610">1月</text>
    <text x="260" y="610">2月</text>
    <text x="360" y="610">3月</text>
    <text x="460" y="610">4月</text>
    <text x="560" y="610">5月</text>
    <text x="660" y="610">6月</text>
    <text x="760" y="610">7月</text>
    <text x="860" y="610">8月</text>
    <text x="960" y="610">9月</text>
    <text x="1060" y="610">10月</text>
  </g>
  <text x="100" y="650" font-family="'Microsoft JhengHei', sans-serif" font-size="14" fill="#60A5FA">表現</text>
  <text x="1140" y="650" font-family="'Microsoft JhengHei', sans-serif" font-size="14" fill="#60A5FA" text-anchor="end">目標</text>

  <!-- 表現軸 -->
  <line x1="100" y1="580" x2="100" y2="200" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
  <g font-family="'Microsoft JhengHei', sans-serif" font-size="12" fill="#93C5FD" text-anchor="end">
    <text x="90" y="245">100%</text>
    <text x="90" y="345">75%</text>
    <text x="90" y="445">50%</text>
    <text x="90" y="545">25%</text>
  </g>

  <!-- 目標線 -->
  <line x1="100" y1="245" x2="1140" y2="245" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7"/>
  <text x="1145" y="248" font-family="'Microsoft JhengHei', sans-serif" font-size="11" fill="#FCD34D">100% 目標線</text>

  <!-- Q1 蜂巢叢集 (表現 60%) -->
  <g transform="translate(220, 410)">
    <!-- 主六邊形（大） -->
    <path d="M0,-55 L47.63,-27.5 L47.63,27.5 L0,55 L-47.63,27.5 L-47.63,-27.5 Z"
          fill="url(#hexMid)" opacity="0.95"/>
    <text x="0" y="0" font-family="'Microsoft JhengHei', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Q1</text>
    <text x="0" y="22" font-family="'Microsoft JhengHei', sans-serif" font-size="11" fill="#DBEAFE" text-anchor="middle" dominant-baseline="middle">60%</text>
    <!-- 環繞小六邊形（5個）-->
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="#3B82F6" opacity="0.7" transform="rotate(0) translate(0,-75)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="#3B82F6" opacity="0.7" transform="rotate(72) translate(0,-75)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="#3B82F6" opacity="0.7" transform="rotate(144) translate(0,-75)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="#3B82F6" opacity="0.7" transform="rotate(216) translate(0,-75)"/>
    <path d="M0,-25 L21.65,-12.5 L21.65,12.5 L0,25 L-21.65,12.5 L-21.65,-12.5 Z"
          fill="#3B82F6" opacity="0.7" transform="rotate(288) translate(0,-75)"/>
  </g>

  <!-- Q2 蜂巢叢集 (表現 78%) -->
  <g transform="translate(420, 305)">
    <path d="M0,-65 L56.29,-32.5 L56.29,32.5 L0,65 L-56.29,32.5 L-56.29,-32.5 Z"
          fill="url(#hexMid)" opacity="0.95"/>
    <text x="0" y="0" font-family="'Microsoft JhengHei', sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">Q2</text>
    <text x="0" y="22" font-family="'Microsoft JhengHei', sans-serif" font-size="11" fill="#DBEAFE" text-anchor="middle" dominant-baseline="middle">78%</text>
    <!-- 環繞（6個，更大）-->
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#60A5FA" opacity="0.75" transform="rotate(0) translate(0,-90)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#60A5FA" opacity="0.75" transform="rotate(60) translate(0,-90)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#60A5FA" opacity="0.75" transform="rotate(120) translate(0,-90)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#60A5FA" opacity="0.75" transform="rotate(180) translate(0,-90)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#60A5FA" opacity="0.75" transform="rotate(240) translate(0,-90)"/>
    <path d="M0,-30 L25.98,-15 L25.98,15 L0,30 L-25.98,15 L-25.98,-15 Z"
          fill="#60A5FA" opacity="0.75" transform="rotate(300) translate(0,-90)"/>
  </g>

  <!-- Q3 蜂巢叢集 (表現 92% 金色強調) -->
  <g transform="translate(620, 235)">
    <!-- 2.5D 效果：外粗空心 + 內實心 -->
    <path d="M0,-75 L64.95,-37.5 L64.95,37.5 L0,75 L-64.95,37.5 L-64.95,-37.5 Z"
          fill="none" stroke="#FCD34D" stroke-width="5"/>
    <path d="M0,-75 L64.95,-37.5 L64.95,37.5 L0,75 L-64.95,37.5 L-64.95,-37.5 Z"
          fill="url(#accentGrad)"/>
    <text x="0" y="0" font-family="'Microsoft JhengHei', sans-serif" font-size="26" font-weight="800" fill="#0F172A" text-anchor="middle" dominant-baseline="middle">Q3</text>
    <text x="0" y="26" font-family="'Microsoft JhengHei', sans-serif" font-size="13" fill="#0F172A" text-anchor="middle" dominant-baseline="middle">92%</text>
    <!-- 環繞（6個，金色淡化）-->
    <path d="M0,-35 L30.31,-17.5 L30.31,17.5 L0,35 L-30.31,17.5 L-30.31,-17.5 Z"
          fill="#FCD34D" opacity="0.85" transform="rotate(0) translate(0,-105)"/>
    <path d="M0,-35 L30.31,-17.5 L30.31,17.5 L0,35 L-30.31,17.5 L-30.31,-17.5 Z"
          fill="#FCD34D" opacity="0.85" transform="rotate(60) translate(0,-105)"/>
    <path d="M0,-35 L30.31,-17.5 L30.31,17.5 L0,35 L-30.31,17.5 L-30.31,-17.5 Z"
          fill="#FCD34D" opacity="0.85" transform="rotate(120) translate(0,-105)"/>
    <path d="M0,-35 L30.31,-17.5 L30.31,17.5 L0,35 L-30.31,17.5 L-30.31,-17.5 Z"
          fill="#FCD34D" opacity="0.85" transform="rotate(180) translate(0,-105)"/>
    <path d="M0,-35 L30.31,-17.5 L30.31,17.5 L0,35 L-30.31,17.5 L-30.31,-17.5 Z"
          fill="#FCD34D" opacity="0.85" transform="rotate(240) translate(0,-105)"/>
    <path d="M0,-35 L30.31,-17.5 L30.31,17.5 L0,35 L-30.31,17.5 L-30.31,-17.5 Z"
          fill="#FCD34D" opacity="0.85" transform="rotate(300) translate(0,-105)"/>
    <!-- 標籤 -->
    <text x="0" y="-130" font-family="'Microsoft JhengHei', sans-serif" font-size="12" font-weight="700" fill="#FCD34D" text-anchor="middle">★ 突破目標</text>
  </g>

  <!-- 趨勢連線（六邊形內部代表成長） -->
  <path d="M 220 410 Q 320 360 420 305 T 620 235" stroke="#FCD34D" stroke-width="2.5" fill="none" stroke-dasharray="4 4" opacity="0.7"/>

  <!-- Q4 預估蜂巢叢集 (表現 108% — 半透明虛線) -->
  <g transform="translate(820, 320)" opacity="0.5">
    <path d="M0,-55 L47.63,-27.5 L47.63,27.5 L0,55 L-47.63,27.5 L-47.63,-27.5 Z"
          fill="none" stroke="#93C5FD" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="0" y="0" font-family="'Microsoft JhengHei', sans-serif" font-size="18" font-weight="700" fill="#93C5FD" text-anchor="middle" dominant-baseline="middle">Q4</text>
    <text x="0" y="20" font-family="'Microsoft JhengHei', sans-serif" font-size="10" fill="#93C5FD" text-anchor="middle" dominant-baseline="middle">預估 108%</text>
  </g>

  <!-- 圖例區 -->
  <g transform="translate(60, 660)">
    <rect x="0" y="-15" width="20" height="20" fill="url(#hexMid)" opacity="0.95" rx="3"/>
    <text x="28" y="0" font-family="'Microsoft JhengHei', sans-serif" font-size="12" fill="#DBEAFE">實際表現</text>
    <rect x="115" y="-15" width="20" height="20" fill="url(#accentGrad)" rx="3"/>
    <text x="143" y="0" font-family="'Microsoft JhengHei', sans-serif" font-size="12" fill="#DBEAFE">突破目標</text>
    <rect x="240" y="-15" width="20" height="20" fill="none" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 2" rx="3"/>
    <text x="268" y="0" font-family="'Microsoft JhengHei', sans-serif" font-size="12" fill="#DBEAFE">預估</text>
  </g>

  <!-- 右下角 KUMAPPT 標記（小） -->
  <text x="1140" y="680" font-family="'Microsoft JhengHei', sans-serif" font-size="11" fill="#60A5FA" text-anchor="end" opacity="0.6">KumaWeb · 工作報告素材 · 2026-08-12</text>
</svg>
