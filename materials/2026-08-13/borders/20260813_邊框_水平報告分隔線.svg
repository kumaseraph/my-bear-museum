<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="400" height="60">
  <!-- 熊熊風格 - 水平邊框，用於報告章節分隔；融合蜂巢叢集 + 觸覺紋理 -->
  <defs>
    <linearGradient id="bearLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6239" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8B6239"/>
      <stop offset="80%" stop-color="#D4A574"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 主裝飾條 -->
  <rect x="20" y="28" width="360" height="4" fill="url(#bearLineGrad)" rx="2"/>

  <!-- 左側蜂巢焦點 (s=15, 2.5D) -->
  <g transform="translate(20, 30)">
    <path d="M15,1 L27,7.5 L27,22.5 L15,29 L3,22.5 L3,7.5 Z"
          fill="none" stroke="#8B6239" stroke-width="2"/>
    <path d="M9,0.5 L16,4 L16,12 L9,15.5 L2,12 L2,4 Z"
          fill="#8B6239" transform="translate(0,7)"/>
  </g>

  <!-- 中央蜂巢叢集 - 焦點標記 -->
  <g transform="translate(180, 30)">
    <!-- 中心大六邊形 -->
    <path d="M15,1 L27,7.5 L27,22.5 L15,29 L3,22.5 L3,7.5 Z"
          fill="none" stroke="#8B6239" stroke-width="2.5"/>
    <path d="M15,1 L27,7.5 L27,22.5 L15,29 L3,22.5 L3,7.5 Z"
          fill="#D4A574"/>
    <!-- 環繞 6 個小六邊形 -->
    <path d="M8,0.5 L14,3.5 L14,10.5 L8,13.5 L2,10.5 L2,3.5 Z"
          fill="#B8895A" transform="rotate(0) translate(0,-23)"/>
    <path d="M8,0.5 L14,3.5 L14,10.5 L8,13.5 L2,10.5 L2,3.5 Z"
          fill="#B8895A" transform="rotate(60) translate(0,-23)"/>
    <path d="M8,0.5 L14,3.5 L14,10.5 L8,13.5 L2,10.5 L2,3.5 Z"
          fill="#B8895A" transform="rotate(120) translate(0,-23)"/>
    <path d="M8,0.5 L14,3.5 L14,10.5 L8,13.5 L2,10.5 L2,3.5 Z"
          fill="#B8895A" transform="rotate(180) translate(0,-23)"/>
    <path d="M8,0.5 L14,3.5 L14,10.5 L8,13.5 L2,10.5 L2,3.5 Z"
          fill="#B8895A" transform="rotate(240) translate(0,-23)"/>
    <path d="M8,0.5 L14,3.5 L14,10.5 L8,13.5 L2,10.5 L2,3.5 Z"
          fill="#B8895A" transform="rotate(300) translate(0,-23)"/>
  </g>

  <!-- 右側蜂巢焦點 (s=15, 2.5D 鏡像) -->
  <g transform="translate(380, 30)">
    <path d="M15,1 L27,7.5 L27,22.5 L15,29 L3,22.5 L3,7.5 Z"
          fill="none" stroke="#D4A574" stroke-width="2"/>
    <path d="M9,0.5 L16,4 L16,12 L9,15.5 L2,12 L2,4 Z"
          fill="#D4A574" transform="translate(0,7)"/>
  </g>

  <!-- 上下手繪裝飾點 -->
  <circle cx="100" cy="12" r="1.5" fill="#8B6239" opacity="0.6"/>
  <circle cx="100" cy="48" r="1.5" fill="#8B6239" opacity="0.6"/>
  <circle cx="260" cy="12" r="1.5" fill="#D4A574" opacity="0.6"/>
  <circle cx="260" cy="48" r="1.5" fill="#D4A574" opacity="0.6"/>
</svg>