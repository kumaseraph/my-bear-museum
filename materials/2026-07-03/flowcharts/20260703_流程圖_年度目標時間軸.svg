<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="100%" style="stop-color:#EFF6FF"/>
    </linearGradient>
    <linearGradient id="quarter1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#60A5FA"/>
    </linearGradient>
    <linearGradient id="quarter2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="quarter3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EC4899"/>
      <stop offset="100%" style="stop-color:#F472B6"/>
    </linearGradient>
    <linearGradient id="quarter4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
  </defs>
  
  <rect width="960" height="540" fill="url(#bg3)"/>
  
  <!-- 標題 -->
  <text x="480" y="45" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="24" font-weight="bold" fill="#1E293B">年度目標時間軸</text>
  
  <!-- 主時間軸線 -->
  <line x1="100" y1="270" x2="860" y2="270" stroke="#CBD5E1" stroke-width="4"/>
  
  <!-- 季度標記點 -->
  <circle cx="100" cy="270" r="8" fill="#3B82F6"/>
  <circle cx="290" cy="270" r="8" fill="#8B5CF6"/>
  <circle cx="480" cy="270" r="8" fill="#EC4899"/>
  <circle cx="670" cy="270" r="8" fill="#F59E0B"/>
  <circle cx="860" cy="270" r="8" fill="#059669"/>
  
  <!-- Q1 第一季 -->
  <g transform="translate(60, 140)">
    <polygon points="40,0 180,0 160,60 20,60" fill="url(#quarter1)" opacity="0.9"/>
    <text x="100" y="35" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="white" font-weight="bold">Q1 奠基期</text>
    <text x="100" y="55" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="11" fill="white">制度建立・資源盤點</text>
  </g>
  <line x1="160" y1="200" x2="160" y2="250" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="160" y="240" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="#3B82F6" font-weight="bold">1月-3月</text>
  
  <!-- Q2 第二季 -->
  <g transform="translate(250, 140)">
    <polygon points="40,0 180,0 160,60 20,60" fill="url(#quarter2)" opacity="0.9"/>
    <text x="100" y="35" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="white" font-weight="bold">Q2 衝刺期</text>
    <text x="100" y="55" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="11" fill="white">計畫推動・初步成果</text>
  </g>
  <line x1="350" y1="200" x2="350" y2="250" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="350" y="240" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="#8B5CF6" font-weight="bold">4月-6月</text>
  
  <!-- Q3 第三季 -->
  <g transform="translate(440, 140)">
    <polygon points="40,0 180,0 160,60 20,60" fill="url(#quarter3)" opacity="0.9"/>
    <text x="100" y="35" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="white" font-weight="bold">Q3 精進期</text>
    <text x="100" y="55" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="11" fill="white">優化調整・深化執行</text>
  </g>
  <line x1="540" y1="200" x2="540" y2="250" stroke="#EC4899" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="540" y="240" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="#EC4899" font-weight="bold">7月-9月</text>
  
  <!-- Q4 第四季 -->
  <g transform="translate(630, 140)">
    <polygon points="40,0 180,0 160,60 20,60" fill="url(#quarter4)" opacity="0.9"/>
    <text x="100" y="35" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="white" font-weight="bold">Q4 收割期</text>
    <text x="100" y="55" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="11" fill="white">成果驗收・年度總結</text>
  </g>
  <line x1="730" y1="200" x2="730" y2="250" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="730" y="240" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="#F59E0B" font-weight="bold">10月-12月</text>
  
  <!-- 透視線裝飾 -->
  <line x1="860" y1="270" x2="920" y2="350" stroke="#059669" stroke-width="1" opacity="0.4"/>
  <line x1="860" y1="270" x2="800" y2="350" stroke="#059669" stroke-width="1" opacity="0.4"/>
  <line x1="860" y1="270" x2="860" y2="360" stroke="#059669" stroke-width="1" opacity="0.4"/>
  
  <!-- 底部總結 -->
  <g transform="translate(350, 330)">
    <polygon points="130,0 260,0 240,70 100,70" fill="#059669" opacity="0.9"/>
    <text x="180" y="35" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="white" font-weight="bold">🎯 年度達標</text>
    <text x="180" y="55" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="11" fill="white">回顧與展望</text>
  </g>
  <line x1="500" y1="400" x2="500" y2="460" stroke="#059669" stroke-width="2"/>
  <circle cx="500" cy="470" r="6" fill="#059669"/>
</svg>