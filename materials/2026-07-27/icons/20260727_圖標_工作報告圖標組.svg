<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="iconBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="iconGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="iconRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="iconPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="iconCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#FFFFFF"/>

  <!-- 標題列 -->
  <text x="120" y="100" font-family="Microsoft JhengHei, sans-serif" font-size="44" font-weight="700" fill="#1E3A8A">工作報告｜圖標組</text>
  <text x="120" y="148" font-family="Microsoft JhengHei, sans-serif" font-size="20" fill="#64748B">6 個常用工作報告圖示｜bento 敘事並排 × 六邊形載體</text>

  <!-- ============ 圖標 1：目標 ============ -->
  <g transform="translate(280, 360)">
    <!-- 六邊形載體背景 -->
    <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z" fill="url(#iconBlue)" opacity="0.08"/>
    <!-- 靶心三圓 -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#iconBlue)" stroke-width="6"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="url(#iconBlue)" stroke-width="4"/>
    <circle cx="0" cy="0" r="14" fill="url(#iconBlue)"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <!-- 箭矢 -->
    <line x1="-70" y1="-70" x2="-15" y2="-15" stroke="url(#iconBlue)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="-20,-20 -10,-22 -22,-10" fill="url(#iconBlue)"/>
  </g>
  <text x="280" y="540" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">目標達成</text>
  <text x="280" y="568" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Target Achievement</text>

  <!-- ============ 圖標 2：數據分析 ============ -->
  <g transform="translate(640, 360)">
    <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z" fill="url(#iconGold)" opacity="0.08"/>
    <!-- 柱狀圖 -->
    <rect x="-50" y="0" width="20" height="50" rx="2" fill="url(#iconGold)"/>
    <rect x="-22" y="-25" width="20" height="75" rx="2" fill="url(#iconGold)"/>
    <rect x="6" y="-45" width="20" height="95" rx="2" fill="url(#iconGold)"/>
    <rect x="34" y="-15" width="20" height="65" rx="2" fill="url(#iconGold)"/>
    <!-- 趨勢線 -->
    <polyline points="-40,-10 -12,-35 16,-55 44,-25" fill="none" stroke="#1E3A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="44" cy="-25" r="5" fill="#1E3A8A"/>
  </g>
  <text x="640" y="540" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">數據分析</text>
  <text x="640" y="568" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Data Analytics</text>

  <!-- ============ 圖標 3：團隊協作 ============ -->
  <g transform="translate(1000, 360)">
    <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z" fill="url(#iconGreen)" opacity="0.08"/>
    <!-- 三人頭像 -->
    <circle cx="-30" cy="-20" r="18" fill="url(#iconGreen)"/>
    <circle cx="30" cy="-20" r="18" fill="url(#iconGreen)"/>
    <circle cx="0" cy="20" r="22" fill="url(#iconGreen)"/>
    <!-- 連線 -->
    <line x1="-20" y1="-10" x2="-8" y2="10" stroke="url(#iconGreen)" stroke-width="3"/>
    <line x1="20" y1="-10" x2="8" y2="10" stroke="url(#iconGreen)" stroke-width="3"/>
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="url(#iconGreen)" stroke-width="3"/>
    <!-- 身體 -->
    <path d="M-50,55 Q-30,40 -10,55 L-10,75 L-50,75 Z" fill="url(#iconGreen)"/>
    <path d="M10,55 Q30,40 50,55 L50,75 L10,75 Z" fill="url(#iconGreen)"/>
  </g>
  <text x="1000" y="540" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">團隊協作</text>
  <text x="1000" y="568" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Team Collaboration</text>

  <!-- ============ 圖標 4：風險預警 ============ -->
  <g transform="translate(1360, 360)">
    <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z" fill="url(#iconRed)" opacity="0.08"/>
    <!-- 警鈴本體 -->
    <path d="M0,-50 L40,-50 L55,-15 L55,30 L-55,30 L-55,-15 Z" fill="url(#iconRed)"/>
    <rect x="-20" y="30" width="40" height="15" rx="3" fill="url(#iconRed)"/>
    <circle cx="0" cy="55" r="8" fill="url(#iconRed)"/>
    <!-- 感嘆號 -->
    <rect x="-4" y="-30" width="8" height="35" rx="2" fill="#FFFFFF"/>
    <circle cx="0" cy="15" r="4" fill="#FFFFFF"/>
    <!-- 警示波 -->
    <line x1="-55" y1="-15" x2="-70" y2="-15" stroke="url(#iconRed)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <line x1="55" y1="-15" x2="70" y2="-15" stroke="url(#iconRed)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>
  <text x="1360" y="540" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">風險預警</text>
  <text x="1360" y="568" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Risk Alert</text>

  <!-- ============ 圖標 5：時程進度 ============ -->
  <g transform="translate(640, 770)">
    <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z" fill="url(#iconPurple)" opacity="0.08"/>
    <!-- 時鐘外框 -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="url(#iconPurple)" stroke-width="6"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#1E3A8A" stroke-width="1" opacity="0.3"/>
    <!-- 時刻標記 -->
    <line x1="0" y1="-50" x2="0" y2="-42" stroke="url(#iconPurple)" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="0" x2="42" y2="0" stroke="url(#iconPurple)" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="50" x2="0" y2="42" stroke="url(#iconPurple)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-50" y1="0" x2="-42" y2="0" stroke="url(#iconPurple)" stroke-width="3" stroke-linecap="round"/>
    <!-- 指標 -->
    <line x1="0" y1="0" x2="0" y2="-32" stroke="url(#iconPurple)" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="28" y2="10" stroke="url(#iconPurple)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="url(#iconPurple)"/>
  </g>
  <text x="640" y="950" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">時程進度</text>
  <text x="640" y="978" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Timeline</text>

  <!-- ============ 圖標 6：成果交付 ============ -->
  <g transform="translate(1000, 770)">
    <path d="M0,-110 L95,-55 L95,55 L0,110 L-95,55 L-95,-55 Z" fill="none" stroke="#E2E8F0" stroke-width="2"/>
    <path d="M0,-90 L78,-45 L78,45 L0,90 L-78,45 L-78,-45 Z" fill="url(#iconCyan)" opacity="0.08"/>
    <!-- 禮盒底 -->
    <rect x="-50" y="-10" width="100" height="60" rx="3" fill="url(#iconCyan)"/>
    <!-- 禮盒蓋 -->
    <rect x="-55" y="-30" width="110" height="22" rx="3" fill="url(#iconCyan)" opacity="0.85"/>
    <!-- 緞帶 -->
    <rect x="-8" y="-30" width="16" height="80" fill="#FBBF24"/>
    <rect x="-50" y="-15" width="100" height="10" fill="#FBBF24" opacity="0.7"/>
    <!-- 蝴蝶結 -->
    <ellipse cx="-15" cy="-40" rx="12" ry="8" fill="#FBBF24"/>
    <ellipse cx="15" cy="-40" rx="12" ry="8" fill="#FBBF24"/>
    <circle cx="0" cy="-40" r="5" fill="#F59E0B"/>
  </g>
  <text x="1000" y="950" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="22" font-weight="700" fill="#1E3A8A">成果交付</text>
  <text x="1000" y="978" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="#64748B">Delivery</text>

  <!-- 底部技術標籤 -->
  <text x="120" y="1040" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#94A3B8">技巧 #120 六邊形載體 × bento 敘事並排</text>
  <text x="1800" y="1040" text-anchor="end" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#94A3B8">2026-07-27 熊熊生成</text>
</svg>
