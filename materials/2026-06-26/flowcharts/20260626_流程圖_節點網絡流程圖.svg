<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F59E0B"/>
    </marker>
  </defs>
  
  <!-- 主節點A -->
  <g transform="translate(30, 20)">
    <circle cx="50" cy="30" r="8" fill="#F59E0B"/>
    <polygon points="20,0 80,0 65,45 5,45" fill="#1E40AF" fill-opacity="0.8"/>
    <text x="42" y="28" font-size="10" fill="white" text-anchor="middle" font-family="Arial, sans-serif">提案</text>
  </g>
  
  <!-- 連接線 A→B -->
  <line x1="110" y1="55" x2="145" y2="55" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 主節點B -->
  <g transform="translate(150, 20)">
    <circle cx="50" cy="30" r="8" fill="#F59E0B"/>
    <polygon points="20,0 80,0 65,45 5,45" fill="#3B82F6" fill-opacity="0.8"/>
    <text x="42" y="28" font-size="10" fill="white" text-anchor="middle" font-family="Arial, sans-serif">審核</text>
  </g>
  
  <!-- 連接線 B→C -->
  <line x1="220" y1="55" x2="255" y2="55" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 主節點C -->
  <g transform="translate(260, 20)">
    <circle cx="50" cy="30" r="8" fill="#F59E0B"/>
    <polygon points="20,0 80,0 65,45 5,45" fill="#60A5FA" fill-opacity="0.8"/>
    <text x="42" y="28" font-size="10" fill="white" text-anchor="middle" font-family="Arial, sans-serif">執行</text>
  </g>
  
  <!-- 子節點向下延伸 -->
  <line x1="285" y1="75" x2="285" y2="95" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,2"/>
  
  <!-- 子節點D -->
  <g transform="translate(250, 90)">
    <circle cx="35" cy="20" r="5" fill="#F59E0B"/>
    <polygon points="10,0 60,0 50,30 0,30" fill="#1E40AF" fill-opacity="0.5"/>
    <text x="28" y="18" font-size="8" fill="white" text-anchor="middle" font-family="Arial, sans-serif">產出</text>
  </g>
  
  <!-- 子節點E -->
  <g transform="translate(315, 90)">
    <circle cx="35" cy="20" r="5" fill="#F59E0B"/>
    <polygon points="10,0 60,0 50,30 0,30" fill="#3B82F6" fill-opacity="0.5"/>
    <text x="28" y="18" font-size="8" fill="white" text-anchor="middle" font-family="Arial, sans-serif">報告</text>
  </g>
  
  <!-- 總結節點 -->
  <g transform="translate(160, 105)">
    <polygon points="20,0 80,0 60,35 0,35" fill="#F59E0B"/>
    <text x="40" y="22" font-size="10" fill="white" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">完成</text>
  </g>
  
  <!-- 連接線至總結 -->
  <line x1="260" y1="115" x2="225" y2="115" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowhead)"/>
</svg>