<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#6B5CE7"/>
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5CE7"/>
      <stop offset="100%" stop-color="#4ECDC4"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="960" height="540" fill="#f0f0ff"/>
  
  <!-- 放射環形蜂巢 - 技巧#122 變化3 -->
  <g transform="translate(480,270)">
    <!-- 中心六邊形 -->
    <path d="M0,-50 L43.3,-25 L43.3,25 L0,50 L-43.3,25 L-43.3,-25 Z" 
          fill="url(#centerGrad)"/>
    
    <!-- 1環：6個 -->
    <g fill="#6B5CE7" opacity="0.9">
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" transform="rotate(0) translate(0,-70)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" transform="rotate(60) translate(0,-70)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" transform="rotate(120) translate(0,-70)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" transform="rotate(180) translate(0,-70)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" transform="rotate(240) translate(0,-70)"/>
      <path d="M0,-40 L34.6,-20 L34.6,20 L0,40 L-34.6,20 L-34.6,-20 Z" transform="rotate(300) translate(0,-70)"/>
    </g>
    
    <!-- 2環：12個 -->
    <g fill="#A78BFA" opacity="0.8">
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" transform="rotate(30) translate(0,-120)"/>
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" transform="rotate(60) translate(0,-120)"/>
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" transform="rotate(90) translate(0,-120)"/>
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" transform="rotate(120) translate(0,-120)"/>
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" transform="rotate(150) translate(0,-120)"/>
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" transform="rotate(180) translate(0,-120)"/>
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" transform="rotate(210) translate(0,-120)"/>
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" transform="rotate(240) translate(0,-120)"/>
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" transform="rotate(270) translate(0,-120)"/>
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" transform="rotate(300) translate(0,-120)"/>
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" transform="rotate(330) translate(0,-120)"/>
      <path d="M0,-30 L26,-15 L26,15 L0,30 L-26,15 L-26,-15 Z" transform="rotate(360) translate(0,-120)"/>
    </g>
  </g>
  
  <text x="480" y="520" text-anchor="middle" font-family="Noto Sans TC, sans-serif" 
        font-size="18" font-weight="600" fill="#4C1D95">放射環形蜂巢</text>
</svg>