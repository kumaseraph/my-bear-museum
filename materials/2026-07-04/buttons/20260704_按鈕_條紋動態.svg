<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="brownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B5B4F"/>
      <stop offset="100%" stop-color="#8B7355"/>
    </linearGradient>
    <pattern id="stripePattern" patternUnits="userSpaceOnUse" width="12" height="12" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#D4A84B" stroke-width="2"/>
    </pattern>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="#F5F3EF"/>
  
  <!-- 雙按鈕設計：上一頁/下一頁 -->
  
  <!-- 上一頁按鈕 -->
  <g transform="translate(360, 440)">
    <rect width="280" height="160" rx="8" fill="url(#brownGrad)"/>
    <rect width="280" height="160" rx="8" fill="url(#stripePattern)" opacity="0.3"/>
    <!-- 左箭頭 -->
    <polygon points="80,80 110,60 110,100" fill="#FAFAF8"/>
    <text x="180" y="90" font-family="Arial, sans-serif" font-size="24" fill="#FAFAF8" text-anchor="middle">上一頁</text>
  </g>
  
  <!-- 下一頁按鈕 -->
  <g transform="translate(1280, 440)">
    <rect width="280" height="160" rx="8" fill="url(#brownGrad)"/>
    <rect width="280" height="160" rx="8" fill="url(#stripePattern)" opacity="0.3"/>
    <!-- 右箭頭 -->
    <polygon points="200,80 170,60 170,100" fill="#FAFAF8"/>
    <text x="100" y="90" font-family="Arial, sans-serif" font-size="24" fill="#FAFAF8" text-anchor="middle">下一頁</text>
  </g>
  
  <!-- 中間連接線：動態條紋 -->
  <line x1="640" y1="520" x2="1280" y2="520" stroke="#8B7355" stroke-width="1" stroke-dasharray="8,4"/>
  <circle cx="960" cy="520" r="8" fill="#D4A84B"/>
</svg>