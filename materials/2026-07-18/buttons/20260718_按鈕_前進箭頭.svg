<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <!-- 漸層背景 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <!-- 按鈕漸層 -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <!-- 斜線圖案 -->
    <pattern id="diagStripes" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#60A5FA" stroke-width="2"/>
    </pattern>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- 按鈕主體：平行四邊形 (skewX=-15) -->
  <g transform="translate(960, 540)">
    <!-- 外層輪廓 (邊界引導線) -->
    <polygon points="-180,-50 0,-50 20,50 -160,50" 
             fill="none" stroke="#1D4ED8" stroke-width="3" 
             transform="skewX(-15)"/>
    
    <!-- 條紋疊加效果 -->
    <polygon points="-180,-50 0,-50 20,50 -160,50" 
             fill="url(#diagStripes)" opacity="0.3"
             transform="skewX(-15)"/>
    
    <!-- 按鈕核心 -->
    <polygon points="-175,-45 0,-45 15,45 -160,45" 
             fill="url(#btnGrad)"
             transform="skewX(-15)"/>
    
    <!-- 雙重交叉線裝飾 -->
    <g transform="skewX(-15)">
      <line x1="-140" y1="0" x2="-20" y2="0" stroke="white" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="-130" y1="-10" x2="-30" y2="-10" stroke="white" stroke-width="1" stroke-opacity="0.4"/>
      <line x1="-130" y1="10" x2="-30" y2="10" stroke="white" stroke-width="1" stroke-opacity="0.4"/>
    </g>
    
    <!-- 前進箭頭 -->
    <g transform="skewX(-15)">
      <polygon points="60,0 40,-15 40,-8 10,-8 10,8 40,8 40,15" 
               fill="white"/>
    </g>
    
    <!-- 箭頭右側箭羽 -->
    <g transform="translate(-80, 0) skewX(-15)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="white" stroke-width="3"/>
    </g>
  </g>
  
  <!-- 標題文字 -->
  <text x="960" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#1E293B">
    前進 Next Page
  </text>
</svg>