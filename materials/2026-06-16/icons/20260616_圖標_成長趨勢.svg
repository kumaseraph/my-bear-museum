<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>成長趨勢</title>
  <desc>工作報告圖標 - 向上成長的趨勢線</desc>
  <!-- 背景圓 -->
  <circle cx="60" cy="60" r="54" fill="#F0F4F8" stroke="#3B82F6" stroke-width="2"/>
  <!-- 趨勢線 -->
  <polyline points="25,85 45,65 65,75 85,40 100,30" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 箭頭 -->
  <polygon points="95,25 100,30 90,32" fill="#3B82F6"/>
  <!-- 數據點 -->
  <circle cx="45" cy="65" r="5" fill="#60A5FA"/>
  <circle cx="65" cy="75" r="5" fill="#60A5FA"/>
  <circle cx="85" cy="40" r="5" fill="#3B82F6"/>
</svg>