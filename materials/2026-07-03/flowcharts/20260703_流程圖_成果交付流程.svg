<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="100%" style="stop-color:#F0FDF4"/>
    </linearGradient>
    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6D28D9"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="nodeTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
    </linearGradient>
    <linearGradient id="nodeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C2410C"/>
      <stop offset="100%" style="stop-color:#F97316"/>
    </linearGradient>
    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#15803D"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="960" height="540" fill="url(#bg5)"/>
  
  <!-- 標題 -->
  <text x="480" y="45" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="24" font-weight="bold" fill="#1E293B">成果交付流程</text>
  
  <!-- 雙重交叉線裝飾 -->
  <g stroke="#E2E8F0" stroke-width="1" opacity="0.6">
    <line x1="100" y1="100" x2="860" y2="500"/>
    <line x1="860" y1="100" x2="100" y2="500"/>
    <line x1="100" y1="500" x2="860" y2="100"/>
    <line x1="860" y1="500" x2="100" y2="100"/>
  </g>
  
  <!-- 流程網絡 -->
  <g transform="translate(80, 100)">
    <!-- 節點1：需求確認（頂部中央） -->
    <g transform="translate(350, 0)">
      <polygon points="50,0 150,0 130,60 30,60" fill="url(#nodeBlue)" filter="url(#glow)"/>
      <circle cx="90" cy="15" r="10" fill="#F59E0B"/>
      <text x="90" y="20" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="10" fill="white" font-weight="bold">1</text>
      <text x="90" y="42" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="white" font-weight="bold">需求確認</text>
    </g>
    
    <!-- 連接線1->2 -->
    <line x1="440" y1="60" x2="300" y2="130" stroke="#3B82F6" stroke-width="2"/>
    <line x1="440" y1="60" x2="580" y2="130" stroke="#3B82F6" stroke-width="2"/>
    
    <!-- 節點2左：文件準備 -->
    <g transform="translate(180, 130)">
      <polygon points="40,0 120,0 105,50 25,50" fill="url(#nodePurple)"/>
      <circle cx="70" cy="12" r="8" fill="#F59E0B"/>
      <text x="70" y="16" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="9" fill="white" font-weight="bold">2</text>
      <text x="70" y="35" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="white" font-weight="bold">文件準備</text>
    </g>
    
    <!-- 節點2右：資源調度 -->
    <g transform="translate(560, 130)">
      <polygon points="40,0 120,0 105,50 25,50" fill="url(#nodePurple)"/>
      <circle cx="70" cy="12" r="8" fill="#F59E0B"/>
      <text x="70" y="16" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="9" fill="white" font-weight="bold">3</text>
      <text x="70" y="35" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="white" font-weight="bold">資源調度</text>
    </g>
    
    <!-- 連接線匯聚 -->
    <line x1="250" y1="180" x2="350" y2="250" stroke="#8B5CF6" stroke-width="2"/>
    <line x1="620" y1="180" x2="520" y2="250" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- 節點3中央：執行交付 -->
    <g transform="translate(330, 250)">
      <polygon points="50,0 170,0 150,70 30,70" fill="url(#nodeTeal)" filter="url(#glow)"/>
      <circle cx="100" cy="18" r="10" fill="#F59E0B"/>
      <text x="100" y="23" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="10" fill="white" font-weight="bold">4</text>
      <text x="100" y="45" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="14" fill="white" font-weight="bold">執行交付</text>
    </g>
    
    <!-- 連接線3->4 -->
    <line x1="430" y1="320" x2="300" y2="380" stroke="#14B8A6" stroke-width="2"/>
    <line x1="430" y1="320" x2="580" y2="380" stroke="#14B8A6" stroke-width="2"/>
    
    <!-- 節點4左：品質檢核 -->
    <g transform="translate(180, 380)">
      <polygon points="40,0 120,0 105,50 25,50" fill="url(#nodeOrange)"/>
      <circle cx="70" cy="12" r="8" fill="#F59E0B"/>
      <text x="70" y="16" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="9" fill="white" font-weight="bold">5</text>
      <text x="70" y="35" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="white" font-weight="bold">品質檢核</text>
    </g>
    
    <!-- 節點4右：客戶確認 -->
    <g transform="translate(560, 380)">
      <polygon points="40,0 120,0 105,50 25,50" fill="url(#nodeOrange)"/>
      <circle cx="70" cy="12" r="8" fill="#F59E0B"/>
      <text x="70" y="16" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="9" fill="white" font-weight="bold">6</text>
      <text x="70" y="35" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="white" font-weight="bold">客戶確認</text>
    </g>
    
    <!-- 連接線匯聚到完成 -->
    <line x1="250" y1="430" x2="350" y2="480" stroke="#F97316" stroke-width="2"/>
    <line x1="620" y1="430" x2="520" y2="480" stroke="#F97316" stroke-width="2"/>
    
    <!-- 節點5底部：完成歸檔 -->
    <g transform="translate(330, 480)">
      <polygon points="50,0 170,0 150,60 30,60" fill="url(#nodeGreen)" filter="url(#glow)"/>
      <circle cx="100" cy="15" r="10" fill="white"/>
      <text x="100" y="20" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="10" fill="#15803D" font-weight="bold">✓</text>
      <text x="100" y="40" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="13" fill="white" font-weight="bold">完成歸檔</text>
    </g>
  </g>
  
  <!-- 底部說明 -->
  <text x="480" y="520" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="12" fill="#64748B">雙重交叉線條強化節點網絡的幾何複雜性，突顯流程的嚴謹性</text>
</svg>