<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <!-- 熊熊工作報告 - 蜂巢章節標題框 (Bento Grid + 蜂巢放射環形) -->
  <defs>
    <!-- 標題框主漸層（暖棕 → 金） -->
    <linearGradient id="secTitleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="50%" stop-color="#F5E6D3"/>
      <stop offset="100%" stop-color="#E8D5B7"/>
    </linearGradient>

    <!-- 蜂巢 pattern -->
    <pattern id="secHoneycomb" x="0" y="0" width="42" height="46" patternUnits="userSpaceOnUse">
      <path d="M21,0 L42,11.5 L42,34.5 L21,46 L0,34.5 L0,11.5 Z"
            fill="none" stroke="#B8860B" stroke-width="0.6" opacity="0.3"/>
    </pattern>

    <!-- 印刷感 grain 質感（Illustrated Worlds 趨勢） -->
    <filter id="secGrain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.55
                             0 0 0 0 0.27
                             0 0 0 0 0.07
                             0 0 0 0.05 0"/>
    </filter>

    <!-- 陰影 -->
    <filter id="secShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 左側裝飾：放射環形蜂巢（技巧 #122） -->
  <g transform="translate(110, 160)" opacity="0.85">
    <!-- 中心大蜂巢 -->
    <path d="M0,-32 L27.7,-16 L27.7,16 L0,32 L-27.7,16 L-27.7,-16 Z"
          fill="#8B4513"/>
    <!-- 環繞 6 個小蜂巢 -->
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
          fill="none" stroke="#8B4513" stroke-width="1.8"
          transform="rotate(0) translate(0,-42)"/>
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
          fill="none" stroke="#8B4513" stroke-width="1.8"
          transform="rotate(60) translate(0,-42)"/>
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
          fill="none" stroke="#8B4513" stroke-width="1.8"
          transform="rotate(120) translate(0,-42)"/>
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
          fill="none" stroke="#8B4513" stroke-width="1.8"
          transform="rotate(180) translate(0,-42)"/>
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
          fill="none" stroke="#8B4513" stroke-width="1.8"
          transform="rotate(240) translate(0,-42)"/>
    <path d="M0,-18 L15.6,-9 L15.6,9 L0,18 L-15.6,9 L-15.6,-9 Z"
          fill="none" stroke="#8B4513" stroke-width="1.8"
          transform="rotate(300) translate(0,-42)"/>
    <!-- 中心內嵌文字「02」 -->
    <text x="0" y="6" text-anchor="middle"
          font-family="Georgia, serif" font-size="22" font-weight="700"
          fill="#FFF8DC">02</text>
  </g>

  <!-- 主標題框（2.5D 蜂巢外形） -->
  <g transform="translate(530, 160)" filter="url(#secShadow)">
    <!-- 外粗空心（2.5D 邊框） -->
    <path d="M-340,-90 L0,-130 L340,-90 L340,90 L0,130 L-340,90 Z"
          fill="none" stroke="#8B4513" stroke-width="4"/>
    <!-- 內實心 -->
    <path d="M-340,-90 L0,-130 L340,-90 L340,90 L0,130 L-340,90 Z"
          fill="url(#secTitleGrad)"/>
    <!-- 蜂巢紋理 -->
    <path d="M-340,-90 L0,-130 L340,-90 L340,90 L0,130 L-340,90 Z"
          fill="url(#secHoneycomb)"/>
    <!-- 印刷感 grain -->
    <path d="M-340,-90 L0,-130 L340,-90 L340,90 L0,130 L-340,90 Z"
          filter="url(#secGrain)"/>
    <!-- 內虛線邊框 -->
    <path d="M-310,-75 L0,-110 L310,-75 L310,75 L0,110 L-310,75 Z"
          fill="none" stroke="#B8860B" stroke-width="1" opacity="0.5"
          stroke-dasharray="3,3"/>
  </g>

  <!-- 標題文字區 -->
  <g transform="translate(530, 160)">
    <!-- 章節標籤 -->
    <text x="-300" y="-45" font-family="Noto Sans TC, sans-serif" font-size="14"
          fill="#A0826D" letter-spacing="3">CHAPTER 02 · 章節二</text>
    <!-- 主標題 -->
    <text x="-300" y="10" font-family="Noto Sans TC, sans-serif" font-size="38" font-weight="700"
          fill="#8B4513" letter-spacing="4">執行成果</text>
    <!-- 副標題 -->
    <text x="-300" y="48" font-family="Noto Sans TC, sans-serif" font-size="16"
          fill="#A0826D" letter-spacing="2">Implementation Results · 2026</text>
  </g>

  <!-- 右下角裝飾蜂巢（小六邊形 - 大小對比） -->
  <g transform="translate(820, 250)">
    <path d="M0,-14 L12.1,-7 L12.1,7 L0,14 L-12.1,7 L-12.1,-7 Z"
          fill="#8B4513" fill-opacity="0.7"/>
    <path d="M0,-9 L7.8,-4.5 L7.8,4.5 L0,9 L-7.8,4.5 L-7.8,-4.5 Z"
          fill="none" stroke="#8B4513" stroke-width="1.2"
          transform="translate(20, -10)"/>
    <path d="M0,-7 L6,-3.5 L6,3.5 L0,7 L-6,3.5 L-6,-3.5 Z"
          fill="#D4A574" fill-opacity="0.6"
          transform="translate(35, -5)"/>
  </g>
</svg>