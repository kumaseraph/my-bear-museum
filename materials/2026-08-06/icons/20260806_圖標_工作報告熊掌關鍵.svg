<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="warm" x2="1" y2="1"><stop stop-color="#B8860B"/><stop offset="1" stop-color="#F2B94B"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#8B6914" flood-opacity=".25"/></filter>
  </defs>
  <!-- 背景六邊形（#120 變化9：叢集與單一焦點） -->
  <g filter="url(#s)">
    <path d="M200,30 L350,115 L350,295 L200,380 L50,295 L50,115 Z" fill="#FFF8E7" stroke="#B8860B" stroke-width="6"/>
  </g>
  <!-- 內層六邊形空心（#120 變化6：虛實對比） -->
  <path d="M200,70 L320,138 L320,272 L200,340 L80,272 L80,138 Z" fill="none" stroke="#B8860B" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- 熊掌主體（#120 變化5：顏色深淺對比） -->
  <g fill="url(#warm)">
    <ellipse cx="200" cy="240" rx="60" ry="50"/>
    <circle cx="142" cy="160" r="28"/>
    <circle cx="258" cy="160" r="28"/>
    <circle cx="170" cy="115" r="24"/>
    <circle cx="230" cy="115" r="24"/>
  </g>
  <!-- 中心鑰匙孔：代表關鍵洞察（跨介面設計語言：象徵「打開資料」） -->
  <circle cx="200" cy="240" r="22" fill="#5C3A0E"/>
  <circle cx="200" cy="232" r="10" fill="#F2B94B"/>
  <path d="M200,238 L200,265 L210,265 L200,238 Z M205,260 L205,265" fill="#F2B94B"/>
  <!-- 4 個小鑽石圍繞（#123 菱形） -->
  <g fill="#D4A017">
    <polygon points="200,55 215,70 200,85 185,70"/>
    <polygon points="345,200 360,215 345,230 330,215"/>
    <polygon points="55,200 70,215 55,230 40,215"/>
    <polygon points="200,345 215,360 200,375 185,360"/>
  </g>
</svg>
