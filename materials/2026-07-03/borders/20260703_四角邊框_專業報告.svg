<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="borderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC"/>
      <stop offset="100%" style="stop-color:#E2E8F0"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="960" height="540" fill="url(#borderBg)"/>
  
  <!-- 外框：六邊形裝飾角 -->
  <!-- 左上角 -->
  <g transform="translate(20, 20)">
    <polygon points="0,40 40,0 80,40 40,80" fill="#1E40AF" opacity="0.8"/>
    <polygon points="15,40 40,15 65,40 40,65" fill="#3B82F6" opacity="0.6"/>
    <line x1="0" y1="40" x2="40" y2="0" stroke="#60A5FA" stroke-width="2"/>
    <line x1="40" y1="80" x2="80" y2="40" stroke="#60A5FA" stroke-width="2"/>
  </g>
  
  <!-- 右上角 -->
  <g transform="translate(860, 20)">
    <polygon points="0,40 40,0 80,40 40,80" fill="#1E40AF" opacity="0.8"/>
    <polygon points="15,40 40,15 65,40 40,65" fill="#3B82F6" opacity="0.6"/>
    <line x1="0" y1="40" x2="40" y2="0" stroke="#60A5FA" stroke-width="2"/>
    <line x1="40" y1="80" x2="80" y2="40" stroke="#60A5FA" stroke-width="2"/>
  </g>
  
  <!-- 左下角 -->
  <g transform="translate(20, 440)">
    <polygon points="0,40 40,0 80,40 40,80" fill="#1E40AF" opacity="0.8"/>
    <polygon points="15,40 40,15 65,40 40,65" fill="#3B82F6" opacity="0.6"/>
    <line x1="0" y1="40" x2="40" y2="80" stroke="#60A5FA" stroke-width="2"/>
    <line x1="40" y1="0" x2="80" y2="40" stroke="#60A5FA" stroke-width="2"/>
  </g>
  
  <!-- 右下角 -->
  <g transform="translate(860, 440)">
    <polygon points="0,40 40,0 80,40 40,80" fill="#1E40AF" opacity="0.8"/>
    <polygon points="15,40 40,15 65,40 40,65" fill="#3B82F6" opacity="0.6"/>
    <line x1="0" y1="40" x2="40" y2="80" stroke="#60A5FA" stroke-width="2"/>
    <line x1="40" y1="0" x2="80" y2="40" stroke="#60A5FA" stroke-width="2"/>
  </g>
  
  <!-- 邊框線條 -->
  <rect x="60" y="60" width="840" height="420" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
  <rect x="70" y="70" width="820" height="400" fill="none" stroke="#93C5FD" stroke-width="1" stroke-dasharray="8,4" opacity="0.4"/>
  
  <!-- 頂部裝飾線 -->
  <line x1="120" y1="50" x2="840" y2="50" stroke="#1E40AF" stroke-width="2"/>
  <line x1="140" y1="45" x2="820" y2="45" stroke="#60A5FA" stroke-width="1"/>
  
  <!-- 底部裝飾線 -->
  <line x1="120" y1="490" x2="840" y2="490" stroke="#1E40AF" stroke-width="2"/>
  <line x1="140" y1="495" x2="820" y2="495" stroke="#60A5FA" stroke-width="1"/>
  
  <!-- 中央襯托區 -->
  <rect x="200" y="150" width="560" height="240" fill="#3B82F6" fill-opacity="0.05" rx="8"/>
  
  <!-- 範例文字區 -->
  <text x="480" y="260" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="28" fill="#1E40AF" font-weight="bold">工作報告</text>
  <text x="480" y="300" text-anchor="middle" font-family="Microsoft JhengHei, sans-serif" font-size="16" fill="#64748B">專業呈現・清晰表達</text>
  <line x1="380" y1="320" x2="580" y2="320" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4,2"/>
</svg>